l_spanish:
 # ===== Cultura, grupo y lengua =====
 gj_soravi: "Soravíes"
 gj_soravi_adj: "soravi"
 gj_soravi_desc: "Pueblo de las Casas del golfo. Aquí la riqueza no se hereda: se firma, se pesa y se jura en la balanza. Un contrato soravi se cumple aunque el mar entero se ponga en contra, y quien lo rompe no vuelve a comerciar en ninguna lonja del estrecho."
 gj_grupo_sorava: "Gentes del Golfo"
 gj_grupo_sorava_desc: "Pueblos de costa, de lonja y de timón. Viven de lo que el mar trae y de lo que las caravanas llevan, y comparten una misma costumbre: la palabra dada se pesa."
 gj_sorava_language: "Soravo"
 gj_sorava_language_desc: "Lengua de pregones y de contratos, rica en palabras para pesos, plazos y garantías. Los marinos la han llenado de términos de navegación que viajan por todo el golfo."
 gj_soravi_dialect: "Soravi"
 map_gj_soravi: "Soravíes"

 # ===== Modificadores nombrados =====
 STATIC_MODIFIER_NAME_gj_sorava_palabra_de_oro: "Fe de plaza"
 STATIC_MODIFIER_DESC_gj_sorava_palabra_de_oro: "Nadie en el golfo duda de lo que Sorava firma. Los contratos se cierran sin regatear y las demás cortes escuchan antes."
 STATIC_MODIFIER_NAME_gj_sorava_palabra_firme: "Palabra firme"
 STATIC_MODIFIER_DESC_gj_sorava_palabra_firme: "Las Casas cumplen y se sabe. Los socios confían, sin más."
 STATIC_MODIFIER_NAME_gj_sorava_palabra_manchada: "Palabra manchada"
 STATIC_MODIFIER_DESC_gj_sorava_palabra_manchada: "Se han roto demasiados contratos. En las lonjas se pide pago por adelantado y los fletes se encarecen."
 STATIC_MODIFIER_NAME_gj_sorava_contrato_especias: "Contrato de especias"
 STATIC_MODIFIER_DESC_gj_sorava_contrato_especias: "Las Casas han jurado entregar especias durante cinco años. Más producción, pero con márgenes ajustados."
 STATIC_MODIFIER_NAME_gj_sorava_contrato_perlas: "Contrato de perlas"
 STATIC_MODIFIER_DESC_gj_sorava_contrato_perlas: "Los buzos trabajan para un solo comprador durante cinco años. Más perlas y joyas, menos pesca."
 STATIC_MODIFIER_NAME_gj_sorava_contrato_escolta: "Contrato de escolta"
 STATIC_MODIFIER_DESC_gj_sorava_contrato_escolta: "Las escoltas de las Casas cubren las rutas ajenas durante cinco años. Más seguridad, más gasto en armas."
 STATIC_MODIFIER_NAME_gj_sorava_pulso_estrecho: "Pulso por el estrecho"
 STATIC_MODIFIER_DESC_gj_sorava_pulso_estrecho: "La flota de las Casas disputa cada milla del estrecho. Caro de sostener, pero cada nave enemiga que pasa lo nota."
 STATIC_MODIFIER_NAME_gj_sorava_lonja_mayor: "Lonja Mayor"
 STATIC_MODIFIER_DESC_gj_sorava_lonja_mayor: "Todas las Casas registran sus tratos en un solo gran libro. Más comerciantes caben bajo un mismo techo."
 STATIC_MODIFIER_NAME_gj_sorava_vientos_de_cola: "Vientos de cola"
 STATIC_MODIFIER_DESC_gj_sorava_vientos_de_cola: "Las cartas de corrientes nuevas acortan los viajes y alivian las reparaciones."
 STATIC_MODIFIER_NAME_gj_sorava_temporada_de_perlas: "Temporada de perlas"
 STATIC_MODIFIER_DESC_gj_sorava_temporada_de_perlas: "Los bancos de ostras rinden como no se recordaba."
 STATIC_MODIFIER_NAME_gj_sorava_almacenes_quemados: "Almacenes quemados"
 STATIC_MODIFIER_DESC_gj_sorava_almacenes_quemados: "El fuego se llevó las existencias y buena parte de la credibilidad de las lonjas."
 STATIC_MODIFIER_NAME_gj_sorava_guerra_de_precios: "Guerra de precios"
 STATIC_MODIFIER_DESC_gj_sorava_guerra_de_precios: "La Liga baja sus fletes y Sorava resiste sin bajar los suyos. Menos ingresos, mucho orgullo."
 STATIC_MODIFIER_NAME_gj_sorava_moneda_falsa: "Moneda falsa"
 STATIC_MODIFIER_DESC_gj_sorava_moneda_falsa: "Las monedas que circulan ya no son de fiar. Todo cuesta más de comprobar."
 STATIC_MODIFIER_NAME_gj_sorava_tinta_sin_secar: "Tinta sin secar"
 STATIC_MODIFIER_DESC_gj_sorava_tinta_sin_secar: "Los tintoreros de la lonja trabajan a destajo con un tinte nuevo."
 STATIC_MODIFIER_NAME_gj_sorava_cofradia_de_pilotos: "Cofradía de pilotos"
 STATIC_MODIFIER_DESC_gj_sorava_cofradia_de_pilotos: "Los pilotos veteranos enseñan el oficio a los jóvenes en cada puerto."
 STATIC_MODIFIER_NAME_gj_sorava_cuentas_claras: "Cuentas claras"
 STATIC_MODIFIER_DESC_gj_sorava_cuentas_claras: "Los libros de las Casas han sido auditados y los tratos son transparentes."
 STATIC_MODIFIER_NAME_gj_sorava_mesa_de_enviados: "Mesa de enviados"
 STATIC_MODIFIER_DESC_gj_sorava_mesa_de_enviados: "Los visitantes del interior encuentran una mesa y un traductor en la lonja."
 STATIC_MODIFIER_NAME_gj_sorava_escolta_del_gremio: "Escolta del gremio"
 STATIC_MODIFIER_DESC_gj_sorava_escolta_del_gremio: "Naves armadas acompañan a los mercantes por el estrecho."
 STATIC_MODIFIER_NAME_gj_sorava_tormenta_de_otono: "Tormenta de otoño"
 STATIC_MODIFIER_DESC_gj_sorava_tormenta_de_otono: "La flota sufrió daños y la moral de los marinos anda baja."
 STATIC_MODIFIER_NAME_gj_sorava_apuesta_de_casa: "Apuesta de las Casas"
 STATIC_MODIFIER_DESC_gj_sorava_apuesta_de_casa: "Las Casas venden por debajo del precio para ganar cuota. Más poder mercante, menos margen."
 STATIC_MODIFIER_NAME_gj_sorava_deudas_heredadas: "Deudas heredadas"
 STATIC_MODIFIER_DESC_gj_sorava_deudas_heredadas: "Nadie olvida la quiebra: el crédito tarda en volver."
 STATIC_MODIFIER_NAME_gj_sorava_puerto_franco: "Puerto franco"
 STATIC_MODIFIER_DESC_gj_sorava_puerto_franco: "Un puerto libre de aduanas atrae a todas las naves, y a los contrabandistas con ellas."

 # ===== Avances: era 1 =====
 gj_sorava_lonja_de_las_casas: "La Lonja de las Casas"
 gj_sorava_lonja_de_las_casas_desc: "Cada Casa abre su mostrador bajo un mismo techo. Se compra, se vende y se anota sin salir de la sala."
 gj_sorava_balanza_y_pesas: "Balanza y pesas"
 gj_sorava_balanza_y_pesas_desc: "Las pesas oficiales se guardan en la sala del Concejo. Quien pese con otras, paga."
 gj_sorava_pilotos_del_estrecho: "Pilotos del estrecho"
 gj_sorava_pilotos_del_estrecho_desc: "Un piloto que ha cruzado cien veces el estrecho vale más que un cañón."
 gj_sorava_buzos_de_perlas: "Buzos de perlas"
 gj_sorava_buzos_de_perlas_desc: "Familias enteras bajan a los bancos con una piedra al pie y un cuchillo en la boca. Las perlas de Sorava llegan hasta lo más lejano."
 gj_sorava_huertos_de_especias: "Huertos de especias"
 gj_sorava_huertos_de_especias_desc: "Terrazas de pimienta y clavo en las laderas cálidas, cuidadas por las mismas manos que firman los contratos."
 gj_sorava_escoltas_de_caravana: "Guardas de recua"
 gj_sorava_escoltas_de_caravana_desc: "Las Casas pagan hombres de armas para acompañar cada carga. Desbloquea las Guardas de recua y los Tiradores de Rada."

 # ===== Avances: era 2 =====
 gj_sorava_casas_de_cambio: "Casas de cambio"
 gj_sorava_casas_de_cambio_desc: "Una letra firmada en Sorava se paga en cualquier puerto del golfo."
 gj_sorava_sociedades_de_ruta: "Sociedades de ruta"
 gj_sorava_sociedades_de_ruta_desc: "Varias Casas se reparten los gastos y las ganancias de cada viaje, y ninguna se arruina con un naufragio."
 gj_sorava_astilleros_de_la_ensenada: "Astilleros de la ensenada"
 gj_sorava_astilleros_de_la_ensenada_desc: "Gradas cubiertas que trabajan todo el año, con maestros que se pasan el oficio de padres a hijos."
 gj_sorava_contratos_notariados: "Contratos notariados"
 gj_sorava_contratos_notariados_desc: "Todo acuerdo grande pasa por un notario del Concejo. Más lento, pero nadie puede decir que no firmó."
 gj_sorava_escoltas_de_las_casas: "Escoltas de las Casas"
 gj_sorava_escoltas_de_las_casas_desc: "Cuerpos de armas con el escudo de cada Casa, ahora bajo un mismo mando. Mejora las Guardas de recua y los Tiradores de Rada."

 # ===== Avances: era 3 =====
 gj_sorava_rutas_de_ultramar: "Rutas de ultramar"
 gj_sorava_rutas_de_ultramar_desc: "Los pilotos pierden la costa de vista y vuelven con cartas que valen más que el cargamento."
 gj_sorava_lonjas_de_ultramar: "Lonjas de ultramar"
 gj_sorava_lonjas_de_ultramar_desc: "Mostradores soravíes en puertos que sus abuelos no conocían."
 gj_sorava_cartas_de_corriente: "Cartas de corriente"
 gj_sorava_cartas_de_corriente_desc: "Dibujadas por pilotos y cosidas en cuero, con la dirección de cada corriente y de cada trampa."
 gj_sorava_oficios_de_la_perla: "Oficios de la perla"
 gj_sorava_oficios_de_la_perla_desc: "Talladores, engastadores y tasadores: la perla ya no sale en bruto."
 gj_sorava_guardia_de_ruta: "Guardia de ruta"
 gj_sorava_guardia_de_ruta_desc: "Puestos armados cada jornada de camino. Mejora las Guardas de recua y los Tiradores de Rada."

 # ===== Avances: era 4 =====
 gj_sorava_banco_de_las_casas: "El Banco de las Casas"
 gj_sorava_banco_de_las_casas_desc: "El crédito deja de ser un favor entre vecinos y pasa a ser un oficio con reglas."
 gj_sorava_patentes_de_navegacion: "Patentes de navegación"
 gj_sorava_patentes_de_navegacion_desc: "Cada nave lleva un papel sellado que dice a quién pertenece y a quién puede hundir."
 gj_sorava_hermandad_de_pilotos: "Hermandad de pilotos"
 gj_sorava_hermandad_de_pilotos_desc: "Los pilotos fundan su propia hermandad, con escuela, caja de socorro y un reglamento que todos acatan."
 gj_sorava_escuela_de_cuentas: "Escuela de cuentas"
 gj_sorava_escuela_de_cuentas_desc: "Aprender a llevar los libros es ahora la primera lección de todo joven de buena Casa."
 gj_sorava_escolta_de_mosquete: "Escolta de mosquete"
 gj_sorava_escolta_de_mosquete_desc: "La pólvora llega a las escoltas. Mejora las Guardas de recua y los Tiradores de Rada."

 # ===== Avances: era 5 =====
 gj_sorava_compania_de_las_especias: "Compañía de las Especias"
 gj_sorava_compania_de_las_especias_desc: "Todas las Casas aportan una parte y reciben otra: nace la mayor empresa del golfo."
 gj_sorava_gran_astillero: "El Gran Astillero"
 gj_sorava_gran_astillero_desc: "Un solo astillero, cubierto y vigilado, capaz de armar una flota entera en una estación."
 gj_sorava_cajas_de_seguro: "Cajas de seguro"
 gj_sorava_cajas_de_seguro_desc: "Un naufragio ya no arruina a una Casa: el seguro lo paga entre todos."
 gj_sorava_escolta_de_linea: "Escolta de línea"
 gj_sorava_escolta_de_linea_desc: "Formaciones cerradas y disciplina de cuartel. Mejora las Guardas de recua y los Tiradores de Rada."

 # ===== Avances: era 6 =====
 gj_sorava_bolsa_del_estrecho: "Bolsa del Estrecho"
 gj_sorava_bolsa_del_estrecho_desc: "Los precios de las especias y las perlas se fijan cada mañana en una sala de vidrio, a voces."
 gj_sorava_vapor_de_las_casas: "Vapor de las Casas"
 gj_sorava_vapor_de_las_casas_desc: "Las máquinas llegan a los muelles. Ya no se construye con las manos, sino con las que saben cuánto cuesta cada hora."
 gj_sorava_escolta_de_fusil: "Escolta de fusil"
 gj_sorava_escolta_de_fusil_desc: "Armas rayadas para las últimas escoltas del golfo. Mejora las Guardas de recua y los Tiradores de Rada."

 # ===== Avances de cultura =====
 gj_sorava_cultura_balanza_honrada: "La balanza honrada"
 gj_sorava_cultura_balanza_honrada_desc: "Todo soravi sabe de pequeño que su palabra es su moneda más cara. Los demás pueblos lo notan."
 gj_sorava_cultura_mesa_de_pregones: "Mesa de pregones"
 gj_sorava_cultura_mesa_de_pregones_desc: "Los pregoneros de la lonja leen los precios en voz alta. Quien llega a Sorava a vender aprende a leer para entenderlos."
 gj_sorava_cultura_ligas_del_mar: "Ligas del mar"
 gj_sorava_cultura_ligas_del_mar_desc: "Los soravíes se asocian con pueblos de otras costas, y el que llega de fuera encuentra casa y oficio."

 # ===== Reformas =====
 gj_sorava_concejo_de_balanzas: "Concejo de las Balanzas"
 gj_sorava_concejo_de_balanzas_desc: "Diez Casas eligen cada año al Concejo que pesa los tratos y juzga a los tramposos. No hay corona: hay un libro y diez firmas."
 gj_sorava_libro_mayor_de_las_casas: "Libro Mayor de las Casas"
 gj_sorava_libro_mayor_de_las_casas_desc: "Todas las deudas y créditos del país quedan en un solo libro, a la vista de quien quiera consultarlo."
 gj_sorava_concordato_del_estrecho: "Concordato del Estrecho"
 gj_sorava_concordato_del_estrecho_desc: "Un acuerdo con quien navega por el estrecho: paso libre a cambio de peaje justo y de respetar las escoltas."

 # ===== Edificios =====
 gj_sorava_casa_especias: "Casa de las Especias"
 gj_sorava_casa_especias_desc: "Almacén, lonja y tribunal de las especias. Solo en centros de mercado; con cada era admite más niveles."
 gj_sorava_banco_de_perlas: "Banco de Perlas"
 gj_sorava_banco_de_perlas_desc: "Viveros, lonjas de buceo y talleres de clasificación. Solo en puertos donde hay perlas o pesca; con cada era admite más niveles."
 gj_sorava_atalaya_del_estrecho: "Atalaya del Estrecho"
 gj_sorava_atalaya_del_estrecho_desc: "Faro, aduana y cuartel de pilotos en uno. Solo en puertos y con el tope de niveles más bajo, porque cuesta mucho de mantener."
 gj_sorava_sala_de_balanzas: "Sala de las Balanzas"
 gj_sorava_sala_de_balanzas_desc: "Donde las Casas juran y registran sus contratos. Solo en ciudades; en la capital, además, da un bono al país."
 gj_sorava_posta_de_caravanas: "Posta de Caravanas"
 gj_sorava_posta_de_caravanas_desc: "Un mesón fortificado en el camino del interior. Solo lejos de la costa: hace por el control lo que un puerto hace por el comercio."
 gj_sorava_casa_especias_mantenimiento: "Casa de las Especias"
 gj_sorava_banco_de_perlas_mantenimiento: "Banco de Perlas"
 gj_sorava_atalaya_mantenimiento: "Atalaya del Estrecho"
 gj_sorava_sala_de_balanzas_mantenimiento: "Sala de las Balanzas"
 gj_sorava_posta_mantenimiento: "Posta de Caravanas"

 # ===== Unidades =====
 gj_sorava_escoltas: "Guardas de recua"
 gj_sorava_tiradores: "Tiradores de Rada"
 a_gj_sorava_escolta_1: "Guarda de Recua"
 a_gj_sorava_escolta_1_desc: "Guardias contratados por las Casas para acompañar cada carga. Aguantan mejor los golpes y matan menos: su trabajo es que la mercancía llegue, no ganar la batalla. Fuertes en la costa y junto a los ríos; lentos."
 a_gj_sorava_escolta_2: "Escolta de las Casas"
 a_gj_sorava_escolta_2_desc: "Los cuerpos de cada Casa, ahora bajo un mismo estandarte. Defensivos, caros y lentos; fuertes en la costa y junto a los ríos."
 a_gj_sorava_escolta_3: "Guardia de Ruta"
 a_gj_sorava_escolta_3_desc: "Puestos de armas con arcabuz a lo largo de la ruta. Defensivos, caros y lentos; fuertes en la costa y junto a los ríos."
 a_gj_sorava_escolta_4: "Escolta de Mosquete"
 a_gj_sorava_escolta_4_desc: "Hombres de mosquete y bayoneta que cierran filas en torno a la carga. Defensivos, caros y lentos; fuertes en la costa y junto a los ríos."
 a_gj_sorava_escolta_5: "Escolta de Línea"
 a_gj_sorava_escolta_5_desc: "Líneas disciplinadas que protegen una ruta entera. Defensivos, caros y lentos; fuertes en la costa y junto a los ríos."
 a_gj_sorava_escolta_6: "Escolta de Fusil"
 a_gj_sorava_escolta_6_desc: "Fusileros con armas rayadas, entrenados para aguantar sin retroceder. Defensivos, caros y lentos; fuertes en la costa y junto a los ríos."
 a_gj_sorava_tirador_1: "Tirador de Rada"
 a_gj_sorava_tirador_1_desc: "Arqueros de puerto, hechos a disparar desde un muelle con el mar moviéndose. Hacen mucho daño y se rompen pronto; tierra adentro flojean."
 a_gj_sorava_tirador_2: "Ballestero de Rada"
 a_gj_sorava_tirador_2_desc: "Ballesteros de puerto con petos ligeros. Hacen mucho daño y se rompen pronto; tierra adentro flojean."
 a_gj_sorava_tirador_3: "Arcabucero de Rada"
 a_gj_sorava_tirador_3_desc: "Arcabuceros de costa, tiradores certeros con un arma recién llegada. Hacen mucho daño y se rompen pronto; tierra adentro flojean."
 a_gj_sorava_tirador_4: "Tirador de Costa"
 a_gj_sorava_tirador_4_desc: "Compañías de tiradores que guardan cada cala y cada embarcadero. Hacen mucho daño y se rompen pronto; tierra adentro flojean."
 a_gj_sorava_tirador_5: "Fusilero de Rada"
 a_gj_sorava_tirador_5_desc: "Fusileros ligeros de puerto, rápidos de recarga. Hacen mucho daño y se rompen pronto; tierra adentro flojean."
 a_gj_sorava_tirador_6: "Carabinero de Rada"
 a_gj_sorava_tirador_6_desc: "Tiradores de precisión al servicio de las Casas. Hacen mucho daño y se rompen pronto; tierra adentro flojean."

 # ===== Decisiones =====
 gj_sorava_contrato_especias.title: "Firmar un Contrato de especias"
 gj_sorava_contrato_especias.desc: "Las Casas ofrecen entregar especias durante cinco años a un precio acordado de antemano. La producción sube, pero los márgenes bajan. Al cierre habrá que rendir cuentas."
 gj_sorava_contrato_especias.a: "Que se pesen las firmas."
 gj_sorava_contrato_perlas.title: "Firmar un Contrato de perlas"
 gj_sorava_contrato_perlas.desc: "Los buzos entregarán toda su cosecha a un comprador por cinco años. Más perlas y joyas, menos pesca. Al cierre habrá que rendir cuentas."
 gj_sorava_contrato_perlas.a: "Que bajen los buzos."
 gj_sorava_contrato_escolta.title: "Firmar un Contrato de escolta"
 gj_sorava_contrato_escolta.desc: "Las escoltas de las Casas cubrirán durante cinco años las rutas de un socio. Más seguridad en el comercio, más gasto en armas. Al cierre habrá que rendir cuentas."
 gj_sorava_contrato_escolta.a: "Que marchen las escoltas."
 gj_sorava_disputar_estrecho.title: "Disputar el estrecho"
 gj_sorava_disputar_estrecho.desc: "Una flota permanente y barata de sostener sobre el papel, carísima en la realidad. Durante cinco años, cada nave de la Liga que cruce el estrecho tendrá que pensárselo dos veces."
 gj_sorava_disputar_estrecho.a: "Que zarpe la flota."
 gj_sorava_lonja_mayor.title: "Fundar la Lonja Mayor"
 gj_sorava_lonja_mayor.desc: "La Sala de las Balanzas de la capital ya está en pie. Falta el Gran Libro, donde cada Casa anotará todos sus tratos. Una vez abierto, no se cierra."
 gj_sorava_lonja_mayor.a: "Que se abra el libro."
 gj_sorava_auditar_las_casas.title: "Auditar las Casas"
 gj_sorava_auditar_las_casas.desc: "Si la palabra de Sorava anda baja, un tribunal de pesadores puede revisar los libros uno por uno. Duele, pero devuelve la confianza."
 gj_sorava_auditar_las_casas.a: "Que se revisen los libros."
 gj_sorava_puerto_franco.title: "Declarar puerto franco"
 gj_sorava_puerto_franco.desc: "La capital se libra de aduanas: llegan naves de toda la costa. También llegan los contrabandistas, y no todos los tratos serán limpios."
 gj_sorava_puerto_franco.a: "Que se abran las cadenas del puerto."

 # ===== Desastre =====
 gj_sorava_quiebra_de_las_casas: "La Quiebra de las Casas"
 gj_sorava_quiebra_de_las_casas_desc: "Demasiados contratos rotos, demasiadas deudas sin pagar: las Casas menores retiran su crédito y el comercio se hunde. Terminará cuando la palabra de Sorava se recupere."
