 STATIC_MODIFIER_DESC_gj_marea_negra_tributo_del_faro: "Tributo del faro"
 STATIC_MODIFIER_NAME_gj_mundo_bestias_batida_hecha: "Comarca batida"
 STATIC_MODIFIER_DESC_gj_mundo_bestias_batida_hecha: "Las tropas han limpiado el monte. Por unos años, el paso y el pasto son tuyos otra vez."
 STATIC_MODIFIER_NAME_gj_mundo_bestias_caceria_fallida: "La Cacería que se perdió"
 STATIC_MODIFIER_DESC_gj_mundo_bestias_caceria_fallida: "Las viudas de la Cacería no olvidan, y los reclutas tampoco."
 STATIC_MODIFIER_NAME_gj_mundo_bestias_cazador_de_dragones: "Quien mató a la Durmiente"
 STATIC_MODIFIER_DESC_gj_mundo_bestias_cazador_de_dragones: "Los cantores lo repiten en cada posada y los reyes vecinos lo piensan dos veces antes de discutir con vos."
 STATIC_MODIFIER_NAME_gj_mundo_bestias_ceniza_fertil: "Surco de ceniza dulce"
 STATIC_MODIFIER_DESC_gj_mundo_bestias_ceniza_fertil: "La ceniza fina que bajó de la caldera ha dejado un abono que los labradores llaman bendición."
 STATIC_MODIFIER_NAME_gj_mundo_bestias_cometa_bueno: "Bajo buen cielo"
 STATIC_MODIFIER_DESC_gj_mundo_bestias_cometa_bueno: "La corte ha leído el presagio como una promesa y el reino camina con la cabeza alta."
 STATIC_MODIFIER_NAME_gj_mundo_bestias_cometa_malo: "Murallas del presagio"
 STATIC_MODIFIER_DESC_gj_mundo_bestias_cometa_malo: "Se ha leído la señal como una advertencia: más piedra en las murallas, menos oro en las arcas."
 STATIC_MODIFIER_NAME_gj_mundo_bestias_corazon_de_brasa: "Corazón de Brasa"
 STATIC_MODIFIER_DESC_gj_mundo_bestias_corazon_de_brasa: "En las forjas del reino arde un carbón que no se apaga. Los herreros dicen que el metal obedece mejor."
 STATIC_MODIFIER_NAME_gj_mundo_bestias_dominio_del_estrecho: "Señor del Estrecho"
 STATIC_MODIFIER_DESC_gj_mundo_bestias_dominio_del_estrecho: "Quien mató a Ullamar cobra respeto en cada puerto del paso. Las flotas ajenas bajan la vela al cruzar."
 STATIC_MODIFIER_NAME_gj_mundo_bestias_dragon_alerta: "Guardias en los pasos de la caldera"
 STATIC_MODIFIER_DESC_gj_mundo_bestias_dragon_alerta: "Las atalayas arden de noche y los pastores duermen vestidos. Se rinde menos, pero nadie vuelve a ser sorprendido."
 STATIC_MODIFIER_NAME_gj_mundo_bestias_dragon_aplacado: "La Durmiente aplacada"
 STATIC_MODIFIER_DESC_gj_mundo_bestias_dragon_aplacado: "Las ofrendas han llegado hasta el borde de la caldera y alguien allá abajo las ha aceptado."
 STATIC_MODIFIER_NAME_gj_mundo_bestias_dragon_furioso: "La ira de Kharuun"
 STATIC_MODIFIER_DESC_gj_mundo_bestias_dragon_furioso: "La Durmiente ha probado el hierro de los cazadores y no lo olvida. Cada valle cercano paga el agravio."
 STATIC_MODIFIER_NAME_gj_mundo_bestias_eclipse_encierro: "Puertas cerradas"
 STATIC_MODIFIER_DESC_gj_mundo_bestias_eclipse_encierro: "Con el reino encerrado y rezando, el enemigo que cruce la frontera tendrá una mala estación, y el campo también."
 STATIC_MODIFIER_NAME_gj_mundo_bestias_eclipse_renovacion: "Voto del astro devuelto"
 STATIC_MODIFIER_DESC_gj_mundo_bestias_eclipse_renovacion: "Tras el día sin luz, la corona ha jurado de nuevo ante el pueblo. Se gana legitimidad; el comercio duda."
 STATIC_MODIFIER_NAME_gj_mundo_bestias_escamas_de_brasa: "Escamas de Brasa"
 STATIC_MODIFIER_DESC_gj_mundo_bestias_escamas_de_brasa: "Las corazas del ejército se forjaron con las escamas de la Durmiente: no se calientan con el sol y asustan a los caballos enemigos."
 STATIC_MODIFIER_NAME_gj_mundo_bestias_kraken_cebo: "El cebo funcionó"
 STATIC_MODIFIER_DESC_gj_mundo_bestias_kraken_cebo: "Bueyes salados arrojados a la corriente han contentado, por ahora, a lo que habita debajo."
 STATIC_MODIFIER_NAME_gj_mundo_bestias_kraken_comercio_caido: "Comercio acobardado"
 STATIC_MODIFIER_DESC_gj_mundo_bestias_kraken_comercio_caido: "Los armadores rodean medio mar con tal de no cruzar el paso."
 STATIC_MODIFIER_NAME_gj_mundo_bestias_kraken_furioso: "El coloso herido"
 STATIC_MODIFIER_DESC_gj_mundo_bestias_kraken_furioso: "Ullamar ha sobrevivido, y desde entonces ataca a todo lo que lleva vuestra bandera."
 STATIC_MODIFIER_NAME_gj_mundo_bestias_kraken_patrulla: "Patrulla del estrecho"
 STATIC_MODIFIER_DESC_gj_mundo_bestias_kraken_patrulla: "Una flota recorre el paso con linternas a proa. Los colosos lo saben y se mantienen a distancia."
 STATIC_MODIFIER_NAME_gj_mundo_bestias_lobos_domados: "Lobos de la estepa"
 STATIC_MODIFIER_DESC_gj_mundo_bestias_lobos_domados: "Los jinetes crían a sus lobos desde cachorros: ladran a los caballos ajenos y no se espantan del fuego."
 STATIC_MODIFIER_NAME_gj_mundo_bestias_luto_de_la_flota: "Luto de la flota"
 STATIC_MODIFIER_DESC_gj_mundo_bestias_luto_de_la_flota: "Los marineros se persignan antes de zarpar, y los astilleros tardan en llenarse de aprendices."
 STATIC_MODIFIER_NAME_gj_mundo_bestias_nido_protegido: "Bajo el ala"
 STATIC_MODIFIER_DESC_gj_mundo_bestias_nido_protegido: "El reino duerme tranquilo: la Brasa Mayor lo cuenta entre los suyos."
 STATIC_MODIFIER_NAME_gj_mundo_bestias_pesca_vacia: "Redes vacías"
 STATIC_MODIFIER_DESC_gj_mundo_bestias_pesca_vacia: "Algo grande ha espantado los bancos de pesca. Las barcas vuelven con las redes secas."
 STATIC_MODIFIER_NAME_gj_mundo_bestias_plaga_enjambre: "Nube zumbadora"
 STATIC_MODIFIER_DESC_gj_mundo_bestias_plaga_enjambre: "Una nube de insectos del tamaño de un pulgar devora cosechas enteras en una tarde."
 STATIC_MODIFIER_NAME_gj_mundo_bestias_plaga_lobos: "Plaga de lobos grandes"
 STATIC_MODIFIER_DESC_gj_mundo_bestias_plaga_lobos: "Una jauría blanca ronda los pastos. Las caravanas viajan en grupo y los pastores han dejado de salir de noche."
 STATIC_MODIFIER_NAME_gj_mundo_bestias_plaga_wyverns: "Plaga de wyverns"
 STATIC_MODIFIER_DESC_gj_mundo_bestias_plaga_wyverns: "Alas de cuero oscurecen los puertos de montaña. Se cae el comercio y el control se afloja."
 STATIC_MODIFIER_NAME_gj_mundo_bestias_suelo_agrietado: "Suelo agrietado"
 STATIC_MODIFIER_DESC_gj_mundo_bestias_suelo_agrietado: "Las grietas silban de noche. Nadie quiere vivir en las casas del lado norte."
 STATIC_MODIFIER_NAME_gj_mundo_bestias_tierra_calcinada: "Tierra calcinada"
 STATIC_MODIFIER_DESC_gj_mundo_bestias_tierra_calcinada: "Donde pasó la Durmiente, el suelo es cristal negro. Tardará una década en dar de comer."
 STATIC_MODIFIER_NAME_gj_orunmar_ayuno_cumplido: "Ayuno cumplido"
 STATIC_MODIFIER_DESC_gj_orunmar_ayuno_cumplido: "El pueblo ha ayunado y los dioses se han dado por servidos, por ahora."
 STATIC_MODIFIER_NAME_gj_orunmar_banquete_de_victoria: "Banquete de victoria"
 STATIC_MODIFIER_DESC_gj_orunmar_banquete_de_victoria: "La Escalinata humea y el pueblo ve cumplido su deber."
 STATIC_MODIFIER_NAME_gj_orunmar_bonanza_de_tinte: "Bonanza del tinte"
 STATIC_MODIFIER_DESC_gj_orunmar_bonanza_de_tinte: "El rojo de Orunmar se paga en plata y en cacao."
 STATIC_MODIFIER_NAME_gj_orunmar_botin_de_nobles: "Botín de nobles"
 STATIC_MODIFIER_DESC_gj_orunmar_botin_de_nobles: "Un señor enemigo en nuestras manos vale más que mil campesinos."
 STATIC_MODIFIER_NAME_gj_orunmar_campos_de_cautivos: "Campos de cautivos"
 STATIC_MODIFIER_DESC_gj_orunmar_campos_de_cautivos: "Los cautivos trabajan a destajo, y el control local se resiente."
 STATIC_MODIFIER_NAME_gj_orunmar_cosecha_de_esclavos: "Cosecha de esclavos"
 STATIC_MODIFIER_DESC_gj_orunmar_cosecha_de_esclavos: "Más brazos en los campos y las minas, más bocas que alimentar y más rencor que vigilar."
 STATIC_MODIFIER_NAME_gj_orunmar_levas_de_ayuno: "Levas de ayuno"
 STATIC_MODIFIER_DESC_gj_orunmar_levas_de_ayuno: "Los hombres huyen del dosel y no hay sacerdote que los traiga."
 STATIC_MODIFIER_NAME_gj_orunmar_marcha_de_cosecha: "Marcha de la Cosecha"
 STATIC_MODIFIER_DESC_gj_orunmar_marcha_de_cosecha: "Los campos esperan mientras la hueste cumple con los dioses."
 STATIC_MODIFIER_NAME_gj_orunmar_mecenas_de_la_niebla: "Mecenas de la niebla"
 STATIC_MODIFIER_DESC_gj_orunmar_mecenas_de_la_niebla: "Poetas, escribas y tintoreros cantan al país que los sostiene."
 STATIC_MODIFIER_NAME_gj_orunmar_niebla_bendita: "Niebla bendita"
 STATIC_MODIFIER_DESC_gj_orunmar_niebla_bendita: "La bruma de las cumbres cubre los escalones de cultivo y los dioses sonríen."
 STATIC_MODIFIER_NAME_gj_orunmar_orugas_rojas: "Orugas rojas"
 STATIC_MODIFIER_DESC_gj_orunmar_orugas_rojas: "Una plaga de orugas devora los escalones de cultivo."
 STATIC_MODIFIER_NAME_gj_orunmar_paz_cobardia: "Paz de cobardes"
 STATIC_MODIFIER_DESC_gj_orunmar_paz_cobardia: "Los sacerdotes murmuran que la Mesa ha perdido el apetito."
 STATIC_MODIFIER_NAME_gj_orunmar_paz_con_el_sol: "Paz con los hijos del Sol"
 STATIC_MODIFIER_DESC_gj_orunmar_paz_con_el_sol: "Los regalos ankaruníes llenan los mercados, pero los sacerdotes miran la cuenta del hambre."
 STATIC_MODIFIER_NAME_gj_orunmar_rebelion_de_cautivos: "Rebelión de cautivos"
 STATIC_MODIFIER_DESC_gj_orunmar_rebelion_de_cautivos: "Las minas arden y los capataces no vuelven."
 STATIC_MODIFIER_NAME_gj_ostrevar_conquista_reciente: "Guerras de conquista seguidas"
 STATIC_MODIFIER_NAME_gj_ostrevar_cuenta_del_ejercito: "El ejercito sale caro"
