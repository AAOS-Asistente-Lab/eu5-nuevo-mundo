 # GENERADO por funde-partes.mjs: claves del juego para modificadores que las partes nombran con la clave pelada.
 STATIC_MODIFIER_NAME_gj_dioses_hambrientos_ayuno_penitente_mod: "Ayuno penitente"
 STATIC_MODIFIER_DESC_gj_dioses_hambrientos_ayuno_penitente_mod: "El pueblo come poco para que los dioses coman más."
 STATIC_MODIFIER_NAME_gj_dioses_hambrientos_banquete_de_los_dioses: "Banquete de los dioses"
 STATIC_MODIFIER_DESC_gj_dioses_hambrientos_banquete_de_los_dioses: "Se ha servido una Mesa tan larga que hasta los soldados comen hasta saciarse."
 STATIC_MODIFIER_NAME_gj_dioses_hambrientos_cuenta_cumplida: "La Cuenta cumplida"
 STATIC_MODIFIER_DESC_gj_dioses_hambrientos_cuenta_cumplida: "Los dioses recibieron lo que se les prometió. El valor de nuestras tropas es contado en las crónicas."
 STATIC_MODIFIER_NAME_gj_dioses_hambrientos_dioses_airados: "Dioses airados"
 STATIC_MODIFIER_DESC_gj_dioses_hambrientos_dioses_airados: "La Cuenta está en números rojos y los Cribadores no ocultan su inquietud."
 STATIC_MODIFIER_NAME_gj_dioses_hambrientos_hambre_del_cielo: "El hambre del cielo"
 STATIC_MODIFIER_DESC_gj_dioses_hambrientos_hambre_del_cielo: "Una señal en el cielo anuncia que los dioses esperan una guerra de cosecha. Los guerreros están más ansiosos."
 STATIC_MODIFIER_NAME_gj_dioses_hambrientos_hijos_de_la_casa: "Hijos de la casa"
 STATIC_MODIFIER_DESC_gj_dioses_hambrientos_hijos_de_la_casa: "Quienes fueron cautivos llevan ya el nombre de la casa que los acogió."
 STATIC_MODIFIER_NAME_gj_dioses_hambrientos_manos_nuevas: "Manos nuevas"
 STATIC_MODIFIER_DESC_gj_dioses_hambrientos_manos_nuevas: "Los cautivos trabajan campos y minas. La producción sube, y también el rencor de quienes la sostienen."
 STATIC_MODIFIER_NAME_gj_dioses_hambrientos_paz_del_plato: "La Gran Paz del Plato"
 STATIC_MODIFIER_DESC_gj_dioses_hambrientos_paz_del_plato: "Los dioses duermen saciados y los campos, por una vez, no cobran deuda."
 STATIC_MODIFIER_NAME_gj_dioses_hambrientos_pozo_bendecido: "Pozo que habla"
 STATIC_MODIFIER_DESC_gj_dioses_hambrientos_pozo_bendecido: "Los fieles acuden a oír la voz del pozo."
 STATIC_MODIFIER_NAME_gj_dioses_hambrientos_silos_bendecidos: "Silos bendecidos"
 STATIC_MODIFIER_DESC_gj_dioses_hambrientos_silos_bendecidos: "El grano de los silos guardados por Daroh se conserva más tiempo."
 STATIC_MODIFIER_DESC_gj_hrimval_noche_blanca: "La Corte Insepulta ha despertado. Durante cuatro años, un invierno sobrenatural cubre todo el norte, las Huestes no sienten el frío ni el cansancio, y las Marchas de Escarcha salen a recoger a los que caen. Cuando acabe, la Corte volverá a dormir."
 STATIC_MODIFIER_NAME_gj_marea_negra_almirante_audaz: "Almirante audaz"
 STATIC_MODIFIER_DESC_gj_marea_negra_almirante_audaz: "Almirante audaz"
