 STATIC_MODIFIER_NAME_gj_ostrevar_llamada_ciudades: "La Llamada de las Ciudades"
 STATIC_MODIFIER_NAME_gj_velathi_bosque_antiguo: "Bosque Antiguo"
 STATIC_MODIFIER_DESC_gj_velathi_bosque_antiguo: "Un bosque sagrado plantado con paciencia. Los ejércitos enemigos sufren desgaste, y la comarca recupera antes población y control."
 STATIC_MODIFIER_NAME_gj_velathi_brote_reciente: "Brote reciente"
 STATIC_MODIFIER_DESC_gj_velathi_brote_reciente: "Los retoños nuevos devuelven la vida a la comarca."
 STATIC_MODIFIER_NAME_gj_velathi_cansancio_1: "Cansancio del trono: primer siglo"
 STATIC_MODIFIER_DESC_gj_velathi_cansancio_1: "El mismo rey lleva muchos años en el trono y las ideas empiezan a repetirse."
 STATIC_MODIFIER_NAME_gj_velathi_cansancio_2: "Cansancio del trono: segundo siglo"
 STATIC_MODIFIER_DESC_gj_velathi_cansancio_2: "El reinado se alarga. Nadie se atreve a contradecir a quien lo vio todo."
 STATIC_MODIFIER_NAME_gj_velathi_cansancio_3: "Cansancio del trono: tercer siglo"
 STATIC_MODIFIER_DESC_gj_velathi_cansancio_3: "El trono pesa más que el reino. La corte duerme, y el mundo avanza."
 STATIC_MODIFIER_NAME_gj_velathi_consejo_regente: "Consejo regente"
 STATIC_MODIFIER_DESC_gj_velathi_consejo_regente: "El rey duerme y el consejo de ancianos gobierna en su nombre, con prudencia y sin ambición."
 STATIC_MODIFIER_NAME_gj_velathi_estandarte_de_hojas: "Estandarte de hojas"
 STATIC_MODIFIER_DESC_gj_velathi_estandarte_de_hojas: "Los ejércitos marchan bajo un estandarte de mil hojas. Cada soldado sabe lo que defiende."
 STATIC_MODIFIER_NAME_gj_velathi_heredera_en_el_consejo: "Heredera en el consejo"
 STATIC_MODIFIER_DESC_gj_velathi_heredera_en_el_consejo: "Una voz joven se sienta entre los ancianos y los obliga a explicar lo que hacen."
 STATIC_MODIFIER_NAME_gj_velathi_incendio_en_la_copa: "Incendio en la copa"
 STATIC_MODIFIER_DESC_gj_velathi_incendio_en_la_copa: "El fuego ha prendido en las copas. La comarca sufre y la madera escasea."
 STATIC_MODIFIER_NAME_gj_velathi_otono_eterno: "Otoño eterno"
 STATIC_MODIFIER_DESC_gj_velathi_otono_eterno: "Las hojas no caen y el bosque da más de lo habitual."
 STATIC_MODIFIER_NAME_gj_velathi_puertas_abiertas: "Caminos abiertos"
 STATIC_MODIFIER_DESC_gj_velathi_puertas_abiertas: "Los forasteros son recibidos en los claros. Llegan ideas nuevas, y también costumbres que algunos prefieren no ver."
 STATIC_MODIFIER_NAME_gj_velathi_puertas_cerradas: "Caminos cerrados"
 STATIC_MODIFIER_DESC_gj_velathi_puertas_cerradas: "Los senderos del bosque se han cerrado a los forasteros. La paz interior aumenta, y el comercio sufre."
 STATIC_MODIFIER_NAME_gj_velathi_reinado_de_espinas: "Reinado de espinas"
 STATIC_MODIFIER_DESC_gj_velathi_reinado_de_espinas: "El nuevo rey promete defensa: quien entre sin permiso, saldrá con espinas."
 STATIC_MODIFIER_NAME_gj_velathi_reinado_de_hojas: "Reinado de hojas"
 STATIC_MODIFIER_DESC_gj_velathi_reinado_de_hojas: "El nuevo rey promete aprender: cada año traerá una hoja nueva."
 STATIC_MODIFIER_NAME_gj_velathi_reinado_de_raices: "Reinado de raíces"
 STATIC_MODIFIER_DESC_gj_velathi_reinado_de_raices: "El nuevo rey promete continuidad: lo que fue, será."
 STATIC_MODIFIER_NAME_gj_velathi_rey_dormido: "Rey dormido"
 STATIC_MODIFIER_DESC_gj_velathi_rey_dormido: "El rey vive, pero no está. Su mente vaga por sueños antiguos."
 STATIC_MODIFIER_NAME_gj_velathi_rey_renovado: "Rey renovado"
 STATIC_MODIFIER_DESC_gj_velathi_rey_renovado: "Tras el Sueño Largo, el rey vuelve con ojos nuevos y una memoria que lo abarca todo."
 STATIC_MODIFIER_NAME_gj_velathi_savia_que_cura: "Savia que cura"
 STATIC_MODIFIER_DESC_gj_velathi_savia_que_cura: "Una savia curativa baña la comarca. Las fiebres ceden y la población crece."
 STATIC_MODIFIER_NAME_gj_velathi_savia_serena: "Savia serena"
 STATIC_MODIFIER_DESC_gj_velathi_savia_serena: "Una calma extraña recorre el Dosel. Las enfermedades ceden y la gente se siente orgullosa."
 STATIC_MODIFIER_NAME_gj_velathi_senda_del_dosel: "Senda del dosel"
 STATIC_MODIFIER_DESC_gj_velathi_senda_del_dosel: "Nuevos caminos entre las copas acortan los viajes y mejoran el abastecimiento."
 STATIC_MODIFIER_NAME_gj_velathi_tala_reciente: "Tala reciente"
 STATIC_MODIFIER_DESC_gj_velathi_tala_reciente: "Se ha talado más de la cuenta. La madera abunda, pero los árboles murmuran."
 STATIC_MODIFIER_NAME_gj_velathi_trueque_de_madera: "Trueque de madera"
 STATIC_MODIFIER_DESC_gj_velathi_trueque_de_madera: "Se cambia madera por monedas en las ferias de frontera. El bosque da menos, pero las arcas se llenan."
