 STATIC_MODIFIER_NAME_gj_ostrevar_ev_inmigracion: "Oleada de forasteros"
 STATIC_MODIFIER_NAME_gj_ostrevar_ev_lazareto: "Fiebres en los barrios altos"
 STATIC_MODIFIER_NAME_gj_ostrevar_ev_maestro: "El arquitecto prodigio"
 STATIC_MODIFIER_NAME_gj_ostrevar_ev_obra_mayor: "Obra mayor en marcha"
