 STATIC_MODIFIER_DESC_gj_marea_negra_almirante_tratante: "Almirante tratante"
 STATIC_MODIFIER_NAME_gj_marea_negra_amenaza_de_disolucion: "La Hermandad se resquebraja"
 STATIC_MODIFIER_DESC_gj_marea_negra_amenaza_de_disolucion: "Quedan pocos puertos y el Código empieza a ceder."
 STATIC_MODIFIER_NAME_gj_marea_negra_arsenal_flotante: "Arsenal flotante"
 STATIC_MODIFIER_DESC_gj_marea_negra_arsenal_flotante: "Arsenal flotante"
