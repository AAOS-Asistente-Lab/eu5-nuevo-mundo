l_spanish:
 # ===== Modificadores =====
 gj_mundo_bestias_dragon_alerta: "Guardias en los pasos de la caldera"
 gj_mundo_bestias_dragon_alerta_desc: "Las atalayas arden de noche y los pastores duermen vestidos. Se rinde menos, pero nadie vuelve a ser sorprendido."
 gj_mundo_bestias_dragon_aplacado: "La Durmiente aplacada"
 gj_mundo_bestias_dragon_aplacado_desc: "Las ofrendas han llegado hasta el borde de la caldera y alguien allá abajo las ha aceptado."
 gj_mundo_bestias_dragon_furioso: "La ira de Kharuun"
 gj_mundo_bestias_dragon_furioso_desc: "La Durmiente ha probado el hierro de los cazadores y no lo olvida. Cada valle cercano paga el agravio."
 gj_mundo_bestias_nido_protegido: "Bajo el ala"
 gj_mundo_bestias_nido_protegido_desc: "El reino duerme tranquilo: la Brasa Mayor lo cuenta entre los suyos."
 gj_mundo_bestias_escamas_de_brasa: "Escamas de Brasa"
 gj_mundo_bestias_escamas_de_brasa_desc: "Las corazas del ejército se forjaron con las escamas de la Durmiente: no se calientan con el sol y asustan a los caballos enemigos."
 gj_mundo_bestias_corazon_de_brasa: "Corazón de Brasa"
 gj_mundo_bestias_corazon_de_brasa_desc: "En las forjas del reino arde un carbón que no se apaga. Los herreros dicen que el metal obedece mejor."
 gj_mundo_bestias_cazador_de_dragones: "Quien mató a la Durmiente"
 gj_mundo_bestias_cazador_de_dragones_desc: "Los cantores lo repiten en cada posada y los reyes vecinos lo piensan dos veces antes de discutir con vos."
 gj_mundo_bestias_caceria_fallida: "La Cacería que se perdió"
 gj_mundo_bestias_caceria_fallida_desc: "Las viudas de la Cacería no olvidan, y los reclutas tampoco."
 gj_mundo_bestias_kraken_patrulla: "Patrulla del estrecho"
 gj_mundo_bestias_kraken_patrulla_desc: "Una flota recorre el paso con linternas a proa. Los colosos lo saben y se mantienen a distancia."
 gj_mundo_bestias_kraken_comercio_caido: "Comercio acobardado"
 gj_mundo_bestias_kraken_comercio_caido_desc: "Los armadores rodean medio mar con tal de no cruzar el paso."
 gj_mundo_bestias_kraken_cebo: "El cebo funcionó"
 gj_mundo_bestias_kraken_cebo_desc: "Bueyes salados arrojados a la corriente han contentado, por ahora, a lo que habita debajo."
 gj_mundo_bestias_dominio_del_estrecho: "Señor del Estrecho"
 gj_mundo_bestias_dominio_del_estrecho_desc: "Quien mató a Ullamar cobra respeto en cada puerto del paso. Las flotas ajenas bajan la vela al cruzar."
 gj_mundo_bestias_kraken_furioso: "El coloso herido"
 gj_mundo_bestias_kraken_furioso_desc: "Ullamar ha sobrevivido, y desde entonces ataca a todo lo que lleva vuestra bandera."
 gj_mundo_bestias_luto_de_la_flota: "Luto de la flota"
 gj_mundo_bestias_luto_de_la_flota_desc: "Los marineros se persignan antes de zarpar, y los astilleros tardan en llenarse de aprendices."
 gj_mundo_bestias_cometa_bueno: "Bajo buen cielo"
 gj_mundo_bestias_cometa_bueno_desc: "La corte ha leído el presagio como una promesa y el reino camina con la cabeza alta."
 gj_mundo_bestias_cometa_malo: "Murallas del presagio"
 gj_mundo_bestias_cometa_malo_desc: "Se ha leído la señal como una advertencia: más piedra en las murallas, menos oro en las arcas."
 gj_mundo_bestias_eclipse_renovacion: "Voto del astro devuelto"
 gj_mundo_bestias_eclipse_renovacion_desc: "Tras el día sin luz, la corona ha jurado de nuevo ante el pueblo. Se gana legitimidad; el comercio duda."
 gj_mundo_bestias_eclipse_encierro: "Puertas cerradas"
 gj_mundo_bestias_eclipse_encierro_desc: "Con el reino encerrado y rezando, el enemigo que cruce la frontera tendrá una mala estación, y el campo también."
 gj_mundo_bestias_lobos_domados: "Lobos de la estepa"
 gj_mundo_bestias_lobos_domados_desc: "Los jinetes crían a sus lobos desde cachorros: ladran a los caballos ajenos y no se espantan del fuego."
 gj_mundo_bestias_tierra_calcinada: "Tierra calcinada"
 gj_mundo_bestias_tierra_calcinada_desc: "Donde pasó la Durmiente, el suelo es cristal negro. Tardará una década en dar de comer."
 gj_mundo_bestias_suelo_agrietado: "Suelo agrietado"
 gj_mundo_bestias_suelo_agrietado_desc: "Las grietas silban de noche. Nadie quiere vivir en las casas del lado norte."
 gj_mundo_bestias_ceniza_fertil: "Surco de ceniza dulce"
 gj_mundo_bestias_ceniza_fertil_desc: "La ceniza fina que bajó de la caldera ha dejado un abono que los labradores llaman bendición."
 gj_mundo_bestias_pesca_vacia: "Redes vacías"
 gj_mundo_bestias_pesca_vacia_desc: "Algo grande ha espantado los bancos de pesca. Las barcas vuelven con las redes secas."
 gj_mundo_bestias_plaga_lobos: "Plaga de lobos grandes"
 gj_mundo_bestias_plaga_lobos_desc: "Una jauría blanca ronda los pastos. Las caravanas viajan en grupo y los pastores han dejado de salir de noche."
 gj_mundo_bestias_plaga_wyverns: "Plaga de wyverns"
 gj_mundo_bestias_plaga_wyverns_desc: "Alas de cuero oscurecen los puertos de montaña. Se cae el comercio y el control se afloja."
 gj_mundo_bestias_plaga_enjambre: "Nube zumbadora"
 gj_mundo_bestias_plaga_enjambre_desc: "Una nube de insectos del tamaño de un pulgar devora cosechas enteras en una tarde."
 gj_mundo_bestias_batida_hecha: "Comarca batida"
 gj_mundo_bestias_batida_hecha_desc: "Las tropas han limpiado el monte. Por unos años, el paso y el pasto son tuyos otra vez."

 # ===== Decisiones =====
 gj_mundo_bestias_aplacar_durmiente: "Aplacar a la Durmiente"
 gj_mundo_bestias_aplacar_durmiente_desc: "Subir a la boca de la caldera con ofrendas, incienso y cantores. A veces la Durmiente se vuelve a dormir; a veces solo cambia de lado."
 gj_mundo_bestias_aplacar_durmiente.a: "Que suban las ofrendas"
 gj_mundo_bestias_gran_caceria: "La Gran Cacería"
 gj_mundo_bestias_gran_caceria_desc: "Reunir un ejército grande, con un general que sepa que no volverá si fracasa, y subir a buscar a Kharuun. Si cae, el reino recibirá un tesoro y una fama que no se borra. Si no cae, la Durmiente se acordará."
 gj_mundo_bestias_gran_caceria.a: "Levantar la Cacería"
 gj_mundo_bestias_patrullar_estrecho: "Patrullar el estrecho"
 gj_mundo_bestias_patrullar_estrecho_desc: "Mantener una flota de guardia en el paso con linternas y arpones. Los colosos se acercan menos a los cascos que ven vigilados."
 gj_mundo_bestias_patrullar_estrecho.a: "Que la flota zarpe"
 gj_mundo_bestias_cazar_coloso: "Cazar al Coloso"
 gj_mundo_bestias_cazar_coloso_desc: "Con una patrulla ya en el paso y una flota que no tema la sombra, ir a por Ullamar. Un solo acierto del arpón cambia el estrecho para siglos; un solo error cuesta media flota."
 gj_mundo_bestias_cazar_coloso.a: "Soltar los arpones"
 gj_mundo_bestias_batida: "Organizar una Batida"
 gj_mundo_bestias_batida_desc: "Un ejército en la comarca durante unos meses: se limpia el monte, ganan oficio los soldados y las pieles pagan parte del gasto."
 gj_mundo_bestias_batida.a: "Que las tropas batan el monte"

 # ===== Dragon: eventos =====
 gj_mundo_bestias.1.title: "La Durmiente se revuelve"
 gj_mundo_bestias.1.desc: "Los pastores de la caldera cuentan que el agua de los pozos huele a azufre desde la última luna. Los ancianos hablan de una Durmiente más antigua que los reinos, a la que llaman Kharuun, y dicen que ha cambiado de lado en el sueño. Los pájaros no anidan en las laderas altas y los perros miran al suelo."
 gj_mundo_bestias.1.a: "Doblar las guardias de los pasos"
 gj_mundo_bestias.1.b: "Enviar ofrendas al borde de la caldera"
 gj_mundo_bestias.1.c: "Vender el azufre que escupe la tierra"
 gj_mundo_bestias.2.title: "Temblores bajo las ollas"
 gj_mundo_bestias.2.desc: "Los alfareros de la caldera encuentran sus ollas agrietadas por la mañana, sin que nadie las haya tocado. Los mineros dicen que el suelo late por las noches. Un capataz propone apuntalar los pozos antes de que algo ceda."
 gj_mundo_bestias.2.a: "Apuntalar los pozos y los techos"
 gj_mundo_bestias.2.b: "Seguir trabajando: el azufre se vende bien"
 gj_mundo_bestias.3.title: "Las aves huyen del valle"
 gj_mundo_bestias.3.desc: "Una mañana de calma los cuervos, las grullas y hasta las moscas han abandonado la caldera. Un cazador veterano jura que lo único que se oye es un respirar profundo bajo las rocas. Los consejeros discuten si es hora de ofrendar o de mirar."
 gj_mundo_bestias.3.a: "Quemar incienso en el borde de la caldera"
 gj_mundo_bestias.3.b: "Mandar exploradores a mirar de cerca"
 gj_mundo_bestias.4.title: "Kharuun despierta"
 gj_mundo_bestias.4.desc: "La montaña ha rugido. Una columna de humo negro sube desde la caldera y se ve desde tres jornadas. Los pastores bajan corriendo con el ganado, y quien vio los ojos dorados abriéndose en la roca no ha vuelto a hablar. La Durmiente ya no duerme."
 gj_mundo_bestias.4.a: "¡Sonad las trompas de aviso!"
 gj_mundo_bestias.4.b: "Evacuar los valles antes de que sea tarde"
 gj_mundo_bestias.4.c: "Honrar a la Brasa Mayor con el rito de las Voces"
 gj_mundo_bestias.5.title: "El tributo de brasa"
 gj_mundo_bestias.5.desc: "Un heraldo no humano, hecho de cenizas y brasas, ha llegado a la plaza y ha depositado una escama del tamaño de un escudo. Nadie sabe cómo se hace entender, pero todos comprenden: la Durmiente quiere oro, y quiere que se lo lleven al borde de la caldera."
 gj_mundo_bestias.5.a: "Pagar el tributo"
 gj_mundo_bestias.5.b: "Negarse: ningún reino se arrodilla ante una lagartija"
 gj_mundo_bestias.6.title: "La Durmiente baja por el valle"
 gj_mundo_bestias.6.desc: "Cayó la noche en pleno día. Una sombra con alas de ladera sobrevoló tres aldeas y el fuego bajó como lluvia. Quienes no corrieron a tiempo, no volvieron a casa. Al amanecer, el valle es una cicatriz negra y la ceniza cubre incluso las campanas."
 gj_mundo_bestias.6.a: "Reconstruir con el tesoro de la corona"
 gj_mundo_bestias.6.b: "Que los supervivientes cuenten su historia"
 gj_mundo_bestias.7.title: "El nido protegido"
 gj_mundo_bestias.7.desc: "La Brasa Mayor ha pasado sobre el reino sin quemar un solo tejado. Los sacerdotes dicen que reconoce a los que cumplieron el pacto. Los pastores dejan ahora un cordero cada noche al borde del camino; por la mañana ya no está, y nadie pregunta por qué."
 gj_mundo_bestias.7.a: "Aceptar la bendición del ala"
 gj_mundo_bestias.7.b: "Ofrecer una ofrenda mayor"
 gj_mundo_bestias.8.title: "Kharuun vuelve a su sueño"
 gj_mundo_bestias.8.desc: "La columna de humo mengua hasta convertirse en un hilo. Después, una noche, la caldera calla. Los más viejos dicen que la Durmiente se ha vuelto a acostar, aunque nadie aseguraría que no vaya a despertar mañana."
 gj_mundo_bestias.8.a: "Dar gracias por la tregua"
 gj_mundo_bestias.8.b: "No fiarse y mantener las guardias"
 gj_mundo_bestias.9.title: "La ceniza fértil"
 gj_mundo_bestias.9.desc: "La Durmiente ha dejado atrás un manto de ceniza fina como harina. Los más prudentes la barren; los más atrevidos la mezclan con la tierra. Un labrador anciano asegura que, hace tres generaciones, de una ceniza así salió la mejor cosecha del siglo."
 gj_mundo_bestias.9.a: "Sembrar sobre la ceniza"
 gj_mundo_bestias.9.b: "Barrerla y venderla como abono"
 gj_mundo_bestias.11.title: "La Gran Cacería: Kharuun cae"
 gj_mundo_bestias.11.desc: "Tres días duró la subida y una noche el combate. Cuando el humo se disipó, la Durmiente yacía sobre la roca con diez lanzas clavadas en el cuello, y alguien que no era soldado lloró. El ejército vuelve cantando y arrastrando una escama del tamaño de un carro. Nunca más volverá a bajar el fuego por estos valles."
 gj_mundo_bestias.11.a: "Forjar las Escamas de Brasa para el ejército"
 gj_mundo_bestias.11.b: "Encender el Corazón de Brasa en las forjas"
 gj_mundo_bestias.11.c: "Alzar el cráneo sobre la puerta de la capital"
 gj_mundo_bestias.12.title: "La Gran Cacería fracasa"
 gj_mundo_bestias.12.desc: "De los tres mil que subieron, bajaron menos de la mitad. El general no volvió: dicen que lo vieron recortado contra la boca de la caldera, con la espada en alto, un instante antes de que el fuego lo cubriese. Kharuun está más despierta que nunca, y tiene motivos para estar enfadada."
 gj_mundo_bestias.12.a: "Enterrar a los muertos y callar"
 gj_mundo_bestias.12.b: "Culpar al consejo que aconsejó la Cacería"
 gj_mundo_bestias.13.title: "Se apaga la Brasa Mayor"
 gj_mundo_bestias.13.desc: "El Ala ha caído. Los sacerdotes de la Llama Profunda se visten de ceniza y recorren las calles sin hablar. El dios prestado que durante años se sentó en el panteón ya no volverá, y la fe se pregunta si el fuego de abajo puede seguir ardiendo sin su voz."
 gj_mundo_bestias.13.a: "Guardar luto"
 gj_mundo_bestias.13.b: "Jurar venganza contra el cazador"

 # ===== Krakens: eventos =====
 gj_mundo_bestias.20.title: "Algo bajo el casco"
 gj_mundo_bestias.20.desc: "Una noche sin viento, la nao capitana nota que el casco cruje, como si algo enorme se frotase contra la quilla. El timonel jura que vio un ojo del tamaño de una rueda de molino. Los marineros reclaman ofrendas, los capitanes, valentía, y el piloto, que nadie vuelva a mirar el agua."
 gj_mundo_bestias.20.a: "Resignarse y rezar para que pase"
 gj_mundo_bestias.20.b: "Arrojar un cebo a la corriente"
 gj_mundo_bestias.20.c: "Cantar el rito del Mar Dormido"
 gj_mundo_bestias.21.title: "Mástiles en el agua"
 gj_mundo_bestias.21.desc: "Los restos de una coca mercante aparecen flotando a la entrada del paso: mástiles astillados, cajas, un loro enloquecido. Los armadores empiezan a murmurar sobre rutas por el sur, y los aseguradores suben sus tarifas por tercera vez."
 gj_mundo_bestias.21.a: "Aceptar que el comercio dé rodeos"
 gj_mundo_bestias.21.b: "Escoltar las rutas con la flota"
 gj_mundo_bestias.22.title: "Las redes vuelven vacías"
 gj_mundo_bestias.22.desc: "La flota pesquera de la costa del estrecho vuelve tres días seguidos sin una sola sardina. Los pescadores aseguran que algo grande ha pasado por los caladeros y que los peces se han ido a las aguas de en medio."
 gj_mundo_bestias.22.a: "Repartir grano entre las familias de los pescadores"
 gj_mundo_bestias.22.b: "Esperar a que los bancos vuelvan"
 gj_mundo_bestias.23.title: "El naufragio del «Cormorán Gris»"
 gj_mundo_bestias.23.desc: "El mercante «Cormorán Gris» se perdió hace diez años con la bodega llena de seda y especias. Una marea baja extraordinaria ha dejado su casco al descubierto, medio comido por algas y algo más. Los buzos dudan: la carga está intacta, pero lo que durmió allí tantos años, quizá no."
 gj_mundo_bestias.23.a: "Recuperar la carga"
 gj_mundo_bestias.23.b: "Dejar el naufragio en paz"
 gj_mundo_bestias.24.title: "La sombra bajo la quilla"
 gj_mundo_bestias.24.desc: "Una tarde clara, desde los muelles, vemos una mancha oscura del tamaño de una isla moverse bajo el agua del paso. Se sumerge sin una burbuja. Los pilotos cartógrafos piden permiso para dibujarla; los artilleros, para disparar."
 gj_mundo_bestias.24.a: "Anotar la sombra en las cartas de marear"
 gj_mundo_bestias.24.b: "Disparar a la sombra"
 gj_mundo_bestias.25.title: "Ullamar cae"
 gj_mundo_bestias.25.desc: "El arpón de la capitana entró hasta la empuñadura y la bestia tardó una hora en morir. Cuando por fin se hundió, el estrecho entero pareció respirar. Los marineros subieron un tentáculo a cubierta y lo midieron: cuarenta pasos. Nadie, dicen, volverá a temer el paso como antes."
 gj_mundo_bestias.25.a: "Colgar un tentáculo en el puerto"
 gj_mundo_bestias.25.b: "Vender los restos a los boticarios y a los curiosos"
 gj_mundo_bestias.26.title: "Ullamar responde"
 gj_mundo_bestias.26.desc: "El mar se abrió en dos y de él salieron ocho brazos como mástiles. En media hora, cuatro naos fueron astillas. Los supervivientes cuentan que la bestia no huyó: se tomó su tiempo. Ahora sabe dónde vivimos."
 gj_mundo_bestias.26.a: "Reconstruir la flota"
 gj_mundo_bestias.26.b: "Pagar a las viudas de los marinos"

 # ===== Plagas: eventos =====
 gj_mundo_bestias.30.title: "La Jauría Blanca"
 gj_mundo_bestias.30.desc: "Una manada de lobos del tamaño de potros, blancos como la escarcha, ha empezado a rondar los pastos. Los pastores hablan de ojos amarillos que siguen a las caravanas a una legua. Los cazadores locales piden un salario o piden que los dejen en paz."
 gj_mundo_bestias.30.a: "Pagar a los cazadores"
 gj_mundo_bestias.30.b: "Cerrar los rediles y esperar a que se vayan"
 gj_mundo_bestias.31.title: "Alas de Pedernal"
 gj_mundo_bestias.31.desc: "Los puertos de montaña están a oscuras de día: alas de cuero y garras de pedernal, wyverns anidando en los riscos. Las caravanas no se atreven a cruzar. Un cazador de nidos propone una recompensa por cada huevo."
 gj_mundo_bestias.31.a: "Pagar a las partidas de caza"
 gj_mundo_bestias.31.b: "Cerrar los pasos hasta que escampe"
 gj_mundo_bestias.31.c: "Ofrecer una recompensa por los huevos"
 gj_mundo_bestias.32.title: "La Nube Zumbadora"
 gj_mundo_bestias.32.desc: "Una nube de insectos del tamaño de un pulgar ha caído sobre los campos. En una tarde han comido un trigal entero, y en la siguiente han dejado una granja sin techo. Los campesinos prenden fuego a todo lo que se mueve."
 gj_mundo_bestias.32.a: "Quemar los cañaverales y los bordes del campo"
 gj_mundo_bestias.32.b: "Esperar a que la nube pase"
 gj_mundo_bestias.33.title: "Cachorros de la nieve"
 gj_mundo_bestias.33.desc: "Una camada de lobos blancos ha nacido en la estepa de invierno. Una joven jinete, medio en broma, ha criado a uno con la leche de una yegua. Ahora el lobo la sigue por el campamento y se detiene ante el fuego sin miedo. Los ancianos dudan entre bendecirlo o matarlo."
 gj_mundo_bestias.33.a: "Criar a los cachorros junto a los potros"
 gj_mundo_bestias.33.b: "Dejarlos a la estepa"
 gj_mundo_bestias.34.title: "La Batida regresa"
 gj_mundo_bestias.34.desc: "Los soldados vuelven del monte con las capas manchadas y un carro lleno de pieles. Han limpiado la comarca y están más contentos de lo que quieren aparentar. El sargento pregunta qué hacer con las cabezas."
 gj_mundo_bestias.34.a: "Repartir las pieles entre los comerciantes"
 gj_mundo_bestias.34.b: "Colgar las cabezas en la plaza"

 # ===== Presagios: eventos =====
 gj_mundo_bestias.41.title: "Un cometa en el cielo"
 gj_mundo_bestias.41.desc.1: "Una noche sin luna ha aparecido sobre el horizonte la Cabellera Azul, un cometa de cola larga y fría que se ve desde todos los reinos a la vez. Las gentes sencillas se arrodillan; los sabios toman nota; las cortes discuten qué quiere decir."
 gj_mundo_bestias.41.desc.2: "El Ojo de Ámbar cruza el cielo cada noche, un poco más al oeste, y se deja ver sobre todas las cortes por igual. Los astrólogos de palacio escriben tratados enteros sobre él, y cada uno contradice al anterior."
 gj_mundo_bestias.41.desc.3: "La Hoz de Plata ha cortado el cielo del anochecer con un trazo limpio. Los navegantes dicen que los nuevos instrumentos permiten medirla; los clérigos, que medirla es una insolencia."
 gj_mundo_bestias.41.desc.4: "La Espada Callada cuelga sobre el mundo desde hace semanas, sin ruido ni humo, y todas las capitales la contemplan a la vez. Los púlpitos se llenan de sermones y las imprentas, de panfletos."
 gj_mundo_bestias.41.desc.5: "La Lágrima Larga ha cruzado el cielo de un horizonte al otro. Los salones debaten con lentes y tablas; en las aldeas, las abuelas cierran las ventanas."
 gj_mundo_bestias.41.desc.6: "La Estrella Errante pasa sobre las ciudades iluminadas por farolas y apenas se la distingue; los sabios la calculan con una precisión que a los viejos les resulta descorazonadora, y a pesar de eso, muchos bajan la voz."
 gj_mundo_bestias.41.a: "Es un buen augurio"
 gj_mundo_bestias.41.b: "Es un mal augurio: reforzar las defensas"
 gj_mundo_bestias.41.c: "Que los sabios lo midan y lo registren"
 gj_mundo_bestias.42.title: "Un eclipse"
 gj_mundo_bestias.42.desc.1: "A mediodía el sol se ha apagado como una lámpara a la que se le acaba el aceite. Los pájaros han callado y los niños han llorado. Durante unos minutos, todos los reinos conocidos han estado en la misma noche."
 gj_mundo_bestias.42.desc.3: "Los almanaques lo anunciaban, pero casi nadie los leía. Cuando el sol se ha apagado, la gente ha recordado de golpe todo lo que prefería olvidar. Hasta los capitanes, que lo sabían, se han quedado sin decir palabra."
 gj_mundo_bestias.42.desc.5: "Los sabios lo habían calculado al minuto, y el eclipse llegó puntual. Eso no ha impedido que la plaza se llene de gente rezando, ni que alguien intentase aprovechar el miedo."
 gj_mundo_bestias.42.a: "Renovar el juramento ante el pueblo"
 gj_mundo_bestias.42.b: "Cerrar las puertas y rezar"
 gj_mundo_bestias.42.c: "Aprovechar la hora en que el enemigo reza"
 gj_mundo_bestias.44.title: "El cometa y lo que pasó después"
 gj_mundo_bestias.44.desc: "Cuatro años han pasado desde aquel cometa, y en la corte aún se discute si lo que ha ocurrido desde entonces se explica por la señal o por la mera suerte. Los cronistas anotan los hechos; los cortesanos, los méritos."
 gj_mundo_bestias.44.a: "Que lo digan los cronistas"
 gj_mundo_bestias.45.title: "El eclipse deja su cuenta"
 gj_mundo_bestias.45.desc: "Hace cuatro años que el sol se apagó a mediodía. El pueblo recuerda lo que juró entonces, y un buen número de súbditos vienen a recordárnoslo."
 gj_mundo_bestias.45.a: "Cumplir lo prometido"
