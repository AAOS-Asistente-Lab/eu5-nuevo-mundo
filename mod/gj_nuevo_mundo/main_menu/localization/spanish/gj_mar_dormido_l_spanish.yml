l_spanish:
 # ===== Religión =====
 gj_mar_dormido: "Mar Dormido"
 gj_mar_dormido_ADJ: "durmiente"
 gj_mar_dormido_desc: "Los pueblos de la costa creen que el mar no es un lugar sino un durmiente: una cosa inmensa que respira dos veces al día, y a esa respiración la llaman marea. Las tormentas son sus sueños malos y los krakens, sus pesadillas hechas carne. Nadie le reza para que haga nada, porque lo peor que puede pasar es que despierte. Se le canta bajito, se le ofrece lo que pide y se le deja dormir. Quien lo logra navega en paz. A quien lo descuida, la marea le cobra."
 gj_mar_dormido_group: "Fe del Sur"

 # ===== Poder de Rito (explicación de la mecánica) =====
 gj_mar_dormido_mecanica: "El Poder de Rito sube cada mes y con las nanas y los lugares sagrados; se gasta en los ritos de marea (decisiones). Por encima de 60 el mar duerme hondo; por debajo de 25, se agita."

 # ===== Aspectos =====
 gj_aspecto_voz_baja: "La Voz Baja"
 gj_aspecto_voz_baja_desc: "Se canta tan bajo que solo el mar lo oye. Los cantores de la rada pasan la vida aprendiendo a no despertar a nadie, y el pueblo, que los respeta, también aprende a bajar la voz."
 gj_aspecto_costa_mansa: "La Costa Mansa"
 gj_aspecto_costa_mansa_desc: "Todo el culto se dedica a que el mar no se enfade: los remos entran sin salpicar, las anclas bajan despacio y las velas se arrían al caer la luz. Es una devoción de marinos prudentes, que vuelven siempre."
 gj_aspecto_mareas_vivas: "Las Mareas Vivas"
 gj_aspecto_mareas_vivas_desc: "Dos veces al mes el mar respira más hondo y sube hasta las escaleras de los muelles. Los fieles dicen que es el momento de pedir al durmiente que sueñe con puertos llenos, y las lonjas abren a medianoche."
 gj_aspecto_pulso_rojo: "El Pulso Rojo"
 gj_aspecto_pulso_rojo_desc: "Hay quien dice que el durmiente se alimenta de los barcos que se hunden y que conviene dárselos de vez en cuando, mejor ajenos que propios. Es un camino rápido y sangriento, y el mar, que no perdona, se despierta un poco con cada ofrenda."

 # ===== Escuela =====
 gj_escuela_marea_negra: "Escuela de la Marea Negra"
 gj_escuela_marea_negra_desc: "Los capitanes de la Marea Negra no cantan nanas. Creen que el mar tiene hambre y que un durmiente bien alimentado no se mueve. Arrojan al agua la décima parte del botín y las proas enemigas, y se jactan de que el mar los quiere más que a nadie."

 # ===== Lugares sagrados =====
 gj_arrecife_cuna: "Arrecife de la Cuna"
 gj_arrecife_cuna_desc: "Un arrecife largo, de coral blanco, que según los fieles es la cuna donde descansa la cabeza del durmiente. Las aguas de alrededor son las más ricas en pesca y ningún barco echa el ancla encima."
 gj_faro_vigilia: "Faro de la Vigilia"
 gj_faro_vigilia_desc: "Una torre de piedra cuyo fuego no se apaga nunca, atendida por los faroleros. Marca los pasos peligrosos y también la hora de cantar: quien ve la luz sabe que alguien vela el sueño del mar."

 # ===== Decisiones (los ritos) =====
 gj_mar_dormido_nana: "Cantar la nana"
 gj_mar_dormido_nana_desc: "Los cantores de la rada se reúnen en el muelle al caer la tarde para cantar al mar la nana más antigua. Cuesta oro y paciencia, pero devuelve Poder de Rito."
 gj_mar_dormido_nana.a: "Que canten hasta que amanezca."
 gj_mar_dormido_calmar_kraken: "Rito: calmar al kraken"
 gj_mar_dormido_calmar_kraken_desc: "Las pesadillas del durmiente suben a la superficie con tentáculos. Los cantores salen en una barca sin remos y entonan el canto de las aguas hondas, para que el kraken vuelva a dormirse."
 gj_mar_dormido_calmar_kraken.a: "Que la barca salga sin remos."
 gj_mar_dormido_levantar_ciudad: "Rito: levantar la ciudad"
 gj_mar_dormido_levantar_ciudad_desc: "Se pide al durmiente que sueñe en voz alta con una ciudad de puertos y escaleras anchas, y una de nuestras costas prospera como si el mar la hubiera elegido."
 gj_mar_dormido_levantar_ciudad.a: "Que el mar sueñe con nuestra costa."
 gj_mar_dormido_bendecir_flota: "Rito: bendecir la flota"
 gj_mar_dormido_bendecir_flota_desc: "En la víspera de zarpar, los cantores recorren los muelles rociando las proas con agua de la marea baja. Los marinos creen que ningún casco bendecido se hundirá por una ola que no tenga permiso."
 gj_mar_dormido_bendecir_flota.a: "Que la marea baja bendiga las proas."
 gj_mar_dormido_ofrenda_corriente: "Rito: ofrenda a la corriente"
 gj_mar_dormido_ofrenda_corriente_desc: "Se arroja al agua una carga de sal, lana y vino en un barco sin tripulación. Si la corriente se la lleva por el rumbo de los mercados, el comercio de la costa tendrá buen año."
 gj_mar_dormido_ofrenda_corriente.a: "Que la corriente lleve la ofrenda."
 gj_mar_dormido_gran_vigilia: "Rito mayor: la Gran Vigilia"
 gj_mar_dormido_gran_vigilia_desc: "Una vez cada generación, en la noche de las mareas vivas, todas las barcas del reino se reúnen y cantan a la vez. Es el mayor rito de la fe y solo está al alcance de quien ha acumulado mucho Poder de Rito y está en paz."
 gj_mar_dormido_gran_vigilia.a: "Que toda la costa cante a la vez."
 gj_mar_dormido_sangrar_marea: "Sangrar la marea"
 gj_mar_dormido_sangrar_marea_desc: "Los capitanes de la Marea Negra echan al agua oro y metal para alimentar al durmiente. Obtienen Poder de Rito de golpe y una racha de saqueo, pero cada ofrenda despierta un poco al mar."
 gj_mar_dormido_sangrar_marea.a: "Que el mar coma."

 # ===== Modificadores =====
 STATIC_MODIFIER_NAME_gj_mar_cancion_cuna: "Canción de cuna"
 STATIC_MODIFIER_DESC_gj_mar_cancion_cuna: "Este año se ha cantado al mar con ganas: pesca abundante y un pueblo tranquilo."
 STATIC_MODIFIER_NAME_gj_mar_silencio_respetuoso: "Silencio respetuoso"
 STATIC_MODIFIER_DESC_gj_mar_silencio_respetuoso: "No se ha hecho ruido en el agua. El mar se ha portado."
 STATIC_MODIFIER_NAME_gj_mar_decima_al_agua: "La décima al agua"
 STATIC_MODIFIER_DESC_gj_mar_decima_al_agua: "Los capitanes han arrojado la décima parte del botín: el mar los trata con cariño."
 STATIC_MODIFIER_NAME_gj_mar_nana_cantada: "Nana cantada"
 STATIC_MODIFIER_DESC_gj_mar_nana_cantada: "Se ha cantado la nana más antigua. El durmiente se ha vuelto a hundir en su sueño."
 STATIC_MODIFIER_NAME_gj_mar_kraken_calmado: "Kraken calmado"
 STATIC_MODIFIER_DESC_gj_mar_kraken_calmado: "Las pesadillas del durmiente han vuelto al fondo. Los barcos pierden menos hombres."
 STATIC_MODIFIER_NAME_gj_mar_flota_bendita: "Flota bendita"
 STATIC_MODIFIER_DESC_gj_mar_flota_bendita: "Las proas han sido rociadas con agua de la marea baja. Los marinos no temen a las olas."
 STATIC_MODIFIER_NAME_gj_mar_corriente_ofrendada: "Corriente ofrendada"
 STATIC_MODIFIER_DESC_gj_mar_corriente_ofrendada: "La corriente se ha llevado la ofrenda hacia los mercados. Las rutas marítimas rinden mejor."
 STATIC_MODIFIER_NAME_gj_mar_gran_vigilia: "La Gran Vigilia"
 STATIC_MODIFIER_DESC_gj_mar_gran_vigilia: "Toda la costa ha cantado a la vez. Se recordará durante una generación."
 STATIC_MODIFIER_NAME_gj_mar_sangre_en_la_marea: "Sangre en la marea"
 STATIC_MODIFIER_DESC_gj_mar_sangre_en_la_marea: "Hemos alimentado al durmiente. Nuestras proas atacan con furia, pero el mar se mueve cada vez más."
 STATIC_MODIFIER_NAME_gj_mar_ciudad_alzada: "Ciudad alzada"
 STATIC_MODIFIER_DESC_gj_mar_ciudad_alzada: "El mar ha soñado con esta costa y la ha hecho próspera."
 STATIC_MODIFIER_NAME_gj_mar_kraken_visto: "El kraken ha sido visto"
 STATIC_MODIFIER_DESC_gj_mar_kraken_visto: "Una pesadilla del durmiente subió a mirar la flota. Los marinos tienen miedo."
 STATIC_MODIFIER_NAME_gj_mar_luna_ausente: "Luna ausente"
 STATIC_MODIFIER_DESC_gj_mar_luna_ausente: "Una marea sin luna ha desordenado el agua. Los barcos sufren y la pesca no sale."
 STATIC_MODIFIER_NAME_gj_mar_cantora_de_la_rada: "La cantora de la rada"
 STATIC_MODIFIER_DESC_gj_mar_cantora_de_la_rada: "Una voz como no hay otra entona las nanas en el puerto, y el pueblo la sigue."
 STATIC_MODIFIER_NAME_gj_mar_pesca_de_lo_hondo: "Pesca de lo hondo"
 STATIC_MODIFIER_DESC_gj_mar_pesca_de_lo_hondo: "Las redes suben de lo hondo cargadas de peces que nadie había visto. Es una bendición, pero el mar lo nota."
 STATIC_MODIFIER_NAME_gj_mar_naufragio_honrado: "Naufragio honrado"
 STATIC_MODIFIER_DESC_gj_mar_naufragio_honrado: "Hemos devuelto al mar lo que era suyo. Se nos tiene por gente de palabra."
 STATIC_MODIFIER_NAME_gj_mar_cuna_rota: "Cuna rota"
 STATIC_MODIFIER_DESC_gj_mar_cuna_rota: "Se ha construido sobre un lugar de canto. Los fieles murmuran que el durmiente se ha dado la vuelta."
 STATIC_MODIFIER_NAME_gj_mar_faroleros_en_marcha: "Faroleros en marcha"
 STATIC_MODIFIER_DESC_gj_mar_faroleros_en_marcha: "La procesión de los faroleros ha recorrido la costa. Hay calma en los puertos."
 STATIC_MODIFIER_NAME_gj_mar_marea_roja: "Marea roja"
 STATIC_MODIFIER_DESC_gj_mar_marea_roja: "El mar se ha teñido y nuestras proas atacan con furia. La gente teme lo que viene después."
 STATIC_MODIFIER_NAME_gj_mar_sueno_roto: "Sueño roto"
 STATIC_MODIFIER_DESC_gj_mar_sueno_roto: "El durmiente se ha movido en su cama y las tripulaciones no quieren zarpar."
 STATIC_MODIFIER_NAME_gj_mar_marea_alta_del_alma: "Marea alta del alma"
 STATIC_MODIFIER_DESC_gj_mar_marea_alta_del_alma: "El mar ha subido a saludarnos. La costa vive su mejor generación."
 STATIC_MODIFIER_NAME_gj_mar_presagio_calma: "Presagio de calma"
 STATIC_MODIFIER_DESC_gj_mar_presagio_calma: "El cielo ha dicho que el mar duerme tranquilo."
 STATIC_MODIFIER_NAME_gj_mar_presagio_tormenta: "Presagio de tormenta"
 STATIC_MODIFIER_DESC_gj_mar_presagio_tormenta: "El cielo ha dicho que el mar se agita. Los barcos aguantan peor, pero hay botín para el que se atreva."
 AUTO_MODIFIER_NAME_gj_mar_calma_honda: "El mar duerme hondo"
 AUTO_MODIFIER_DESC_gj_mar_calma_honda: "Mucho Poder de Rito: la costa vive en paz con el durmiente."
 AUTO_MODIFIER_NAME_gj_mar_sueno_inquieto: "El sueño se agita"
 AUTO_MODIFIER_DESC_gj_mar_sueno_inquieto: "Poco Poder de Rito: el mar se mueve en sueños y los barcos lo pagan."

 # ===== Eventos =====
 gj_mar_dormido.1.title: "La respiración de la marea"
 gj_mar_dormido.1.desc: "Al llegar la marea viva, los cantores de la rada se reúnen en el muelle y esperan. El durmiente respira más hondo que otros años y cada uno de sus suspiros trae un olor distinto: a sal, a algas, a algo muy antiguo. Hay que decidir cómo se le trata este año."
 gj_mar_dormido.1.a: "Que canten alto, con oro para los cantores."
 gj_mar_dormido.1.b: "Que nadie haga ruido: se le deja dormir."
 gj_mar_dormido.1.c: "Que la décima del botín vaya al agua."
 gj_mar_dormido.2.title: "El kraken sube a mirar"
 gj_mar_dormido.2.desc: "Una mañana de calma chicha, las barcas de pesca encuentran una forma enorme bajo el agua, que sube despacio hacia la luz. No ataca. Mira. Los cantores aseguran que es una pesadilla del durmiente que ha subido a ver el mundo, y que o se la devuelve al fondo con el canto, o se la deja pasar."
 gj_mar_dormido.2.a: "Que los cantores salgan y la devuelvan a su sueño."
 gj_mar_dormido.2.b: "Que las barcas se retiren y la dejen pasar."
 gj_mar_dormido.2.c: "Que los arponeros prueben fortuna: el marfil se paga bien."
 gj_mar_dormido.3.title: "Marea sin luna"
 gj_mar_dormido.3.desc: "Una noche sin luna, el agua sube sin orden ni concierto. Las anclas arrastran, las amarras se tensan y hay quien jura haber oído roncar al mar. Los cantores piden que se encienda una hilera de faroles hasta el amanecer."
 gj_mar_dormido.3.a: "Que se enciendan todos los faroles de la costa."
 gj_mar_dormido.3.b: "Es solo una marea: que cada cual amarre su barco."
 gj_mar_dormido.4.title: "La cantora de la rada"
 gj_mar_dormido.4.desc: "Una muchacha de los muelles ha empezado a cantar al caer la tarde, y su voz tiene algo que hace callar a las gaviotas y aquietar el agua. Los cantores mayores dicen que no han oído nada igual desde los tiempos de sus abuelos y piden que se la acoja en el templo."
 gj_mar_dormido.4.a: "Que se instale en el templo y cante para todos."
 gj_mar_dormido.4.b: "Que cante en las lonjas: los mercaderes pagarán por oírla."
 gj_mar_dormido.5.title: "Los pescadores de lo hondo"
 gj_mar_dormido.5.desc: "Unos pescadores de altura han vuelto con las redes llenas de peces extraños, de ojos grandes y vientre luminoso. Dicen que los han sacado de una grieta que no tenía fondo. Los mercaderes los quieren vender. Los cantores prefieren que se devuelvan al agua."
 gj_mar_dormido.5.a: "Que se vendan: es una pesca excepcional."
 gj_mar_dormido.5.b: "Que se devuelvan al agua con un canto."
 gj_mar_dormido.6.title: "El naufragio de los durmientes"
 gj_mar_dormido.6.desc: "Un barco sin bandera ha varado en la costa. En la bodega no hay carga, sino una docena de ataúdes de coral y una inscripción que ningún sabio sabe leer. Los cantores creen que son marinos que el durmiente se llevó hace siglos y piden devolverlos al agua. Los capitanes, que el coral vale más de lo que pesa."
 gj_mar_dormido.6.a: "Que se devuelvan al mar con todos los honores."
 gj_mar_dormido.6.b: "Que se venda el coral y se hunda el casco."
 gj_mar_dormido.7.title: "La cuna rota"
 gj_mar_dormido.7.desc: "Los constructores del puerto quieren ampliar el muelle y para eso necesitan dragar un arrecife que los cantores consideran sagrado. El puerto lleva años lleno y los mercaderes insisten. Los cantores avisan: quien rompe la cuna del durmiente no vuelve a dormir tranquilo."
 gj_mar_dormido.7.a: "Se respeta el arrecife: que el muelle se amplíe por otro lado."
 gj_mar_dormido.7.b: "Que se drague: el comercio no puede esperar."
 gj_mar_dormido.8.title: "La procesión de los faroleros"
 gj_mar_dormido.8.desc: "Cada generación, los faroleros recorren la costa con sus linternas de cristal azul, cantando el nombre de cada rada, de cada cala y de cada bajío. Dicen que así el durmiente sabe que nadie lo ha olvidado. El pueblo sale a las calles con velas y los niños siguen la comitiva."
 gj_mar_dormido.8.a: "Que se pague la procesión de la costa entera."
 gj_mar_dormido.8.b: "Que sea modesta: solo hasta el templo."
 gj_mar_dormido.9.title: "Marea roja"
 gj_mar_dormido.9.desc: "Tras la última racha de saqueos, el agua del puerto ha amanecido teñida de rojo. Los capitanes lo toman por un buen augurio: dicen que el durmiente ha probado la sangre y pide más. Los cantores más viejos, en cambio, piden detener la ofrenda y cantar una nana de perdón."
 gj_mar_dormido.9.a: "Que el mar coma. La Marea Negra navega."
 gj_mar_dormido.9.b: "Que se cante la nana de perdón antes de que despierte."
 gj_mar_dormido.10.title: "El sueño se rompe"
 gj_mar_dormido.10.desc: "Hace tiempo que nadie canta como es debido y el durmiente se ha movido. Los barcos vuelven con las velas rotas, los pescadores no quieren salir de noche y en el puerto se oyen ruidos bajo los muelles. Si no se hace algo, el mar tomará la costa."
 gj_mar_dormido.10.a: "Una vigilia de tres noches con todos los cantores del reino."
 gj_mar_dormido.10.b: "Que se espere: el mar se calmará solo."
 gj_mar_dormido.11.title: "La marea alta del alma"
 gj_mar_dormido.11.desc: "Cinco ritos se han cantado y los cinco han sido escuchados. En la noche de la marea más alta del siglo, el agua sube hasta la escalinata del templo sin mojar el último peldaño, y los fieles aseguran haber visto sonreír a la luna en el reflejo. El durmiente nos ha tomado cariño."
 gj_mar_dormido.11.a: "Que el reino celebre la bendición del mar."
 gj_mar_dormido.11.b: "Que se guarde en silencio, y se dé gracias en privado."
 gj_mar_dormido.12.title: "El cielo sobre la rada"
 gj_mar_dormido.12.desc: "Algo ha cambiado en el cielo: una luz larga cruza la noche, o el sol se ha apagado en pleno día. El agua de la rada, que refleja siempre lo que hay arriba, lo ha mostrado todo. Los cantores se reúnen en el muelle para decidir si el durmiente sueña bien o mal."
 gj_mar_dormido.12.a: "El mar lo ha reflejado en calma: es un buen augurio."
 gj_mar_dormido.12.b: "El mar lo ha reflejado en negro: es un aviso."
 gj_mar_dormido.12.c: "Es una tormenta que viene: que la flota salga a por ella."
