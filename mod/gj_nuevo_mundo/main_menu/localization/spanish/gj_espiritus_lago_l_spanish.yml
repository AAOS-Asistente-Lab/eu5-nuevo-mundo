l_spanish:
 # ===== Religión =====
 gj_espiritus_lago: "Espíritus del Lago"
 gj_espiritus_lago_ADJ: "lacustre"
 gj_espiritus_lago_desc: "Los pueblos de los lagos creen que cada agua guarda un espíritu que no duerme: respira bajo el hielo, se agita con la niebla y habla a quien sabe escuchar. Nada se emprende sin leer antes el presagio, y el que sabe leerlo manda en la orilla. Dos escuelas se disputan la lectura: los barqueros, que leen el agua para el comercio, y las sagas, que la leen para la incursión."

 # ===== Aspectos =====
 gj_espiritus_lago_aspecto_hielo_que_canta: "El Hielo que Canta"
 gj_espiritus_lago_aspecto_hielo_que_canta_desc: "Cuando el lago cruje, canta. Quien entiende la canción sabe por dónde puede pasar un ejército y por dónde no, y marcha sobre el agua dura con la confianza de quien camina por su casa."
 gj_espiritus_lago_aspecto_remo_y_red: "Remo y Red"
 gj_espiritus_lago_aspecto_remo_y_red_desc: "El lago da de comer al que lo respeta y paga al que lo recorre. Los fieles consagran las barcas de pesca y los muelles, y los mercaderes rezan con la red en la mano."
 gj_espiritus_lago_aspecto_ola_larga: "La Ola Larga"
 gj_espiritus_lago_aspecto_ola_larga_desc: "Hay un viento que sopla hacia las costas ajenas, y el que lo sigue vuelve con la bodega llena. Es un camino de gloria, pero los vecinos no olvidan a quien les visita con antorchas."
 gj_espiritus_lago_aspecto_fuego_de_orilla: "Fuego de Orilla"
 gj_espiritus_lago_aspecto_fuego_de_orilla_desc: "En cada orilla arde un fuego que no se apaga nunca: los videntes lo alimentan y en sus brasas leen. Quien cuida el fuego de orilla consigue que los presagios duren más y que los espíritus cobren menos por su consejo."

 # ===== Escuelas =====
 gj_escuela_barqueros: "Escuela de los Barqueros"
 gj_escuela_barqueros_desc: "Los barqueros leen el agua como se lee un libro de cuentas: una corriente que cambia es un mercado que se mueve. Sus videntes viajan en los convoyes y venden consejo junto con las mercancías."
 gj_escuela_sagas: "Escuela de las Sagas"
 gj_escuela_sagas_desc: "Las sagas se cantan alrededor del fuego y cada una acaba con un presagio cumplido. Los lectores de esta escuela leen en las olas el nombre de la próxima costa y en el ánimo de los remeros, la victoria."

 # ===== Espíritus y presagios =====
 gj_espiritus_lago_madre_ahogada_god: "La Madre Ahogada"
 gj_espiritus_lago_madre_ahogada_god_desc: "Madre de todas las aguas dulces, duerme en el fondo del lago más profundo. Se dice que sus cabellos son las redes de los pescadores y que cobra lo que se le debe. Quien comercia con honradez no tiene nada que temer de ella."
 gj_espiritus_lago_madre_ahogada_god_omen: "La superficie del lago se queda quieta como un espejo y, bajo el agua, una forma larga y pálida se vuelve despacio. Hemos llamado la atención de [ShowGodName('gj_espiritus_lago_madre_ahogada_god')]..."
 gj_espiritus_lago_omen_red_colmada: "La Red Colmada"
 gj_espiritus_lago_omen_red_colmada_desc: "Las redes suben cargadas hasta rebosar y los cuévanos de los mercados no dan abasto."
 gj_espiritus_lago_omen_aguas_hondas: "Aguas Hondas"
 gj_espiritus_lago_omen_aguas_hondas_desc: "Las aguas se abren bajo la quilla y la tripulación navega sin miedo por donde nadie se atrevería."
 gj_espiritus_lago_omen_cuenta_saldada: "La Cuenta Saldada"
 gj_espiritus_lago_omen_cuenta_saldada_desc: "Todo lo que se debía en la orilla se paga a tiempo y los almacenes se llenan en ambos sentidos."

 gj_espiritus_lago_anciano_hielo_god: "El Anciano del Hielo"
 gj_espiritus_lago_anciano_hielo_god_desc: "Es la capa dura que cubre el lago en invierno y también el que la rompe en primavera. Protege a quien se fía de él y se lleva a quien lo desafía. Los guerreros de las orillas le piden paso."
 gj_espiritus_lago_anciano_hielo_god_omen: "El aliento se hiela en el aire y el lago empieza a cantar con una voz grave y larga. Hemos llamado la atención de [ShowGodName('gj_espiritus_lago_anciano_hielo_god')]..."
 gj_espiritus_lago_omen_hielo_firme: "Hielo Firme"
 gj_espiritus_lago_omen_hielo_firme_desc: "El hielo se afirma de orilla a orilla: los ejércitos y las caravanas pasan por donde antes había agua."
 gj_espiritus_lago_omen_escarcha_en_las_cuerdas: "Escarcha en las Cuerdas"
 gj_espiritus_lago_omen_escarcha_en_las_cuerdas_desc: "Una escarcha blanca cubre las empalizadas de la orilla: nadie podrá acercarse sin ser visto."
 gj_espiritus_lago_omen_deshielo_tardio: "Deshielo Tardío"
 gj_espiritus_lago_omen_deshielo_tardio_desc: "El invierno se queda más de lo debido, pero la tierra que descansa debajo dará mejor cosecha."

 gj_espiritus_lago_viento_orilla_god: "El Viento de la Orilla"
 gj_espiritus_lago_viento_orilla_god_desc: "Es el viento que empuja las velas hacia la costa del vecino. Los remeros le ofrecen la primera captura y los capitanes cantan su nombre al levar el ancla. Es caprichoso, pero nunca olvida un favor."
 gj_espiritus_lago_viento_orilla_god_omen: "El viento cambia de golpe y empuja todas las velas hacia el mismo punto del horizonte. Hemos llamado la atención de [ShowGodName('gj_espiritus_lago_viento_orilla_god')]..."
 gj_espiritus_lago_omen_vela_hinchada: "Vela Hinchada"
 gj_espiritus_lago_omen_vela_hinchada_desc: "Un viento en popa constante sopla durante semanas: las flotas llegan antes de lo que nadie espera."
 gj_espiritus_lago_omen_costa_sin_luz: "Costa sin Luz"
 gj_espiritus_lago_omen_costa_sin_luz_desc: "Una noche sin luna cubre la costa vecina: las bodegas vuelven llenas y las barcas, intactas."
 gj_espiritus_lago_omen_cuervos_de_proa: "Cuervos de Proa"
 gj_espiritus_lago_omen_cuervos_de_proa_desc: "Una bandada de cuervos acompaña a la flota y se posa en los mástiles: la marinería sabe que la victoria está cerca."

 gj_espiritus_lago_senora_niebla_god: "La Señora de la Niebla"
 gj_espiritus_lago_senora_niebla_god_desc: "No tiene cara ni nombre más que este. Aparece al amanecer sobre el agua y se lleva lo que no se vigila. A cambio, susurra a los videntes lo que ha visto en las orillas lejanas."
 gj_espiritus_lago_senora_niebla_god_omen: "Una niebla densa sube del lago y trae consigo voces que nadie reconoce, pero todos entienden. Hemos llamado la atención de [ShowGodName('gj_espiritus_lago_senora_niebla_god')]..."
 gj_espiritus_lago_omen_velo_de_bruma: "Velo de Bruma"
 gj_espiritus_lago_omen_velo_de_bruma_desc: "La niebla susurra a los eruditos lo que dicen los libros de las costas lejanas."
 gj_espiritus_lago_omen_voz_bajo_el_hielo: "Voz bajo el Hielo"
 gj_espiritus_lago_omen_voz_bajo_el_hielo_desc: "Una voz serena, que parece venir de debajo del hielo, confirma el derecho del que gobierna."
 gj_espiritus_lago_omen_espejo_negro: "Espejo Negro"
 gj_espiritus_lago_omen_espejo_negro_desc: "En el agua oscura del lago se ven las caras de los reyes lejanos: nuestro nombre se pronuncia en sus cortes."

 # ===== Lugares sagrados =====
 gj_espiritus_lago_sagrado: "Lago Sagrado"
 gj_espiritus_lago_sagrado_desc: "Un lago donde, según los fieles, el espíritu se deja oír con más claridad. Sus aguas dan más pesca y sus orillas atraen a los videntes."
 gj_espiritus_lago_isla_del_augurio: "Isla del Augurio"
 gj_espiritus_lago_isla_del_augurio_desc: "Una isla de piedra en medio de un lago, con un fuego perpetuo y una empalizada. Allí se leen los grandes presagios y los videntes viven apartados."

 # ===== Acciones =====
 gj_espiritus_lago_select_omen: "Invocar presagio"
 gj_espiritus_lago_select_omen_desc: "Nuestro gobernante pedirá a un espíritu del lago que nos muestre su presagio."
 gj_espiritus_lago_select_omen_tt: "Obtendremos un bonus temporal para nuestro [country|e]."
 gj_espiritus_lago_select_omen_god: "Elegir espíritu"
 gj_espiritus_lago_select_omen_god_desc: "Nuestro gobernante escogerá a qué espíritu del lago pedirá consejo."
 gj_espiritus_lago_select_omen_god_tt: "Elige un espíritu del lago para que guíe nuestro [omen|e]."

 # ===== Modificadores =====
 STATIC_MODIFIER_NAME_gj_espiritus_lago_lectura_mercaderes: "Lectura del hielo: los mercaderes"
 STATIC_MODIFIER_NAME_gj_espiritus_lago_lectura_incursion: "Lectura del hielo: la incursión"
 STATIC_MODIFIER_NAME_gj_espiritus_lago_lectura_prudencia: "Lectura del hielo: la prudencia"
 STATIC_MODIFIER_NAME_gj_espiritus_lago_aguas_sin_hielo: "El lago que no se hiela"
 STATIC_MODIFIER_NAME_gj_espiritus_lago_ofrenda_aceptada: "Ofrenda aceptada por el lago"
 STATIC_MODIFIER_NAME_gj_espiritus_lago_pez_de_plata: "El pez de plata"
 STATIC_MODIFIER_NAME_gj_espiritus_lago_voz_oida: "La voz oída bajo el hielo"
 STATIC_MODIFIER_NAME_gj_espiritus_lago_procesion_de_barcas: "Procesión de las barcas"
 STATIC_MODIFIER_NAME_gj_espiritus_lago_niebla_propicia: "Niebla propicia"
 STATIC_MODIFIER_NAME_gj_espiritus_lago_primer_deshielo: "El canto del primer deshielo"
 STATIC_MODIFIER_NAME_gj_espiritus_lago_cuervos_prevenidos: "Cuervos prevenidos"
 STATIC_MODIFIER_NAME_gj_espiritus_lago_cisma_de_lectores: "Cisma de lectores"
 STATIC_MODIFIER_NAME_gj_espiritus_lago_vidente_mayor: "Vidente mayor"
 STATIC_MODIFIER_NAME_gj_espiritus_lago_presagio_propicio: "Presagio propicio del cielo"
 STATIC_MODIFIER_NAME_gj_espiritus_lago_presagio_funesto: "Presagio funesto del cielo"

 # ===== Eventos =====
 gj_espiritus_lago.1.title: "La lectura del hielo"
 gj_espiritus_lago.1.desc: "Cuando el primer hielo cubre el lago, los videntes se sientan sobre él con la cabeza descubierta y escuchan. Esta vez el hielo ha crujido tres veces seguidas, cada una con un tono distinto, y todos esperan que el gobernante diga cómo debe leerse. ¿Es una señal de que las barcas deben salir cargadas? ¿Un aviso de que hay costas que visitar? ¿O una orden de quedarse quietos y esperar?"
 gj_espiritus_lago.1.a: "Es un año de mercaderes: que las barcas salgan cargadas."
 gj_espiritus_lago.1.b: "Es un año de incursión: que las proas miren a las costas ajenas."
 gj_espiritus_lago.1.c: "Es un año de espera: que cada cual guarde lo suyo."

 gj_espiritus_lago.2.title: "El lago que no se hiela"
 gj_espiritus_lago.2.desc: "Llegado el invierno, el lago se resiste a helarse. El agua sigue negra y viva, y los pescadores cuentan que de noche se oyen golpes bajo la superficie. Los ancianos susurran que la Madre Ahogada está inquieta y exige ser aplacada antes de que acabe el año."
 gj_espiritus_lago.2.a: "Que se haga una ofrenda a las aguas."
 gj_espiritus_lago.2.b: "Es solo el clima. Que nadie se alarme."
 gj_espiritus_lago.2.c: "Que los barqueros pongan precio al presagio."

 gj_espiritus_lago.3.title: "El pez de plata"
 gj_espiritus_lago.3.desc: "Un pescador ha subido en su red un pez de escamas como monedas de plata, largo como un remo y manso como un niño. Todo el puerto se ha reunido a mirarlo. Los videntes dicen que es un mensajero del lago y que lo que se haga con él será lo que el lago haga con nosotros."
 gj_espiritus_lago.3.a: "Devolverlo al agua con una canción."
 gj_espiritus_lago.3.b: "Venderlo al mercader que mejor pague."
 gj_espiritus_lago.3.c: "Que el escaldo cante su saga: el pez será un buen augurio de guerra."

 gj_espiritus_lago.4.title: "La voz bajo el hielo"
 gj_espiritus_lago.4.desc: "Unos niños que patinaban juran haber oído una voz que hablaba desde debajo del hielo. No era una lengua conocida, pero entendieron lo que decía. Los videntes se agolpan en la orilla y piden permiso para escuchar."
 gj_espiritus_lago.4.a: "Que los videntes se queden a escuchar."
 gj_espiritus_lago.4.b: "Que se abra el hielo y se vea qué hay debajo."
 gj_espiritus_lago.4.c: "Que el lago hable cuando quiera. Nadie debe molestarlo."

 gj_espiritus_lago.5.title: "La procesión de las barcas"
 gj_espiritus_lago.5.desc: "Es costumbre que, pasado el solsticio, todas las barcas del lago se unan en una procesión de faroles. Este año, el gentío es mayor que nunca y los remeros piden que el gobernante la presida. La fiesta costará unas monedas, pero a nadie se le olvidará."
 gj_espiritus_lago.5.a: "Que la presida el gobernante y corra con los gastos."
 gj_espiritus_lago.5.b: "Que cada aldea ponga su barca y cada cual lleve su farol."

 gj_espiritus_lago.6.title: "Niebla en la orilla"
 gj_espiritus_lago.6.desc: "Una niebla espesa ha caído sobre el lago y no se mueve. Los capitanes dicen que es la Señora de la Niebla, que cubre a los que se atreven a salir. Otros dicen que se lleva a quienes lo intentan. La decisión no admite demora."
 gj_espiritus_lago.6.a: "Zarpar con la niebla, que cubre a los audaces."
 gj_espiritus_lago.6.b: "Esperar en el puerto a que se levante."

 gj_espiritus_lago.7.title: "El canto del primer deshielo"
 gj_espiritus_lago.7.desc: "Con el primer deshielo, el lago suena como un cántaro que se vacía. Los campesinos de la orilla recogen el agua en jarras y la vierten sobre los campos. Dicen que es el aliento del Anciano del Hielo, que se despide hasta el invierno siguiente, y que da buena cosecha a quien lo honra."
 gj_espiritus_lago.7.a: "Que cada campo reciba su jarra."
 gj_espiritus_lago.7.b: "Que el agua se guarde para los enfermos."

 gj_espiritus_lago.8.title: "Cuervos en el mástil"
 gj_espiritus_lago.8.desc: "Una bandada de cuervos se ha posado en los mástiles de la flota. Los marineros se llevan la mano al pecho y los capitanes se miran. Para unos es un augurio de guerra; para otros, una advertencia de tormenta. En cualquier caso, algo se acerca."
 gj_espiritus_lago.8.a: "Prevenir a la flota para lo que venga."
 gj_espiritus_lago.8.b: "Ahuyentar a los cuervos. Son solo pájaros."
 gj_espiritus_lago.8.c: "Dejar que sigan a la flota: son el emblema de las sagas."

 gj_espiritus_lago.9.title: "La disputa de los lectores"
 gj_espiritus_lago.9.desc: "Dos videntes han leído el mismo presagio y han llegado a conclusiones contrarias. El de los barqueros jura que el agua anuncia un año de comercio; el de las sagas, que anuncia un año de guerra. La disputa ha pasado de los templos a las plazas, y todos esperan que el gobernante decida de qué lado está la verdad."
 gj_espiritus_lago.9.a: "Dar la razón a los barqueros: que gobierne la escuela del comercio."
 gj_espiritus_lago.9.b: "Dar la razón a las sagas: que gobierne la escuela de la incursión."
 gj_espiritus_lago.9.c: "Que cada escuela lea a su modo y se enfrenten en paz."

 gj_espiritus_lago.10.title: "El Gran Presagio"
 gj_espiritus_lago.10.desc: "Cinco veces hemos leído el agua y cinco veces el lago ha dicho la verdad. Los videntes se reúnen en la isla del fuego y declaran que el espíritu ha elegido a un lector mayor: uno que no solo lee los presagios, sino que habla con quien los envía. Los pueblos del lago bajan la cabeza ante la corte."
 gj_espiritus_lago.10.a: "Que el lector mayor sea quien gobierne."
 gj_espiritus_lago.10.b: "Que el lector mayor sea el que aconseje desde su isla."

 gj_espiritus_lago.11.title: "El cielo sobre el lago"
 gj_espiritus_lago.11.desc: "El cielo ha cambiado: una luz nueva cruza la noche, o el sol se ha apagado un rato en pleno día. Las aguas del lago, que reflejan siempre lo que hay arriba, lo han mostrado todo. En las orillas, los videntes se agolpan a interpretar lo que el lago ha visto antes que nadie."
 gj_espiritus_lago.11.a: "El lago lo ha reflejado en calma: es un buen augurio."
 gj_espiritus_lago.11.b: "El lago lo ha reflejado negro: es un aviso y hay que prepararse."
 gj_espiritus_lago.11.c: "Que la escuela del reino lea lo que el lago ha visto."
