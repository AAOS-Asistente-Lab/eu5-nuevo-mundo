 # FACCION
 gj_thalassar_nombre: "Thalassar"
 # EVENTOS
 gj_thalassar.1.title: "El Canto de las Conchas"
 gj_thalassar.1.desc: "En el equinoccio, los coros descienden por la calzada de piedra que baja del muelle hasta el fondo y cantan con la cabeza bajo el agua. El sonido viaja lejos: dicen que en Ahtessa, abajo, alguien contesta. Los maestros de ceremonias piden fondos para vestir a mil cantores y encender las lámparas de nácar."
 gj_thalassar.1.a: "Financiemos el festival."
 gj_thalassar.1.b: "Que canten sin lámparas."
 gj_thalassar.2.title: "Cristales en la red"
 gj_thalassar.2.desc: "Los pescadores de la ría sacan las redes y las encuentran cargadas de cristales de marea, limpios como lágrimas y fríos como una promesa. Hace años que no había una pesca así. El tesorero quiere venderlos; el sumo calafate, guardarlos para los barrios que aún duermen bajo el agua."
 gj_thalassar.2.a: "Al tesoro de la Ciudad Hundida."
 gj_thalassar.2.b: "A los mercados, mientras estén caros."
 gj_thalassar.3.title: "El buzo de las ruinas"
 gj_thalassar.3.desc: "Un buzo de las Casas del Reflujo sube de las galerías ahogadas con una tablilla de coral grabada con signos que nadie lee ya. La sostiene como quien sostiene un hijo. Los cartógrafos la quieren para sus archivos, un mercader foráneo ya ha ofrecido una suma obscena y los ancianos susurran que lo que duerme en el fondo no debe subir."
 gj_thalassar.3.a: "Que la estudien los cartógrafos y que abran la ruina."
 gj_thalassar.3.b: "Venderla al mejor postor."
 gj_thalassar.3.c: "Devolverla al fondo, con honores."
 gj_thalassar.4.title: "La disputa de las Casas Hundidas"
 gj_thalassar.4.desc: "La Casa de Orsellan y la Casa de Kaeldris llevan tres generaciones disputándose el derecho de custodiar la Escalera Sumergida, el camino ceremonial hacia el fondo. Ambas dicen descender del último arconte de Ahtessa. Ambas tienen razón, o ninguna. El consejo espera que la corona decida antes de que se desate la próxima vendetta."
 gj_thalassar.4.a: "Dar la Escalera a la Casa de Orsellan."
 gj_thalassar.4.b: "Entregarla a los gremios de buzos."
 gj_thalassar.4.c: "Pagar el arbitraje de ambas."
 gj_thalassar.5.title: "La Perla Negra"
 gj_thalassar.5.desc: "En un lecho de ostras que nadie había tocado, una niña de los cultivadores encuentra una perla del color de la noche sin luna. Pesa más de lo que debería y, bajo la lámpara, parece moverse. Los joyeros hablan de un regalo del Mar; los recaudadores, de una subasta."
 gj_thalassar.5.a: "Exhibirla en el Palacio de las Mareas."
 gj_thalassar.5.b: "Subastarla entre las cortes extranjeras."
 gj_thalassar.6.title: "Mareas vivas"
 gj_thalassar.6.desc: "El mar sube tres palmos sobre lo previsto y los diques de la ría crujen en la noche. Los ingenieros de las esclusas piden dinero para reforzarlos; los navegantes, que se les deje salir con la marea. Cada hora de indecisión cuesta una casa."
 gj_thalassar.6.a: "Reforzar los diques cueste lo que cueste."
 gj_thalassar.6.b: "Cerrar los puertos y resistir."
 gj_thalassar.7.title: "El cartógrafo del Abismo"
 gj_thalassar.7.desc: "Un viejo cartógrafo de la Escuela de Corales llega con un mapa de las corrientes profundas que, asegura, ha dibujado de memoria de los mismos pasajes que sus abuelos recorrieron antes del Hundimiento. Pide naves y un año de silencio. Si tiene razón, nuestros barcos cruzarán medio mar sin velas."
 gj_thalassar.7.a: "Financiar su expedición."
 gj_thalassar.7.b: "Archivar sus cartas en la Biblioteca Húmeda."
 gj_thalassar.8.title: "Embajada del Estrecho"
 gj_thalassar.8.desc: "Una flotilla de mercaderes de las costas vecinas llega al muelle bajo bandera de paz. Quieren un pacto de pesos y balizas: faros para sus mástiles, tarifas moderadas para nuestras perlas. Su jefe es afable, demasiado. Hay quien dice que antes de comerciar se ha cuidado de contar nuestros cañones."
 gj_thalassar.8.a: "Firmar el pacto de balizas."
 gj_thalassar.8.b: "Despedirles con cortesía y silencio."
 gj_thalassar.9.title: "Algas rojas"
 gj_thalassar.9.desc: "Una mancha de algas rojas se extiende frente a la costa y el agua huele a hierro. Los peces suben muertos con las barrigas al aire. Los curanderos de los barrios altos piden dinero para quemar hierbas y filtrar las bocanas; los viejos pescadores, silencio y paciencia."
 gj_thalassar.9.a: "Pagar a los curanderos."
 gj_thalassar.9.b: "Esperar a que pase."
 gj_thalassar.10.title: "Los Cantores de Ahtessa"
 gj_thalassar.10.desc: "Las viejas voces que cantaban las crónicas de Ahtessa se apagan una a una. Un maestro propone reunir a los últimos cantores bajo un coro real, con salario y sala propia, para que las historias no se pierdan bajo el agua una segunda vez."
 gj_thalassar.10.a: "Fundar el Coro Real."
 gj_thalassar.10.b: "Que sigan cantando en las plazas."
 gj_thalassar.11.title: "Corsarios en el arrecife"
 gj_thalassar.11.desc: "Tres cascos negros llevan semanas fondeando entre los bajíos del arrecife exterior. No atacan a nadie, de momento. Su capitana envía un mensaje: puede ser nuestra espada o nuestra pesadilla, según el precio."
 gj_thalassar.11.a: "Contratarlos como corsarios."
 gj_thalassar.11.b: "Perseguirlos con las Naves de Marea."
 gj_thalassar.12.title: "La sirena del faro"
 gj_thalassar.12.desc: "Los fareros juran que, en noches sin viento, una voz canta desde el agua bajo la linterna. No pide nada; solo canta. Un timonel ha dejado de dormir. Otro dice que desde que la oye, las corrientes le son más amables."
 gj_thalassar.12.a: "Dejar ofrendas al pie del faro."
 gj_thalassar.12.b: "Ignorar los cantos."
 gj_thalassar.13.title: "El heredero ahogado"
 gj_thalassar.13.desc: "El heredero del Palacio de las Mareas se ha ahogado en el baño ritual, ante cien testigos y sin una sola ola. Sus cuñados sospechan unos de otros. El consejo quiere cerrar el asunto antes de que las casas mojen sus plumas."
 gj_thalassar.13.a: "Aceptar la regencia del Consejo de Casas."
 gj_thalassar.13.b: "Adoptar a un primo lejano de la Casa de Talvaris."
 gj_thalassar.14.title: "Los calafates de la ría"
 gj_thalassar.14.desc: "Los calafates de la ría, que todavía ensamblan los cascos con clavijas de nácar y brea de alga, piden un contrato de la corona. Prometen una nave más ligera que cualquiera en el mar. No prometen que sea barata."
 gj_thalassar.14.a: "Subvencionar el astillero."
 gj_thalassar.14.b: "Dejarlos a su aire."
 gj_thalassar.15.title: "La marea muerta"
 gj_thalassar.15.desc: "Durante nueve días el mar no se mueve. No sube, no baja, no respira. Las redes cuelgan inertes, los barcos fondean en su propia sombra y los niños se niegan a bañarse. Los más viejos dicen que es la señal de que Ahtessa contiene la respiración."
 gj_thalassar.15.a: "Rezar al Mar Dormido."
 gj_thalassar.15.b: "Racionar víveres y esperar."
 gj_thalassar.16.title: "Los sueños del dique"
 gj_thalassar.16.desc: "Los ingenieros del Dique Mayor cuentan que tres noches seguidas han soñado con el mismo plano: una cámara de cristal bajo las esclusas, con puertas que se abren al revés. Piden permiso para excavar bajo la losa."
 gj_thalassar.16.a: "Financiar la excavación."
 gj_thalassar.16.b: "Que dejen de soñar."
 gj_thalassar.17.title: "Refugiados de la costa lejana"
 gj_thalassar.17.desc: "Una flota de barcazas viejas llega a nuestros muelles con familias enteras a bordo. Huyen del hambre en las costas del este y piden refugio. Nuestros barrios están llenos, pero las ciudades de Thalassar siempre han sido más grandes bajo el agua que sobre ella."
 gj_thalassar.17.a: "Acogerlos en los barrios nuevos."
 gj_thalassar.17.b: "Cerrar los puertos."
 gj_thalassar.18.title: "La procesión del reflujo"
 gj_thalassar.18.desc: "Cada generación, cuando la marea baja al mínimo, la corona recorre la calzada descubierta hasta la última arcada que asoma del fondo. Es una ceremonia antigua que algunos reformadores consideran idólatra. El pueblo la considera suya."
 gj_thalassar.18.a: "Celebrarla con toda pompa."
 gj_thalassar.18.b: "Suspenderla este año."
 gj_thalassar.19.title: "El arsenal despierta"
 gj_thalassar.19.desc: "Bajo la ensenada del Arsenal Sumergido, los mecanismos de esclusa se mueven por primera vez en doscientos años. Alguien ha dejado una llave de cristal en el cerrojo. Las flotas de reserva podrían botarse con la próxima marea, si la corona da la orden."
 gj_thalassar.19.a: "Botar la flota."
 gj_thalassar.19.b: "Mantener la reserva."
 gj_thalassar.20.title: "Mareas de oro"
 gj_thalassar.20.desc: "Los puertos de las cuatro costas piden perlas, redes y astilleros talasios. Nunca hubo tanta demanda ni tanto dinero en la ría. La corona puede abrir de par en par los mercados o aprovechar para cobrar peaje a cada mástil."
 gj_thalassar.20.a: "Abrir los mercados."
 gj_thalassar.20.b: "Cobrar aranceles."
 gj_thalassar.21.title: "Los canales despiertan"
 gj_thalassar.21.desc: "Los canales del primer barrio se abren de nuevo: los desagües centenarios, las compuertas de coral, las escaleras bajo la lengua del agua. Por primera vez desde el Hundimiento, hay niños que juegan en una calle que sus bisabuelos solo conocían de los cantos. Ahtessa respira."
 gj_thalassar.21.a: "Que se grabe en el coral."
 gj_thalassar.22.title: "El barrio de las perlas"
 gj_thalassar.22.desc: "Los constructores han emergido el segundo barrio: las salas de los clasificadores de perlas, con sus mesas de alabastro y sus lámparas de agua. Una sala permanece cerrada desde dentro. Nadie se atreve a derribarla, y desde entonces las perlas salen más gordas."
 gj_thalassar.22.a: "Que reciban una nueva guardia."
 gj_thalassar.22.b: "Derribar la puerta sellada."
 gj_thalassar.23.title: "El mercado sumergido"
 gj_thalassar.23.desc: "En el tercer barrio, bajo las bóvedas sin techo, el viejo mercado de Ahtessa abre de nuevo sus ochenta puestos. Mercaderes de las cuatro costas bajan en cestas de cristal, pagan a los guardianes de la marea y vuelven con la mercancía sin una gota. El comercio de la ciudad ya no tiene fondo."
 gj_thalassar.23.a: "Que se anuncie a todas las cortes."
 gj_thalassar.24.title: "El palacio de coral"
 gj_thalassar.24.desc: "El cuarto barrio emerge entero: una cúpula de coral blanco, torres de nácar y una sala del trono con vistas al mar abierto. El consejo se reúne por primera vez bajo sus bóvedas. Nadie habla; el eco devuelve cada palabra con la voz de los muertos."
 gj_thalassar.24.a: "Ocupar el trono con orgullo."
 gj_thalassar.25.title: "La emersión"
 gj_thalassar.25.desc: "Al amanecer, la marea no vuelve. Ahtessa, la Ciudad Hundida, entera y brillante, asoma del mar con todas sus torres. Las campanas de coral suenan solas. Los ancianos lloran; los jóvenes miran con ojos muy abiertos. Thalassar ya no es el recuerdo de un reino: es un reino que recuerda."
 gj_thalassar.25.a: "La corona vuelve a casa."
 gj_thalassar.26.title: "El peso de los siglos"
 gj_thalassar.26.desc: "Treinta años sin una piedra nueva en la Ciudad Hundida. Las Casas, que siempre prometieron esperar, ya no esperan. Dicen que la corona se ha hecho pesada, que el proyecto de los antiguos es un sueño de viejos y que lo que está hundido debe seguir hundido. La nobleza se alinea contra el trono y el pueblo, entre el miedo y la nostalgia, no sabe de qué lado ponerse."
 gj_thalassar.26.a: "Convocar la Asamblea de las Casas."
 gj_thalassar.26.b: "Doblegar a las Casas por la fuerza."
 gj_thalassar.27.title: "La concordia de las mareas"
 gj_thalassar.27.desc: "Las Casas y la corona sellan un pacto sobre la losa del puerto, con la marea baja y el sol a la espalda. Se acabaron los pleitos, por ahora. El viejo proyecto sigue en pie, y esta vez nadie dice que sea un sueño de ancianos."
 gj_thalassar.27.a: "Que dure."
 gj_thalassar.28.title: "Las Casas exigen"
 gj_thalassar.28.desc: "Un delegado de las Casas Hundidas llega al palacio con una lista de exigencias escrita en pergamino de alga: más puestos en el Consejo, la custodia de las ruinas y el fin de los gastos en el Arsenal."
 gj_thalassar.28.a: "Ceder en lo que se pueda."
 gj_thalassar.28.b: "Negarse."
 gj_thalassar.29.title: "Rumores de abdicación"
 gj_thalassar.29.desc: "Se dice en las tabernas del muelle que la corona piensa ceder el trono a un consejo de las Casas. Nadie sabe quién ha empezado el rumor, pero ya se vende en verso."
 gj_thalassar.29.a: "Mostrar la corona en la procesión del puerto."
 gj_thalassar.29.b: "Ignorar los versos."
 gj_thalassar.30.title: "Las aguas se estancan"
 gj_thalassar.30.desc: "Los fareros anotan que las corrientes se detienen cada vez más tiempo en los canales viejos. Los sabios dicen que la Ciudad Hundida lleva demasiado sin tocar. Si el proyecto sigue parado, la paciencia de las Casas se acabará."
 gj_thalassar.30.a: "Que se escriba en el libro de mareas."
