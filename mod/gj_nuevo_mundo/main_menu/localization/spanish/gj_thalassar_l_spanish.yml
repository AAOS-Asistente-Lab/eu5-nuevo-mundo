l_spanish:
 # AVANCES
 gj_thalassar_voz_de_las_mareas: "La Voz de las Mareas"
 gj_thalassar_voz_de_las_mareas_desc: "Los pilotos talasios aprenden a leer las corrientes como quien lee una carta: por el sonido. Cada marea trae un aviso, y quien lo oye llega antes y con menos sal en el casco."
 gj_thalassar_memoria_de_ahtessa: "La Memoria de Ahtessa"
 gj_thalassar_memoria_de_ahtessa_desc: "Cada familia guarda una frase, un plano o una receta de la Ciudad Hundida. Recopilarlas es la primera tarea de la corona y da a su gobierno el peso de lo antiguo."
 gj_thalassar_cultivo_de_perlas: "El Cultivo de Perlas"
 gj_thalassar_cultivo_de_perlas_desc: "Las barcazas de los cultivadores siembran ostras en los bajíos como otros siembran trigo. La perla deja de ser un hallazgo y pasa a ser una cosecha."
 gj_thalassar_diques_y_esclusas: "Malecones del Reflujo"
 gj_thalassar_diques_y_esclusas_desc: "Compuertas de coral, muelles de nácar y esclusas que se abren con la marea. El puerto talasio trabaja con el mar, no contra él."
 gj_thalassar_gremio_de_cartografos: "El Gremio de Cartógrafos"
 gj_thalassar_gremio_de_cartografos_desc: "La Escuela de Corales dibuja las corrientes, los bajíos y los pasos hundidos. Quien tiene sus cartas navega sin miedo hasta donde otros no se atreven."
 gj_thalassar_coros_del_abismo: "Los Coros del Abismo"
 gj_thalassar_coros_del_abismo_desc: "Los marineros cantan en cubierta una letanía antigua que marca el ritmo del remo y calma el pulso. En combate, la letanía se vuelve un grito."
 gj_thalassar_aduanas_de_cristal: "Las Aduanas de Cristal"
 gj_thalassar_aduanas_de_cristal_desc: "Un cristal de marea en cada balanza y en cada sello: ningún mercader puede alegar que le han engañado en el peso. Los puertos talasios son los más honestos y los más caros del mar."
 gj_thalassar_nobleza_sumergida: "La Nobleza Sumergida"
 gj_thalassar_nobleza_sumergida_desc: "Las viejas Casas se enorgullecen de descender de los arcontes de Ahtessa. La corona les concede honores a cambio de que no pretendan más poder. Casi siempre funciona."
 gj_thalassar_astilleros_de_nacar: "Astilleros de Nácar"
 gj_thalassar_astilleros_de_nacar_desc: "Cascos ligeros, ensamblados con clavijas de nácar y calafateados con brea de alga. Se botan en la mitad de tiempo y se hunden mucho menos que los de los vecinos."
 gj_thalassar_bancos_de_marea: "Los Bancos de Marea"
 gj_thalassar_bancos_de_marea_desc: "Casas de cambio que prestan a las flotas a la ida y cobran al regreso. Con ellas, el crédito talasio viaja a todos los puertos."
 gj_thalassar_astronomia_de_las_mareas: "Astronomía de las Mareas"
 gj_thalassar_astronomia_de_las_mareas_desc: "El calendario talasio sigue la luna y las mareas con un rigor que no tiene nadie más. De ahí nacen las tablas de navegación y el orgullo de los observatorios."
 gj_thalassar_pesca_de_profundidad: "La Pesca de Profundidad"
 gj_thalassar_pesca_de_profundidad_desc: "Redes de cientos de brazas, linternas de cristal para atraer a los bancos y buzos que bajan con un solo aliento. Los puertos hierven de pescado y, a veces, de gemas."
 gj_thalassar_bastiones_de_coral: "Los Bastiones de Coral"
 gj_thalassar_bastiones_de_coral_desc: "Murallas vivas que crecen bajo el agua y rompen las naves enemigas antes de que lleguen al puerto. Nadie rodea un bastión de coral sin pagar peaje."
 gj_thalassar_cantores_de_ahtessa: "Los Cantores de Ahtessa"
 gj_thalassar_cantores_de_ahtessa_desc: "Los coros reales memorizan la historia del reino en versos que cada niño aprende. Enseñar a leer se vuelve una forma de cantar."
 gj_thalassar_camaras_de_comercio_marino: "Cámaras de Comercio Marino"
 gj_thalassar_camaras_de_comercio_marino_desc: "Cada puerto tiene su cámara y cada cámara, su flota. Los mercaderes talasios hablan con una sola voz y ponen precio al mar."
 gj_thalassar_medicina_del_agua: "La Medicina del Agua"
 gj_thalassar_medicina_del_agua_desc: "Baños de sal, filtros de alga y cuarentenas en los fondeaderos. Las fiebres de los barcos llegan a Thalassar y se quedan sin víctimas."
 gj_thalassar_arsenal_de_cristal: "El Arsenal de Cristal"
 gj_thalassar_arsenal_de_cristal_desc: "Los grandes buques talasios se arman en cámaras acuáticas que ahorran media vida de trabajo. La flota de línea es cara, pero responde como un solo cuerpo."
 gj_thalassar_tributo_del_mar: "El Tributo del Mar"
 gj_thalassar_tributo_del_mar_desc: "Todo barco que cruza las aguas talasias paga una tasa por la baliza y la protección. Es poco, pero lo paga todo el mundo."
 gj_thalassar_ingenieria_hidraulica: "Ingeniería Hidráulica"
 gj_thalassar_ingenieria_hidraulica_desc: "Los ingenieros de los diques levantan acueductos y canales con la misma soltura con la que los demás levantan graneros. Construir cuesta menos, y lo construido dura."
 gj_thalassar_archivo_de_las_profundidades: "El Archivo de las Profundidades"
 gj_thalassar_archivo_de_las_profundidades_desc: "Un edificio bajo el nivel del mar, sellado contra la humedad, en el que se guarda cuanto el reino ha sabido. Los sabios bajan en cestas de cristal."
 gj_thalassar_mareas_domadas: "Las Mareas Domadas"
 gj_thalassar_mareas_domadas_desc: "Compuertas, turbinas de agua y cuencas de reserva: la marea mueve molinos, telares y forjas. Las ciudades talasias trabajan con la fuerza del mar."
 gj_thalassar_la_emersion: "La Emersión"
 gj_thalassar_la_emersion_desc: "Ahtessa vuelve a ver el sol. Con ella, un reino que se creía recuerdo recupera una corte, un nombre y un destino."
 gj_thalassar_flota_de_la_alborada: "La Flota de la Alborada"
 gj_thalassar_flota_de_la_alborada_desc: "Naves ligeras de línea fina que cruzan los cuatro mares antes de que el sol llegue al horizonte. La alborada talasia es la hora del mensajero."
 gj_thalassar_concordia_de_los_cuatro_mares: "La Concordia de los Cuatro Mares"
 gj_thalassar_concordia_de_los_cuatro_mares_desc: "Una red de tratados con los puertos del mundo: pesos iguales, balizas comunes, justicia mercante. Thalassar, por fin, es una potencia del comercio."
 gj_talasio_canto_de_las_conchas: "El Canto de las Conchas"
 gj_talasio_canto_de_las_conchas_desc: "Cada niño talasio aprende a soplar una concha antes de aprender a leer. El canto de las conchas marca los turnos de trabajo, las horas y las fiestas."
 gj_talasio_piel_de_sal: "Piel de Sal"
 gj_talasio_piel_de_sal_desc: "Siglos de baños salinos han hecho a los talasios resistentes a las fiebres del puerto y serenos en el mar. Un marinero talasio rara vez se marea."
 gj_talasio_heredad_del_dique: "La Heredad del Dique"
 gj_talasio_heredad_del_dique_desc: "Cada familia tiene su tramo de dique y lo cuida de padres a hijos. Una ciudad talasia crece con orden y sin pedir permiso."
 # REFORMAS
 gj_thalassar_consejo_de_las_mareas: "Consejo de las Mareas"
 gj_thalassar_consejo_de_las_mareas_desc: "Las Casas Hundidas y los gremios del puerto comparten el gobierno en un consejo que se reúne al pie de la marea. La corona reina, pero el consejo decide cuándo se zarpa."
 gj_thalassar_custodios_del_arrecife: "Custodios del Arrecife"
 gj_thalassar_custodios_del_arrecife_desc: "Una orden militar de la costa que defiende los pasos sumergidos del reino. Sus naves no persiguen: esperan, y el enemigo llega por su propio pie."
 gj_thalassar_corona_emergida: "La Corona Emergida"
 gj_thalassar_corona_emergida_desc: "Con la Ciudad Hundida de nuevo sobre el agua, la monarquía recupera las formas y el derecho de los arcontes. Es el sueño de los antiguos hecho gobierno."
 # CULTURA
 gj_talasio: "Talasios"
 gj_talasio_desc: "Los talasios descienden de los supervivientes de Ahtessa, la ciudad que se hundió bajo el mar interior. Se dicen herederos de los arcontes y cultivan una memoria obstinada: la del agua, el nácar y la voz bajo las olas."
 gj_talasio_dialect: "Talasio"
 gj_talasia_language: "Lengua talasia"
 gj_talasia_language_family: "Lenguas talasias"
 gj_grupo_talasio: "Talasios"
 gj_grupo_talasio_desc: "Los pueblos del mar interior que conservan la memoria de la Ciudad Hundida. Viven de la pesca, la perla y el comercio de cabotaje, y entre ellos el mar es un pariente más."
 # EDIFICIOS
 gj_thalassar_faro_de_marea_1: "Faro de Marea"
 gj_thalassar_faro_de_marea_1_desc: "Una linterna de cristal sobre un pilar de coral. Guía a los barcos, calma la rompiente y atrae a los cristales de marea a la red del puerto."
 gj_thalassar_faro_de_marea_2: "Faro de Marea mayor"
 gj_thalassar_faro_de_marea_2_desc: "Torre de nácar con espejos de cristal. Su luz se ve a tres leguas y las corrientes se ordenan a su alrededor."
 gj_thalassar_faro_de_marea_3: "Faro de Marea mayor, con linterna de arrecife"
 gj_thalassar_faro_de_marea_3_desc: "Un faro con sala de mapas, depósito de cristales y guarnición. No hay barco en el mar interior que no lo reconozca."
 gj_thalassar_barrio_emergido_1: "Barrio emergido"
 gj_thalassar_barrio_emergido_1_desc: "Un barrio de la Ciudad Hundida, vaciado de agua y devuelto a la luz. Calles de piedra clara, patios con estanques y escalinatas que bajan a la sombra."
 gj_thalassar_barrio_emergido_2: "Barrio emergido mayor"
 gj_thalassar_barrio_emergido_2_desc: "El barrio ha vuelto a ser una ciudad dentro de una ciudad: academias, talleres y bóvedas de coral con hornacinas para los lamparistas."
 gj_thalassar_barrio_emergido_3: "Barrio emergido, de la Ciudad Alzada"
 gj_thalassar_barrio_emergido_3_desc: "Los barrios de Ahtessa por fin fuera del mar. Mercado, palacio y escuela comparten plaza y música."
 gj_thalassar_jardin_de_perlas_1: "Jardín de Perlas"
 gj_thalassar_jardin_de_perlas_1_desc: "Cuencas protegidas donde las ostras crecen bajo vigilancia. Los jardineros las giran, las limpian y les cantan."
 gj_thalassar_jardin_de_perlas_2: "Jardín de Perlas mayor"
 gj_thalassar_jardin_de_perlas_2_desc: "Terrazas de cultivo que bajan en escalera hasta el fondo. Las perlas salen más grandes y más regulares."
 gj_thalassar_jardin_de_perlas_3: "Jardín de Perlas de la Casa Real"
 gj_thalassar_jardin_de_perlas_3_desc: "Un criadero de ostras con clasificadores, joyeros y catadores. Es un monopolio de hecho: nadie en el mar tiene perlas como las talasias."
 gj_thalassar_academia_de_las_mareas_1: "Academia de las Mareas"
 gj_thalassar_academia_de_las_mareas_1_desc: "Una escuela de navegación y cartografía en la capital. Sus maestros enseñan a leer corrientes, estrellas y mapas."
 gj_thalassar_academia_de_las_mareas_2: "Academia de las Mareas mayor"
 gj_thalassar_academia_de_las_mareas_2_desc: "La escuela crece con una biblioteca húmeda y una sala de globos de cristal. Sus alumnos viajan por todo el mundo con sus cuadernos."
 gj_thalassar_academia_de_las_mareas_3: "Academia de las Mareas, Sala del Archivo"
 gj_thalassar_academia_de_las_mareas_3_desc: "Un archivo sellado bajo el nivel del mar y una universidad en la superficie. Ahtessa piensa otra vez."
 gj_thalassar_arsenal_sumergido_1: "Arsenal sumergido"
 gj_thalassar_arsenal_sumergido_1_desc: "Un astillero cubierto bajo el muelle, del que las naves salen por rampas y esclusas. Solo se construye donde ya hay un faro."
 gj_thalassar_arsenal_sumergido_2: "Arsenal sumergido mayor"
 gj_thalassar_arsenal_sumergido_2_desc: "Un complejo de diques secos y grúas de contrapeso en el que se arman flotas enteras en una temporada."
 gj_thalassar_arsenal_sumergido_3: "Gran Arsenal sumergido"
 gj_thalassar_arsenal_sumergido_3_desc: "Mil carpinteros y un millar de brazas de rampa. La flota de Thalassar sale de aquí, y regresa a reparar aquí."
