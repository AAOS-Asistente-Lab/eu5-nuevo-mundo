 # UNIDADES
 n_gj_thalassar_nave_de_marea_1: "Nave de Marea"
 n_gj_thalassar_nave_de_marea_1_desc: "Un casco ligero de nácar que corre con la marea. Rápida y ágil, pero frágil y cara de tripular."
 n_gj_thalassar_nave_de_marea_2: "Nave de Marea de vela latina"
 n_gj_thalassar_nave_de_marea_2_desc: "Mismo diseño, ahora con velas latinas y una pequeña batería."
 n_gj_thalassar_nave_de_marea_3: "Carabela de Marea"
 n_gj_thalassar_nave_de_marea_3_desc: "Una carabela afinada por los calafates talasios. Cruza el mar interior con el viento en contra."
 n_gj_thalassar_nave_de_marea_4: "Fragata de Marea"
 n_gj_thalassar_nave_de_marea_4_desc: "Fragata de casco bajo y mástiles altos. Su velocidad es la que cuenta, no la fuerza del casco."
 n_gj_thalassar_nave_de_marea_5: "Corbeta de Marea"
 n_gj_thalassar_nave_de_marea_5_desc: "Casco hidrodinámico y artillería moderada. Es un correo con dientes."
 n_gj_thalassar_nave_de_marea_6: "Clíper de Marea"
 n_gj_thalassar_nave_de_marea_6_desc: "Esbelto y veloz como una idea. El enemigo suele verlo solo por el rastro de espuma."
 n_gj_thalassar_galera_de_cristal_1: "Galera de Cristal"
 n_gj_thalassar_galera_de_cristal_1_desc: "Una galera con ariete de cristal y bancos de remeros cantores. Solo la tienen unos pocos puertos del reino."
 n_gj_thalassar_galera_de_cristal_2: "Galera de Cristal mayor"
 n_gj_thalassar_galera_de_cristal_2_desc: "Galera con baterías de proa y rostro reforzado. Más pesada y más lenta, y ya más letal."
 n_gj_thalassar_galera_de_cristal_3: "Galeaza de Cristal"
 n_gj_thalassar_galera_de_cristal_3_desc: "Una galeaza con artillería de cristal y bancos dobles. Un casco hecho para asaltar costas."
 n_gj_thalassar_galera_de_cristal_4: "Galeaza de Cristal mayor"
 n_gj_thalassar_galera_de_cristal_4_desc: "Una galeaza con cañones de largo alcance y cubierta de abordaje. Un puerto pequeño no la sostiene."
 n_gj_thalassar_galera_de_cristal_5: "Galera de Línea de Cristal"
 n_gj_thalassar_galera_de_cristal_5_desc: "La última galera de línea, con artillería en pasillo y casco de coral. Rara y orgullosa."
 n_gj_thalassar_galera_de_cristal_6: "Galera Acorazada de Cristal"
 n_gj_thalassar_galera_de_cristal_6_desc: "Casco acorazado de nácar y acero, con cañones de proa. Es un monumento flotante y una amenaza real."
 a_gj_thalassar_guardia_de_marea_1: "Guardia de Marea"
 a_gj_thalassar_guardia_de_marea_1_desc: "Infantería pesada que protege los muelles y los diques. Aguanta el golpe, rinde menos fuera de su costa y no persigue."
 a_gj_thalassar_guardia_de_marea_2: "Guardia de Marea, de la Calzada"
 a_gj_thalassar_guardia_de_marea_2_desc: "Armadura de escamas de coral y pavés largo. Su sitio es la rompiente."
 a_gj_thalassar_guardia_de_marea_3: "Guardia de Marea, de la Escalera"
 a_gj_thalassar_guardia_de_marea_3_desc: "Pica y arcabuz bajo las mismas banderas. Los muros del puerto los llaman suyos."
 a_gj_thalassar_guardia_de_marea_4: "Guardia de Marea, del Dique"
 a_gj_thalassar_guardia_de_marea_4_desc: "Mosquete y bayoneta en las murallas de la ría. Aguantan, no avanzan."
 a_gj_thalassar_guardia_de_marea_5: "Guardia de Marea, del Arrecife"
 a_gj_thalassar_guardia_de_marea_5_desc: "Línea disciplinada de fusileros costeros. Mueren en su sitio antes que retroceder."
 a_gj_thalassar_guardia_de_marea_6: "Guardia de Marea, de la Emersión"
 a_gj_thalassar_guardia_de_marea_6_desc: "Fusilería moderna con coraza ligera. Guardianes de una ciudad que ha vuelto a la luz."
 # FAMILIAS
 gj_nave_de_marea: "Naves de Marea"
 gj_galera_de_cristal: "Galeras de Cristal"
 gj_guardia_de_marea: "Guardias de Marea"
 # DESASTRE
 gj_thalassar_peso_de_los_siglos: "El peso de los siglos"
 gj_thalassar_peso_de_los_siglos_desc: "Treinta años sin levantar una piedra de la Ciudad Hundida han agotado la paciencia de las Casas. Si no se reaviva el proyecto o se convoca el Concilio de las Mareas, la nobleza se alzará contra el trono."
 # DECISIONES
 gj_thalassar_alzar_fase_1.title: "Alzar la Ciudad Hundida: los Canales"
 gj_thalassar_alzar_fase_1.desc: "Primera fase de la Ciudad Hundida. Vaciar los canales del primer barrio y devolverles la luz. Requiere oro y cristales de marea."
 gj_thalassar_alzar_fase_1.a: "Que se abran los canales."
 gj_thalassar_alzar_fase_2.title: "Alzar la Ciudad Hundida: el Barrio de las Perlas"
 gj_thalassar_alzar_fase_2.desc: "Segunda fase. Emerger el barrio de los clasificadores de perlas y fundar la orden de los Custodios del Arrecife. Requiere la era del Renacimiento y estar en paz."
 gj_thalassar_alzar_fase_2.a: "Que emerja el barrio."
 gj_thalassar_alzar_fase_3.title: "Alzar la Ciudad Hundida: el Mercado Sumergido"
 gj_thalassar_alzar_fase_3.desc: "Tercera fase. Reabrir el viejo mercado de Ahtessa. Pide dominar el mar interior (tres puertos propios en él) o haber explorado una ruina atlante."
 gj_thalassar_alzar_fase_3.a: "Que abra el mercado."
 gj_thalassar_alzar_fase_4.title: "Alzar la Ciudad Hundida: el Palacio de Coral"
 gj_thalassar_alzar_fase_4.desc: "Cuarta fase. Levantar la cúpula del palacio real en el centro de Ahtessa. Requiere la era de la Reforma y un reino estable."
 gj_thalassar_alzar_fase_4.a: "Que se alce el palacio."
 gj_thalassar_alzar_fase_5.title: "Alzar la Ciudad Hundida: la Emersión"
 gj_thalassar_alzar_fase_5.desc: "Quinta y última fase. Hacer que Ahtessa entera emerja del mar. Es la obra de una dinastía y el sueño de un reino: se desbloquea la Corona Emergida y el formable de Thalassar Restaurada."
 gj_thalassar_alzar_fase_5.a: "Que emerja Ahtessa."
 gj_thalassar_cosecha_de_cristales.title: "Cosecha de cristales de marea"
 gj_thalassar_cosecha_de_cristales.desc: "Organizar la gran cosecha de cristales en los bajíos. Cuesta oro, da cristales y un pequeño aumento en la producción de gemas durante cinco años."
 gj_thalassar_cosecha_de_cristales.a: "Organizar la cosecha."
 gj_thalassar_concilio_de_las_mareas.title: "Concilio de las Mareas"
 gj_thalassar_concilio_de_las_mareas.desc: "Convocar a las Casas Hundidas a un concilio para renovar el pacto y rebajar la decadencia del proyecto. Se puede repetir cada diez años."
 gj_thalassar_concilio_de_las_mareas.a: "Convocar el concilio."
 gj_thalassar_jubileo_de_las_mareas.title: "Jubileo de las Mareas"
 gj_thalassar_jubileo_de_las_mareas.desc: "Celebrar un jubileo en la Ciudad Hundida para honrar el progreso del reino. Solo se puede celebrar una vez."
 gj_thalassar_jubileo_de_las_mareas.a: "Que empiece el jubileo."
