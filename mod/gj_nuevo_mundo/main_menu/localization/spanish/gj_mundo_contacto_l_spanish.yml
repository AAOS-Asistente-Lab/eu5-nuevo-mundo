l_spanish:
 # ---------- Modificadores de país ----------
 STATIC_MODIFIER_NAME_gj_contacto_via_comercio: "Puertos abiertos al comercio"
 STATIC_MODIFIER_DESC_gj_contacto_via_comercio: "Los muelles reciben barcos de ultramar y los mercaderes cierran tratos con gente que habla otra lengua."
 STATIC_MODIFIER_NAME_gj_contacto_via_aprender: "Los sabios de los puertos"
 STATIC_MODIFIER_DESC_gj_contacto_via_aprender: "Hemos mandado a nuestros mejores a aprender de los recién llegados, y las escuelas de los puertos están llenas."
 STATIC_MODIFIER_NAME_gj_contacto_via_cerrado: "Puertos cerrados a los barcos"
 STATIC_MODIFIER_DESC_gj_contacto_via_cerrado: "Nadie desembarca. Los sacerdotes están contentos, los mercaderes no tanto, y los libros nuevos no llegan."
 STATIC_MODIFIER_NAME_gj_inmunidad_1: "Cuerpos que ya conocen la fiebre"
 STATIC_MODIFIER_NAME_gj_inmunidad_2: "Dos generaciones de contacto"
 STATIC_MODIFIER_NAME_gj_inmunidad_3: "Sangre curtida por el mar"
 STATIC_MODIFIER_DESC_gj_inmunidad_1: "Tras años de trato con los barcos, el pueblo resiste mejor las fiebres que llegan con ellos."
 STATIC_MODIFIER_DESC_gj_inmunidad_2: "Los abuelos sobrevivieron a las fiebres y sus nietos nacen con las defensas más altas."
 STATIC_MODIFIER_DESC_gj_inmunidad_3: "Medio siglo de contacto ha hecho que las fiebres de los barcos sean una desgracia más, no una catástrofe."
 STATIC_MODIFIER_NAME_gj_difusion_1: "Poniéndose al día: pasos cortos"
 STATIC_MODIFIER_NAME_gj_difusion_2: "Poniéndose al día: zancadas"
 STATIC_MODIFIER_NAME_gj_difusion_3: "Poniéndose al día: a la carrera"
 STATIC_MODIFIER_DESC_gj_difusion_1: "Vamos por detrás de algún país del Viejo Mundo que conocemos. Lo que ellos ya saben nos cuesta menos aprenderlo. Desaparece al alcanzarlos."
 STATIC_MODIFIER_DESC_gj_difusion_2: "Nos llevan una distancia considerable. Los saberes se difunden con facilidad hacia quien va a la cola. Desaparece al alcanzarlos."
 STATIC_MODIFIER_DESC_gj_difusion_3: "Nos llevan mucha ventaja y todo el mundo quiere enseñarnos. Desaparece al alcanzarlos: nadie va por delante gracias a esto."
 STATIC_MODIFIER_NAME_gj_saber_ultramar_forja: "La forja de las montañas"
 STATIC_MODIFIER_DESC_gj_saber_ultramar_forja: "Los herreros del Viejo Mundo han copiado el temple y la fragua de los constructores de la montaña."
 STATIC_MODIFIER_NAME_gj_saber_ultramar_terrazas: "Los bancales del sol"
 STATIC_MODIFIER_DESC_gj_saber_ultramar_terrazas: "Los labradores de ultramar han aprendido a sostener la ladera con muros y canales."
 STATIC_MODIFIER_NAME_gj_saber_ultramar_navegacion: "Las cartas de los marinos"
 STATIC_MODIFIER_DESC_gj_saber_ultramar_navegacion: "Los pilotos de allá copian las cartas y los nudos de los marinos de acá."
 STATIC_MODIFIER_NAME_gj_saber_ultramar_bosque: "Hierbas y savias del bosque"
 STATIC_MODIFIER_DESC_gj_saber_ultramar_bosque: "Los boticarios de ultramar han descubierto lo que el pueblo del bosque sabe desde hace siglos."
 STATIC_MODIFIER_NAME_gj_saber_ultramar_estepa: "La cría de las estepas"
 STATIC_MODIFIER_DESC_gj_saber_ultramar_estepa: "Los caballerizos del Viejo Mundo se han llevado potros y secretos de doma."
 STATIC_MODIFIER_NAME_gj_saber_ultramar_generico: "Oficios de ultramar"
 STATIC_MODIFIER_DESC_gj_saber_ultramar_generico: "Los visitantes han vuelto a casa con herramientas, recetas y modos de hacer que no conocían."
 STATIC_MODIFIER_NAME_gj_ev_cuarentena_muelles: "Cuarentena en los muelles"
 STATIC_MODIFIER_NAME_gj_ev_medicos_del_otro_lado: "Médicos del otro lado"
 STATIC_MODIFIER_NAME_gj_ev_oracion_y_hierbas: "Oración y hierbas"
 STATIC_MODIFIER_NAME_gj_ev_cultivo_llegado: "Cultivo nuevo en el mercado"
 STATIC_MODIFIER_NAME_gj_ev_caballos_llegados: "Caballos de ultramar"
 STATIC_MODIFIER_NAME_gj_ev_lengua_del_puerto: "Intérpretes del puerto"
 STATIC_MODIFIER_NAME_gj_ev_ola_de_maestros: "Ola de maestros"
 STATIC_MODIFIER_NAME_gj_ev_imprenta_en_el_muelle: "Imprenta en el muelle"
 STATIC_MODIFIER_NAME_gj_ev_viejo_rencor: "Rencor de los muros"
 # ---------- Modificadores de location ----------
 STATIC_MODIFIER_NAME_gj_loc_cuarentena: "Barrio en cuarentena"
 STATIC_MODIFIER_NAME_gj_loc_rastro_de_fiebres: "Rastro de las fiebres"
 STATIC_MODIFIER_NAME_gj_loc_puerto_de_saberes: "Puerto de los saberes"
 STATIC_MODIFIER_NAME_gj_loc_casa_de_curanderos: "Casa de curanderos"
 # ---------- Decisiones ----------
 gj_contacto_cerrar_puertos: "Cerrar los puertos a ultramar"
 gj_contacto_cerrar_puertos_desc: "Que ningún barco extranjero toque nuestra costa. Ganamos calma y fe, y perdemos comercio y saber nuevo. Las fiebres de los barcos tendrán más difícil entrar."
 gj_contacto_cerrar_puertos.a: "Echar las cadenas al puerto"
 gj_contacto_reabrir_puertos: "Reabrir los puertos"
 gj_contacto_reabrir_puertos_desc: "Han pasado años tras los muros. Quizá sea hora de dejar que vuelvan los barcos, aunque el clero proteste."
 gj_contacto_reabrir_puertos.a: "Alzar las cadenas"
 gj_contacto_embajada: "Mandar una embajada al otro lado del mar"
 gj_contacto_embajada_desc: "Un barco, un intérprete y regalos de los mejores talleres. A cambio, noticias, libros y buena fama. Se puede repetir cada diez años."
 gj_contacto_embajada.a: "Que zarpe la embajada"
 gj_contacto_casa_de_saberes: "Fundar la Casa de los Saberes"
 gj_contacto_casa_de_saberes_desc: "Un edificio junto al muelle donde se traducen libros, se copian planos y se enseña a leer a quien llegue. Una sola vez."
 gj_contacto_casa_de_saberes.a: "Colocar la primera piedra junto al agua"
 gj_contacto_cuarentena_general: "Cuarentena general en los puertos"
 gj_contacto_cuarentena_general_desc: "Las fiebres de los barcos corren por nuestra costa. Quien llegue de ultramar espera cuarenta días en la isla de la boya."
 gj_contacto_cuarentena_general.a: "Que cada barco espere en la boya"
 # ---------- Eventos: primer contacto ----------
 gj_mundo_contacto.1.title: "Velas en el horizonte"
 gj_mundo_contacto.1.desc: "El vigía del faro baja las escaleras sin aliento: hay velas, muchas, de una forma que nadie ha visto antes, con cascos altos y telas claras. Vienen de levante y no parecen perdidas. Los pescadores dicen que traen gente de piel y lengua extrañas, y que preguntan por el nombre de nuestra tierra con señas torpes.\n\nEl consejo se reúne en la sala de las mareas. Unos quieren recibirlos con ofrendas; otros, con lanzas; otros, que sigan su camino y no vuelvan."
 gj_mundo_contacto.1.historical_info: "Los pueblos que se encontraron con los barcos del Viejo Mundo solían tener una sola oportunidad de decidir cómo recibirlos. Los que supieron comerciar y aprender sin dejarse engañar salieron mejor parados."
 gj_mundo_contacto.1.a: "Recibirlos en el muelle y abrir el mercado"
 gj_mundo_contacto.1.b: "Que nuestros sabios suban a bordo y aprendan"
 gj_mundo_contacto.1.c: "Echar las cadenas al puerto: que sigan su camino"
 gj_mundo_contacto.2.title: "Noticias del otro lado del mar"
 gj_mundo_contacto.2.desc: "Uno de nuestros capitanes ha regresado con una historia que nadie quería creer: una costa lejana, ciudades de piedra y madera, gente que nos recibió con cautela y regalos, y una lengua que casi se aprende en un mes. Trae semillas, dos libros de cuentas y un mapa dibujado en una piel de cabra.\n\nLos cortesanos discuten si esa tierra es una oportunidad o una amenaza."
 gj_mundo_contacto.2.a: "Interrogar a los marinos y copiar el mapa"
 gj_mundo_contacto.2.b: "Armar otro viaje: allí hay mercado"
 gj_mundo_contacto.2.c: "Guardar el secreto y seguir como hasta ahora"
 gj_mundo_contacto.3.title: "La primera caravana de ultramar"
 gj_mundo_contacto.3.desc: "Dos años después de las primeras velas, llega la primera flota que viene a comerciar de verdad. Traen herramientas de hierro bueno, telas, libros de cuentas y cajas de semillas envueltas en paja. Piden a cambio lo que nos sobra: pieles, madera, metales y nuestras mejores piezas de taller.\n\nLos mercaderes se frotan las manos. Los viejos del puerto miran con desconfianza las cajas más pequeñas."
 gj_mundo_contacto.3.a: "Vender a buen precio y llenar la tesorería"
 gj_mundo_contacto.3.b: "Comprar herramientas y semillas: lo que no tenemos"
 gj_mundo_contacto.3.c: "Pedir copias de sus libros"
 gj_mundo_contacto.4.title: "La escuela del puerto"
 gj_mundo_contacto.4.desc: "Dos años de aprendizaje han dejado una pregunta: ¿a quién enseñamos lo aprendido? Los recién llegados han dejado dos maestros y un cofre de libros, y el consejo debate dónde levantar la escuela. Los nobles quieren educar a sus hijos; los clérigos, traducir los textos; los burgueses, que entre cualquiera."
 gj_mundo_contacto.4.a: "Para los hijos de los nobles"
 gj_mundo_contacto.4.b: "Un scriptorium de traductores bajo el clero"
 gj_mundo_contacto.4.c: "Abierta a todos y pagada por el tesoro"
 gj_mundo_contacto.5.title: "Los muros de la fe"
 gj_mundo_contacto.5.desc: "Cinco años de puertos cerrados. Los barcos se han ido y casi nadie los echa de menos en los templos, donde las ofrendas han subido. Pero los jóvenes miran el mar con ojos hambrientos y los mercaderes cuentan monedas que no entran.\n\nEl sacerdote mayor pide un edicto que selle el cierre; los jóvenes, un puerto libre."
 gj_mundo_contacto.5.a: "Reforzar el cierre con un edicto"
 gj_mundo_contacto.5.b: "Reabrir un muelle, solo uno"
 # ---------- Eventos: Fiebres de los barcos ----------
 gj_mundo_contacto.6.title: "Fiebres en los barcos"
 gj_mundo_contacto.6.desc: "Una fiebre llega con los barcos: ardores, manchas, tos que no cede. En los muelles se cuentan los primeros muertos y los boticarios se miran sin saber qué dar. No es la peste que arrasa provincias enteras, pero asusta, porque nadie recuerda haberla visto antes.\n\nEl cuerpo de guardia pide permiso para cerrar los muelles; el clero, para abrir los templos."
 gj_mundo_contacto.6.a: "Cuarentena en los muelles"
 gj_mundo_contacto.6.b: "Que recen y beban las hierbas de los abuelos"
 gj_mundo_contacto.6.c: "Pedir médicos al otro lado del mar"
 gj_mundo_contacto.7.title: "Un brote en el barrio del muelle"
 gj_mundo_contacto.7.desc: "En [gj_loc_brote.GetName] las fiebres han saltado de los barcos a las casas del muelle. Las familias esconden a los enfermos por miedo a que les quemen la casa. Los pocos curanderos de la zona piden ayuda, hierbas y paños limpios."
 gj_mundo_contacto.7.a: "Socorrer a los enfermos y pagar a los curanderos"
 gj_mundo_contacto.7.b: "Cerrar el barrio con soldados"
 gj_mundo_contacto.7.c: "Dejar que pase: no hay recursos para todos"
 gj_mundo_contacto.8.title: "El curandero y el fraile"
 gj_mundo_contacto.8.desc: "Dos remedios, una ciudad. El curandero cree que la fiebre sale de las aguas sucias y de los muelles; el fraile, que es un castigo por el trato con extranjeros. Los dos tienen seguidores. El consejo les pide que no se peleen en público: piden decidir a quién se le da el dinero."
 gj_mundo_contacto.8.a: "Apoyar al curandero: aguas limpias y hospital"
 gj_mundo_contacto.8.b: "Apoyar al fraile: rogativas y ayuno"
 gj_mundo_contacto.9.title: "La barca sin tripulación"
 gj_mundo_contacto.9.desc: "Una barca de velas sucias ha varado en la playa. No hay tripulantes vivos; dentro hay un cargamento intacto de telas y cajas. Los pescadores no se atreven a tocarla. Los más audaces dicen que en esas telas hay dinero para un año."
 gj_mundo_contacto.9.a: "Quemar el casco con todo lo que lleva"
 gj_mundo_contacto.9.b: "Salvar la carga: no se tira tanto oro"
 gj_mundo_contacto.10.title: "Los que no enfermaron"
 gj_mundo_contacto.10.desc: "Hay familias que han atendido a enfermos sin contagiarse, y marineros que ya pasaron estas fiebres en otras costas. Los ancianos los llaman «los curtidos». Nadie sabe por qué, pero con ellos cerca la cosa va mejor."
 gj_mundo_contacto.10.a: "Honrar a los curtidos como curanderos"
 gj_mundo_contacto.10.b: "Ponerlos de guardia en los muelles"
 gj_mundo_contacto.11.title: "Se van las fiebres"
 gj_mundo_contacto.11.desc: "Un día sin nuevos enfermos. Luego una semana. Las fiebres de los barcos remiten y los muelles vuelven a llenarse. No ha sido la peste que arrasa continentes, pero ha dejado nombres en las lápidas y una cautela nueva en los puertos."
 gj_mundo_contacto.11.a: "Dar gracias y recordar a los muertos"
 gj_mundo_contacto.11.b: "Levantar una casa de curanderos junto al muelle"
 gj_mundo_contacto.12.title: "Los abuelos lo dicen: ya nos resistimos mejor"
 gj_mundo_contacto.12.desc: "Las fiebres que llegaron con los barcos aún matan, pero ya no a cuchilladas. Los hijos de los primeros contagiados las pasan en una semana; los nietos, apenas las notan. Los médicos de los puertos lo apuntan en sus cuadernos con letra pequeña: nuestro pueblo se ha hecho más fuerte frente a las enfermedades del mar."
 gj_mundo_contacto.12.a: "Que se recuerde en las crónicas"
 # ---------- Eventos: intercambio y difusión ----------
 gj_mundo_contacto.13.title: "Los caballos de ultramar"
 gj_mundo_contacto.13.desc: "Un barco ha desembarcado dos yeguas y un semental, mareados y furiosos. Los criadores locales los miran con una mezcla de miedo y codicia. En un año habrá potros, y en cinco, un linaje distinto del que conocemos."
 gj_mundo_contacto.13.a: "Fundar una cuadra real y mejorar la cría"
 gj_mundo_contacto.13.b: "Vender los potros a la nobleza"
 gj_mundo_contacto.14.title: "Un cultivo nuevo en el mercado"
 gj_mundo_contacto.14.desc: "Entre los sacos de un mercader de ultramar viene una semilla desconocida. La dan a probar: cuece rápido, sacia y crece donde otros no. Las campesinas ya preguntan cuánto cuesta."
 gj_mundo_contacto.14.a: "Repartirla entre los campesinos"
 gj_mundo_contacto.14.b: "Que lo siembren los nobles en sus tierras"
 gj_mundo_contacto.15.title: "Los intérpretes del puerto"
 gj_mundo_contacto.15.desc: "Tras años de trato, hay chicos del puerto que hablan las dos lenguas como si hubieran nacido en cada una. Los recién llegados ya no necesitan señas, y nuestros mercaderes cierran tratos con una sola charla."
 gj_mundo_contacto.15.a: "Formar una escuela de intérpretes"
 gj_mundo_contacto.15.b: "Enviar a los mejores como emisarios"
 gj_mundo_contacto.16.title: "Una imprenta en el muelle"
 gj_mundo_contacto.16.desc: "Un impresor cansado de su ciudad natal ha cruzado el mar con su prensa y cajas de plomo. Pide un taller y permiso para imprimir en nuestra lengua. El clero mira la tinta con recelo."
 gj_mundo_contacto.16.a: "Pagarle el taller y darle la bienvenida"
 gj_mundo_contacto.16.b: "Dejarlo trabajar, pero bajo el ojo del clero"
 gj_mundo_contacto.17.title: "Los hijos del cierre"
 gj_mundo_contacto.17.desc: "La generación que nació tras los muros se asoma al mar. Han oído historias de barcos con velas blancas, de libros que cantan y de gente que come con herramientas de metal. Los ancianos dicen que son palabras de extranjeros; los jóvenes, que ya es hora."
 gj_mundo_contacto.17.a: "Reabrir los puertos y enviar a aprender a los jóvenes"
 gj_mundo_contacto.17.b: "Mantener los muros: lo extraño no entra"
 gj_mundo_contacto.18.title: "Llegan maestros de ultramar"
 gj_mundo_contacto.18.desc: "Los que saben más que nosotros están dispuestos a venderlo. Una nave trae tres maestros de obras, un cartógrafo y un fabricante de instrumentos. Piden techo, comida y que les dejemos hablar. Lo que enseñen nos pondrá más cerca de ellos."
 gj_mundo_contacto.18.a: "Alojarlos en el palacio y abrirles las aulas"
 gj_mundo_contacto.18.b: "Que enseñen en el puerto, a quien pague"
 gj_mundo_contacto.19.title: "Lo que aprendimos de ellos"
 gj_mundo_contacto.19.desc: "Hace tres años que nuestro capitán regresó del otro lado del mar. Algunos de los saberes que trajo ya son de uso común: un modo distinto de curtir, de temple, de trazar una vela. Hemos aprendido de ellos, sí, pero ellos también nos han enseñado algo. Y ahora, en nuestras escuelas, se enseñan las dos cosas."
 gj_mundo_contacto.19.a: "Dejarlo en las crónicas de la corte"
 gj_mundo_contacto.19.b: "Sacarle provecho en el mercado"
 gj_mundo_contacto.20.title: "El intérprete que se quedó"
 gj_mundo_contacto.20.desc: "Uno de los hombres del primer barco se ha quedado. Ha aprendido la lengua, se ha casado con una mujer del puerto y ahora ofrece, a cambio de techo, contar todo lo que sabe de su tierra: leyes, rutas, marinos y sus malicias."
 gj_mundo_contacto.20.a: "Nombrarlo consejero para asuntos de ultramar"
 gj_mundo_contacto.20.b: "Pedirle que enseñe su lengua a los jóvenes"
 gj_mundo_contacto.21.title: "El mapa del capitán"
 gj_mundo_contacto.21.desc: "Un viejo capitán del Viejo Mundo ha dejado en el puerto un mapa de las costas del otro lado, con corrientes, vientos y fondeaderos. No lo ha regalado: pide a cambio su peso en sal."
 gj_mundo_contacto.21.a: "Pagarle y copiar el mapa para los pilotos"
 gj_mundo_contacto.21.b: "Venderlo a los mercaderes del puerto"
