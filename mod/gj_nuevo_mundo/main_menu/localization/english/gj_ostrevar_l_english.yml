 gj_ostrevar.41.title: "Las guerras se alargan"
 gj_ostrevar.41.desc: "El Consejo de Piedra se queja: el Reino nació para construir y no para marchar. Cada conquista seguida de otra gasta lo que costó años levantar, y los gremios empiezan a preguntar para qué sirven tantas murallas si el rey nunca está en casa."
 gj_ostrevar.41.a: "Los gremios tienen razón"
