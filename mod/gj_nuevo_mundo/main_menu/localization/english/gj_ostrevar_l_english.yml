l_english:
 # Copia del castellano: esta parte no trae textos en ingles.
 gj_ostrevari: "Ostrevarios"
 gj_ostrevari_desc: "Hijos de los valles occidentales, constructores de ciudades de piedra y de ríos canalizados. Se les reconoce por su orgullo gremial y por no dejar nada sin medir."
 gj_ostrevari_language: "Ostrevario"
 gj_ostrevari_language_family: "Lenguas de los valles"
 gj_grupo_ostrevari: "Pueblos de los valles"
 gj_ostrevar_piedra_sobre_piedra: "Piedra sobre piedra"
 gj_ostrevar_piedra_sobre_piedra_desc: "Los primeros ostrevarios levantaron sus casas contra el viento de los desfiladeros, y aprendieron que lo que se construye despacio dura. Cada muro del Reino lleva la marca de quien lo alzó."
 gj_ostrevar_fueros_de_los_valles: "Fueros de los valles"
 gj_ostrevar_fueros_de_los_valles_desc: "Cada valle jura su fuero ante la Luz: quien trabaje un año y un día tras las murallas es vecino, no siervo. Las gentes del campo suben a las ciudades y las ciudades les enseñan a leer."
 gj_ostrevar_graneros_de_ladera: "Graneros de ladera"
 gj_ostrevar_graneros_de_ladera_desc: "Bancales sobre las laderas, graneros bajo los aleros y un cuenco de grano guardado para cada mal año. En Ostrevar nadie recuerda la última hambruna, porque nadie quiere repetirla."
 gj_ostrevar_guardia_de_calle: "La Guardia de la Calle"
 gj_ostrevar_guardia_de_calle_desc: "Los gremios pagan a sus propios guardias, con casaca del color de la torre. No saben marchar lejos, pero nadie los saca de su calle."
 gj_ostrevar_ballestas_del_gremio: "Ballestas del gremio"
 gj_ostrevar_ballestas_del_gremio_desc: "Los armeros de la Torre del Gremio ensayan una ballesta de palanca que cualquier tendero aprende a tensar en una tarde."
 gj_ostrevar_bombardas_de_muralla: "Bombardas de muralla"
 gj_ostrevar_bombardas_de_muralla_desc: "Las fundiciones de la ciudad baja vierten bronce en moldes de piedra y suben las bombardas a los adarves. Pesan demasiado para ir a ninguna parte, y por eso nunca se pierden."
 gj_ostrevar_la_cantera_del_reino: "La cantera del Reino"
 gj_ostrevar_la_cantera_del_reino_desc: "La gran cantera de la sierra abastece a todos los valles: sillares para las murallas, mármol para las plazas y ripio para los caminos."
 gj_ostrevar_carta_de_las_ciudades: "La Carta de las Ciudades"
 gj_ostrevar_carta_de_las_ciudades_desc: "El Alto Rey firma ante el Consejo la Carta que reconoce a los burgueses como segundo brazo del Reino. Desde ese día la torre del gremio y el estandarte real ondean a la misma altura."
 gj_ostrevar_escuela_de_canteros: "La Escuela de Canteros"
 gj_ostrevar_escuela_de_canteros_desc: "Aprendices de doce valles se forman en la Escuela con plomada, escuadra y cuerda. Sus maestros dicen que una ciudad bien trazada vale por un ejército."
 gj_ostrevar_arcos_del_mercado: "Los arcos del mercado"
 gj_ostrevar_arcos_del_mercado_desc: "Las plazas ostrevarias se rodean de soportales donde llueva o nieve se pesa, se prueba y se discute. El que compra bajo los arcos paga a gusto el arbitrio."
 gj_ostrevar_archivos_del_censo: "Los archivos del censo"
 gj_ostrevar_archivos_del_censo_desc: "Un escribano por barrio cuenta puertas, bocas y oficios. El Reino sabe cuánta gente tiene y dónde falta, y gobierna con cifras en lugar de rumores."
 gj_ostrevar_calles_empedradas: "Calles empedradas"
 gj_ostrevar_calles_empedradas_desc: "Ninguna ciudad ostrevaria tiene barro: el adoquín llega antes que la segunda planta. Quien llega del campo con una carreta encuentra camino hasta la puerta de su taller."
 gj_ostrevar_el_barrio_alto: "El Barrio Alto"
 gj_ostrevar_el_barrio_alto_desc: "Cuando falta suelo, se sube. Los ostrevarios apilan casas sobre casas con pasarelas entre los tejados, y la ciudad crece hacia el cielo sin pedir tierra a nadie."
 gj_ostrevar_acueductos_largos: "Acueductos largos"
 gj_ostrevar_acueductos_largos_desc: "Treinta leguas de arcos traen el agua limpia de la sierra. Se acabaron las fiebres del pozo y los vecinos hablan de sus acueductos como otros hablan de sus santos."
 gj_ostrevar_imprenta_de_los_gremios: "La imprenta de los gremios"
 gj_ostrevar_imprenta_de_los_gremios_desc: "Los impresores se agrupan en gremio y lanzan tablillas, almanaques y cartillas por centenares. Quien no sabe leer en una ciudad ostrevaria es ya la excepción."
 gj_ostrevar_mercado_de_los_siete_puentes: "El mercado de los Siete Puentes"
 gj_ostrevar_mercado_de_los_siete_puentes_desc: "En la confluencia de los siete ríos se funda un mercado que no cierra jamás. Allí se fija el precio de la sal, del paño y del grano para todo el Reino."
 gj_ostrevar_la_ciudad_de_marmol: "La Ciudad de Mármol"
 gj_ostrevar_la_ciudad_de_marmol_desc: "La capital se reviste de mármol blanco hasta el último zócalo. Es vanidad, dicen los envidiosos; es mejor que cualquier moneda, responden los banqueros."
 gj_ostrevar_las_leyes_del_rio: "Las Leyes del Río"
 gj_ostrevar_las_leyes_del_rio_desc: "Los jueces de cada cuenca se reúnen cada diez años y reescriben las leyes con la crecida: cuanto más baja el agua, más se escribe. El Reino se rige por un único código y lo sabe de memoria."
 gj_ostrevar_cuerpos_de_ingenieros: "Cuerpos de ingenieros"
 gj_ostrevar_cuerpos_de_ingenieros_desc: "Los maestros de obras reciben grado militar. Un ingeniero ostrevario levanta un baluarte en una primavera y lo desmonta en otra, si hace falta."
 gj_ostrevar_lazaretos_de_valle: "Lazaretos de valle"
 gj_ostrevar_lazaretos_de_valle_desc: "Cada barrio alto tiene su lazareto con ventanas al norte y cal en las paredes. Las epidemias se encierran allí y no cruzan la calle."
 gj_ostrevar_manufacturas_del_valle: "Manufacturas del valle"
 gj_ostrevar_manufacturas_del_valle_desc: "Los talleres de los gremios se juntan bajo grandes bóvedas y mueven telares con la fuerza de los ríos. Producen más y cuestán menos, con la ayuda del agua de siempre."
 gj_ostrevar_urbanismo_ordenado: "Urbanismo ordenado"
 gj_ostrevar_urbanismo_ordenado_desc: "Planos, alineaciones, alcantarillas y plazas: el Consejo aprueba cada calle antes de que se abra. Las ciudades ostrevarias crecen como se escribe un buen párrafo."
 gj_ostrevar_el_tribunal_de_las_ciudades: "El Tribunal de las Ciudades"
 gj_ostrevar_el_tribunal_de_las_ciudades_desc: "Un tribunal propio resuelve los pleitos entre gremios sin molestar al rey. Cada sentencia lleva el sello de la ciudad y de la Corona."
 gj_ostrevar_la_metropoli: "La metrópoli"
 gj_ostrevar_la_metropoli_desc: "Las murallas se derriban y se trazan avenidas. De noche, las luces de la capital se ven desde tres valles."
 gj_ostrevar_la_fabrica_de_piedra: "La fábrica de piedra"
 gj_ostrevar_la_fabrica_de_piedra_desc: "Las viejas canteras se vuelven fábricas: sierras de agua, grúas de contrapeso y vagonetas sobre raíles de granito."
 gj_ostrevar_la_administracion_del_reino: "La administración del Reino"
 gj_ostrevar_la_administracion_del_reino_desc: "Una escuela de escribanos, un registro por cada oficio y una oficina de cuentas en cada valle. La burocracia ostrevaria se enseña como un arte."
 gj_ostrevari_hijos_de_la_piedra: "Hijos de la piedra"
 gj_ostrevari_hijos_de_la_piedra_desc: "En los valles ostrevarios, un niño recibe su primer cincel a los siete años y lo conserva hasta la tumba. La piedra no es un oficio: es una lengua que todos hablan."
 gj_ostrevari_la_hospitalidad_del_vado: "La hospitalidad del vado"
 gj_ostrevari_la_hospitalidad_del_vado_desc: "Quien cruza el vado de un río ostrevario recibe pan y sal. Los forasteros se quedan; sus hijos hablan como los demás."
 gj_ostrevari_la_virtud_del_trabajo: "La virtud del trabajo"
 gj_ostrevari_la_virtud_del_trabajo_desc: "Un ostrevario honra al Fundador levantando algo que dure más que él. El día de descanso se dedica a mirar lo hecho."
 gj_ostrevar_carta_de_las_ciudades_reforma: "La Carta de las Ciudades (gobierno)"
 gj_ostrevar_carta_de_las_ciudades_reforma_desc: "Los burgueses ganan asiento en el Consejo y la población urbana rinde más para el tesoro. A cambio, la nobleza rural mira con recelo cada torre nueva."
 gj_ostrevar_consejo_de_piedra: "El Consejo de Piedra"
 gj_ostrevar_consejo_de_piedra_desc: "Un consejo permanente de gremios, jueces y señores se sienta en la Casa de las Leyes. Las decisiones son lentas y firmes como los sillares."
 gj_ostrevar_mancomunidad_de_los_valles: "La Mancomunidad de los Valles"
 gj_ostrevar_mancomunidad_de_los_valles_desc: "Cada valle elige delegados al Consejo y el Alto Rey se convierte en el primer ciudadano de una federación de ciudades."
 gj_ostrevar_torre_gremio: "Torre del Gremio"
 gj_ostrevar_torre_gremio_desc: "La torre donde los gremios de la ciudad guardan sus cuentas, sus patrones y su bandera. Mientras más gremios, más alta la torre; mientras más alta, más lejos llega su voz."
 gj_ostrevar_torre_gremio_mantenimiento: "Mantenimiento de Torre del Gremio"
 gj_ostrevar_barrio_alto: "Barrio Alto"
 gj_ostrevar_barrio_alto_desc: "Casas sobre casas, pasarelas entre los tejados y escaleras que nadie ha contado. El Barrio Alto sólo se levanta donde hay gente de sobra para llenarlo."
 gj_ostrevar_barrio_alto_mantenimiento: "Mantenimiento de Barrio Alto"
 gj_ostrevar_acueducto_piedra: "Acueducto de Piedra"
 gj_ostrevar_acueducto_piedra_desc: "Arcos de sillar que bajan el agua de la sierra a las fuentes de la ciudad. Donde corre el agua limpia, la gente se queda y los hijos sobreviven."
 gj_ostrevar_acueducto_piedra_mantenimiento: "Mantenimiento de Acueducto de Piedra"
 gj_ostrevar_casa_del_censo: "Casa del Censo"
 gj_ostrevar_casa_del_censo_desc: "Un edificio austero donde un escribano por barrio cuenta puertas, bocas y oficios. Lo que no se cuenta no se gobierna, dicen en Ostrevar."
 gj_ostrevar_casa_del_censo_mantenimiento: "Mantenimiento de Casa del Censo"
 gj_ostrevar_canteria_real: "Cantería Real"
 gj_ostrevar_canteria_real_desc: "El taller de la Corona donde se tallan sillares para todo el Reino. Sus maestros sellan cada bloque con la marca de su cantera."
 gj_ostrevar_canteria_real_mantenimiento: "Mantenimiento de Cantería Real"
 GJ_OSTREVAR_NIVEL_ERA: "Avance de era de Ostrevar"
 a_gj_ostrevar_guardia_1: "Guardia de la Ciudad (I)"
 a_gj_ostrevar_guardia_2: "Guardia de la Ciudad (II)"
 a_gj_ostrevar_guardia_3: "Guardia de la Ciudad (III)"
 a_gj_ostrevar_guardia_4: "Guardia de la Ciudad (IV)"
