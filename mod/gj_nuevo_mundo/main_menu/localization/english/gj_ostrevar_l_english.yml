 gj_ostrevar_ev_inmigracion: "Oleada de forasteros"
 gj_ostrevar_ev_crecida: "Crecida del rio"
 gj_ostrevar_ev_incendio: "Incendio de la ciudad baja"
 gj_ostrevar_ev_lazareto: "Fiebres en los barrios altos"
 gj_ostrevar_llamada_activar: "Abrir la Llamada de las Ciudades"
 gj_ostrevar_llamada_activar_desc: "Los pregoneros recorren los valles: quien venga a trabajar a las ciudades del Reino tendra techo, oficio y fuero. Los vecinos sentirán que se les vacían los campos."
 gj_ostrevar_llamada_activar.a: "Que suenen las campanas"
 gj_ostrevar_llamada_apagar: "Cerrar la Llamada de las Ciudades"
 gj_ostrevar_llamada_apagar_desc: "Las ciudades están llenas y los campos reclaman brazos. Se cierran las puertas del reclamo."
 gj_ostrevar_llamada_apagar.a: "que callen las campanas"
 gj_ostrevar_primera_piedra: "Colocar la Primera Piedra"
 gj_ostrevar_primera_piedra_desc: "Un Alto Rey que se precie coloca una piedra de su mano en cada obra mayor. El gasto es grande, y también la fama."
 gj_ostrevar_primera_piedra.a: "Una obra para el Reino"
 gj_ostrevar_legado_final: "El último legado"
 gj_ostrevar_legado_final_desc: "El Reino mira atras y elige que dejará a quienes vengan después."
 gj_ostrevar_legado_final.a: "La ciudad de mármol"
 gj_ostrevar_legado_final.b: "La escuela de canteros"
 gj_ostrevar_legado_final.c: "Los graneros del Reino"
 gj_ostrevar.1.title: "La corona de los valles"
 gj_ostrevar.1.desc: "Cuando el último de los consejos de valle jura fidelidad, el Alto Rey recibe la corona en la plaza mayor de la ciudad más antigua. Los gremios han pagado la tarima; los señores del campo han traído sus estandartes. Los dos esperan que el nuevo soberano no olvide a quién debe el trono."
 gj_ostrevar.1.historical_info: "Ostrevar no nació de una conquista, sino de un pacto entre valles. La corona se coloca cada vez ante dos testigos: un cantero y un señor."
 gj_ostrevar.1.a: "Que los gremios sostengan la corona"
 gj_ostrevar.1.b: "Que la sostengan los señores del campo"
 gj_ostrevar.1.c: "Coronarse sin testigos, ante la Luz"
 gj_ostrevar.2.title: "El censo de los valles"
 gj_ostrevar.2.desc: "Un escribano de la corte pide permiso para contar a todos los habitantes del Reino: quién vive dónde, de qué trabaja y cuántos son. El tesorero se frota las manos; los señores arrugan la frente. Saber cuánta gente hay es el primer paso para pedirle impuestos."
 gj_ostrevar.2.historical_info: "Los primeros censos ostrevarios se escribían en tablillas de arcilla cocida y se guardaban en la cripta del Consejo."
 gj_ostrevar.2.a: "Contar todo: valles, ciudades y aldeas"
 gj_ostrevar.2.b: "Contar sólo las ciudades"
 gj_ostrevar.2.c: "Que cada valle cuente a los suyos"
 gj_ostrevar.3.title: "Los santos de la primera piedra"
 gj_ostrevar.3.desc: "En la capilla de los Fundadores, un sacerdote asegura que en los cimientos de la ciudad vieja yace el cuerpo de quien trazó sus calles. La gente quiere un nuevo santo: el que puso la primera piedra. El clero pide una canonización en toda regla; los gremios, una fiesta."
 gj_ostrevar.3.historical_info: "En la Luz de los Fundadores, los santos son quienes fundaron ciudades y las vieron prosperar."
 gj_ostrevar.3.a: "Canonizar al Fundador con toda solemnidad"
 gj_ostrevar.3.b: "Celebrar una fiesta, sin proceso"
 gj_ostrevar.3.c: "Dejar los huesos en paz"
 gj_ostrevar.4.title: "Los canteros piden más piedra"
 gj_ostrevar.4.desc: "El maestro mayor de la cantería llega al Consejo con las manos llenas de polvo blanco. Las obras se paran por falta de sillares, dice: la sierra tiene piedra, pero no hay brazos ni mulas para bajarla. Pide un impuesto de acarreo, o permiso para contratar a media comarca."
 gj_ostrevar.4.a: "Pagar el acarreo con el tesoro"
 gj_ostrevar.4.b: "Dejar que contraten a los campesinos"
 gj_ostrevar.4.c: "Esperar a la próxima primavera"
 gj_ostrevar.5.title: "Disputa en la Torre del Gremio"
 gj_ostrevar.5.desc: "Los herreros y los tejedores han llegado a las manos en el patio de la Torre. Unos dicen que el piso alto les corresponde por antigüedad; otros, que ellos pagaron la escalera. El portero ha mandado a avisar al Consejo."
 gj_ostrevar.5.a: "Zanjar con una sentencia salomónica"
 gj_ostrevar.5.b: "Dar la razón a los más ricos"
 gj_ostrevar.5.c: "Que se arreglen entre ellos"
 gj_ostrevar.6.title: "La crecida del río"
 gj_ostrevar.6.desc: "Tras tres semanas de lluvia, el río crece como una bestia y se lleva los puentes de madera. Las murallas de las ciudades bajas contienen el agua; los barrios del arrabal no han tenido esa suerte. Los ingenieros piden dinero para unos diques."
 gj_ostrevar.6.a: "Levantar diques de piedra"
 gj_ostrevar.6.b: "Reconstruir lo perdido sin más"
 gj_ostrevar.6.c: "Dejar que el río vuelva a su cauce"
 gj_ostrevar.7.title: "El año que sobró grano"
 gj_ostrevar.7.desc: "Un otoño espléndido llena los graneros hasta el techo. Los de ladera no caben más sacos; el tesorero propone vender el sobrante a los vecinos y los clérigos quieren repartirlo entre los pobres."
 gj_ostrevar.7.a: "Vender el grano a los vecinos"
 gj_ostrevar.7.b: "Repartirlo entre los pobres"
 gj_ostrevar.7.c: "Guardarlo para los años flacos"
 gj_ostrevar.8.title: "El Barrio Alto se levanta"
 gj_ostrevar.8.desc: "Un maestro de obras propone levantar tres pisos más sobre las casas del barrio viejo y unirlas con pasarelas. Los vecinos tienen miedo del vacío; los inversores, de perder la ocasión. Si sale bien, la ciudad crecerá sin pedir un palmo de campo."
 gj_ostrevar.8.a: "Apoyar la obra con fondos de la Corona"
 gj_ostrevar.8.b: "Dejarlo en manos de los gremios"
 gj_ostrevar.8.c: "Prohibir los pisos altos"
 gj_ostrevar.9.title: "Peregrinos al muro de los nombres"
 gj_ostrevar.9.desc: "En la plaza mayor hay un muro donde se graban los nombres de quienes levantaron algo para el Reino. Cada año llegan caravanas de peregrinos a pasar la mano por la piedra y encargar nuevas inscripciones. El párroco pregunta si ha de cobrar la piedra o ponerla gratis."
 gj_ostrevar.9.a: "Cobrar un diezmo por inscripción"
 gj_ostrevar.9.b: "Grabar los nombres gratis"
 gj_ostrevar.9.c: "Reservar el muro a los grandes constructores"
 gj_ostrevar.10.title: "Un forastero del este trae saberes"
 gj_ostrevar.10.desc: "Un hombre de piel curtida llega con una carreta de rollos y herramientas desconocidas. Dice venir de tierras que usted jamás ha oído nombrar y ofrece enseñar una forma distinta de tallar la piedra. En la corte hay quien lo toma por charlatán."
 gj_ostrevar.10.a: "Darle un taller y aprendices"
 gj_ostrevar.10.b: "Oírlo, y que se vaya"
 gj_ostrevar.10.c: "Echarlo con cajas destempladas"
 gj_ostrevar.11.title: "Gente nueva en la ciudad baja"
 gj_ostrevar.11.desc: "Los pregoneros de la Llamada de las Ciudades han tenido éxito: cada semana llegan carros con familias enteras. Las posadas están llenas; los barrios, a reventar. Alguien tendrá que decidir dónde se les aloja."
 gj_ostrevar.11.a: "Abrir el barrio nuevo extramuros"
 gj_ostrevar.11.b: "Alojarlos donde haya sitio"
 gj_ostrevar.11.c: "Cerrar las puertas esta temporada"
 gj_ostrevar.12.title: "Rencillas en la frontera de la estepa"
 gj_ostrevar.12.desc: "Un pastor trashumante ha cruzado la linde con sus rebaños y ha pisoteado un campo recién sembrado. Los aldeanos reclaman justicia; el gobernador de la frontera dice que no es la primera vez y que los de la estepa lo hacen a propósito."
 gj_ostrevar.12.a: "Exigir una multa en cabezas de ganado"
 gj_ostrevar.12.b: "Levantar un muro de piedra en la linde"
 gj_ostrevar.12.c: "Mirar hacia otro lado"
 gj_ostrevar.13.title: "El incendio de la ciudad baja"
 gj_ostrevar.13.desc: "Una vela olvidada en un taller de tejedores prende un incendio que devora media calle antes de que las bombas de agua lleguen. Las casas de madera ardieron como yesca; las de piedra, ni una sola. Desde entonces nadie discute al maestro de obras."
 gj_ostrevar.13.a: "Reconstruir todo en piedra"
 gj_ostrevar.13.b: "Reconstruir como antes, y barato"
 gj_ostrevar.13.c: "Ayudar a los damnificados y nada más"
 gj_ostrevar.14.title: "El maestro de los acueductos"
 gj_ostrevar.14.desc: "Un viejo ingeniero llegado de otra comarca ofrece sus planos para un acueducto que suba el agua hasta la ciudad alta sin una sola bomba. Es costoso y nadie lo ha probado; si funciona, será la envidia de los reinos vecinos."
 gj_ostrevar.14.a: "Financiar el acueducto por completo"
 gj_ostrevar.14.b: "Pedir contribución a las ciudades"
 gj_ostrevar.14.c: "Guardar los planos para otro reinado"
 gj_ostrevar.15.title: "Huelga de canteros"
 gj_ostrevar.15.desc: "Cuatrocientos canteros han dejado las herramientas en el suelo y se han sentado a la sombra de la muralla. Piden jornales justos y dos días de descanso cada semana. En las casas de los ricos, ya hay quien pide soldados."
 gj_ostrevar.15.a: "Conceder los jornales y el descanso"
 gj_ostrevar.15.b: "Mandar a la guardia"
 gj_ostrevar.15.c: "Negociar un término medio"
 gj_ostrevar.16.title: "La biblioteca de los Fundadores"
 gj_ostrevar.16.desc: "Un sacerdote anciano deja a la ciudad su colección de libros: relatos de fundaciones, planos antiguos, contabilidades de los primeros gremios. Pide que se abra a todo el que sepa leer. El obispo teme que la gente aprenda más de lo que debe."
 gj_ostrevar.16.a: "Abrirla al público"
 gj_ostrevar.16.b: "Reservarla al clero y a los gremios"
 gj_ostrevar.16.c: "Guardarla bajo llave en la cripta"
 gj_ostrevar.17.title: "Fiebres en los barrios altos"
 gj_ostrevar.17.desc: "Una fiebre pegajosa sube por las escaleras del Barrio Alto y se instala en las buhardillas. Los médicos piden cerrar las pasarelas; los comerciantes, que no se toque nada."
 gj_ostrevar.17.a: "Cerrar los barrios y levantar un lazareto"
 gj_ostrevar.17.b: "Dejar que la fiebre siga su curso"
 gj_ostrevar.17.c: "Pedir plegarias a los Fundadores"
 gj_ostrevar.18.title: "El arquitecto prodigio"
 gj_ostrevar.18.desc: "Un muchacho sin estudios dibuja en una pizarra una cúpula que ningún maestro se atreve a levantar. Los gremios dicen que es un portento; el maestro mayor, que es un insensato. El pueblo ya habla de él por las plazas."
 gj_ostrevar.18.a: "Financiar su obra"
 gj_ostrevar.18.b: "Hacerlo ayudante del maestro mayor"
 gj_ostrevar.18.c: "Dejar que busque fortuna lejos"
 gj_ostrevar.19.title: "Elecciónes del Consejo"
 gj_ostrevar.19.desc: "Se cumple el plazo para renovar a los consejeros de las ciudades. Las candidaturas son tantas que han tenido que agruparse en bancos. El Alto Rey puede dejar que decidan los gremios, que lo decida la nobleza o que se sorteen los puestos."
 gj_ostrevar.19.a: "Que voten los gremios"
 gj_ostrevar.19.b: "Que decida la nobleza"
 gj_ostrevar.19.c: "Sortear los puestos"
 gj_ostrevar.20.title: "La fiesta de la Primera Piedra"
 gj_ostrevar.20.desc: "Cada otoño, la ciudad se llena de guirnaldas y se corona al maestro del año con un casco de papel pintado. Hay torneos de albañiles, concursos de mortero y carreras de carretillas. Nadie recuerda por qué empezó, pero nadie quiere que acabe."
 gj_ostrevar.20.a: "Que se celebre con todo el esplendor"
 gj_ostrevar.20.b: "Una fiesta modesta"
 gj_ostrevar.20.c: "Suspender las fiestas este año"
 gj_ostrevar.30.title: "El legado de las Tradiciones"
 gj_ostrevar.30.desc: "Una era se cierra y el Reino se vuelve a mirar lo que ha hecho. Los cronistas registran los años de las Tradiciones: lo que creció, lo que se construyó, la paz que se guardó. Es hora de elegir qué recuerdo quedará grabado en la piedra para siempre."
 gj_ostrevar.30.historical_info: "Cada era deja al Reino un legado permanente, elegido entre lo que de verdad se hizo."
 gj_ostrevar.30.a: "Los Graneros del Reino: la población ha crecido"
 gj_ostrevar.30.b: "La Escuela de Canteros: se ha construido mucho"
 gj_ostrevar.30.c: "Las Leyes del Río: la paz ha sido larga"
 gj_ostrevar.30.d: "La Ciudad de Mármol: las ciudades son grandes"
