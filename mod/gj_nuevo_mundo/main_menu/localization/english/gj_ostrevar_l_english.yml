 gj_ostrevar_guardia_familia: "Guardia de la Ciudad"
 a_gj_ostrevar_guardia_1_desc: "Casaca del gremio y escudo de torre: nadie ha visto retroceder a una guardia ostrevaria dentro de sus muros, ni avanzar fuera de ellos."
 a_gj_ostrevar_guardia_2_desc: "Con la segunda leva se sumó la cota de malla remachada: la guardia ya sale a las puertas, no solo a las almenas."
 a_gj_ostrevar_guardia_3_desc: "Los capitanes del gremio adiestran por barrios. Cada calle manda una fila y cada fila conoce el nombre de sus vecinos."
 a_gj_ostrevar_guardia_4_desc: "Alabarda larga y coraza de placas del taller de la Torre. Aguanta el choque, pero cuesta cada paso ganarlo."
 a_gj_ostrevar_guardia_5_desc: "Las compañías de guardia desfilan en la plaza mayor cada primavera, y los extranjeros las cuentan antes de decidir si asaltar."
 a_gj_ostrevar_guardia_6_desc: "Cuerpo veterano de la Mancomunidad: escudo pavés, jubón acolchado y la orden de no ceder un portal."
 a_gj_ostrevar_ballesteros_1: "Ballesteros del Gremio (I)"
 a_gj_ostrevar_ballesteros_2: "Ballesteros del Gremio (II)"
 a_gj_ostrevar_ballesteros_3: "Ballesteros del Gremio (III)"
 a_gj_ostrevar_ballesteros_4: "Ballesteros del Gremio (IV)"
 a_gj_ostrevar_ballesteros_5: "Ballesteros del Gremio (V)"
 a_gj_ostrevar_ballesteros_6: "Ballesteros del Gremio (VI)"
 gj_ostrevar_ballesteros_familia: "Ballesteros del Gremio"
 a_gj_ostrevar_ballesteros_1_desc: "Tenderos y artesanos que aprendieron a tensar la ballesta de palanca: acierto de oficio, pero ningun entrenamiento para aguantar una carga."
 a_gj_ostrevar_ballesteros_2_desc: "El arco de acero de los talleres del gremio dobla el alcance, y los aprendices tiran por turnos sobre las murallas."
 a_gj_ostrevar_ballesteros_3_desc: "Los cuarteles del gremio premian la puntería: quien clava tres saetas en el blanco ingresa en la compañía."
 a_gj_ostrevar_ballesteros_4_desc: "Ballesta de cuerda trenzada y mantelete de madera: avanzan tras la pantalla, tiran y se refugian."
 a_gj_ostrevar_ballesteros_5_desc: "Compañías con paveses de campaña y ballestas de molinete, pagadas por los mercaderes del Consejo."
 a_gj_ostrevar_ballesteros_6_desc: "La flor del oficio: tiradores que recargan al compás y no fallan a los cien pasos."
 a_gj_ostrevar_artilleros_1: "Artilleros de Muralla (I)"
 a_gj_ostrevar_artilleros_2: "Artilleros de Muralla (II)"
 a_gj_ostrevar_artilleros_3: "Artilleros de Muralla (III)"
 a_gj_ostrevar_artilleros_4: "Artilleros de Muralla (IV)"
 a_gj_ostrevar_artilleros_5: "Artilleros de Muralla (V)"
 a_gj_ostrevar_artilleros_6: "Artilleros de Muralla (VI)"
 gj_ostrevar_artilleros_familia: "Artilleros de Muralla"
 a_gj_ostrevar_artilleros_1_desc: "Bombardas montadas sobre bancadas de piedra en los adarves. Nunca han salido de su ciudad y no sabrían como hacerlo."
 a_gj_ostrevar_artilleros_2_desc: "Piezas de bronce fundidas en la cantería, más manejables que las bombardas viejas, aunque aún pesadas de mover."
 a_gj_ostrevar_artilleros_3_desc: "Las dotaciones aprenden a medir el alza con tablas de piedra grabadas en los adarves."
 a_gj_ostrevar_artilleros_4_desc: "Cañones sobre cureñas de ruedas macizas: salen de la ciudad con escolta de ballesteros y mala gana."
 a_gj_ostrevar_artilleros_5_desc: "Baterías de campaña con pólvora granulada de la Casa del Censo, que anota cada barril que gastan."
 a_gj_ostrevar_artilleros_6_desc: "Artillería de sitio de la Mancomunidad: lenta, cara y capaz de abrir cualquier muralla que no sea la suya."
