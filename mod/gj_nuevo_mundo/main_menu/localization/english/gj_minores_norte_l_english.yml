 # ===== Avances de estilo: ciudad-estado =====
 gj_minores_norte_ce_puentes_y_gremios: "Puentes y gremios"
 gj_minores_norte_ce_puentes_y_gremios_desc: "Una ciudad que vive de un vado aprende pronto que quien tiende el puente cobra, y que quien lo repara manda. Los gremios de albañiles y de carpinteros de ribera se reparten las obras y se vigilan unos a otros."
 gj_minores_norte_ce_carta_de_franquicias: "Carta de franquicias"
 gj_minores_norte_ce_carta_de_franquicias_desc: "El consejo de la ciudad pone por escrito lo que antes se pactaba de palabra: quién pesa, quién sella y quién responde si la mercancía llega mojada. Desde hoy se puede levantar la Lonja de Pesas."
 gj_minores_norte_ce_milicia_de_barrio: "Milicia de barrio"
 gj_minores_norte_ce_milicia_de_barrio_desc: "Cada barrio arma a sus vecinos y los saca a la muralla cuando suena la campana. No ganan guerras fuera de casa, pero en casa son muy difíciles de echar."

 # ===== Avances de estilo: clan =====
 gj_minores_norte_cl_juramento_de_hogar: "Juramento de hogar"
 gj_minores_norte_cl_juramento_de_hogar_desc: "Todo el que come del mismo fuego se debe al mismo fuego. Cuando el cuerno llama, no hace falta dar órdenes: la casa entera sale al camino."
 gj_minores_norte_cl_fuego_comun: "El fuego común"
 gj_minores_norte_cl_fuego_comun_desc: "Las familias del clan encienden un solo fuego en tiempos de escasez y reparten lo que hay. Se come menos, pero no se muere nadie."
 gj_minores_norte_cl_hijos_del_clan: "Hijos del clan"
 gj_minores_norte_cl_hijos_del_clan_desc: "Quien crece bajo nuestro techo y jura nuestro fuego es del clan, venga de donde venga. Los forasteros se vuelven parientes más deprisa que en ningún otro sitio."

 # ===== Avances de estilo: marca =====
 gj_minores_norte_ma_atalaya: "Atalaya"
 gj_minores_norte_ma_atalaya_desc: "En cada cerro, una torre; en cada torre, una hoguera seca y alguien que no duerme. Desde hoy se pueden levantar Atalayas de Marca."
 gj_minores_norte_ma_guardia_de_marca_1: "Guardia de Marca"
 gj_minores_norte_ma_guardia_de_marca_1_desc: "Hombres de paso y de relevo, con escudo alto y paciencia larga. Aguantan mejor de lo que atacan, y lo saben."
 gj_minores_norte_ma_guardia_de_marca_2: "Guardia de Marca: la pica"
 gj_minores_norte_ma_guardia_de_marca_2_desc: "La Guardia cierra filas detrás de picas largas y de las primeras armas de fuego. Sigue siendo lenta, pero rompe pocas veces."
 gj_minores_norte_ma_guardia_de_marca_3: "Guardia de Marca: el fusil"
 gj_minores_norte_ma_guardia_de_marca_3_desc: "El fusil llega a las atalayas. Los guardias descargan desde detrás de los muros y no se mueven aunque los rodeen."
 gj_minores_norte_ma_guardia_de_marca_4: "Guardia de Marca: la línea"
 gj_minores_norte_ma_guardia_de_marca_4_desc: "Los antiguos guardias de paso se forman en línea de batalla sin perder el hábito de plantar los pies y no ceder ni un palmo."

 # ===== Avances de cultura =====
 gj_minores_norte_tarnavi_cien_puentes: "Los cien puentes"
 gj_minores_norte_tarnavi_cien_puentes_desc: "Tarnavia no tiene calles: tiene puentes, y cada puente tiene su cofradía. Construir en lo alto de lo ya construido es el oficio de la ciudad."
 gj_minores_norte_tarnavi_notarios_del_vado: "Notarios del vado"
 gj_minores_norte_tarnavi_notarios_del_vado_desc: "Un cuerpo de notarios que no responde ante ningún príncipe redacta, sella y archiva. La ciudad gobierna con papel más que con espadas."
 gj_minores_norte_nenvari_linternas: "Linternas del lago"
 gj_minores_norte_nenvari_linternas_desc: "Cada barca nenvari lleva una linterna de vidrio verde que se ve desde la otra orilla. Los pilotos se reconocen por el color de su luz."
 gj_minores_norte_nenvari_cartas_de_hielo: "Cartas de hielo"
 gj_minores_norte_nenvari_cartas_de_hielo_desc: "Los cartógrafos de la Cofradía dibujan el lago en invierno y en verano, porque no es el mismo. Sus cartas se venden más caras que las espadas."
 gj_minores_norte_isbranti_salazon: "Salazón de Isbrant"
 gj_minores_norte_isbranti_salazon_desc: "Un pescado salado a la manera isbranta aguanta un invierno entero en el fondo de una bodega. Con eso se alimenta una ciudad y se compra otra."
 gj_minores_norte_isbranti_hansa_sin_dueno: "Hansa sin dueño"
 gj_minores_norte_isbranti_hansa_sin_dueno_desc: "Isbrant no jura a nadie y comercia con todos, incluso con quienes se odian entre sí. Cada bando cree que es su mejor cliente."
 gj_minores_norte_hondarri_vetas_cerradas: "Vetas cerradas"
 gj_minores_norte_hondarri_vetas_cerradas_desc: "El clan no vende el mineral crudo: lo funde en casa y exporta barras selladas. Nadie sabe dónde están las minas, y así es como debe ser."
 gj_minores_norte_hondarri_galerias_de_defensa: "Galerías de defensa"
 gj_minores_norte_hondarri_galerias_de_defensa_desc: "Cada mina tiene su segunda salida y su tercera trampa. Un ejército que entra a buscar el tesoro del clan sale pocas veces por donde entró."
 gj_minores_norte_aryuki_pozos_y_rebanos: "Pozos y rebaños"
 gj_minores_norte_aryuki_pozos_y_rebanos_desc: "Los tres pozos de la horda marcan el calendario: se pasta aquí en primavera, allí en verano y en el último cuando llega la helada."
 gj_minores_norte_aryuki_levas_de_pozo: "Levas de pozo"
 gj_minores_norte_aryuki_levas_de_pozo_desc: "Quien bebe de un pozo de la horda le debe un jinete cada vez que suena el cuerno. Es un tributo que nadie recuerda haber discutido."
 gj_minores_norte_marismeno_pasos_de_turba: "Pasos de turba"
 gj_minores_norte_marismeno_pasos_de_turba_desc: "Los marismeños tienen sendas que solo ellos ven. Un ejército que las siga sin guía se hunde hasta la cintura y pierde la mitad de sus carros."
 gj_minores_norte_marismeno_ganso_y_niebla: "Ganso y niebla"
 gj_minores_norte_marismeno_ganso_y_niebla_desc: "La caza de ganso gris y la pesca de anguila se hacen con niebla, y quien no sabe leerla no vuelve. Los forasteros pagan bien por plumas y por silencio."
 gj_minores_norte_vigiano_fuegos_de_aviso: "Fuegos de aviso"
 gj_minores_norte_vigiano_fuegos_de_aviso_desc: "Tres fuegos significan jinetes; cuatro, un ejército. En una noche clara, el aviso llega de un extremo de la Marca al otro antes de que el enemigo termine de cenar."
 gj_minores_norte_vigiano_pasos_cerrados: "Cerrojo de la Cañada"
 gj_minores_norte_vigiano_pasos_cerrados_desc: "La Marca no defiende sus tierras: defiende los pasos que llevan a ellas. Lo demás se puede perder y recuperar."
 gj_minores_norte_cenizario_oficio_de_difuntos: "Oficio de difuntos"
 gj_minores_norte_cenizario_oficio_de_difuntos_desc: "El Capítulo entierra a quien nadie entierra, y lo hace bien: hondo, con sal y con ceniza. Las enfermedades que salen de los muertos no salen de sus tumbas."
 gj_minores_norte_cenizario_fuego_lento: "Fuego lento"
 gj_minores_norte_cenizario_fuego_lento_desc: "Cada hermano del Capítulo aprende a leer y a contar, porque un registro de difuntos mal llevado deja a un muerto sin descanso. Esa disciplina se contagia al resto del país."

 # ===== Unidades =====
 gj_minores_norte_guardia_de_marca_1: "Guardia de Marca"
 gj_minores_norte_guardia_de_marca_1_desc: "Infantería de paso con escudo alto. Sufre menos daño y se rompe menos, pero causa menos, avanza despacio y cuesta más formarla. Solo se recluta en tierras de marca. Es fuerte en colinas y montañas."
 gj_minores_norte_guardia_de_marca_2: "Guardia de Marca (pica)"
 gj_minores_norte_guardia_de_marca_2_desc: "La Guardia de la segunda era, con picas y primeras armas de fuego. Mantiene su debilidad: lenta, cara y poco ofensiva. Solo se recluta en tierras de marca."
 gj_minores_norte_guardia_de_marca_3: "Guardia de Marca (fusil)"
 gj_minores_norte_guardia_de_marca_3_desc: "La Guardia con fusil, tras los muros de la atalaya. Sigue siendo lenta, cara y poco ofensiva. Solo se recluta en tierras de marca."
 gj_minores_norte_guardia_de_marca_4: "Guardia de Marca (línea)"
 gj_minores_norte_guardia_de_marca_4_desc: "La Guardia en línea de batalla. Sigue siendo lenta, cara y poco ofensiva. Solo se recluta en tierras de marca."

 # ===== Edificios =====
 gj_minores_norte_lonja_de_pesas: "Lonja de Pesas"
 gj_minores_norte_lonja_de_pesas_desc: "Casa donde se pesa, se sella y se firma el comercio de una ciudad-estado. Solo un nivel, solo en ciudades de cultura tarnavia, nenvari o isbranta."
 gj_minores_norte_atalaya_de_marca: "Atalaya de Marca"
 gj_minores_norte_atalaya_de_marca_desc: "Torre de fuego y de aviso en un paso o en un cerro. Solo un nivel, solo en tierras de cultura vigiana o cenizaria."

 # ===== Modificadores =====
 STATIC_MODIFIER_NAME_gj_minores_norte_peaje_libre: "Peaje libre"
 STATIC_MODIFIER_DESC_gj_minores_norte_peaje_libre: "Durante unos años el puente no cobra, y los mercaderes dan la vuelta para pasar por aquí."
 STATIC_MODIFIER_NAME_gj_minores_norte_gremio_en_ruinas: "Gremio en ruinas"
 STATIC_MODIFIER_DESC_gj_minores_norte_gremio_en_ruinas: "La quiebra de un gremio deja obras a medias y deudas sin cobrar."
 STATIC_MODIFIER_NAME_gj_minores_norte_pesas_honradas: "Pesas honradas"
 STATIC_MODIFIER_DESC_gj_minores_norte_pesas_honradas: "La fama de pesar justo atrae a los mercaderes y llena el erario."
 STATIC_MODIFIER_NAME_gj_minores_norte_cuarentena: "Cuarentena del barrio bajo"
 STATIC_MODIFIER_DESC_gj_minores_norte_cuarentena: "Se aísla a los enfermos. Se come peor, pero se enferma menos."
 STATIC_MODIFIER_NAME_gj_minores_norte_cronica_viva: "Crónica viva"
 STATIC_MODIFIER_DESC_gj_minores_norte_cronica_viva: "Un cronista pagado cuenta la ciudad a quien quiera oírla, y la ciudad sale ganando."
 STATIC_MODIFIER_NAME_gj_minores_norte_sello_de_la_ciudad: "Sello de la ciudad"
 STATIC_MODIFIER_DESC_gj_minores_norte_sello_de_la_ciudad: "El sello de la ciudad en un saco de grano vale más que la firma de un príncipe."
 STATIC_MODIFIER_NAME_gj_minores_norte_feria_abierta: "Feria de los puentes"
 STATIC_MODIFIER_DESC_gj_minores_norte_feria_abierta: "Los puentes se cubren de puestos y de toldos, y la ciudad entera se vuelve mercado."
 STATIC_MODIFIER_NAME_gj_minores_norte_puente_cien: "El puente número cien"
 STATIC_MODIFIER_DESC_gj_minores_norte_puente_cien: "Hemos cerrado la cuenta de los puentes. Los albañiles caminan con la cabeza alta."
 STATIC_MODIFIER_NAME_gj_minores_norte_faro_eterno: "La luz que no se apaga"
 STATIC_MODIFIER_DESC_gj_minores_norte_faro_eterno: "Los barqueros juran que el faro de la Cofradía guía incluso a las barcas que ya no existen."
 STATIC_MODIFIER_NAME_gj_minores_norte_salmuera: "Salmuera de Isbrant"
 STATIC_MODIFIER_DESC_gj_minores_norte_salmuera: "Las deudas de los salineros se han saldado y las pilas trabajan a pleno rendimiento."
 STATIC_MODIFIER_NAME_gj_minores_norte_hogar_encendido: "Hogar encendido"
 STATIC_MODIFIER_DESC_gj_minores_norte_hogar_encendido: "El fuego común arde otra vez, y las casas del clan se acuerdan de quiénes son."
 STATIC_MODIFIER_NAME_gj_minores_norte_hogar_apagado: "Hogar apagado"
 STATIC_MODIFIER_DESC_gj_minores_norte_hogar_apagado: "Se ha dejado morir el fuego común. Nadie quiere hablar de ello."
 STATIC_MODIFIER_NAME_gj_minores_norte_pleito_de_pozos: "Pleito de pozos"
 STATIC_MODIFIER_DESC_gj_minores_norte_pleito_de_pozos: "Dos familias se disputan un pozo a pedradas, y cada una cuenta con sus jinetes."
 STATIC_MODIFIER_NAME_gj_minores_norte_invierno_largo: "Invierno largo"
 STATIC_MODIFIER_DESC_gj_minores_norte_invierno_largo: "La nieve no se va. Los rebaños adelgazan y los niños también."
 STATIC_MODIFIER_NAME_gj_minores_norte_ancianos_oidos: "Se oyó a los ancianos"
 STATIC_MODIFIER_DESC_gj_minores_norte_ancianos_oidos: "Los viejos del clan han hablado y se les ha hecho caso. Es más fácil gobernar así."
 STATIC_MODIFIER_NAME_gj_minores_norte_sangre_vengada: "Sangre vengada"
 STATIC_MODIFIER_DESC_gj_minores_norte_sangre_vengada: "Se ha cobrado la deuda de sangre. Los guerreros del clan marchan con el pecho alto."
 STATIC_MODIFIER_NAME_gj_minores_norte_clanes_reunidos: "Clanes reunidos"
 STATIC_MODIFIER_DESC_gj_minores_norte_clanes_reunidos: "Todas las casas han sentado a su jefe en el mismo círculo. Por un tiempo hablan con una sola voz."
 STATIC_MODIFIER_NAME_gj_minores_norte_fuego_mayor: "El Fuego Mayor"
 STATIC_MODIFIER_DESC_gj_minores_norte_fuego_mayor: "Un fuego que se ve desde tres valles. Quien lo mira recuerda de quién es hijo."
 STATIC_MODIFIER_NAME_gj_minores_norte_veta_que_canta: "La veta que canta"
 STATIC_MODIFIER_DESC_gj_minores_norte_veta_que_canta: "Los mineros del clan afirman que la piedra les habla. Extraen más, y nadie les pregunta qué dice."
 STATIC_MODIFIER_NAME_gj_minores_norte_tres_pozos: "Los tres pozos"
 STATIC_MODIFIER_DESC_gj_minores_norte_tres_pozos: "Los rebaños de la horda se han reunido en torno a los tres pozos y los jinetes han vuelto al redil."
 STATIC_MODIFIER_NAME_gj_minores_norte_niebla_viva: "Niebla viva"
 STATIC_MODIFIER_DESC_gj_minores_norte_niebla_viva: "Dicen que la niebla de la marisma elige a quién deja pasar. Los invasores no suelen ser sus favoritos."
 STATIC_MODIFIER_NAME_gj_minores_norte_guardia_alerta: "Guardia alerta"
 STATIC_MODIFIER_DESC_gj_minores_norte_guardia_alerta: "Las atalayas están llenas y los relevos, puntuales."
 STATIC_MODIFIER_NAME_gj_minores_norte_paso_nevado: "Paso nevado"
 STATIC_MODIFIER_DESC_gj_minores_norte_paso_nevado: "La nieve ha cerrado el paso. Ni el comercio ni los ejércitos se mueven."
 STATIC_MODIFIER_NAME_gj_minores_norte_refugiados_del_hielo: "Refugiados del hielo"
 STATIC_MODIFIER_DESC_gj_minores_norte_refugiados_del_hielo: "Familias enteras han bajado del norte con lo puesto. Traen brazos, hambre y noticias que nadie quiere oír."
 STATIC_MODIFIER_NAME_gj_minores_norte_ronda_de_difuntos: "Ronda de difuntos"
 STATIC_MODIFIER_DESC_gj_minores_norte_ronda_de_difuntos: "Se han sellado las puertas y se reza por los que no descansan."
 STATIC_MODIFIER_NAME_gj_minores_norte_relevo_ejemplar: "Relevo ejemplar"
 STATIC_MODIFIER_DESC_gj_minores_norte_relevo_ejemplar: "Los reclutas nuevos aprenden de los veteranos en la misma garita. La guardia no ha perdido el paso."
 STATIC_MODIFIER_NAME_gj_minores_norte_atalayas_encadenadas: "Atalayas encadenadas"
 STATIC_MODIFIER_DESC_gj_minores_norte_atalayas_encadenadas: "De un extremo a otro de la Marca, cada fuego se ve desde el siguiente."
 STATIC_MODIFIER_NAME_gj_minores_norte_paso_cerrado: "Paso cerrado"
 STATIC_MODIFIER_DESC_gj_minores_norte_paso_cerrado: "Se ha atrancado el paso por decreto. Pasa menos gente, para bien y para mal."
 STATIC_MODIFIER_NAME_gj_minores_norte_torre_que_habla: "La torre que habla"
 STATIC_MODIFIER_DESC_gj_minores_norte_torre_que_habla: "El eco de una atalaya devuelve palabras que nadie dijo. Quienes las escuchan negocian mejor."
 STATIC_MODIFIER_NAME_gj_minores_norte_entierro_imposible: "El entierro imposible"
 STATIC_MODIFIER_DESC_gj_minores_norte_entierro_imposible: "El Capítulo ha cumplido con un rito que parecía imposible, y el país entero lo sabe."
 STATIC_MODIFIER_NAME_gj_minores_norte_barrio_bajo_enfermo: "Fiebre en el barrio bajo"
 STATIC_MODIFIER_DESC_gj_minores_norte_barrio_bajo_enfermo: "Las casas junto al río huelen a vinagre y a miedo."
 STATIC_MODIFIER_NAME_gj_minores_norte_puente_nuevo: "El puente nuevo"
 STATIC_MODIFIER_DESC_gj_minores_norte_puente_nuevo: "Un puente recién estrenado, con su cofradía y su sello. Se pasa, se compra y se vende más."

 # ===== Eventos de estilo: ciudad-estado =====
 gj_minores_norte.1.title: "Los notarios del puente"
 gj_minores_norte.1.desc: "Los notarios que cobran el peaje del puente mayor traen una queja: los carreteros pasan de noche para no pagar, y los que pagan se sienten tontos. Proponen subir la tarifa o abolirla por una temporada y ver qué pasa."
 gj_minores_norte.1.a: "Que paguen todos, y más."
 gj_minores_norte.1.b: "Un año de paso libre."
 gj_minores_norte.2.title: "Quiebra de un gremio"
 gj_minores_norte.2.desc: "El gremio de los toneleros se ha hundido por una mala cosecha de mimbre y una deuda con tres casas de cambio. Los maestros piden al consejo que cubra el agujero antes de que arrastren a los demás."
 gj_minores_norte.2.a: "Cubrir la deuda con el tesoro de la ciudad."
 gj_minores_norte.2.b: "Que cada gremio cuide de sí mismo."
 gj_minores_norte.3.title: "El consejo de las pesas"
 gj_minores_norte.3.desc: "Llega la inspección anual de las pesas. Un pesador ha hecho un hallazgo: las balanzas de la lonja pesan un poco de más en favor de la casa. Nadie se ha quejado todavía."
 gj_minores_norte.3.a: "Corregirlas y publicar la corrección."
 gj_minores_norte.3.b: "Dejarlo como está y callar."
 gj_minores_norte.4.title: "Mercenarios a la puerta"
 gj_minores_norte.4.desc: "Una compañía de ballesteros sin amo acampa fuera de las murallas. Su capitán ofrece contratos por tres años y garantiza que sus hombres no saquean lo que cobran por guardar."
 gj_minores_norte.4.a: "Contratarlos y pagarles bien."
 gj_minores_norte.4.b: "Cerrar las puertas y que sigan su camino."
 gj_minores_norte.5.title: "Fiebre en el barrio bajo"
 gj_minores_norte.5.desc: "Han aparecido enfermos en las casas junto al río. Los físicos aconsejan aislar el barrio; los tenderos, no cerrar el mercado. El consejo está dividido y la fiebre, no."
 gj_minores_norte.5.a: "Aislar el barrio y pagar a los vecinos."
 gj_minores_norte.5.b: "Dejar el mercado abierto."
 gj_minores_norte.6.title: "El cronista de la ciudad"
 gj_minores_norte.6.desc: "Un cronista joven se ofrece a escribir la historia de la ciudad con sus gremios, sus puentes y sus pleitos. Pide casa, tinta y que no le corrijan lo que no le guste."
 gj_minores_norte.6.a: "Pagarle y dejarle escribir."
 gj_minores_norte.6.b: "Una ciudad que cuenta su historia se hace enemigos."

 # ===== Eventos de estilo: clan =====
 gj_minores_norte.7.title: "El fuego común se apaga"
 gj_minores_norte.7.desc: "En la noche más fría, el fuego común de la casa mayor se ha apagado. Algunos lo toman por un mal presagio; otros, por descuido de un muchacho. Los ancianos esperan a ver qué hace el jefe."
 gj_minores_norte.7.a: "Encenderlo de nuevo con el rito completo."
 gj_minores_norte.7.b: "Vender la leña sagrada y encender uno nuevo sin ceremonia."
 gj_minores_norte.8.title: "Pleito de pozos y pastos"
 gj_minores_norte.8.desc: "Dos familias del clan se disputan un pozo y los pastos que lo rodean. Cada una trae testigos, y cada una asegura que el pozo lo cavó su abuelo."
 gj_minores_norte.8.a: "Que decidan los ancianos."
 gj_minores_norte.8.b: "Que se enfrenten, y que gane el que sepa pelear."
 gj_minores_norte.9.title: "El hijo del jefe vuelve"
 gj_minores_norte.9.desc: "El hijo menor del jefe regresa tras años en tierras ajenas. Trae un caballo flaco, un cuaderno lleno de dibujos y ideas que a los ancianos les parecen una afrenta."
 gj_minores_norte.9.a: "Escucharle y aprovechar lo que sabe."
 gj_minores_norte.9.b: "Que se calle y coma con los demás."
 gj_minores_norte.10.title: "Un invierno largo"
 gj_minores_norte.10.desc: "La nieve lleva cuatro meses sin ceder. Los rebaños adelgazan y las reservas se acaban. El consejo del clan plantea sacrificar la mitad de las bestias o pedir ayuda a los vecinos."
 gj_minores_norte.10.a: "Sacrificar los rebaños y vender la carne."
 gj_minores_norte.10.b: "Pedir ayuda, aunque cueste el orgullo."
 gj_minores_norte.11.title: "Los ancianos del clan"
 gj_minores_norte.11.desc: "Los ancianos piden hablar en pleno. Dicen que el clan se aleja de sus costumbres y que el jefe decide demasiado deprisa. Hablan sin enojo, que es peor."
 gj_minores_norte.11.a: "Escucharlos y gobernar con su consejo."
 gj_minores_norte.11.b: "Agradecerles y seguir como hasta ahora."
 gj_minores_norte.12.title: "Caravana de forasteros"
 gj_minores_norte.12.desc: "Una caravana de forasteros pide paso. Traen sal, telas y relatos de países lejanos. Dicen que pagarán lo que se les pida si se les deja acampar tres noches."
 gj_minores_norte.12.a: "Comerciar con ellos y aprender lo que cuenten."
 gj_minores_norte.12.b: "Darles agua y despedirlos al amanecer."
 gj_minores_norte.13.title: "Venganza de sangre"
 gj_minores_norte.13.desc: "Hace una generación, una casa del clan mató a un hombre de otra. La deuda sigue en pie. Esta primavera, el nieto del muerto ha jurado cobrarla ante todo el clan."
 gj_minores_norte.13.a: "Que se cobre la sangre."
 gj_minores_norte.13.b: "Pagar el precio de sangre con el tesoro del clan."

 # ===== Eventos de estilo: marca =====
 gj_minores_norte.14.title: "El fuego de aviso"
 gj_minores_norte.14.desc: "Esta noche ha ardido la hoguera de la Atalaya Tercera: tres fuegos, jinetes. Se ha movilizado la guardia de media Marca, y al amanecer se ha visto que eran pastores trashumantes con muchas ovejas."
 gj_minores_norte.14.a: "Premiar a la guardia, porque el aviso funcionó."
 gj_minores_norte.14.b: "Castigar al vigía que dio la alarma sin comprobar."
 gj_minores_norte.15.title: "El paso nevado"
 gj_minores_norte.15.desc: "Una nevada fuera de temporada ha cerrado el paso principal. Los comerciantes se quejan, las patrullas no pueden salir y la guardia propone despejarlo a pala, a costa del erario."
 gj_minores_norte.15.a: "Pagar a las cuadrillas y abrir el paso."
 gj_minores_norte.15.b: "Esperar a que el deshielo haga el trabajo."
 gj_minores_norte.16.title: "Refugiados del hielo"
 gj_minores_norte.16.desc: "Familias enteras han bajado del norte, con los niños en trineos y los ancianos en mulas. Dicen que algo se mueve en el hielo y que no volverán. La guardia no sabe si acogerlos o devolverlos."
 gj_minores_norte.16.a: "Acogerlos y repartirlos por las atalayas."
 gj_minores_norte.16.b: "Devolverlos al camino, con provisiones."
 gj_minores_norte.17.title: "La ronda de los muertos"
 gj_minores_norte.17.desc: "Los vigías juran haber visto, a medianoche, una fila de figuras que caminaban junto al muro sin proyectar sombra. Los sacerdotes piden ritos; los capitanes, flechas."
 gj_minores_norte.17.a: "Salir con las armas y acabar con ellas."
 gj_minores_norte.17.b: "Cerrar las puertas y rezar hasta que amanezca."
 gj_minores_norte.18.title: "El relevo de la guardia"
 gj_minores_norte.18.desc: "Los veteranos de la guardia se acercan a los cuarenta años de servicio. Los nuevos reclutas son muchos, y no se parecen a ellos. Hay que decidir cómo se hace el relevo."
 gj_minores_norte.18.a: "Un relevo escalonado, con cuarteles y soldadas nuevas."
 gj_minores_norte.18.b: "Todo se hace como siempre se ha hecho."

 # ===== Eventos propios de cada menor =====
 gj_minores_norte.19.title: "Tarnavia: el puente número cien"
 gj_minores_norte.19.desc: "Los albañiles han acabado el puente que faltaba. La ciudad cuenta ya cien puentes, y hay que decidir cómo celebrarlo: una inauguración de las que se recuerdan o una ceremonia modesta y el ahorro para la próxima crecida."
 gj_minores_norte.19.a: "Una fiesta de tres días, con sello y bandera."
 gj_minores_norte.19.b: "Una misa breve, y a trabajar."
 gj_minores_norte.20.title: "Nenvar: la luz que no se apaga"
 gj_minores_norte.20.desc: "El faro de la Cofradía lleva doscientos años encendido, y el aceite escasea. Los fareros proponen comprar más aceite o apagarlo una noche al mes para ahorrar. Pero nadie en el lago recuerda una noche sin luz."
 gj_minores_norte.20.a: "Pagar el aceite: la luz no se apaga."
 gj_minores_norte.20.b: "Que se apague una noche al mes y se ahorre."
 gj_minores_norte.21.title: "Isbrant: salmuera y deudas"
 gj_minores_norte.21.desc: "Los salineros de Isbrant deben dinero a una casa de cambio. El prestamista ofrece perdonar la deuda si la ciudad le cede el monopolio de la sal durante diez años."
 gj_minores_norte.21.a: "Pagar la deuda y quedarse con la sal."
 gj_minores_norte.21.b: "Embargar los barriles del prestamista antes de que se vaya."
 gj_minores_norte.22.title: "Hondarri: la veta que canta"
 gj_minores_norte.22.desc: "Una galería nueva ha dado con una veta que resuena como una campana. Los mineros se niegan a seguir cavando: dicen que la piedra les habla. El capataz promete duplicar la paga."
 gj_minores_norte.22.a: "Seguir cavando; el clan se hará rico."
 gj_minores_norte.22.b: "Sellar la galería y hacer un rito de agradecimiento."
 gj_minores_norte.23.title: "Aryuki: los tres pozos"
 gj_minores_norte.23.desc: "Es el día en que los tres pozos del Aryuki dan agua al mismo tiempo, algo que ocurre cada treinta años. Los jefes de los clanes han llegado de todas partes y esperan una señal."
 gj_minores_norte.23.a: "Reunir a todos junto al pozo mayor."
 gj_minores_norte.23.b: "Poner guardia en cada pozo y volver a casa."
 gj_minores_norte.24.title: "Marisma: la niebla se lleva un ejército"
 gj_minores_norte.24.desc: "Una columna de forasteros entró en la marisma una mañana de niebla y no ha salido. Los ancianos dicen que fue cosa de la niebla; los jóvenes, que fue cosa de las sendas. Ambos miran al jefe."
 gj_minores_norte.24.a: "Cantar la canción de la niebla en agradecimiento."
 gj_minores_norte.24.b: "Pagar a los guías por no decir cómo se hizo."
 gj_minores_norte.25.title: "Vigía Alto: la torre que habla"
 gj_minores_norte.25.desc: "Desde hace tres noches, la atalaya mayor devuelve el eco de voces que no pertenecen a nadie. Los vigías tienen miedo. El jefe de la guardia tiene una idea: anotar lo que dicen."
 gj_minores_norte.25.a: "Anotar todas las voces y estudiarlas."
 gj_minores_norte.25.b: "Tapiar la torre y ordenar silencio."
 gj_minores_norte.26.title: "Capítulo de Ceniza: el entierro imposible"
 gj_minores_norte.26.desc: "Una aldea del norte pide al Capítulo que entierre a doscientos muertos de una sola noche. No hay tierra blanda ni leña seca. El Maestro de Difuntos duda si es un rito posible o una trampa."
 gj_minores_norte.26.a: "Cumplir con el rito, aunque dure una estación."
 gj_minores_norte.26.b: "Quemar a los muertos con aceite y acabar de una vez."

 # ===== Decisiones =====
 gj_minores_norte_decision_sellar_las_pesas.title: "Sellar las pesas de la ciudad"
 gj_minores_norte_decision_sellar_las_pesas.desc: "El consejo puede grabar el sello de la ciudad en todas las pesas y medidas. Costará dinero, pero ningún mercader dudará de lo que lleve ese sello."
 gj_minores_norte_decision_sellar_las_pesas.a: "Grabar el sello en todas las pesas."
 gj_minores_norte_decision_sellar_las_pesas.b: "Dejarlo para otro año."
 gj_minores_norte_decision_feria_de_los_puentes.title: "La feria de los puentes"
 gj_minores_norte_decision_feria_de_los_puentes.desc: "Se pueden cubrir los puentes con puestos y toldos durante una semana, e invitar a los mercaderes de toda la comarca."
 gj_minores_norte_decision_feria_de_los_puentes.a: "Abrir la feria."
 gj_minores_norte_decision_feria_de_los_puentes.b: "Una feria modesta, solo para los vecinos."
 gj_minores_norte_decision_consejo_de_clanes.title: "Reunir el consejo de clanes"
 gj_minores_norte_decision_consejo_de_clanes.desc: "Los jefes de todas las casas pueden sentarse en un círculo bajo un mismo techo. Se hablará de deudas, de pozos y de guerras."
 gj_minores_norte_decision_consejo_de_clanes.a: "Reunir a todos los jefes."
 gj_minores_norte_decision_consejo_de_clanes.b: "Hablar solo con los más cercanos."
 gj_minores_norte_decision_fuego_mayor.title: "Encender el Fuego Mayor"
 gj_minores_norte_decision_fuego_mayor.desc: "Un fuego tan alto que se vea desde tres valles. Cada familia traerá su leña y su historia."
 gj_minores_norte_decision_fuego_mayor.a: "Encender el Fuego Mayor."
 gj_minores_norte_decision_fuego_mayor.b: "Todavía no es el momento."
 gj_minores_norte_decision_encadenar_atalayas.title: "Encadenar las atalayas"
 gj_minores_norte_decision_encadenar_atalayas.desc: "Si cada atalaya se ve desde la siguiente, el aviso recorre toda la Marca en una noche. Cuesta leña, mástiles y cuadrillas."
 gj_minores_norte_decision_encadenar_atalayas.a: "Levantar la cadena."
 gj_minores_norte_decision_encadenar_atalayas.b: "Por ahora, bastan las atalayas sueltas."
 gj_minores_norte_decision_cerrar_el_paso.title: "Cerrar el paso"
 gj_minores_norte_decision_cerrar_el_paso.desc: "Atrancar los pasos de la Marca detiene a ejércitos y a mercaderes por igual. Es una medida de guerra que se paga en tiempos de paz."
 gj_minores_norte_decision_cerrar_el_paso.a: "Cerrar el paso por ocho años."
 gj_minores_norte_decision_cerrar_el_paso.b: "No cerrar nada; que todos crucen."

 # ===== Misiones =====
 gj_minores_norte_mision_ce_ciudad_de_pesas: "La Ciudad de las Pesas"
 gj_minores_norte_mision_ce_ciudad_de_pesas_desc: "Ser ciudad es pesar justo, sellar bien y defender lo que se ha construido."
 gj_minores_norte_ce_tarea_gremios: "Puentes y gremios"
 gj_minores_norte_ce_tarea_gremios_desc: "Que los gremios repartan las obras y se vigilen entre sí."
 gj_minores_norte_ce_tarea_franquicias: "Carta de franquicias"
 gj_minores_norte_ce_tarea_franquicias_desc: "Poner por escrito lo que se pactaba de palabra."
 gj_minores_norte_ce_tarea_milicia: "Milicia de barrio"
 gj_minores_norte_ce_tarea_milicia_desc: "Que cada barrio sepa defenderse sin pedir socorro."
 gj_minores_norte_mision_cl_fuegos_del_clan: "Los Fuegos del Clan"
 gj_minores_norte_mision_cl_fuegos_del_clan_desc: "Un clan es lo que se reúne alrededor de un mismo fuego."
 gj_minores_norte_cl_tarea_juramento: "Juramento de hogar"
 gj_minores_norte_cl_tarea_juramento_desc: "Que todo el que coma del fuego jure al fuego."
 gj_minores_norte_cl_tarea_fuego: "El fuego común"
 gj_minores_norte_cl_tarea_fuego_desc: "Compartir en la escasez lo que hay."
 gj_minores_norte_cl_tarea_hijos: "Hijos del clan"
 gj_minores_norte_cl_tarea_hijos_desc: "Hacer del forastero un pariente."
 gj_minores_norte_mision_ma_cadena_de_atalayas: "La Cadena de Atalayas"
 gj_minores_norte_mision_ma_cadena_de_atalayas_desc: "Una marca se defiende de lejos: con fuego, con paciencia y con relevos."
 gj_minores_norte_ma_tarea_atalaya: "Atalaya"
 gj_minores_norte_ma_tarea_atalaya_desc: "Una torre en cada cerro."
 gj_minores_norte_ma_tarea_guardia: "La Guardia de la pica"
 gj_minores_norte_ma_tarea_guardia_desc: "Formar a la Guardia con picas largas."
 gj_minores_norte_ma_tarea_relevo: "La Guardia en línea"
 gj_minores_norte_ma_tarea_relevo_desc: "Que la Guardia sepa batirse también en campo abierto."
