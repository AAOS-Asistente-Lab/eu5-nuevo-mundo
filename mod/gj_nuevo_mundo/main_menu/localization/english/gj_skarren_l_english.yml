l_english:
 # Copia del castellano: esta parte no trae textos en ingles.
 gj_skarren_remo_largo: "El remo largo"
 gj_skarren_remo_largo_desc: "En los fiordos se aprende a remar antes que a andar. Una quilla estrecha y cuarenta brazos llevan a la partida de asalto a la orilla antes de que suene la primera campana."
 gj_skarren_botin_compartido: "Botín compartido"
 gj_skarren_botin_compartido_desc: "Todo lo que se saca de una orilla ajena se reparte en la playa, a la vista de todos. Quien reparte con justicia no necesita pagar a nadie para que lo siga."
 gj_skarren_casas_largas: "Casas largas"
 gj_skarren_casas_largas_desc: "Bajo un mismo techo de turba duermen tres generaciones y los aperos de guerra de todas. Cuando suena el cuerno, la casa entera es una leva."
 gj_skarren_ahumaderos: "Ahumaderos de arenque"
 gj_skarren_ahumaderos_desc: "Sin cosecha que valga, el invierno se vence con pescado salado y humo. Un ahumadero bien llevado mantiene a una aldea y a su flota hasta la primavera."
 gj_skarren_piedra_de_runas: "La piedra de las runas"
 gj_skarren_piedra_de_runas_desc: "Se alza una piedra ante cada salón y se talla en ella el nombre de quien vuelve del mar. Los señores del fiordo tallan sus hazañas y las discuten a golpe de cincel."
 gj_skarren_quillas_de_cuchilla: "Quillas de cuchilla"
 gj_skarren_quillas_de_cuchilla_desc: "Los astilleros aprenden a afinar la proa hasta que corta el agua como un cuchillo. Los barcos pesan menos y llegan más lejos con la misma tripulación."
 gj_skarren_pacto_de_sangre: "Pacto de sangre"
 gj_skarren_pacto_de_sangre_desc: "Dos señores del fiordo se abren la palma sobre la misma hoguera y juran no abandonarse. Un ejército de pactados no huye: o vuelve entero o no vuelve."
 gj_skarren_mercado_del_botin: "El mercado del botín"
 gj_skarren_mercado_del_botin_desc: "En ciertos puertos neutrales se compra sin preguntar de dónde viene lo vendido. Hay quien dice que la mitad del comercio del norte huele a brea y a sangre."
 gj_skarren_hogueras_de_aviso: "Hogueras de aviso"
 gj_skarren_hogueras_de_aviso_desc: "De cabo en cabo se enciende la cadena de fuegos que avisa de la vela enemiga. Quien conoce el aviso espera al invasor con la flota ya en el agua."
 gj_skarren_sagas_recitadas: "Sagas recitadas"
 gj_skarren_sagas_recitadas_desc: "Cada invierno un recitador repite de memoria las hazañas del año. Quien aparece en la saga vive; quien no, se desvanece con el humo."
 gj_skarren_calafateo_de_brea: "Calafateo de brea"
 gj_skarren_calafateo_de_brea_desc: "Un casco bien embreado aguanta otra temporada de hielo y de rocas. El que descuida la brea, descuida a su gente."
 gj_skarren_rutas_del_hielo: "Rutas del hielo"
 gj_skarren_rutas_del_hielo_desc: "Los pilotos aprenden a seguir el borde del hielo y las migraciones de las focas hasta mares que nadie había nombrado. El horizonte se ensancha cada primavera."
 gj_skarren_abordaje_en_masa: "Abordaje en masa"
 gj_skarren_abordaje_en_masa_desc: "Mil cuerdas con garfio y una carga de hachas bastan para convertir cualquier nave rica en un regalo. La presa se remolca hasta casa y se bautiza de nuevo."
 gj_skarren_dinero_de_proteccion: "Dinero de protección"
 gj_skarren_dinero_de_proteccion_desc: "Quien paga cada año no es saqueado. Quien se niega descubre cuántas razones tiene un señor del fiordo para visitar su costa."
 gj_skarren_corsarios_del_norte: "Corsarios del norte"
 gj_skarren_corsarios_del_norte_desc: "Con patente o sin ella, los capitanes del fiordo hacen la guerra por su cuenta. Una flota ligera y barata pone en jaque a escuadras mucho mayores."
 gj_skarren_fundicion_de_anclas: "Fundición de anclas"
 gj_skarren_fundicion_de_anclas_desc: "Los herreros del puerto aprenden a forjar anclas de una sola pieza y herrajes que no se rompen con el frío. Las flotas esperan menos en los varaderos."
 gj_skarren_senores_de_bahia: "Señores de bahía"
 gj_skarren_senores_de_bahia_desc: "Cada bahía tiene su señor del fiordo y cada señor del fiordo, su palabra. Aprender a escucharlos a todos a la vez es el verdadero arte del que manda."
 gj_skarren_diezmo_del_saqueo: "El diezmo del saqueo"
 gj_skarren_diezmo_del_saqueo_desc: "Una décima parte de cada botín va al tesoro común y a los que se quedaron en casa. El saqueo deja de ser un negocio de capitanes para volverse un asunto de reino."
 gj_skarren_escuadras_de_asalto: "Escuadras de asalto"
 gj_skarren_escuadras_de_asalto_desc: "El hacha se acompaña ahora de pólvora y de orden cerrado. El primer choque sigue siendo brutal, pero ya no se disuelve en una melé."
 gj_skarren_fortalezas_del_paso: "Fortalezas del paso"
 gj_skarren_fortalezas_del_paso_desc: "Pequeños fuertes de piedra en cada paso y cada vado alimentan a las columnas que se internan en tierra firme. Se aprende a vivir de la tierra ajena."
 gj_skarren_hijos_del_hielo_y_el_hierro: "Hijos del hielo y del hierro"
 gj_skarren_hijos_del_hielo_y_el_hierro_desc: "Los hijos de los hijos de los remeros forman ahora regimientos de ancha espalda. La costa pobre cría a una generación entera que solo sabe luchar."
 gj_skarren_vapor_y_arpon: "Vapor y arpón"
 gj_skarren_vapor_y_arpon_desc: "El humo sustituye al remo, pero el arpón sigue colgando de la proa. Los viejos capitanes se ríen del vapor hasta que ven llegar el primer convoy."
 gj_skarren_ultimo_saqueo: "El último saqueo"
 gj_skarren_ultimo_saqueo_desc: "Se dice que cada generación tiene su último gran saqueo, y que ninguna lo sabe hasta que ha pasado. Esta decide que el suyo será el mejor contado."
 gj_skarren_la_gran_saga: "La gran saga"
 gj_skarren_la_gran_saga_desc: "Un cronista junta por fin todas las sagas en un solo libro. Quien lo lee entiende por qué los skarren no se rinden: no pueden, están escritos."
 gj_skarren_cultura_voz_del_fiordo: "La voz del fiordo"
 gj_skarren_cultura_voz_del_fiordo_desc: "Un skarren grita para hacerse oír sobre el viento y el oleaje, y sus hijos aprenden a gritar antes que a hablar. En la batalla, esa voz parece venir de todas partes."
 gj_skarren_cultura_ojos_de_marea: "Ojos de marea"
 gj_skarren_cultura_ojos_de_marea_desc: "Los niños de la costa distinguen el cambio de marea por el olor del agua. Un pueblo entero de pilotos natos pierde pocos barcos."
 gj_skarren_cultura_fiordo_eterno: "El fiordo eterno"
 gj_skarren_cultura_fiordo_eterno_desc: "El fiordo no cambia, y por eso el pueblo tampoco. Quien nace en él sabe de dónde viene y a quién debe obediencia."
 gj_n_skarren_corredor_1: "Corredor del Fiordo"
 gj_n_skarren_corredor_1_desc: "Una nave larga y baja que corre sobre el agua y vara de proa en cualquier playa. Desembarca a su gente antes de que el defensor se haya puesto la cota."
 gj_n_skarren_corredor_1_advance: "Corredor del Fiordo"
 gj_n_skarren_corredor_1_advance_desc: "Una nave larga y baja que corre sobre el agua y vara de proa en cualquier playa. Desembarca a su gente antes de que el defensor se haya puesto la cota."
 gj_n_skarren_corredor_2: "Corredor de quilla larga"
 gj_n_skarren_corredor_2_desc: "La quilla alargada gana nudos y pierde panza. Sigue siendo una barca de asalto, no un barco de línea, y lo sabe."
 gj_n_skarren_corredor_2_advance: "Corredor de quilla larga"
 gj_n_skarren_corredor_2_advance_desc: "La quilla alargada gana nudos y pierde panza. Sigue siendo una barca de asalto, no un barco de línea, y lo sabe."
 gj_n_skarren_corredor_3: "Corredor artillado"
 gj_n_skarren_corredor_3_desc: "Dos falconetes en la proa para despejar la playa antes del desembarco. Aun así, un solo navío de línea la hundiría de una andanada."
 gj_n_skarren_corredor_3_advance: "Corredor artillado"
 gj_n_skarren_corredor_3_advance_desc: "Dos falconetes en la proa para despejar la playa antes del desembarco. Aun así, un solo navío de línea la hundiría de una andanada."
 gj_n_skarren_corredor_4: "Balandro corredor"
 gj_n_skarren_corredor_4_desc: "Casco mixto, vela latina y borda baja para saltar a tierra. Llega primero, descarga y se retira antes de que llegue el refuerzo."
 gj_n_skarren_corredor_4_advance: "Balandro corredor"
 gj_n_skarren_corredor_4_advance_desc: "Casco mixto, vela latina y borda baja para saltar a tierra. Llega primero, descarga y se retira antes de que llegue el refuerzo."
 gj_n_skarren_corredor_5: "Corredor de escuadra"
 gj_n_skarren_corredor_5_desc: "Los corredores navegan ya en escuadra, con señales y con un cirujano a bordo. La velocidad sigue siendo su única coraza."
 gj_n_skarren_corredor_5_advance: "Corredor de escuadra"
 gj_n_skarren_corredor_5_advance_desc: "Los corredores navegan ya en escuadra, con señales y con un cirujano a bordo. La velocidad sigue siendo su única coraza."
 gj_n_skarren_corredor_6: "Corredor a vapor"
 gj_n_skarren_corredor_6_desc: "Hélice y vela auxiliar: la última generación de corredores se ríe de las mareas. Un cañonero cualquiera la haría pedazos."
 gj_n_skarren_corredor_6_advance: "Corredor a vapor"
 gj_n_skarren_corredor_6_advance_desc: "Hélice y vela auxiliar: la última generación de corredores se ríe de las mareas. Un cañonero cualquiera la haría pedazos."
 gj_a_skarren_hachero_1: "Hacheros de saga"
 gj_a_skarren_hachero_1_desc: "Guerreros con hacha de dos manos y nombre en una saga. Rompen la línea con el primer golpe, y si el primero falla, lo intentan con el segundo."
 gj_a_skarren_hachero_1_advance: "Hacheros de saga"
 gj_a_skarren_hachero_1_advance_desc: "Guerreros con hacha de dos manos y nombre en una saga. Rompen la línea con el primer golpe, y si el primero falla, lo intentan con el segundo."
 gj_a_skarren_hachero_2: "Hacheros juramentados"
 gj_a_skarren_hachero_2_desc: "Los hacheros pactados cobran soldada de señor del fiordo y ya no combaten por gloria sola. Siguen cargando como si fuera el primer día."
 gj_a_skarren_hachero_2_advance: "Hacheros juramentados"
 gj_a_skarren_hachero_2_advance_desc: "Los hacheros pactados cobran soldada de señor del fiordo y ya no combaten por gloria sola. Siguen cargando como si fuera el primer día."
 gj_a_skarren_hachero_3: "Hacheros del fiordo"
 gj_a_skarren_hachero_3_desc: "Con peto y casco de hierro, la guardia del señor del fiordo carga en cuña. Cae bien y levanta mal: no está hecha para quedarse quieta bajo el fuego."
 gj_a_skarren_hachero_3_advance: "Hacheros del fiordo"
 gj_a_skarren_hachero_3_advance_desc: "Con peto y casco de hierro, la guardia del señor del fiordo carga en cuña. Cae bien y levanta mal: no está hecha para quedarse quieta bajo el fuego."
 gj_a_skarren_hachero_4: "Guardia de hacha y pólvora"
 gj_a_skarren_hachero_4_desc: "Hacha en una mano y arcabuz en la otra: disparan una vez y cargan. Su moral es altísima y su munición, escasa."
 gj_a_skarren_hachero_4_advance: "Guardia de hacha y pólvora"
 gj_a_skarren_hachero_4_advance_desc: "Hacha en una mano y arcabuz en la otra: disparan una vez y cargan. Su moral es altísima y su munición, escasa."
 gj_a_skarren_hachero_5: "Guardia del fiordo"
 gj_a_skarren_hachero_5_desc: "Una guardia de hierro y de pólvora que sigue prefiriendo la hoja. Soporta mal una larga marcha y peor un asedio."
 gj_a_skarren_hachero_5_advance: "Guardia del fiordo"
 gj_a_skarren_hachero_5_advance_desc: "Una guardia de hierro y de pólvora que sigue prefiriendo la hoja. Soporta mal una larga marcha y peor un asedio."
 gj_a_skarren_hachero_6: "Guardia de asalto skarren"
 gj_a_skarren_hachero_6_desc: "Granaderos de asalto con hacha de zapa. Son la última versión del hachero: temibles al primer golpe y frágiles si se alarga el combate."
 gj_a_skarren_hachero_6_advance: "Guardia de asalto skarren"
 gj_a_skarren_hachero_6_advance_desc: "Granaderos de asalto con hacha de zapa. Son la última versión del hachero: temibles al primer golpe y frágiles si se alarga el combate."
 gj_a_skarren_arponero_1: "Arponeros del fiordo"
 gj_a_skarren_arponero_1_desc: "Cazadores de foca que lanzan el arpón con una puntería asombrosa. Acosan desde la orilla y desaparecen antes de que los alcance la caballería."
 gj_a_skarren_arponero_1_advance: "Arponeros del fiordo"
 gj_a_skarren_arponero_1_advance_desc: "Cazadores de foca que lanzan el arpón con una puntería asombrosa. Acosan desde la orilla y desaparecen antes de que los alcance la caballería."
 gj_a_skarren_arponero_2: "Arponeros veteranos"
 gj_a_skarren_arponero_2_desc: "El arpón se ata a una cuerda y se recupera: un arma de caza convertida en un arma de guerra molesta y letal."
 gj_a_skarren_arponero_2_advance: "Arponeros veteranos"
 gj_a_skarren_arponero_2_advance_desc: "El arpón se ata a una cuerda y se recupera: un arma de caza convertida en un arma de guerra molesta y letal."
 gj_a_skarren_arponero_3: "Arcabuceros de la costa"
 gj_a_skarren_arponero_3_desc: "Los primeros arcabuceros skarren disparan desde las rocas y las dunas. No aguantan una carga pero sí un asedio largo."
 gj_a_skarren_arponero_3_advance: "Arcabuceros de la costa"
 gj_a_skarren_arponero_3_advance_desc: "Los primeros arcabuceros skarren disparan desde las rocas y las dunas. No aguantan una carga pero sí un asedio largo."
 gj_a_skarren_arponero_4: "Cazadores del fiordo"
 gj_a_skarren_arponero_4_desc: "Cazadores de rifle corto, avezados a la niebla y al frío. Su especialidad es la emboscada a la columna de marcha."
 gj_a_skarren_arponero_4_advance: "Cazadores del fiordo"
 gj_a_skarren_arponero_4_advance_desc: "Cazadores de rifle corto, avezados a la niebla y al frío. Su especialidad es la emboscada a la columna de marcha."
 gj_a_skarren_arponero_5: "Fusileros costeros"
 gj_a_skarren_arponero_5_desc: "Fusileros de costa, entrenados para recibir a un desembarco con disparos en cadena. Muy buenos defendiendo, pésimos a campo abierto."
 gj_a_skarren_arponero_5_advance: "Fusileros costeros"
 gj_a_skarren_arponero_5_advance_desc: "Fusileros de costa, entrenados para recibir a un desembarco con disparos en cadena. Muy buenos defendiendo, pésimos a campo abierto."
 gj_a_skarren_arponero_6: "Tiradores del rompiente"
 gj_a_skarren_arponero_6_desc: "Tiradores selectos que usan la niebla del fiordo como un segundo uniforme. Matan a distancia y huyen si les llegan al cuerpo."
 gj_a_skarren_arponero_6_advance: "Tiradores del rompiente"
 gj_a_skarren_arponero_6_advance_desc: "Tiradores selectos que usan la niebla del fiordo como un segundo uniforme. Matan a distancia y huyen si les llegan al cuerpo."
 gj_skarren_senorio_de_la_quilla: "Señorío de la quilla"
 gj_skarren_senorio_de_la_quilla_desc: "Cada señor del fiordo es dueño de un casco y el casco es dueño de su señor del fiordo. El reino se mide en quillas, no en leguas."
 gj_skarren_asamblea_de_las_sagas: "Asamblea de las sagas"
 gj_skarren_asamblea_de_las_sagas_desc: "Una vez al año los señores del fiordo se reúnen ante la piedra y eligen entre ellos al que mejor cuenta lo que ha hecho. El elegido manda mientras su saga siga en pie."
 gj_skarren_flotas_de_asalto: "Flotas de asalto"
 gj_skarren_flotas_de_asalto_desc: "El señor del fiordo ya no asalta con una sola nave, sino con una flota con intendencia y calendario. El saqueo se convierte en una estación del año."
 gj_patronimico_skarren_hijo: "sen"
 gj_patronimico_skarren_hija: "sdottir"
 gj_prefijo_skarren: "de "
 gj_familia_fiordo: "Familia del fiordo"
 gj_lengua_skarren: "Lengua skarren"
 gj_dialecto_skarren: "Skarren"
 gj_grupo_fiordo: "Pueblos del fiordo"
 gj_skarren: "Skarren"
 gj_skarren_adj: "skarren"
 gj_skarren_collective_noun: "Skarrenes"
 gj_skarren_saga_mar: "Saga del mar"
 STATIC_MODIFIER_NAME_gj_skarren_saga_mar: "Saga del mar"
 STATIC_MODIFIER_DESC_gj_skarren_saga_mar: "Una saga de travesías y de naufragios cuenta cómo el reino aprendió a vivir sobre el agua. Los marineros la repiten antes de zarpar."
 gj_skarren_saga_hierro: "Saga del hierro"
 STATIC_MODIFIER_NAME_gj_skarren_saga_hierro: "Saga del hierro"
 STATIC_MODIFIER_DESC_gj_skarren_saga_hierro: "Una saga de asedios y de vados defendidos. Los soldados se la saben de memoria y la gritan al cargar."
 gj_skarren_saga_sangre: "Saga de la sangre"
 STATIC_MODIFIER_NAME_gj_skarren_saga_sangre: "Saga de la sangre"
 STATIC_MODIFIER_DESC_gj_skarren_saga_sangre: "Una saga de venganzas y de botines. Nadie en la costa ajena la ha leído, pero todos la temen."
 gj_skarren_saga_fama: "Saga de la fama"
 STATIC_MODIFIER_NAME_gj_skarren_saga_fama: "Saga de la fama"
 STATIC_MODIFIER_DESC_gj_skarren_saga_fama: "Una saga que cuenta la grandeza de un señor del fiordo desde los ojos de sus enemigos. Es la que más impresiona a los reyes lejanos."
 gj_skarren_senores_inquietos: "Señores inquietos"
 STATIC_MODIFIER_NAME_gj_skarren_senores_inquietos: "Señores inquietos"
 STATIC_MODIFIER_DESC_gj_skarren_senores_inquietos: "Los señores del fiordo llevan años sin oler la sal de un botín. Hay hachas que se afilan demasiado y bocas que cuentan agravios."
 gj_skarren_senores_en_armas: "Señores en armas"
 STATIC_MODIFIER_NAME_gj_skarren_senores_en_armas: "Señores en armas"
 STATIC_MODIFIER_DESC_gj_skarren_senores_en_armas: "Varias bahías se han negado a pagar el diezmo y han cerrado sus puertos. El reino tiene más hachas que nunca y todas apuntan hacia dentro."
 gj_skarren_banquete_largo: "Banquete largo"
 STATIC_MODIFIER_NAME_gj_skarren_banquete_largo: "Banquete largo"
 STATIC_MODIFIER_DESC_gj_skarren_banquete_largo: "El banquete de la piedra duró siete noches. Los señores del fiordo volvieron a sus bahías con la barriga llena y la promesa de otra primavera."
 gj_skarren_costa_saqueada: "Costa saqueada"
 STATIC_MODIFIER_NAME_gj_skarren_costa_saqueada: "Costa saqueada"
 STATIC_MODIFIER_DESC_gj_skarren_costa_saqueada: "Una incursión skarren ha arrasado nuestras orillas. La gente huye tierra adentro y el tesoro paga lo que el miedo no puede."
 gj_skarren_tregua_del_hielo: "Tregua del hielo"
 STATIC_MODIFIER_NAME_gj_skarren_tregua_del_hielo: "Tregua del hielo"
 STATIC_MODIFIER_DESC_gj_skarren_tregua_del_hielo: "El hielo cerró los puertos y los señores del fiordo aprovecharon para firmar la paz. Hasta que se derrita, nadie sale a saquear."
 gj_skarren_salon_sagas: "Salón de las sagas"
 gj_skarren_salon_sagas_desc: "Una nave larga de madera oscura donde se recita, año tras año, lo que han hecho los señores del fiordo. Cuanto más alto el techo, más lejos llega la fama."
 gj_skarren_salon_sagas_mantenimiento: "Salón de las sagas"
 gj_skarren_salon_sagas_mantenimiento_desc: "Mantenimiento del edificio salón de las sagas."
 gj_skarren_astillero_de_fiordo: "Astillero de fiordo"
 gj_skarren_astillero_de_fiordo_desc: "Una grada excavada a pico en la orilla de un fiordo, con la sombra de la montaña como techo. Los cascos salen sin quilla recta y regresan con el botín dentro."
 gj_skarren_astillero_de_fiordo_mantenimiento: "Astillero de fiordo"
 gj_skarren_astillero_de_fiordo_mantenimiento_desc: "Mantenimiento del edificio astillero de fiordo."
 gj_skarren_lonja_del_botin: "Lonja del botín"
 gj_skarren_lonja_del_botin_desc: "Un mercado de tablas donde se subastan los despojos de media costa. Los mercaderes ven aquí gangas, y los saqueados, sus propias cosas con otro dueño."
 gj_skarren_lonja_del_botin_mantenimiento: "Lonja del botín"
 gj_skarren_lonja_del_botin_mantenimiento_desc: "Mantenimiento del edificio lonja del botín."
 gj_skarren_atalaya_de_hogueras: "Atalaya de hogueras"
 gj_skarren_atalaya_de_hogueras_desc: "Un torreón de piedra seca con una pila de leña resinosa siempre lista. Cuando se enciende, la costa entera sabe que viene una vela."
 gj_skarren_atalaya_de_hogueras_mantenimiento: "Atalaya de hogueras"
 gj_skarren_atalaya_de_hogueras_mantenimiento_desc: "Mantenimiento del edificio atalaya de hogueras."
 gj_skarren_casa_de_remeros: "Casa de remeros"
 gj_skarren_casa_de_remeros_desc: "Una casa larga donde viven, comen y duermen las tripulaciones. Aquí se juntan las tripulaciones y se juran los pactos de remo."
 gj_skarren_casa_de_remeros_mantenimiento: "Casa de remeros"
 gj_skarren_casa_de_remeros_mantenimiento_desc: "Mantenimiento del edificio casa de remeros."
 gj_skarren_gloria: "Gloria"
 gj_skarren_sagas: "Sagas escritas"
 gj_skarren_botin_reciente: "Botín reciente"
 gj_skarren_incursion_enfriamiento: "Incursión reciente"
 gj_skarren_gran_enfriamiento: "Gran incursión reciente"
