 gj_skarren_incursion.title: "Incursión de primavera"
 gj_skarren_incursion.desc: "Basta una noche sin luna y tres cascos largos para visitar la costa de un vecino. Se vuelve con el aliento de la sal en la barba y el oro bajo la capa. Es poco, pero es nuestro."
 gj_skarren_incursion.a: "Que zarpen los cascos."
 gj_skarren_incursion: "Incursión de primavera"
 gj_skarren_incursion_desc: "Basta una noche sin luna y tres cascos largos para visitar la costa de un vecino. Se vuelve con el aliento de la sal en la barba y el oro bajo la capa. Es poco, pero es nuestro."
 gj_skarren_gran_incursion.title: "La gran incursión"
 gj_skarren_gran_incursion.desc: "Cuando la costa vecina está dormida y la flota entera está lista, un señor del fiordo convoca todos los cascos. Es la apuesta más grande del año: si sale bien, se cantará durante generaciones."
 gj_skarren_gran_incursion.a: "Que arda la costa entera."
 gj_skarren_gran_incursion: "La gran incursión"
 gj_skarren_gran_incursion_desc: "Cuando la costa vecina está dormida y la flota entera está lista, un señor del fiordo convoca todos los cascos. Es la apuesta más grande del año: si sale bien, se cantará durante generaciones."
 gj_skarren_banquete.title: "El banquete largo"
 gj_skarren_banquete.desc: "Siete noches de carne asada, hidromiel y recitados ante la piedra. Es caro, pero un señor del fiordo con la barriga llena es un señor del fiordo que no afila el hacha contra su rey."
 gj_skarren_banquete.a: "Que se abran los barriles."
 gj_skarren_banquete: "El banquete largo"
 gj_skarren_banquete_desc: "Siete noches de carne asada, hidromiel y recitados ante la piedra. Es caro, pero un señor del fiordo con la barriga llena es un señor del fiordo que no afila el hacha contra su rey."
 gj_skarren_encargar_saga.title: "Encargar una saga"
 gj_skarren_encargar_saga.desc: "Hay hazañas tan grandes que no pueden esperar a que las cuente el tiempo. Se paga a un recitador y se la talla en la piedra mientras el recuerdo sigue caliente."
 gj_skarren_encargar_saga.a: "Que se escriba lo hecho."
 gj_skarren_encargar_saga: "Encargar una saga"
 gj_skarren_encargar_saga_desc: "Hay hazañas tan grandes que no pueden esperar a que las cuente el tiempo. Se paga a un recitador y se la talla en la piedra mientras el recuerdo sigue caliente."
 gj_skarren.1.title: "La Piedra de la Asamblea"
 gj_skarren.1.desc: "Junto a la bahía del salón se alza una piedra gris, tan vieja que nadie recuerda quién la trajo. Aquí se reúnen los señores del fiordo cuando hay que elegir quién manda. Este año el viento viene del mar y trae olor a guerra."
 gj_skarren.1.a: "Que hable el más viejo."
 gj_skarren.1.b: "Que decida la hoja más larga."
 gj_skarren.2.title: "El invierno del hambre"
 gj_skarren.2.desc: "La nieve cubrió los campos hasta las rodillas y el hielo cerró las ensenadas. Los graneros de los señores del fiordo menguan y los niños comen sopa de algas. Alguien susurra que en la costa del sur hay trigo, y que nadie lo vigila."
 gj_skarren.2.a: "Abrir los graneros del señor del fiordo."
 gj_skarren.2.b: "Zarpar a por lo que haga falta."
 gj_skarren.2.c: "Que se vayan los más débiles."
 gj_skarren.3.title: "El casco a la deriva"
 gj_skarren.3.desc: "Al amanecer, los pescadores avistan un casco largo que flota sin tripulación, con la vela rota y las bodegas atadas. Nadie sabe de qué costa viene. Lo más sensato sería no tocarlo, pero eso no es lo que hacen los skarren."
 gj_skarren.3.a: "Remolcarlo a puerto."
 gj_skarren.3.b: "Quemarlo en honor de los muertos."
 gj_skarren.4.title: "La ballena varada"
 gj_skarren.4.desc: "Una ballena enorme ha varado en la playa de la bahía mayor. Hay carne para todo el invierno y aceite para todas las lámparas. El cantor de sagas dice que es un regalo del Mar Quieto; el tesorero, que es una oportunidad."
 gj_skarren.4.a: "Repartirla en la playa."
 gj_skarren.4.b: "Vender el aceite en el mercado."
 gj_skarren.5.title: "El cantor de sagas ciego"
 gj_skarren.5.desc: "Un anciano ciego llega a la corte de un señor del fiordo guiado por un niño. Dice que lleva cuarenta inviernos recitando de memoria y que aún sabe todos los nombres de los que no volvieron. Pide un techo y una hoguera."
 gj_skarren.5.a: "Escucharlo hasta el final."
 gj_skarren.5.b: "Pagarle para que cante nuestras victorias."
 gj_skarren.6.title: "El hacha de otro mundo"
 gj_skarren.6.desc: "En lo hondo de una turbera, unos cavadores encuentran un hacha de un metal que nadie conoce, sin una mella y fría como el hielo. Dicen que perteneció a un pueblo que no está en ninguna saga."
 gj_skarren.6.a: "Ofrecerla a la piedra."
 gj_skarren.6.b: "Fundir el metal."
 gj_skarren.6.c: "Dársela al señor del fiordo más fiero."
 gj_skarren.7.title: "Tributo de las Mil Lagunas"
 gj_skarren.7.desc: "Una delegación de barqueros llega con cofres cerrados y sonrisas tensas. Ofrecen oro cada año a cambio de que los cascos del fiordo se mantengan lejos de sus aguas. Los señores del fiordo más jóvenes escupen al suelo."
 gj_skarren.7.a: "Aceptar el oro y respetar sus aguas."
 gj_skarren.7.b: "Rechazar el tributo y saquearlos."
 gj_skarren.8.title: "La hija del señor del fiordo"
 gj_skarren.8.desc: "La hija mayor del señor del fiordo de la bahía sur no quiere casarse con ningún vecino. Dice que prefiere ir con la flota, como sus hermanos. El señor del fiordo se tira de la barba y busca consejo en la piedra."
 gj_skarren.8.a: "Casarla con el señor del fiordo vecino."
 gj_skarren.8.b: "Deseñor del fiordoa ir con la flota."
 gj_skarren.8.c: "Que decida ella."
 gj_skarren.9.title: "Fuego en la grada"
 gj_skarren.9.desc: "Una chispa de la fragua cayó sobre un montón de virutas y en minutos ardía la grada entera, con sus quillas a medio hacer. Los carpinteros corren a salvar lo que pueden. Hay quien murmura que no ha sido un accidente."
 gj_skarren.9.a: "Reconstruirla con madera nueva."
 gj_skarren.9.b: "Dejar que arda y levantarla de nuevo."
 gj_skarren.10.title: "La saga se escribe"
 gj_skarren.10.desc: "Los hechos de los últimos años han crecido hasta pedir su lugar junto a la piedra. El recitador mayor reúne a los señores del fiordo: hay que decidir de qué se hablará en la nueva saga, porque eso decidirá cómo se recordará a quien la protagonizó."
 gj_skarren.10.a: "La saga del mar."
 gj_skarren.10.b: "La saga del hierro."
 gj_skarren.10.c: "La saga de la sangre."
 gj_skarren.10.d: "La saga de la fama."
 gj_skarren.11.title: "El señor del fiordo que no volvió"
 gj_skarren.11.desc: "Una flota salió en abril y solo regresó una vela. El señor del fiordo que la mandaba se hundió con su nave en un mar de niebla. Su hermano reclama el nombre y la venganza; su viuda reclama la parte del botín."
 gj_skarren.11.a: "Honrar su nombre en la piedra."
 gj_skarren.11.b: "Mandar otra flota a vengarlo."
 gj_skarren.12.title: "La Piedra elige"
 gj_skarren.12.desc: "El señor del fiordo ha muerto y la bahía entera calla. Alrededor de la piedra los pretendientes se miran sin hablar. Cada uno lleva un cofre de promesas, y cada uno sabe cuántas sagas cuentan sus hazañas."
 gj_skarren.12.a: "Elegir a quien más gloria acumuló."
 gj_skarren.12.b: "Elegir al más prudente."
 gj_skarren.13.title: "Niebla de tres noches"
 gj_skarren.13.desc: "Una niebla espesa como lana mojada cubre las costas durante tres noches. Los pilotos no ven ni la proa. Algunos capitanes proponen aprovecharla para aparecer ante la costa enemiga; otros, esperar a que pase."
 gj_skarren.13.a: "Seguir remando."
 gj_skarren.13.b: "Echar el ancla y esperar."
 gj_skarren.14.title: "El templo del lago"
 gj_skarren.14.desc: "En una isla del lago hay un templo pequeño, con ofrendas de oro y de ámbar a los pies de un dios sin rostro. Está custodiado por tres ancianos desarmados. Los hacheros dudan: a un dios así quizá no convenga robarle."
 gj_skarren.14.a: "Saquear el templo."
 gj_skarren.14.b: "Dejar una ofrenda y marcharse."
 gj_skarren.15.title: "El mercader asustado"
 gj_skarren.15.desc: "Un mercader de una costa lejana pide hablar con el señor del fiordo. Viaja con una carga valiosa y teme a los piratas, pero no se le escapa que los piratas más temidos de la zona son precisamente quienes lo reciben. Ofrece un trato."
 gj_skarren.15.a: "Cobrar el dinero de protección."
 gj_skarren.15.b: "Escoltarlo hasta su puerto."
 gj_skarren.16.title: "El cautivo que sabía leer"
 gj_skarren.16.desc: "Entre los cautivos de la última incursión hay un hombre flaco que descifra las runas de la piedra mejor que el propio recitador. Los señores del fiordo discuten qué hacer con él, porque la escritura aún da miedo."
 gj_skarren.16.a: "Ponerlo al servicio del cantor de sagas."
 gj_skarren.16.b: "Pedir rescate por él."
 gj_skarren.16.c: "Deseñor del fiordoo en el remo."
 gj_skarren.17.title: "Los lobos del hielo"
 gj_skarren.17.desc: "Una manada de lobos blancos baja de las montañas y ataca los rebaños de la costa. Los hacheros piden permiso para cazarlos; los ancianos advierten que quien mata a un lobo del hielo nunca vuelve a dormir tranquilo."
 gj_skarren.17.a: "Cazarlos."
 gj_skarren.17.b: "Deseñor del fiordoos pasar."
 gj_skarren.18.title: "Aguas bermejas"
 gj_skarren.18.desc: "El agua de las ensenadas se ha vuelto roja de un día para otro. Los peces flotan panza arriba y las gaviotas no se acercan. El recitador dice que es un presagio, pero no se pone de acuerdo con el cantor de sagas sobre de qué."
 gj_skarren.18.a: "Es un presagio de saqueo."
 gj_skarren.18.b: "Es un presagio de hambre: guardar el pescado."
 gj_skarren.19.title: "Hijos que no vuelven"
 gj_skarren.19.desc: "Cada primavera zarpan más cascos y regresan menos. En las casas largas hay sitios vacíos junto al fuego y las madres empiezan a murmurar. Los señores del fiordo piden más barcos; las madres, más hijos vivos."
 gj_skarren.19.a: "Honrarlos en la piedra."
 gj_skarren.19.b: "Prometer más botín el año que viene."
 gj_skarren.20.title: "El señor del fiordo aburrido"
 gj_skarren.20.desc: "Hace años que los cascos no se alejan de la costa. Los señores del fiordo pasan los días bebiendo y quejándose, y las hachas se afilan más de lo que hace falta para cortar leña. Algo hay que hacer antes de que alguien lo haga por nosotros."
 gj_skarren.20.a: "Celebrar un banquete largo."
 gj_skarren.20.b: "Que esperen: la paz es buena."
 gj_skarren.20.c: "Mandar una incursión ya."
 gj_skarren.21.title: "Los señores del fiordo se rebelan"
 gj_skarren.21.desc: "Varias bahías han cerrado sus puertos y se niegan a pagar el diezmo. Las hachas que no sirvieron para saquear se vuelven contra la piedra. O se paga con oro o se paga con sangre."
 gj_skarren.21.a: "Pagar el diezmo con oro."
 gj_skarren.21.b: "Aplastar a los rebeldes."
 gj_skarren.22.title: "La tregua del hielo"
 gj_skarren.22.desc: "Un invierno largo cierra los puertos y los señores del fiordo aprovechan para firmar la paz entre ellos. Ya habrá tiempo de saquear cuando se derrita el hielo; mientras tanto, el reino respira."
 gj_skarren.22.a: "Que haya paz hasta el deshielo."
 gj_skarren.22.b: "Mejor remar entre el hielo."
