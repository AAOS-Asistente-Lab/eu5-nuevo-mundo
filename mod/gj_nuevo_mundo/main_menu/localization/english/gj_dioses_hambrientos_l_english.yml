l_english:
 # Copia del castellano: esta parte no trae textos en ingles.
 # ===== Religión =====
 gj_dioses_hambrientos: "Dioses Hambrientos"
 gj_dioses_hambrientos_ADJ: "hambriento"
 gj_dioses_hambrientos_desc: "Los Siete Hambres no crearon el mundo por bondad: lo crearon para tener algo que comer. Orrum, la Boca Primera, abrió el cielo; Ammé, Madre de las Cribas, separó el grano de la paja; Vethkar el Cobrador reparte las guerras; Sulé, la Sed Dulce, manda la lluvia; Ishquen, el Pozo, guarda a los muertos; Daroh vela los silos; y Nerrimba, la Lengua de Sal, lame las costas. Quien los sigue sabe que todo don es un préstamo y que la deuda se paga en la Mesa. Cada ofrenda, y sobre todo cada cautivo entregado en ella, mantiene lleno el [religious_influence|el]. Pero cuando los años de paz se alargan, los dioses se impacientan y los sacerdotes, los Cribadores, empiezan a llevar la Cuenta."

 # ===== Aspectos =====
 gj_dioses_hambrientos_aspecto_mesa_servida: "La Mesa Siempre Servida"
 gj_dioses_hambrientos_aspecto_mesa_servida_desc: "Los dioses comen después del pueblo. En cada campaña de siembra se aparta la primera fanega para la Mesa, y el resto alimenta a quien la ha ganado."
 gj_dioses_hambrientos_aspecto_hoja_del_alba: "La Hoja del Alba"
 gj_dioses_hambrientos_aspecto_hoja_del_alba_desc: "La guerra es el primer plato. Los ejércitos salen al amanecer y vuelven con las manos llenas: de botín, de cautivos y de promesas. No puede elegirse junto al Guardián de los Silos."
 gj_dioses_hambrientos_aspecto_guardian_silos: "El Guardián de los Silos"
 gj_dioses_hambrientos_aspecto_guardian_silos_desc: "Daroh enseña que un silo bien guardado alimenta a los dioses tanto como una batalla. Los años de paz pesan menos sobre la devoción, aunque no dejan de pesar. No puede elegirse junto a la Hoja del Alba."
 gj_dioses_hambrientos_aspecto_pozo_de_ofrendas: "El Pozo de las Ofrendas"
 gj_dioses_hambrientos_aspecto_pozo_de_ofrendas_desc: "Los Cribadores llevan la Cuenta en un pozo seco: cada ofrenda es una piedra que cae y cada piedra se oye. Un clero que cuenta bien reza mejor."

 # ===== Enfoques religiosos =====
 gj_dioses_hambrientos_foco_cuenta_larga: "La Cuenta Larga"
 gj_dioses_hambrientos_foco_cuenta_larga_desc: "Los Cribadores aprenden a llevar la Cuenta de generaciones enteras: quién debe qué a qué dios y cuándo vence. La Mesa admite más devoción antes de rebosar."
 gj_dioses_hambrientos_foco_mesa_larga: "La Mesa Larga"
 gj_dioses_hambrientos_foco_mesa_larga_desc: "Se amplían los graneros del culto para que ningún hambre, humana o divina, quede sin servir. Mientras se levantan, el pueblo aprieta el cinturón."
 gj_dioses_hambrientos_foco_hierro_del_alba: "El Hierro del Alba"
 gj_dioses_hambrientos_foco_hierro_del_alba_desc: "Se consagran las partidas de captura: el hierro es la cuchara de Vethkar y cada cautivo es un plato. Los ejércitos cuestan más mientras se instituye el rito."
 gj_dioses_hambrientos_foco_hierro_del_alba_tt: "Este enfoque religioso permite a los seguidores de los Dioses Hambrientos declarar la guerra ritual de la Hoja del Alba."

 # ===== Lugares sagrados =====
 gj_dioses_hambrientos_mesa_de_piedra: "Mesa de piedra hambrienta"
 gj_dioses_hambrientos_mesa_de_piedra_desc: "Es un [holy_site|el] importante para todos los que siguen el [ShowReligionName('gj_dioses_hambrientos')|l]: una losa gastada donde se sirvió la primera ofrenda."
 gj_dioses_hambrientos_pozo_de_la_cuenta: "Pozo de la Cuenta"
 gj_dioses_hambrientos_pozo_de_la_cuenta_desc: "Es un [holy_site|el] importante para todos los que siguen el [ShowReligionName('gj_dioses_hambrientos')|l]: un pozo sin fondo donde los Cribadores echan una piedra por cada cautivo."

 # ===== Modificadores =====
 gj_dioses_hambrientos_banquete_de_los_dioses: "Banquete de los dioses"
 gj_dioses_hambrientos_banquete_de_los_dioses_desc: "Se ha servido una Mesa tan larga que hasta los soldados comen hasta saciarse."
 gj_dioses_hambrientos_dioses_airados: "Dioses airados"
 gj_dioses_hambrientos_dioses_airados_desc: "La Cuenta está en números rojos y los Cribadores no ocultan su inquietud."
 gj_dioses_hambrientos_hambre_del_cielo: "El hambre del cielo"
 gj_dioses_hambrientos_hambre_del_cielo_desc: "Una señal en el cielo anuncia que los dioses esperan una guerra de cosecha. Los guerreros están más ansiosos."
 gj_dioses_hambrientos_cuenta_cumplida: "La Cuenta cumplida"
 gj_dioses_hambrientos_cuenta_cumplida_desc: "Los dioses recibieron lo que se les prometió. El valor de nuestras tropas es contado en las crónicas."
 gj_dioses_hambrientos_manos_nuevas: "Manos nuevas"
 gj_dioses_hambrientos_manos_nuevas_desc: "Los cautivos trabajan campos y minas. La producción sube, y también el rencor de quienes la sostienen."
 gj_dioses_hambrientos_hijos_de_la_casa: "Hijos de la casa"
 gj_dioses_hambrientos_hijos_de_la_casa_desc: "Quienes fueron cautivos llevan ya el nombre de la casa que los acogió."
 gj_dioses_hambrientos_ayuno_penitente_mod: "Ayuno penitente"
 gj_dioses_hambrientos_ayuno_penitente_mod_desc: "El pueblo come poco para que los dioses coman más."
 gj_dioses_hambrientos_paz_del_plato: "La Gran Paz del Plato"
 gj_dioses_hambrientos_paz_del_plato_desc: "Los dioses duermen saciados y los campos, por una vez, no cobran deuda."
 gj_dioses_hambrientos_silos_bendecidos: "Silos bendecidos"
 gj_dioses_hambrientos_silos_bendecidos_desc: "El grano de los silos guardados por Daroh se conserva más tiempo."
 gj_dioses_hambrientos_pozo_bendecido: "Pozo que habla"
 gj_dioses_hambrientos_pozo_bendecido_desc: "Los fieles acuden a oír la voz del pozo."

 # ===== Acciones religiosas =====
 gj_dioses_hambrientos_ofrenda_de_cautivos: "Ofrenda de cautivos"
 gj_dioses_hambrientos_ofrenda_de_cautivos_desc: "Se ofrece en la Mesa a una parte de la población esclava. La devoción sube mucho y el hambre de los dioses se aplaca: la cuenta de años de paz vuelve a cero."
 gj_dioses_hambrientos_gran_banquete: "El Gran Banquete"
 gj_dioses_hambrientos_gran_banquete_desc: "Se gasta devoción y oro en servir una Mesa que alcance al último campesino. Durante cinco años el ánimo de las tropas y el prestigio del reino se mantienen altos."
 gj_dioses_hambrientos_ayuno_penitente: "El Ayuno Penitente"
 gj_dioses_hambrientos_ayuno_penitente_desc: "El pueblo ayuna para adelantar la ofrenda de los años de paz. Reduce en dos la cuenta de años sin guerra y da devoción a cambio de moral."

 # ===== Eventos =====
 gj_dioses_hambrientos.1.title: "Los dioses murmuran"
 gj_dioses_hambrientos.1.desc: "Tres años sin una sola columna de humo en la frontera. En los templos, los Cribadores dicen que los dioses murmuran en la noche, que el Pozo de la Cuenta devuelve un eco más hueco cada luna. Todavía hablan en voz baja."
 gj_dioses_hambrientos.1.a: "Servir una Mesa pública."
 gj_dioses_hambrientos.1.b: "Que murmuren: la paz es buena."
 gj_dioses_hambrientos.1.c: "Mostrar los silos llenos a los sacerdotes."
 gj_dioses_hambrientos.2.title: "El cántaro vacío"
 gj_dioses_hambrientos.2.desc: "Seis años de paz. Los Cribadores traen un cántaro vacío y lo dejan a los pies del trono. No dicen nada: no hace falta. Todo el mundo sabe que el cántaro se llena de una manera, y no es con grano."
 gj_dioses_hambrientos.2.a: "Dar la sangre de la propia casa."
 gj_dioses_hambrientos.2.b: "Buscar al enemigo: habrá guerra."
 gj_dioses_hambrientos.2.b.tt: "Los sacerdotes darán tres años para que se alce un ejército."
 gj_dioses_hambrientos.2.c: "Que los dioses esperen."
 gj_dioses_hambrientos.3.title: "Las filas de cautivos"
 gj_dioses_hambrientos.3.desc: "Han llegado de la frontera atados con cuerdas de esparto, con las manos llenas de tierra de otro reino. Los capitanes preguntan qué hacer con ellos, y los Cribadores se acercan para mirarlos de cerca."
 gj_dioses_hambrientos.3.a: "A la Mesa, todos."
 gj_dioses_hambrientos.3.b: "Al campo y a la mina."
 gj_dioses_hambrientos.3.c: "Darles un nombre y un techo."
 gj_dioses_hambrientos.4.title: "El cielo tiene hambre"
 gj_dioses_hambrientos.4.desc: "Una luz anómala cruza el cielo y los Cribadores la leen de una sola manera: los dioses tienen hambre, y no del hambre ordinaria. Han abierto la boca y exigen una guerra de cosecha en cinco años, o se llevarán lo suyo de nuestra devoción."
 gj_dioses_hambrientos.4.a: "Que la Cuenta se cumpla."
 gj_dioses_hambrientos.4.a.tt: "Si en cinco años no se toma una sola location en guerra, la devoción caerá en picado."
 gj_dioses_hambrientos.4.b: "Es solo una luz en el cielo."
 gj_dioses_hambrientos.5.title: "La Cuenta se cierra"
 gj_dioses_hambrientos.5.desc.a: "Pasaron los cinco años y los Cribadores han contado cada piedra del pozo: la Mesa quedó servida. Los dioses duermen, y en los templos se habla de una nueva época de abundancia."
 gj_dioses_hambrientos.5.desc.b: "Pasaron los cinco años y el pozo devuelve el eco de siempre. La guerra no llegó y los dioses cobran su deuda con intereses."
 gj_dioses_hambrientos.5.a: "La Mesa está servida."
 gj_dioses_hambrientos.5.b: "El pozo sigue vacío."
 gj_dioses_hambrientos.6.title: "El pozo que habla"
 gj_dioses_hambrientos.6.desc: "Una noche los Cribadores bajan a un cautivo al Pozo de la Cuenta con una cuerda de lino. Cuando suben la cuerda, dicen, el pozo ha hablado. Nadie más ha oído nada, pero todos quieren saber qué ha dicho."
 gj_dioses_hambrientos.6.a: "Dejar que el pozo responda."
 gj_dioses_hambrientos.6.b: "Cerrar el pozo y guardar silencio."
 gj_dioses_hambrientos.7.title: "Hijos de cautivos"
 gj_dioses_hambrientos.7.desc: "Los niños que nacieron en las casas de los vencedores hablan ya como sus amos, aunque conservan en el nombre un eco de la tierra de sus padres. Un viejo Cribador sugiere que ya es tiempo de decidir qué serán."
 gj_dioses_hambrientos.7.a: "Que lleven el nombre de la casa."
 gj_dioses_hambrientos.7.b: "Que sigan en la mina: es lo que saben hacer."
 gj_dioses_hambrientos.8.title: "Los Cribadores piden la Cuenta"
 gj_dioses_hambrientos.8.desc: "El Pozo está casi seco. Los Cribadores no piden ya: reclaman. Dicen que hace tiempo que no se sirve una Mesa digna de los dioses, y que sin devoción no hay culto, y sin culto, no hay reino."
 gj_dioses_hambrientos.8.a: "Pagar la deuda en oro."
 gj_dioses_hambrientos.8.b: "Que se las arreglen."
 gj_dioses_hambrientos.9.title: "La Mesa desborda"
 gj_dioses_hambrientos.9.desc: "La devoción rebosa y la guerra sigue abierta. En el campamento circula la noticia de que la Mesa del templo ha tenido que ensancharse. Los intendentes preguntan a quién se ha de servir primero."
 gj_dioses_hambrientos.9.a: "Repartirlo entre las tropas."
 gj_dioses_hambrientos.9.b: "Guardarlo para el invierno."
 gj_dioses_hambrientos.10.title: "El silo de Daroh"
 gj_dioses_hambrientos.10.desc: "Los Guardianes de los Silos llevan años contando granos en lugar de cabezas. Un campesino de la frontera ha abierto el silo de su aldea y lo ha encontrado intacto, con el grano igual que el día en que lo cerraron. Dice que Daroh en persona sopló sobre él."
 gj_dioses_hambrientos.10.a: "Proclamar el milagro de los silos."
 gj_dioses_hambrientos.10.b: "Honrar a los Guardianes en la corte."
 gj_dioses_hambrientos.11.title: "La Gran Paz del Plato"
 gj_dioses_hambrientos.11.desc: "Hay tanta devoción que los Cribadores no recuerdan cuándo se vio algo parecido. Dicen que los dioses duermen saciados, y que durante una generación los campos no cobrarán deuda. Hay que decidir cómo se celebra."
 gj_dioses_hambrientos.11.a: "Celebrar la Gran Paz con una Mesa por cada aldea."
 gj_dioses_hambrientos.11.b: "No hace falta tanto ruido."
