l_english:
 # Copia del castellano: esta parte no trae textos en ingles.
 gj_ank_terraza_1: "Terraza de Piedra Seca"
 gj_ank_terraza_1_desc: "Muros de piedra sin argamasa sujetan la tierra a la ladera, y cada peldaño es un campo. Los ankaruníes dicen que una montaña bien trabajada es un granero con escaleras."
 gj_ank_terraza_1_mantenimiento: "Terrazas de piedra seca"
 gj_ank_terraza_2: "Terraza de Riego Escalonado"
 gj_ank_terraza_2_desc: "Canales de agua de deshielo recorren los peldaños y reparten la humedad de arriba abajo. La cosecha deja de depender de la lluvia, y la ladera sostiene más bocas."
 gj_ank_terraza_2_mantenimiento: "Terrazas de riego"
 gj_ank_terraza_3: "Cumbre Cultivada"
 gj_ank_terraza_3_desc: "Las terrazas trepan casi hasta la nieve, con estanques que guardan el calor del día y muros que lo sueltan por la noche. Donde antes solo crecía el liquen, ahora madura el grano."
 gj_ank_terraza_3_mantenimiento: "Cumbres cultivadas"
 gj_ank_observatorio_1: "Mirador del Gnomon"
 gj_ank_observatorio_1_desc: "Un pilar de piedra clavado en la cima, con marcas que la sombra recorre a lo largo del año. De sus sombras salen la siembra, la cosecha y la fecha de las fiestas."
 gj_ank_observatorio_1_mantenimiento: "Miradores del gnomon"
 gj_ank_observatorio_2: "Observatorio del Sol Blanco"
 gj_ank_observatorio_2_desc: "Una torre con cámaras oscuras y tablas de cuerdas anudadas donde los contadores del cielo anotan cada solsticio. Los reyes consultan sus cuentas antes de decidir una guerra."
 gj_ank_observatorio_2_mantenimiento: "Observatorios del Sol Blanco"
 gj_ank_observatorio_3: "Gran Cámara de los Cómputos"
 gj_ank_observatorio_3_desc: "Una sala de cálculo con lentes de cristal pulido y archivos de siglos de eclipses. Quien manda aquí sabe cuándo se apagará el sol, y ese saber vale más que un ejército."
 gj_ank_observatorio_3_mantenimiento: "Cámaras de cómputos"
 gj_ank_cuerda_1: "Posta de Cuerda"
 gj_ank_cuerda_1_desc: "Una cabaña de relevo junto al camino, con una madeja de cuerdas anudadas que cuentan cuántos viajeros han pasado y qué llevaban. El mensaje corre más que el mensajero."
 gj_ank_cuerda_1_mantenimiento: "Postas de cuerda"
 gj_ank_cuerda_2: "Casa de las Cuerdas"
 gj_ank_cuerda_2_desc: "Un almacén de cuerdas, puentes colgantes de repuesto y mulas. Aquí se entrenan los tejedores de puentes que mantienen unidas las laderas."
 gj_ank_cuerda_2_mantenimiento: "Casas de las cuerdas"
 gj_ank_cuerda_3: "Gran Nudo de Caminos"
 gj_ank_cuerda_3_desc: "El centro de una red de caminos y pasarelas que cose el país entero. Desde él, una orden llega al último valle antes de que se enfríe la sopa."
 gj_ank_cuerda_3_mantenimiento: "Grandes nudos de caminos"
 gj_ank_paso_1: "Atalaya del Paso"
 gj_ank_paso_1_desc: "Una torre de vigilancia sobre el desfiladero, con una hoguera siempre preparada. Cuando arde, los valles de abajo cierran las puertas y suben los guardianes."
 gj_ank_paso_1_mantenimiento: "Atalayas del paso"
 gj_ank_paso_2: "Fuerte del Paso"
 gj_ank_paso_2_desc: "Muros de piedra encajados en la roca, con cisternas y almacenes de flechas. El enemigo que quiera pasar tendrá que pagar cada peldaño con sangre."
 gj_ank_paso_2_mantenimiento: "Fuertes del paso"
 gj_ank_paso_3: "Ciudadela de Cumbre"
 gj_ank_paso_3_desc: "Un nido de murallas escalonadas sobre el puerto de montaña, con baterías cubiertas y galerías de roca. Un ejército que se estrelle contra ella dejará media tropa en la nieve."
 gj_ank_paso_3_mantenimiento: "Ciudadelas de cumbre"
 gj_ank_canteria_1: "Taller de Cantería"
 gj_ank_canteria_1_desc: "Canteros que tallan la piedra de la montaña en bloques que encajan sin mortero. Su oficio pasa de padres a hijos, con las marcas de cada familia grabadas en la cara oculta."
 gj_ank_canteria_1_mantenimiento: "Talleres de cantería"
 gj_ank_canteria_2: "Casa de los Maestros Albañiles"
 gj_ank_canteria_2_desc: "Una cofradía de maestros con sus aprendices, sus plantillas de madera y sus cuerdas de medida. Un edificio de la Casa lleva su sello, y todos dicen que dura mil años."
 gj_ank_canteria_2_mantenimiento: "Casas de albañiles"
 gj_ank_canteria_3: "Hermandad de la Piedra Viva"
 gj_ank_canteria_3_desc: "Los herederos de generaciones de constructores, que han reunido todos los secretos de la talla y el levantamiento. Si hay que alzar un templo en un acantilado, ellos saben cómo."
 gj_ank_canteria_3_mantenimiento: "Hermandades de la piedra"
 gj_ank_tope_observatorio_tt: "Tope por país, según la era: 2, 3 y 4 observatorios."
 gj_ank_tope_paso_tt: "Tope por país, según la era: 3, 5 y 7 fuertes de paso."
 gj_ank_tope_canteria_tt: "Tope por país, según la era: 2, 3 y 4 talleres de cantería."
 gj_ank_guardianes_1: "Guardianes del Paso"
 gj_ank_guardianes_1_desc: "Infantería pesada de las atalayas, vestida de cuero endurecido y piedra pulida. En su montaña no hay quien la mueva, pero en la llanura se queda sin suelo bajo los pies."
 gj_ank_guardianes_2: "Guardianes Acorazados del Paso"
 gj_ank_guardianes_2_desc: "Los Guardianes se visten ahora con coraza de placas cosidas y escudos de madera reforzada. Siguen sosteniendo los desfiladeros, y siguen sufriendo en campo abierto."
 gj_ank_guardianes_3: "Guardianes de la Cumbre"
 gj_ank_guardianes_3_desc: "Armados con mosquetes de mecha y picas cortas, aguantan en los pasos como si fueran parte de la roca. Fuera de la cordillera pierden la seguridad."
 gj_ank_guardianes_4: "Guardianes Fusileros del Paso"
 gj_ank_guardianes_4_desc: "Han adoptado los fusiles de pedernal y las bayonetas. Disparan desde detrás de muros bajos que ellos mismos levantan en una noche."
 gj_ank_guardianes_5: "Guardianes de Cumbre en Línea"
 gj_ank_guardianes_5_desc: "Tropa de línea de la sierra, con uniforme gris de lana y cartucheras de piel. Son lentos en el avance, pero nadie los saca de una posición elegida."
 gj_ank_guardianes_6: "Guardianes de la Cordillera"
 gj_ank_guardianes_6_desc: "Los últimos Guardianes, con rifles de largo alcance y capotes impermeables. Son la columna de la defensa ankaruní, y siguen siendo malos atacantes en terreno llano."
 gj_ank_honderos_1: "Honderos del Sol"
 gj_ank_honderos_1_desc: "Hondas de lana trenzada y piedras de río elegidas una a una. Disparan desde las terrazas con una precisión que sorprende, pero se desmoronan si los alcanzan de cerca."
 gj_ank_honderos_2: "Honderos de Plomo"
 gj_ank_honderos_2_desc: "Han sustituido las piedras por bolas de plomo fundido y las hondas por correas de cuero doble. El alcance es mayor, y la fragilidad también."
 gj_ank_honderos_3: "Arcabuceros del Alba"
 gj_ank_honderos_3_desc: "Arcabuces ligeros de ánima corta, pensados para montar y desmontar en terreno quebrado. Tiran mejor desde la ladera que desde el llano."
 gj_ank_honderos_4: "Tiradores del Sol Alto"
 gj_ank_honderos_4_desc: "Tiradores de fusil ligero, ágiles entre las rocas. En la cordillera son un enjambre, pero un escuadrón de caballería en llano los barre."
 gj_ank_honderos_5: "Tiradores de Cumbre"
 gj_ank_honderos_5_desc: "Una infantería ligera de fusil rayado, que se mueve por las cornisas como cabras. Pegan fuerte y se rompen pronto."
 gj_ank_honderos_6: "Tiradores de la Cordillera"
 gj_ank_honderos_6_desc: "Tiradores de precisión entrenados en las terrazas. Cada uno cuenta con su cuerda de ascenso, su rifle y una noche entera para elegir blanco."
 gj_ank_porteadores_1: "Porteadores de la Cuerda"
 gj_ank_porteadores_1_desc: "Hombres y llamas que cargan víveres por las sendas de cuerda. Ningún ejército de la montaña marcha sin ellos, pero en una batalla huyen los primeros."
 gj_ank_porteadores_2: "Recuas de la Cuerda"
 gj_ank_porteadores_2_desc: "Recuas de mulas con cestos de tejido doble y arrieros que conocen cada atajo. Cargan más y gastan menos, y no valen nada en combate."
 gj_ank_porteadores_3: "Convoyes de la Cuerda"
 gj_ank_porteadores_3_desc: "Convoyes de carros ligeros y mulas para los senderos más estrechos. Alimentan a un ejército entero en una cumbre desnuda."
 gj_ank_porteadores_4: "Recuas Mayores de la Cuerda"
 gj_ank_porteadores_4_desc: "Una organización de arrieros con intendentes y libros de cuenta. Cada saco tiene su marca y cada sendero su turno."
 gj_ank_porteadores_5: "Trenes de Cuerda"
 gj_ank_porteadores_5_desc: "Trenes de carros reforzados con cuerdas de tiro y poleas de carga. Los ingenieros los diseñaron para los desfiladeros."
 gj_ank_porteadores_6: "Cuerpo de Porteadores de la Cordillera"
 gj_ank_porteadores_6_desc: "Un cuerpo profesional de transporte de montaña. Dejan a los ejércitos con la panza llena en el invierno más duro."
 gj_ank_guardianes: "Guardianes del Paso"
 gj_ank_honderos: "Honderos del Sol"
 gj_ank_porteadores: "Porteadores de la Cuerda"
 GJ_ANK_NIVELES_PASO: "Niveles de fuertes de paso"
 GJ_ANK_NIVELES_CUERDA: "Niveles de casas de cuerda"
 gj_ankaru.1.desc: "Al amanecer, los contadores del cielo suben a la cumbre con las cuerdas anudadas de sus antepasados. El primer rayo toca el gnomon de piedra y el cuerno de la siembra suena en todos los valles. Desde hoy, el Calendario Solar rige el país: cinco años de siembra, cinco de cosecha, cinco de fiesta y cinco de ayuno, y vuelta a empezar. Quien trabaje con el calendario, prosperará. Quien lo ignore, lo pagará en el invierno."
 gj_ankaru.1.a: "Que el cordel marque los años."
 gj_ankaru.1.b: "Que los sacerdotes ajusten el cómputo."
 gj_ankaru.1.title: "El Cuerno de la Siembra"
 gj_ankaru.2.desc: "Empieza la fase de la siembra. En todas las terrazas, las familias bajan con sus palos de cavar y sus sacos de semilla, y los más viejos cantan la letanía de los peldaños. Es tiempo de hundir la mano en la tierra y de confiar. Los contadores aseguran que el sol de estos cinco años será generoso con los que no se descuiden."
 gj_ankaru.2.a: "Sembrar para el pueblo."
 gj_ankaru.2.b: "Sembrar para el mercado."
 gj_ankaru.2.title: "Se Abren los Surcos"
 gj_ankaru.3.desc: "Los años de la cosecha han llegado. Las terrazas se visten de oro y los porteadores bajan por las cuerdas con el grano a cuestas. Los graneros de piedra se llenan hasta el techo, y los mercaderes extranjeros llegan por los pasos preguntando precios. Es el momento de contar y de vender."
 gj_ankaru.3.a: "Llenar los almacenes."
 gj_ankaru.3.b: "Vender sin demora."
 gj_ankaru.3.title: "La Gran Cosecha"
 gj_ankaru.4.desc: "Cinco años de fiesta empiezan hoy, y las plazas de las terrazas se llenan de máscaras de oro y de danzas en espiral. Los ricos reparten maíz tostado, los pobres reparten canciones y todo el mundo hace las paces. Si en estos años se apagase el sol, sería un presagio de grandeza."
 gj_ankaru.4.a: "Que dure siete días."
 gj_ankaru.4.b: "Una fiesta sobria."
 gj_ankaru.4.title: "Los Días Largos del Festival"
 gj_ankaru.5.desc: "Cuando las últimas máscaras vuelven a sus cofres, empieza el ayuno. Durante cinco años los templos piden austeridad y los obreros piden pan, y entre una cosa y otra se levantan más muros y más escalinatas que en ninguna otra época. El sol blanco quiere ver las manos de su pueblo ocupadas, no vacías."
 gj_ankaru.5.a: "Que se ayune con rigor."
 gj_ankaru.5.b: "Que los obreros coman."
 gj_ankaru.5.title: "El Ayuno de las Cumbres"
 gj_ankaru.6.desc: "En pleno festival, a mediodía, la sombra se come el sol. Un silencio inmenso cubre las terrazas y las máscaras de oro dejan de bailar. Entonces, el borde del disco negro se enciende en un anillo de fuego blanco y una oleada de gritos sube de las plazas. Los contadores lo habían escrito en las cuerdas hacía siglos: es la corona del Sol, la señal de que su pueblo es el elegido."
 gj_ankaru.6.a: "Es la corona de nuestro pueblo."
 gj_ankaru.6.b: "Que lo midan los contadores."
 gj_ankaru.6.title: "El Sol Coronado"
 gj_ankaru.7.desc: "En pleno ayuno, a mediodía, el sol se apaga. Las obras se detienen, los obreros se arrodillan sobre las piedras y las madres tapan los ojos de los niños. Los sacerdotes gritan que el Sol ha vuelto la cara a un pueblo que no ayunó bastante. Cuando la luz vuelve, nadie recuerda lo que se dijo, pero todos recuerdan el miedo."
 gj_ankaru.7.a: "Doblar el ayuno."
 gj_ankaru.7.b: "Era solo una sombra, y lo sabíamos."
 gj_ankaru.7.title: "La Noche del Ayuno"
 gj_ankaru.8.desc: "Un velo oscuro cruza el sol de lado a lado, entre una fase del calendario y otra. No coincide con ninguna fiesta ni con ningún ayuno, y los sacerdotes discuten durante días si es un buen presagio o uno malo. Los contadores se limitan a anotar la hora, el color del cielo y la dirección de las sombras."
 gj_ankaru.8.a: "Anotarlo en los nudos."
 gj_ankaru.8.b: "Que los contadores lo estudien."
 gj_ankaru.8.title: "Sombra sobre las Terrazas"
 gj_ankaru.9.desc: "Después de las lluvias, una terraza entera se ha deslizado ladera abajo con sus cultivos y sus muros. Nadie ha muerto, pero los vecinos de [target_location.GetName] miran el hueco con la misma cara que se pone ante una herida. Hay que decidir si se reconstruye con piedra nueva o si se deja que la montaña se asiente."
 gj_ankaru.9.a: "Reconstruir con piedra nueva."
 gj_ankaru.9.b: "Dejar que la ladera se asiente."
 gj_ankaru.9.title: "El Peldaño que Cedió"
 gj_ankaru.10.desc: "El Mirador del Norte y el Mirador del Sur han llegado a dos cómputos distintos para el próximo solsticio. La diferencia es de tres días, pero tres días de siembra o de fiesta pueden decidir un año entero. Cada bando tiene sus cuerdas, sus cálculos y sus partidarios en la corte."
 gj_ankaru.10.a: "Seguir al Mirador del Norte."
 gj_ankaru.10.b: "Seguir al Mirador del Sur."
 gj_ankaru.10.c: "Pedir un tercer cómputo."
 gj_ankaru.10.title: "Los Contadores Discrepan"
 gj_ankaru.11.desc: "Un viejo cantero de las laderas del norte ha trazado, sin más ayuda que una cuerda y unas estacas, un puente colgante que salva un barranco donde antes se tardaba un día en cruzar. Dice que no sabe leer, pero que la piedra le habla. Los constructores de la corte quieren conocerlo."
 gj_ankaru.11.a: "Darle casa y nombre."
 gj_ankaru.11.b: "Que enseñe a los demás."
 gj_ankaru.11.title: "El Maestro de Obras"
 gj_ankaru.12.desc: "Una larga fila de peregrinos extranjeros llega a los pies de la cordillera. Han oído hablar de los gnomones y quieren ver con sus ojos cómo el sol obedece a la piedra. Traen poco dinero y mucha hambre, y los guardias del paso se preguntan si dejarlos pasar o cobrarles."
 gj_ankaru.12.a: "Alojarlos en las terrazas."
 gj_ankaru.12.b: "Cobrar el paso."
 gj_ankaru.12.title: "Los Peregrinos de la Cumbre"
 gj_ankaru.13.desc: "Los porteadores han encontrado sacos de sal sin sello ni marca de aduana ocultos entre los cestos de maíz. Alguien está burlando el impuesto de las atalayas, y lo hace con la ayuda de los que deberían vigilar. La sal es barata, pero el ejemplo sale caro."
 gj_ankaru.13.a: "Cerrar los pasos."
 gj_ankaru.13.b: "Mirar a otro lado."
 gj_ankaru.13.title: "Sal en la Cuerda"
 gj_ankaru.14.desc: "Los vigías del paso han visto, al otro lado de la cordillera, una larga columna de humo rojizo que no es de ninguna cocina. Los que bajan de las selvas altas dicen que los señores carmesíes preparan otra de sus campañas de cautivos. Los Guardianes piden refuerzos y los consejeros piden calma."
 gj_ankaru.14.a: "Doblar las guardias."
 gj_ankaru.14.b: "Mandar una embajada con sal y lana."
 gj_ankaru.14.title: "Humo en el Paso"
 gj_ankaru.15.desc: "Una treintena de familias han cruzado la cordillera de noche, descalzas y sin equipaje. Cuentan que escaparon de las listas de ofrendas de la Hegemonía. Los jueces del paso no saben qué hacer con ellas, y los sacerdotes del Sol Blanco preguntan si su sangre es digna de las terrazas."
 gj_ankaru.15.a: "Acogerlas en las terrazas."
 gj_ankaru.15.b: "Devolverlas al paso."
 gj_ankaru.15.title: "Los que Cruzaron la Cumbre"
 gj_ankaru.16.desc: "Los valles bajos están llenos y las laderas altas, vacías. Una asamblea de familias jóvenes ha presentado a la corte una petición firmada con nudos: quieren que se les asigne tierra en las terrazas nuevas, a cambio de cuidar los caminos de cuerda. Dicen que prefieren una montaña difícil a un valle donde no caben."
 gj_ankaru.16.a: "Abrir el camino a los colonos."
 gj_ankaru.16.b: "Que se queden donde nacieron."
 gj_ankaru.16.title: "Los Hijos de la Cuerda"
 gj_ankaru.17.desc: "Una noche de cielo limpio, mucho antes de lo previsto, el aire de las alturas baja a las terrazas y se lleva el verde de los brotes. Los campesinos corren con braseros y mantas de lana para proteger lo que se pueda. El invierno ha llegado antes que los contadores."
 gj_ankaru.17.a: "Encender fuegos en las terrazas."
 gj_ankaru.17.b: "Resignarse."
 gj_ankaru.17.title: "Helada Temprana"
 gj_ankaru.18.desc: "Este año las espigas son tan pesadas que se doblan hasta tocar los muros de piedra. Los viejos aseguran que no recuerdan nada igual, y los contadores revisan sus cuerdas buscando la razón. Hay tanto grano que los graneros no bastan para guardarlo y las mulas no bastan para llevarlo."
 gj_ankaru.18.a: "Llenar los graneros."
 gj_ankaru.18.b: "Vender el excedente."
 gj_ankaru.18.title: "La Cosecha Prodigiosa"
 gj_ankaru.19.desc: "Los maestros de la cantería se reúnen en el patio de un templo sin techo para jurar el viejo secreto de la piedra. Piden que se reconozcan sus marcas, sus fueros y su derecho a elegir a sus aprendices. A cambio prometen que los edificios del reino durarán mil años. La corte duda de si es un juramento o una exigencia."
 gj_ankaru.19.a: "Aceptar sus fueros."
 gj_ankaru.19.b: "Rechazarlos."
 gj_ankaru.19.title: "El Juramento de los Albañiles"
 gj_ankaru.20.desc.a: "Los contadores anuncian que el viejo gnomon ya no basta. Con nuevos instrumentos de bronce y tablas más finas, el calendario se ajusta al día. Es el amanecer de una era de cálculo, y los reyes lo saben."
 gj_ankaru.20.desc.b: "Los viajeros hablan de mares que se cruzan siguiendo estrellas, y los contadores compran sus mapas. El calendario del Sol se abre al cielo entero, y el Mirador reúne a sabios de países lejanos."
 gj_ankaru.20.desc.c: "Las ideas y las dudas corren por los caminos de cuerda tan deprisa como los mensajes. Los contadores discuten por escrito si el cielo es un reloj o una escritura. El calendario sobrevive, pero ya no es la única voz."
 gj_ankaru.20.desc.d: "La corte exige que cada cuenta tenga su registro y cada nudo su copia en papel. Los contadores se vuelven burócratas del sol, y el calendario se imprime y se reparte por los valles."
 gj_ankaru.20.desc.e: "Las máquinas y las fábricas amenazan con romper el ritmo de las estaciones. Los contadores defienden el calendario con cifras nuevas: cinco años para sembrar, cinco para recoger. Una era nueva exige un cómputo nuevo."
 gj_ankaru.20.desc.z: "Los contadores del cielo se reúnen y anuncian que una era nueva exige un cómputo nuevo."
 gj_ankaru.20.a: "Fijar el nuevo cómputo."
 gj_ankaru.20.b: "Guardar el viejo cómputo."
 gj_ankaru.20.title: "Una Nueva Era del Cómputo"
 gj_ankaru.21.desc: "Han pasado los años de la gran obra y los campesinos vuelven a mirar sus propios campos. Quedan escalinatas nuevas, puentes nuevos y callos viejos. Los maestros de obra piden que se premie a los obreros más tenaces, y los capataces preguntan cuándo será la próxima llamada."
 gj_ankaru.21.a: "Que vuelvan a sus campos."
 gj_ankaru.21.b: "Honrar a los obreros."
 gj_ankaru.21.title: "El Descanso de la Cuerda"
 gj_ank_cuerda_y_nudo: "La Cuerda y el Nudo"
 gj_ank_cuerda_y_nudo_desc: "Los ankaruníes llevan sus cuentas, sus leyes y sus mensajes en cuerdas anudadas. Un buen nudo no se olvida ni se falsifica, y una buena cuerda cuelga puentes sobre los barrancos. Con ella se mide, se construye y se manda."
 gj_ank_terrazas_del_sol: "Las Terrazas del Sol"
 gj_ank_terrazas_del_sol_desc: "Cada ladera es un granero esperando a que alguien le ponga escalones. Los constructores aprenden a encajar la piedra seca, a guiar el agua de deshielo y a plantar cada peldaño con lo que mejor le sienta."
 gj_ank_calendario_de_piedra: "El Calendario de Piedra"
 gj_ank_calendario_de_piedra_desc: "En la cima de cada valle se levanta un pilar cuya sombra cuenta los días. Los ankaruníes han descubierto que quien domina el calendario domina la siembra, la fiesta y el miedo."
 gj_ank_paso_guardado: "El Paso Guardado"
 gj_ank_paso_guardado_desc: "Los desfiladeros de la cordillera son su muralla. Cada paso tiene su atalaya, su hoguera y su guarnición de Guardianes, y cada valle sabe de memoria cuántas horas tardan en subir."
 gj_ank_contadores_del_cielo: "Los Contadores del Cielo"
 gj_ank_contadores_del_cielo_desc: "Una cofradía de sabios dedica su vida a anotar el movimiento del sol y de los astros en cuerdas de colores. Sus cómputos fijan el calendario, y su consejo pesa tanto como el de los generales."
 gj_ank_caminos_de_cuerda: "Los Caminos de Cuerda"
 gj_ank_caminos_de_cuerda_desc: "Pasarelas colgantes, escalinatas talladas y postas de relevo cosen las laderas entre sí. Un mensajero cruza el país en una semana, y un ejército de montaña marcha sin perderse."
 gj_ank_hijos_del_valle: "Los Hijos del Valle"
 gj_ank_hijos_del_valle_desc: "Los valles bajos están llenos, y los jóvenes buscan tierra en las alturas. La corte organiza las partidas de colonos y reparte las terrazas nuevas entre las familias, para que ninguna ladera quede vacía."
 gj_ank_escudo_de_piedra: "El Escudo de Piedra"
 gj_ank_escudo_de_piedra_desc: "Armaduras de placas cosidas, escudos de madera reforzada y una disciplina de montaña. Los Guardianes del Paso se instruyen para resistir en lo alto, y no para perseguir en el llano."
 gj_ank_cuerda_mayor: "La Cuerda Mayor"
 gj_ank_cuerda_mayor_desc: "Los maestros de obra reúnen en una sola cuerda trenzada las reglas de medida de todo el país. Los edificios se trazan por el mismo patrón, y los capataces se entienden de un valle a otro."
 gj_ank_terrazas_altas: "Las Terrazas Altas"
 gj_ank_terrazas_altas_desc: "El riego escalonado permite subir los cultivos hasta donde antes solo pastaban las llamas. Las laderas más duras producen ya su primera cosecha, y los pueblos de las alturas dejan de depender del valle."
 gj_ank_observatorio_mayor: "El Observatorio Mayor"
 gj_ank_observatorio_mayor_desc: "Una torre con lentes de cristal pulido y cámaras oscuras sube sobre la capital. Los contadores calculan eclipses con años de antelación y los reyes consultan sus tablas antes de decidir."
 gj_ank_paso_bastionado: "El Paso Bastionado"
 gj_ank_paso_bastionado_desc: "Los muros de las atalayas se ensanchan para recibir cañones y arcabuces. Los Guardianes aprenden a disparar desde detrás de la roca, y los Honderos del Sol cambian la piedra por el plomo."
 gj_ank_gremio_de_canteros: "El Gremio de Canteros"
 gj_ank_gremio_de_canteros_desc: "Los maestros albañiles se organizan en una hermandad con sus sellos, sus fueros y sus aprendices. Su piedra sale de las canteras sin desperdicio y su obra dura siglos."
 gj_ank_graneros_del_sol: "Los Graneros del Sol"
 gj_ank_graneros_del_sol_desc: "Torres de piedra con ventilación cruzada guardan el grano de una cosecha a otra. Con ellos, una mala siembra deja de ser una catástrofe, y los años buenos se convierten en reserva."
 gj_ank_ciencia_del_eclipse: "La Ciencia del Eclipse"
 gj_ank_ciencia_del_eclipse_desc: "Los contadores han reunido siglos de eclipses en archivos que nadie más posee. Saben cuándo llegará el siguiente, y esa certeza vale más que un ejército."
 gj_ank_guardia_de_la_cumbre: "La Guardia de la Cumbre"
 gj_ank_guardia_de_la_cumbre_desc: "Una tropa reglada de fusileros de montaña, con oficiales formados en las atalayas y uniformes de lana gruesa. Aguantan una semana de nevada donde otros aguantan una hora."
 gj_ank_cuerda_eterna: "La Cuerda Eterna"
 gj_ank_cuerda_eterna_desc: "Un solo sistema de caminos, puentes y postas recorre el país entero. Quien lo construyó ha muerto, pero su cuerda sigue sosteniendo las laderas, y cada generación la repara."
 gj_ank_cumbre_cultivada: "La Cumbre Cultivada"
 gj_ank_cumbre_cultivada_desc: "Hasta las cumbres más altas tienen su terraza, su estanque de calor y su observatorio. Donde antes solo había hielo, ahora hay un pueblo y un campo, y la gente sube allí a ver el sol."
 gj_ank_ciudadela_de_cumbre: "La Ciudadela de Cumbre"
 gj_ank_ciudadela_de_cumbre_desc: "Murallas escalonadas, baterías cubiertas y galerías de roca guardan los pasos principales. Quien intente forzarlas deberá dejar medio ejército en la nieve."
 gj_ank_obra_de_mil_anios: "La Obra de Mil Años"
 gj_ank_obra_de_mil_anios_desc: "Los constructores ankaruníes se proponen dejar obras que sobrevivan a su propio país. Cada edificio se piensa para el siglo que viene, y la eficiencia de los talleres no deja de crecer."
 gj_ank_ciencia_solar: "La Ciencia Solar"
 gj_ank_ciencia_solar_desc: "La vieja astronomía se funde con las matemáticas y la ingeniería. Las escuelas del Sol Blanco forman a sabios que miden el cielo, el suelo y el aire con la misma regla."
 gj_ank_guardia_de_la_cordillera: "La Guardia de la Cordillera"
 gj_ank_guardia_de_la_cordillera_desc: "El último cuerpo de Guardianes: rifles de largo alcance, capotes impermeables y un orgullo de piedra. Son la columna de la defensa ankaruní."
 gj_ank_cultura_nudos_de_memoria: "Los Nudos de la Memoria"
 gj_ank_cultura_nudos_de_memoria_desc: "Los ankaruníes cuentan su historia en cuerdas anudadas que los ancianos leen con los dedos. Una cuerda bien guardada vale por una biblioteca, y quien la lee aprende quién fue su pueblo."
 gj_ank_cultura_hijos_del_sol: "Los Hijos del Sol"
 gj_ank_cultura_hijos_del_sol_desc: "Un pueblo que se sabe elegido soporta mejor los inviernos y las desgracias. La fe en el Sol da fuerza a los enfermos y paciencia a los gobernantes."
 gj_ank_cultura_mano_de_piedra: "La Mano de Piedra"
 gj_ank_cultura_mano_de_piedra_desc: "Los niños ankaruníes aprenden a tallar antes que a escribir. Cada familia tiene su marca de cantero, y las ciudades se levantan con el pulso de muchas manos."
 gj_ank_gobierno_del_cordel: "El Gobierno del Cordel"
 gj_ank_gobierno_del_cordel_desc: "Cada magistrado lleva su cuerda de medida y cada decreto se anuda antes de proclamarse. El Estado se sostiene sobre registros públicos y una disciplina que a veces fastidia, pero que levanta puentes."
 gj_ank_regencia_del_gnomon: "La Regencia del Gnomon"
 gj_ank_regencia_del_gnomon_desc: "El trono se somete al consejo de los contadores, que fija con el calendario las fechas de las decisiones importantes. El rey manda, pero el gnomon decide cuándo."
 gj_ank_concordia_de_las_cumbres: "La Concordia de las Cumbres"
 gj_ank_concordia_de_las_cumbres_desc: "Las altas casas, los gremios y los templos firman un pacto de reparto de cargas y de tierras. A cambio de la estabilidad, cada estamento cede un poco de su poder."
 gj_ankaruno: "Ankaruní"
 gj_ankaruno_desc: "Los ankaruníes son un pueblo de terrazas y de cielo abierto. Sus campos suben por las montañas como peldaños, y sus sacerdotes cuentan los años por el sol. Dicen que quien construye hacia arriba nunca llega tarde."
 gj_grupo_solar: "Solar"
 gj_grupo_solar_desc: "Los pueblos solares viven en una cordillera de valles altos y pasos estrechos. Todos comparten la costumbre de contar el tiempo por el sol, de hablar con cuerdas y de construir hacia arriba."
 gj_lengua_ankaruna: "Ankaruna"
 gj_lengua_ankaruna_desc: "Una lengua de sílabas abiertas y vocales largas, nacida en los valles altos. Se escribe con cuerdas y nudos, y las palabras que más se repiten son las de la piedra, el sol y el camino."
 gj_ank_cuerda_del_trabajo.title: "La Cuerda del Trabajo"
 gj_ank_cuerda_del_trabajo.desc: "El rey hace sonar el cuerno de la gran obra y los campesinos de las terrazas suben por las cuerdas con picos y cestos. Durante años, las obras salen más baratas y se levantan más deprisa, pero los campos se descuidan y el pueblo murmura. La Cuerda se tensa, y quien la tensa debe saber cuándo soltarla."
 gj_ank_cuerda_del_trabajo.a: "Que suene el cuerno."
 gj_ank_colonos_del_sol.title: "Los Colonos del Sol"
 gj_ank_colonos_del_sol.desc: "Los valles bajos rebosan de gente y las terrazas altas tienen sitio de sobra. La corte organiza una partida de familias, con mulas, semillas y un guía de cuerda, para que pueblen las laderas vacías. La mudanza es dura, pero la montaña da más de lo que parece."
 gj_ank_colonos_del_sol.a: "Que partan los colonos."
 gj_ank_consagrar_gnomon.title: "Consagrar un Gnomon"
 gj_ank_consagrar_gnomon.desc: "Un gnomon es un pilar de piedra cuya sombra cuenta los días. Levantar uno en la capital es una obra santa, que reúne a los contadores, a los canteros y a los sacerdotes, y que da a la corte su propio Mirador."
 gj_ank_consagrar_gnomon.a: "Que se levante el pilar."
 gj_ank_consagrar_gnomon: "Consagración del gnomon"
 gj_ank_concilio_de_computos.title: "El Concilio de los Cómputos"
 gj_ank_concilio_de_computos.desc: "Los contadores del cielo llegan de todos los valles con sus cuerdas y sus tablas. Durante una década, se reúnen en la capital para cotejar los cómputos y fijar uno solo. Es un gasto enorme, y una de las empresas más sabias del reino."
 gj_ank_concilio_de_computos.a: "Que se reúnan los contadores."
