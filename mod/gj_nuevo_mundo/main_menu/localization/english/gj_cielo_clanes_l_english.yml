l_english:
 # Copia del castellano: esta parte no trae textos en ingles.
 gj_cielo_clanes: "Cielo de los Clanes"
 gj_cielo_clanes_ADJ: "del Cielo"
 gj_cielo_clanes_desc: "Los clanes de la estepa no rezan a un solo dios, sino a seis, y cada kan elige a cuál servirá durante su reinado. Bajo Aurak, el Cielo Abierto, se juran las leyes; con Ilsa crecen las yeguadas; Korvun guía a los jinetes; Halet abre caminos; Mura guarda los pozos; y Dzerek, el Lobo Gris, acompaña a los que cazan de noche. Cuando el kan muere, el dios cae con él, y el siguiente alza otro pabellón. El Cielo concede su favor a quien lo escucha y lo retira a quien lo olvida."

 gj_aurak_god: "Aurak, el Cielo Abierto"
 gj_aurak_god_desc: "Aurak es el cielo sin nubes sobre la estepa. Bajo su pabellón se juran las leyes y se cumplen las deudas, porque nada puede ocultarse a su mirada."
 gj_ilsa_god: "Ilsa, la Madre de las Yeguadas"
 gj_ilsa_god_desc: "Ilsa dio el primer potro al primer clan. Sus fieles cuentan los años por las crías, y un reinado a su sombra se mide en manadas."
 gj_korvun_god: "Korvun, el Jinete sin Rostro"
 gj_korvun_god_desc: "Nadie ha visto el rostro de Korvun, que cabalga delante de todos los ejércitos. Los kanes que lo eligen declaran que su reinado será de guerra y pagan con la paz de su tienda."
 gj_halet_god: "Halet, la Voz del Viento"
 gj_halet_god_desc: "Halet habla en el viento del oeste y guía a las caravanas y a los exploradores. Un reinado bajo su voz alcanza más lejos, pero deja el hogar sin defensa."
 gj_mura_god: "Mura, la Señora de las Aguas Quietas"
 gj_mura_god_desc: "Mura habita los lagos, los pozos y los vados. Bajo su cuidado hay pastos verdes y orillas pobladas, aunque los jinetes se vuelven más mansos."
 gj_dzerek_god: "Dzerek, el Lobo Gris de la Noche"
 gj_dzerek_god_desc: "Dzerek corre por la noche delante de los saqueadores y detrás de los fugitivos. Su reinado es de botín y de rastro, y deja a su kan con pocos amigos."

 gj_aspecto_pabellon_alto: "El Pabellón Alto"
 gj_aspecto_pabellon_alto_desc: "Un solo mástil, un solo kan, una sola ley. Los clanes aceptan la autoridad del que alza el pabellón más alto."
 gj_aspecto_tienda_abierta: "La Tienda Abierta"
 gj_aspecto_tienda_abierta_desc: "Nadie pregunta su fe a quien llega con sed. Las tiendas se abren a los forasteros y las caravanas llegan más lejos."
 gj_aspecto_yeguada_sagrada: "La Yeguada Sagrada"
 gj_aspecto_yeguada_sagrada_desc: "Cada potro nace con un nombre y con una deuda. Los criadores son sacerdotes, y los jinetes montan con devoción."
 gj_aspecto_fuego_de_los_nombres: "El Fuego de los Nombres"
 gj_aspecto_fuego_de_los_nombres_desc: "Cada noche se pronuncian los nombres de los muertos junto al fuego. Quien combate con ellos al lado gana renombre, y mudar el campamento ya no cuesta tanto."

 gj_cielo_mastil: "Mástil del Cielo"
 gj_cielo_mastil_desc: "Un tronco enorme, hincado en lo más alto de la llanura y adornado con colas de caballo. Los clanes acuden a él para jurar y para pedir un reinado propicio."
 gj_cielo_cairn: "Cairn de los Nombres"
 gj_cielo_cairn_desc: "Un montón de piedras en el que cada antepasado ha dejado la suya. Los clanes lo visitan para recitar los nombres y renovar las alianzas."

 STATIC_MODIFIER_NAME_gj_reino_aurak: "Reinado de Aurak"
 STATIC_MODIFIER_DESC_gj_reino_aurak: "El kan reina bajo el Cielo Abierto: ley firme, pero pocos jinetes dispuestos a marchar."
 STATIC_MODIFIER_NAME_gj_reino_ilsa: "Reinado de Ilsa"
 STATIC_MODIFIER_DESC_gj_reino_ilsa: "El kan reina bajo la Madre de las Yeguadas: muchos potros y pueblo creciente, aunque la caballería pesada sufre."
 STATIC_MODIFIER_NAME_gj_reino_korvun: "Reinado de Korvun"
 STATIC_MODIFIER_DESC_gj_reino_korvun: "El kan reina bajo el Jinete sin Rostro: caballería temible, pero un reino sin paz ni legitimidad estable."
 STATIC_MODIFIER_NAME_gj_reino_halet: "Reinado de Halet"
 STATIC_MODIFIER_DESC_gj_reino_halet: "El kan reina bajo la Voz del Viento: ejércitos veloces y caravanas lejanas, pero poca defensa en casa."
 STATIC_MODIFIER_NAME_gj_reino_mura: "Reinado de Mura"
 STATIC_MODIFIER_DESC_gj_reino_mura: "El kan reina bajo la Señora de las Aguas Quietas: comida abundante y marineros firmes, pero jinetes menos fieros."
 STATIC_MODIFIER_NAME_gj_reino_dzerek: "Reinado de Dzerek"
 STATIC_MODIFIER_DESC_gj_reino_dzerek: "El kan reina bajo el Lobo Gris: los enemigos pierden hombres en el rastro y el botín crece, pero el prestigio mengua."
 STATIC_MODIFIER_NAME_gj_favor_del_cielo: "Favor del Cielo"
 STATIC_MODIFIER_DESC_gj_favor_del_cielo: "Los clanes interpretan cada señal a nuestro favor."
 STATIC_MODIFIER_NAME_gj_ceno_del_cielo: "Ceño del Cielo"
 STATIC_MODIFIER_DESC_gj_ceno_del_cielo: "Los clanes murmuran que el Cielo nos ha dado la espalda."
 STATIC_MODIFIER_NAME_gj_fiesta_cuatro_lunas: "Las cuatro lunas"
 STATIC_MODIFIER_DESC_gj_fiesta_cuatro_lunas: "La fiesta de los pastos ha dejado buena sangre y mejores nacimientos."
 STATIC_MODIFIER_NAME_gj_pabellon_caido: "Pabellón caído"
 STATIC_MODIFIER_DESC_gj_pabellon_caido: "El pabellón del Cielo cayó y nadie lo alzó a tiempo."
 STATIC_MODIFIER_NAME_gj_presagio_cometa: "Bajo el cometa"
 STATIC_MODIFIER_DESC_gj_presagio_cometa: "Los jinetes creen que la estrella con cola cabalga con ellos."
 STATIC_MODIFIER_NAME_gj_presagio_eclipse_malo: "Cielo cerrado"
 STATIC_MODIFIER_DESC_gj_presagio_eclipse_malo: "El Cielo se cerró sobre nosotros y los clanes temen lo que viene."
 STATIC_MODIFIER_NAME_gj_presagio_eclipse_bueno: "Noche a mediodía"
 STATIC_MODIFIER_DESC_gj_presagio_eclipse_bueno: "El Lobo y el Jinete salieron de día y los enemigos aún tiemblan."
 STATIC_MODIFIER_NAME_gj_dios_cambiado: "Pabellón mudado"
 STATIC_MODIFIER_DESC_gj_dios_cambiado: "Cambiar de dios a mitad de reinado ha sembrado dudas entre los clanes."
 STATIC_MODIFIER_NAME_gj_cielo_reconciliado: "El Cielo reconciliado"
 STATIC_MODIFIER_DESC_gj_cielo_reconciliado: "Cuatro reinados han pasado sin romper el pacto: los seis dioses sonríen a la vez."
 STATIC_MODIFIER_NAME_gj_potros_de_oro: "Potros de dos colores"
 STATIC_MODIFIER_DESC_gj_potros_de_oro: "Nacieron potros de pelaje nunca visto, y los criadores dicen que Ilsa los bendijo."
 STATIC_MODIFIER_NAME_gj_hermandad_de_lobos: "Hermandad de lobos"
 STATIC_MODIFIER_DESC_gj_hermandad_de_lobos: "Los jinetes han jurado seguirse como una jauría."
 STATIC_MODIFIER_NAME_gj_peregrino_del_mastil: "Peregrino del Mástil"
 STATIC_MODIFIER_DESC_gj_peregrino_del_mastil: "El kan ha rezado al pie del Mástil del Cielo y los clanes lo saben."

 gj_cielo_clanes_alzar_pabellon.title: "Alzar el pabellón de otro dios"
 gj_cielo_clanes_alzar_pabellon.desc: "El dios de este reinado ya no nos sirve. Se puede alzar un pabellón nuevo, a un precio en oro y en dudas de los clanes."
 gj_cielo_clanes_alzar_pabellon.a: "Mudemos de dios."
 gj_cielo_clanes_peregrinacion.title: "Peregrinación al Mástil del Cielo"
 gj_cielo_clanes_peregrinacion.desc: "El kan y su séquito viajarán hasta el Mástil del Cielo para renovar el pacto con los dioses. El viaje es largo y caro."
 gj_cielo_clanes_peregrinacion.a: "Que parta la comitiva."

 gj_cielo_clanes.1.title: "El dios del reinado"
 gj_cielo_clanes.1.desc: "Cuando un kan sube al trono, los clanes se reúnen al pie del mástil para saber a qué dios servirá. [target_character.GetName] tiene que alzar su pabellón, y el pabellón que alce dirá a los clanes qué clase de reinado les espera."
 gj_cielo_clanes.1.a: "Aurak, el Cielo Abierto: ley y juramento."
 gj_cielo_clanes.1.b: "Ilsa, la Madre de las Yeguadas: potros y crecimiento."
 gj_cielo_clanes.1.c: "Korvun, el Jinete sin Rostro: guerra."
 gj_cielo_clanes.1.d: "Halet, la Voz del Viento: caminos y caravanas."
 gj_cielo_clanes.1.e: "Mura, la Señora de las Aguas Quietas: comida y orillas."
 gj_cielo_clanes.1.f: "Dzerek, el Lobo Gris: botín y rastro."

 gj_cielo_clanes.2.title: "El pabellón del Cielo cae"
 gj_cielo_clanes.2.desc: "Una ráfaga ha derribado el pabellón sagrado del kan y los clanes lo han visto caer. Se murmura que el dios del reinado ha retirado su mano, aunque quizá solo fue el viento."
 gj_cielo_clanes.2.a: "Alzadlo de nuevo, con ofrendas."
 gj_cielo_clanes.2.b: "Es solo viento. Que lo alcen los criados."

 gj_cielo_clanes.3.title: "Las cuatro lunas"
 gj_cielo_clanes.3.desc: "Llega la primavera de los pastos, y con ella las cuatro lunas, la fiesta en que los clanes comparten mesa, carreras y matrimonios. Los ancianos piden que el kan la costee."
 gj_cielo_clanes.3.a: "Que sea una fiesta como no se ha visto."
 gj_cielo_clanes.3.b: "Una fiesta sencilla, como siempre."

 gj_cielo_clanes.4.title: "Un cometa sobre el campamento"
 gj_cielo_clanes.4.desc: "Una estrella con cola cruza el cielo durante nueve noches. Los chamanes del mástil se reúnen a leerla, y cada uno la interpreta según el dios al que sirve el kan."
 gj_cielo_clanes.4.a: "Que cada uno lea lo que vea."

 gj_cielo_clanes.5.title: "El viejo del mástil"
 gj_cielo_clanes.5.desc: "Un anciano, más viejo que el campamento, se presenta ante [target_character.GetName] y asegura haber sido testigo del primer reinado. Pide una limosna a cambio de la historia de los primeros kanes."
 gj_cielo_clanes.5.a: "Que se siente y que cuente. Se le paga bien."
 gj_cielo_clanes.5.b: "Los viejos mienten. Que se vaya."

 gj_cielo_clanes.6.title: "El día que se cerró el Cielo"
 gj_cielo_clanes.6.desc: "A mediodía la luz se apaga como una tienda sin fuego. Las yeguadas se agitan y los niños lloran. Los chamanes dicen que el Cielo se ha cerrado, y los clanes esperan una señal del kan."
 gj_cielo_clanes.6.a: "Esperemos a ver qué dice el dios de este reinado."

 gj_cielo_clanes.7.title: "Potros de dos colores"
 gj_cielo_clanes.7.desc: "Han nacido potros de dos colores en la yeguada del kan, y los criadores aseguran que Ilsa los ha enviado. Piden criar solo de ellos, lo cual encarece la monta."
 gj_cielo_clanes.7.a: "Que se críen para la guerra y el comercio."
 gj_cielo_clanes.7.b: "Que se vendan a los mercaderes."

 gj_cielo_clanes.8.title: "Dos clanes, un rito"
 gj_cielo_clanes.8.desc: "Dos clanes discuten la forma correcta del rito del cambio de pastos: unos quieren hacerlo al amanecer, ante el fuego; otros, de noche, entre los nombres. Ambos exigen que el kan decida."
 gj_cielo_clanes.8.a: "Que mande el fuego del amanecer."
 gj_cielo_clanes.8.b: "Que mande la noche de los nombres."
 gj_cielo_clanes.8.c: "Que hagan los dos y que se aguanten."

 gj_cielo_clanes.9.title: "La hermandad de los lobos"
 gj_cielo_clanes.9.desc: "En la vigilia de la batalla, los jinetes de varias tiendas se cortan la palma y juran seguirse como una jauría. Es un rito viejo, que solo se hace bajo Korvun o el Lobo Gris."
 gj_cielo_clanes.9.a: "Que lo juren todos."
 gj_cielo_clanes.9.b: "Que lo hagan los oficiales y nadie más."

 gj_cielo_clanes.10.title: "Peregrinación al Mástil"
 gj_cielo_clanes.10.desc: "El kan y su séquito han llegado al Mástil del Cielo, tras semanas de camino. Al pie del tronco, entre las colas de caballo, los chamanes aceptan la ofrenda y recitan el nombre del dios del reinado."
 gj_cielo_clanes.10.a: "El Cielo ha oído."

 gj_cielo_clanes.11.title: "El Cielo se reconcilia"
 gj_cielo_clanes.11.desc: "Han pasado cuatro reinados sin que un solo dios fuera ofendido. En la última noche del año, los seis pabellones se alzan a la vez en el campamento, y los chamanes dicen que no ocurría desde antes de los primeros kanes."
 gj_cielo_clanes.11.a: "Que se recuerde para siempre."

 gj_cielo_clanes.12.title: "Recalculo del favor"
 gj_cielo_clanes.12.desc: "Evento oculto: recalcula cada año el favor del Cielo."