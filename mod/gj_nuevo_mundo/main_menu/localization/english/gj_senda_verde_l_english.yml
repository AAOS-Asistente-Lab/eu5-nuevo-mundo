l_english:
 # Copia del castellano: esta parte no trae textos en ingles.
 # Religion
 gj_senda_verde: "La Senda Verde"
 gj_senda_verde_ADJ: "de la Senda Verde"
 gj_senda_verde_desc: "Los velathi no rezan a un dios, sino a una conversación lenta: la del bosque consigo mismo. La Senda Verde enseña que cada árbol es una palabra de esa conversación y que un pueblo vive mientras sepa escuchar sin interrumpir. Sus sacerdotes, los hilanderos del musgo, no predican; cuentan anillos, siembran claros y recuerdan a los reyes, que viven siglos, que el bosque ha visto pasar a muchos como ellos.\n\nEl [karma|e] de la Senda es una balanza viva: la guerra, la tala y la prisa lo hunden; plantar, esperar y escuchar lo elevan. Pero la Senda no premia al más puro, sino al que guarda el equilibrio. Demasiada quietud adormece al pueblo bajo el musgo; demasiada herida lo vuelve fiera."

 # Aspectos
 gj_senda_verde_camino_raiz: "Camino de la Raíz"
 gj_senda_verde_camino_raiz_desc: "Quien sigue la Raíz cree que todo comienza bajo tierra: en el suelo bien cuidado, en la semilla que espera y en la mesa compartida."
 gj_senda_verde_camino_copa: "Camino de la Copa"
 gj_senda_verde_camino_copa_desc: "La Copa vigila desde lo alto. Sus seguidores defienden el bosque con arcos, trampas de ramas y la paciencia de quien deja que el enemigo se pierda solo."
 gj_senda_verde_camino_savia: "Camino de la Savia"
 gj_senda_verde_camino_savia_desc: "La Savia sube despacio y lo recuerda todo. Este camino honra a los cantores, a los cronistas y a quienes aprenden midiendo anillos."
 gj_senda_verde_camino_musgo: "Camino del Musgo"
 gj_senda_verde_camino_musgo_desc: "El Musgo cubre lo que importa y lo protege del ruido. Sus seguidores aman la calma, la costumbre y las leyes que nadie recuerda haber promulgado."

 # Lugares sagrados
 gj_senda_verde_claro_sagrado: "Claro sagrado de la Senda"
 gj_senda_verde_claro_sagrado_desc: "Un claro plantado por manos devotas, donde el bosque y el pueblo acuerdan sus lindes cada primavera."
 gj_senda_verde_arbol_anillo: "Árbol de los Anillos"
 gj_senda_verde_arbol_anillo_desc: "Un tronco tan antiguo que sus anillos son una crónica. Los hilanderos acuden a leer en él los años que ningún libro guarda."

 # Franjas de karma
 AUTO_MODIFIER_NAME_gj_senda_verde_savia_en_calma: "Savia en calma"
 AUTO_MODIFIER_NAME_gj_senda_verde_sueno_del_musgo: "Sueño del Musgo"
 AUTO_MODIFIER_NAME_gj_senda_verde_savia_herida: "Savia herida"

