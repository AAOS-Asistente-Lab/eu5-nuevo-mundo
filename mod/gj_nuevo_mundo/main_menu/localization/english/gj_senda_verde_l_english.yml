 # Decisiones
 gj_senda_verde_plantar_claro.title: "Plantar un claro vivo"
 gj_senda_verde_plantar_claro.desc: "Los hilanderos proponen sembrar un claro nuevo en una de nuestras tierras: robles jóvenes, helechos y una piedra de lindes. Costará esfuerzo y consejo, pero el bosque lo recordará y la Senda también."
 gj_senda_verde_plantar_claro.a: "Que se plante el claro."
 gj_senda_verde_poda_consentida.title: "La poda consentida"
 gj_senda_verde_poda_consentida.desc: "El bosque ha crecido más de lo que el pueblo puede abarcar. Los podadores piden permiso para aclararlo según el rito: solo la rama que ya quiere caer, solo la madera que alguien pidió. Es un modo de volver al equilibrio sin herirlo."
 gj_senda_verde_poda_consentida.a: "Que se pode según el rito."
 gj_senda_verde_asamblea_de_anillos.title: "Convocar la Asamblea de Anillos"
 gj_senda_verde_asamblea_de_anillos.desc: "Cuando el pueblo y el bosque están en paz, los ancianos pueden reunirse al pie del árbol más viejo y contar sus anillos en voz alta. De esa asamblea sale una década de leyes claras y de memoria compartida."
 gj_senda_verde_asamblea_de_anillos.a: "Que se reúnan los ancianos."

 # Eventos
 gj_senda_verde.1.title: "La hora de la poda"
 gj_senda_verde.1.desc: "El musgo ya cubre los senderos y las ramas bajas rozan los tejados. Los podadores, con las manos limpias de hacha y llenas de paciencia, piden audiencia: el bosque ha crecido más de lo que puede sostener."
 gj_senda_verde.1.a: "Podemos aclararlo, con medida y con permiso."
 gj_senda_verde.1.b: "Que el bosque se cierre; es su derecho."
 gj_senda_verde.1.c: "Que hablen los ancianos de los anillos."
 gj_senda_verde.2.title: "Las heridas del hacha"
 gj_senda_verde.2.desc: "Cada noche se oyen lamentos en los troncos recién cortados, dicen los hilanderos. Han atado cintas negras a las cortezas heridas y piden que la corte acuda a verlas. El pueblo mira a su soberano: algo hay que hacer."
 gj_senda_verde.2.a: "Haremos penitencia de hojas."
 gj_senda_verde.2.b: "Plantaremos sin descanso hasta saldar la deuda."
 gj_senda_verde.2.c: "El reino no puede detenerse por unas cintas."
 gj_senda_verde.3.title: "Los plantadores de primavera"
 gj_senda_verde.3.desc: "Bajo un cielo sereno, el pueblo sale a plantar en procesión. Todo marcha en equilibrio, y los hilanderos preguntan cómo quiere el soberano que se aproveche la buena estación."
 gj_senda_verde.3.a: "Que sea una fiesta de brotes."
 gj_senda_verde.3.b: "Que el esfuerzo vaya a las cosechas."
 gj_senda_verde.4.title: "El cantor de raíces"
 gj_senda_verde.4.desc: "Un anciano llegado de ninguna parte dice que canta lo que las raíces susurran bajo la corte. Sus versos hablan de reyes olvidados y de caminos que el bosque ha tapado a propósito. Algunos lo toman por loco; otros, por testigo."
 gj_senda_verde.4.a: "Escuchémosle hasta el final."
 gj_senda_verde.4.b: "Que cante para los nobles; les hará bien."
 gj_senda_verde.5.title: "Fuego en la linde"
 gj_senda_verde.5.desc: "Un rayo de verano ha prendido el sotobosque en [target_location.GetName]. Las llamas avanzan despacio entre los helechos. Los guardabosques preguntan si deben abrir cortafuegos con el hacha o dejar que el bosque se limpie solo."
 gj_senda_verde.5.a: "Abramos cortafuegos, aunque duela."
 gj_senda_verde.5.b: "Que el fuego haga su trabajo."
 gj_senda_verde.5.c: "Recemos a la Savia y esperemos la lluvia."
 gj_senda_verde.6.title: "La red de micelio"
 gj_senda_verde.6.desc: "Los mineros de la raíz han abierto una galería y han encontrado hilos blancos que laten como venas: una red viva que conecta los árboles de un confín a otro. Los hilanderos aseguran que sus pulsos llevan noticias. Nadie sabe si es sabiduría o una peligrosa curiosidad."
 gj_senda_verde.6.a: "Aprendamos a escucharla."
 gj_senda_verde.6.b: "Sellemos la galería; hay cosas que no deben oírse."
 gj_senda_verde.7.title: "El peregrino del muérdago"
 gj_senda_verde.7.desc: "Llega por el camino un peregrino con la barba trenzada de muérdago, que ha recorrido todos los claros sagrados del país. Pide hospedaje y promete contar, a cambio, lo que vio en cada uno."
 gj_senda_verde.7.a: "Que se siente a nuestra mesa."
 gj_senda_verde.7.b: "Que descanse y siga su camino."
 gj_senda_verde.8.title: "Tala furtiva"
 gj_senda_verde.8.desc: "Unos leñadores, hijos de familias con deudas, talan de noche los robles de la linde y venden la madera en los puertos. Los guardabosques han cogido a dos de ellos; los gremios, en cambio, ven en la madera barata una oportunidad."
 gj_senda_verde.8.a: "Que los castiguen según la Senda."
 gj_senda_verde.8.b: "Cerremos los ojos, por esta vez."
 gj_senda_verde.8.c: "Instituyamos un permiso de hoja, pagado y vigilado."
 gj_senda_verde.9.title: "La noche de las luciérnagas"
 gj_senda_verde.9.desc: "Una vez cada pocos años, las luciérnagas salen todas a la vez, y el bosque entero parpadea como un cielo caído. El pueblo cree que es el momento en que la Senda sonríe."
 gj_senda_verde.9.a: "Encendamos las linternas y cantemos."
 gj_senda_verde.9.b: "Guardemos el aceite; basta con mirar."
 gj_senda_verde.10.title: "Los hilanderos leen las cenizas"
 gj_senda_verde.10.desc: "En el solsticio, los hilanderos del musgo queman ramas de siete árboles y leen en las cenizas lo que el cielo anuncia. Piden al soberano que elija en qué lengua se interpreten los signos: la del cometa, que poda el cielo, o la del eclipse, que lo silencia."
 gj_senda_verde.10.a: "Que lean un cometa."
 gj_senda_verde.10.b: "Que lean un eclipse."
 gj_senda_verde.10.c: "Que no lean nada; basta con las cenizas."
 gj_senda_verde.11.title: "Los jóvenes quieren ir más allá"
 gj_senda_verde.11.desc: "Los hijos de la última generación miran las fronteras con hambre. Dicen que el bosque no termina donde acaban los mapas y que hay claros por fundar al otro lado. Los ancianos recuerdan que la Senda se recorre sin prisa."
 gj_senda_verde.11.a: "Que vayan: el prestigio vale el desasosiego del bosque."
 gj_senda_verde.11.b: "Recordemos el mandato de la Senda."
