l_english:
 # Copia del castellano: esta parte no trae textos en ingles.
 ### CULTURA, GRUPO Y LENGUA ###
 gj_lagunero: "Laguneño"
 gj_lagunero_desc: "Gente de remo y de pesas. Nacen entre juncos y neblina, y aprenden a regatear antes que a andar. Para un laguneño, el hielo no cierra el camino: lo ensancha."
 gj_lagunero_dialect: "Laguneño"
 gj_lagunas_language: "Lenguas de las Lagunas"
 gj_grupo_lagunas: "Pueblos de las Lagunas"
 gj_grupo_lagunas_desc: "Los pueblos del distrito de lagos comparten el oficio de barquero, la costumbre de votar y un respeto casi religioso por los contratos."

 ### AVANCES DEL PAIS ###
 gj_lag_barqueros_de_la_orilla: "Barqueros de la Orilla"
 gj_lag_barqueros_de_la_orilla_desc: "Cada familia ribereña tiene su barca y su remo. De ellas sale la primera marinería de la Liga, y de sus astilleros de orilla, las primeras patrullas."
 gj_lag_pesas_y_sellos: "Pesas y Sellos de la Liga"
 gj_lag_pesas_y_sellos_desc: "Una misma pesa y un mismo sello valen en las mil lagunas. Un contrato sellado en una orilla se cumple en la otra: sin eso, no habría Liga."
 gj_lag_mercados_del_hielo: "Mercados del Hielo"
 gj_lag_mercados_del_hielo_desc: "En invierno los lagos se cubren de puestos, trineos y braseros. Se vende sobre el agua lo mismo que en verano se transporta encima."
 gj_lag_primera_asamblea: "La Primera Asamblea"
 gj_lag_primera_asamblea_desc: "Cada ciudad-laguna manda a sus delegados al Salón de la Asamblea. Allí se reparten las aguas, se pactan los pesos y se elige a quien lleve el remo mayor."
 gj_lag_diques_y_esclusas: "Diques y Esclusas"
 gj_lag_diques_y_esclusas_desc: "Los ingenieros de la Liga elevan las orillas, enlazan lagos con canales y ganan a la ciénaga campos que antes eran fango."
 gj_lag_cuaderno_de_cuentas: "El Cuaderno de Cuentas"
 gj_lag_cuaderno_de_cuentas_desc: "Cada casa de la Liga lleva dos libros, el suyo y el de todos. El crédito corre barato donde las cuentas están a la vista."
 gj_lag_escoltas_de_caravana: "Escoltas de Caravana"
 gj_lag_escoltas_de_caravana_desc: "Barcas armadas y guardias de dique acompañan a los convoyes. La Liga no conquista: protege lo que vende."
 gj_lag_academia_de_tejedores: "Academia de Tejedores"
 gj_lag_academia_de_tejedores_desc: "Las tejedoras de los canales aprenden telares nuevos y tintes de agua dulce. Sus paños se pagan bien en todos los mercados."
 gj_lag_flota_de_los_lagos: "Flota de los Lagos"
 gj_lag_flota_de_los_lagos_desc: "Las patrullas dejan de ser barcas con ballestas y pasan a ser una flota con su estandarte, sus pilotos y su propia escuela de remeros."
 gj_lag_puertos_de_agua_dulce: "Puertos de Agua Dulce"
 gj_lag_puertos_de_agua_dulce_desc: "Los muelles de la Liga se ensanchan para recibir lo mismo cargas del mar que de las orillas más remotas."
 gj_lag_tratado_del_hielo: "El Tratado del Hielo"
 gj_lag_tratado_del_hielo_desc: "Los embajadores de la Liga firman pactos de paso invernal con todos los vecinos. Quien cruza el hielo con permiso paga; quien lo cruza sin él, responde."
 gj_lag_gremios_de_barcaza: "Gremios de Barcaza"
 gj_lag_gremios_de_barcaza_desc: "Los barqueros se organizan en gremios de barcaza que comparten muelles, almacenes y deudas. Producir y transportar se vuelve un solo oficio."
 gj_lag_la_gran_feria: "La Gran Feria de las Mil Orillas"
 gj_lag_la_gran_feria_desc: "Cada año, durante cuarenta días, todas las orillas se reúnen en una feria flotante. Quien no está allí, no existe para el comercio."
 gj_lag_cartas_de_corso_lagunar: "Cartas de Corso Laguneñas"
 gj_lag_cartas_de_corso_lagunar_desc: "La Liga contrata a capitanes con patente para dar caza a los saqueadores de las orillas, aun a costa de mancharse las manos."
 gj_lag_astilleros_de_dique: "Astilleros de Dique"
 gj_lag_astilleros_de_dique_desc: "Los diques secos de la Liga botan barcas nuevas en semanas. Cada orilla puede armar su patrulla antes de que el invasor cruce el agua."
 gj_lag_jueces_de_aguas: "Los Jueces de Aguas"
 gj_lag_jueces_de_aguas_desc: "Un cuerpo de jueces itinerantes dirime las querellas entre barqueros, pescadores y tejedores. Donde hay juez, hay contrato."
 gj_lag_banco_de_la_asamblea: "El Banco de la Asamblea"
 gj_lag_banco_de_la_asamblea_desc: "La Asamblea funda un banco con sus propias arcas y su propio sello. Su crédito es tan seguro como el hielo de enero."
 gj_lag_aduana_de_los_lagos: "Aduana de los Lagos"
 gj_lag_aduana_de_los_lagos_desc: "Cada puerto interior recauda con la misma regla. El contrabandista que pasa por una orilla ya no se salva en la siguiente."
 gj_lag_tejidos_de_canal: "Tejidos de Canal"
 gj_lag_tejidos_de_canal_desc: "Los telares movidos por el agua de los canales multiplican la producción, y los hijos de los tejedores aprenden a leer en las escuelas de gremio."
 gj_lag_la_liga_ilustrada: "La Liga Ilustrada"
 gj_lag_la_liga_ilustrada_desc: "Los sabios de las orillas debaten sobre el derecho de las aguas y la libertad del comercio. La Asamblea los escucha, y a veces les hace caso."
 gj_lag_aseguradores_del_hielo: "Aseguradores del Hielo"
 gj_lag_aseguradores_del_hielo_desc: "Por una prima, la Liga garantiza la carga que cruza el lago. Los aseguradores conocen el hielo mejor que nadie y cobran en consecuencia."
 gj_lag_el_canal_grande: "El Canal Grande"
 gj_lag_el_canal_grande_desc: "Una obra colosal une los lagos mayores y abre a los barcos de la Liga un camino navegable de orilla a orilla del país."
 gj_lag_cultura_tradicion_del_remo: "Tradición del Remo"
 gj_lag_cultura_tradicion_del_remo_desc: "Se remó antes que se escribió: cada niño del distrito de lagos conoce los cantos de ritmo y los nudos de amarre."
 gj_lag_cultura_hospitalidad_de_muelle: "Hospitalidad de Muelle"
 gj_lag_cultura_hospitalidad_de_muelle_desc: "El forastero que atraca es huésped durante tres días. Después es cliente, y al cabo de un año, vecino."
 gj_lag_cultura_lengua_de_los_mercaderes: "La Lengua de los Mercaderes"
 gj_lag_cultura_lengua_de_los_mercaderes_desc: "Una jerga de mostrador, medio laguneña y medio de todas partes, se extiende por los mercados y facilita cada trato."

 ### REFORMAS DE GOBIERNO ###
 gj_lag_barquero_mayor: "El Barquero Mayor"
 gj_lag_barquero_mayor_desc: "Quien lleve el remo mayor gobierna la Liga por un mandato. Lo vota la Asamblea y lo vigilan las ciudades-laguna, que no olvidan que el remo también se retira."
 gj_lag_pacto_de_los_lagos: "El Pacto de los Lagos"
 gj_lag_pacto_de_los_lagos_desc: "Las ciudades-laguna firman un tratado de comercio común: un solo arancel, una sola capacidad de mercado, y un reparto de ganancias que contenta a casi todas."
 gj_lag_liga_de_hielo_y_agua: "La Liga de Hielo y Agua"
 gj_lag_liga_de_hielo_y_agua_desc: "Con las barcas de verano y los trineos de invierno, la Liga comercia todo el año. Su flota guarda las aguas y su Asamblea guarda la paz."

 ### EDIFICIOS ###
 gj_lag_mercado_flotante: "Mercado Flotante"
 gj_lag_mercado_flotante_desc: "Un barrio de barcazas amarradas, con puestos, tinglados y pasarelas. Allí se compra, se vende y se pacta sin pisar tierra firme. Solo puede levantarse junto a un lago. Con las eras gana niveles."
 gj_lag_mercado_flotante_maintenance: "Barcazas del mercado"
 gj_lag_muelle_barqueros: "Muelle de los Barqueros"
 gj_lag_muelle_barqueros_desc: "Un muelle con casa gremial, pesquería y cobertizo de remos. Forma marineros y acelera los astilleros del lugar. Con las eras gana niveles."
 gj_lag_muelle_barqueros_maintenance: "Dotación del muelle"
 gj_lag_casa_de_pesas: "Casa de las Pesas y Medidas"
 gj_lag_casa_de_pesas_desc: "En ella se guardan las pesas oficiales de la Liga y se juzgan las falsas. Solo puede erigirse en un centro de mercado. Con las eras gana niveles."
 gj_lag_casa_de_pesas_maintenance: "Archivo de pesas"
 gj_lag_salon_asamblea: "Salón de la Asamblea"
 gj_lag_salon_asamblea_desc: "Sede de las votaciones del Barquero Mayor. Solo uno por país y solo en la capital: la Asamblea no se parte. Con las eras gana niveles."
 gj_lag_salon_asamblea_maintenance: "Secretaría de la Asamblea"
 gj_lag_astillero_barcazas: "Astillero de Barcazas"
 gj_lag_astillero_barcazas_desc: "Un astillero de orilla donde se arman a la vez docenas de barcazas y botes. Solo puede levantarse en un puerto de lago. Con las eras gana niveles."
 gj_lag_astillero_barcazas_maintenance: "Gradas y diques secos"

 ### UNIDADES ###
 gj_lag_patrullero_1: "Patrullero de Laguna"
 gj_lag_patrullero_1_desc: "Una barca larga, de remo y vela, que vigila las orillas. Ágil, de poco casco y con pocas armas: es la mejor en aguas cerradas y la peor en el mar abierto. Solo se bota junto a un lago, y con tope de número."
 gj_lag_patrullero_2: "Patrullero de Laguna Reforzado"
 gj_lag_patrullero_2_desc: "$gj_lag_patrullero_1_desc$"
 gj_lag_patrullero_3: "Balandra de Laguna"
 gj_lag_patrullero_3_desc: "$gj_lag_patrullero_1_desc$"
 gj_lag_patrullero_4: "Balandra Artillada de Laguna"
 gj_lag_patrullero_4_desc: "$gj_lag_patrullero_1_desc$"
 gj_lag_patrullero_5: "Cúter de la Liga"
 gj_lag_patrullero_5_desc: "$gj_lag_patrullero_1_desc$"
 gj_lag_patrullero_6: "Cañonero de Canal"
 gj_lag_patrullero_6_desc: "$gj_lag_patrullero_1_desc$"
 gj_lag_ballestero_1: "Ballestero del Dique"
 gj_lag_ballestero_1_desc: "Milicia pagada por los gremios para guardar muelles y caravanas. Su tiro es certero, pero se quiebra pronto y flaquea en colinas y montañas. Defienden el comercio; no conquistan."
 gj_lag_ballestero_2: "Ballestero del Dique Reglado"
 gj_lag_ballestero_2_desc: "$gj_lag_ballestero_1_desc$"
 gj_lag_ballestero_3: "Fusilero del Dique"
 gj_lag_ballestero_3_desc: "$gj_lag_ballestero_1_desc$"
 gj_lag_ballestero_4: "Mosquetero del Dique"
 gj_lag_ballestero_4_desc: "$gj_lag_ballestero_1_desc$"
 gj_lag_ballestero_5: "Fusilero de la Liga"
 gj_lag_ballestero_5_desc: "$gj_lag_ballestero_1_desc$"
 gj_lag_ballestero_6: "Tirador de la Asamblea"
 gj_lag_ballestero_6_desc: "$gj_lag_ballestero_1_desc$"
 gj_lag_barcaza_2: "Barcaza de Asedio"
 gj_lag_barcaza_2_desc: "Un chalán ancho con bombardas montadas sobre cureñas de proa. Bombardea mejor que la artillería común, pero avanza despacio y solo se arma junto a un lago."
 gj_lag_barcaza_3: "Barcaza de Bombardas"
 gj_lag_barcaza_3_desc: "$gj_lag_barcaza_2_desc$"
 gj_lag_barcaza_4: "Barcaza Mortero"
 gj_lag_barcaza_4_desc: "$gj_lag_barcaza_2_desc$"
 gj_lag_barcaza_5: "Chalana Artillada"
 gj_lag_barcaza_5_desc: "$gj_lag_barcaza_2_desc$"
 gj_lag_barcaza_6: "Batería Flotante"
 gj_lag_barcaza_6_desc: "$gj_lag_barcaza_2_desc$"

 ### MODIFICADORES ###
 STATIC_MODIFIER_NAME_gj_lag_caminos_de_hielo: "Caminos de hielo"
 STATIC_MODIFIER_DESC_gj_lag_caminos_de_hielo: "El invierno ha cerrado los lagos a las barcas, pero los ha abierto a trineos y ejércitos. Cuando llegue la primavera, el hielo cederá."
 STATIC_MODIFIER_NAME_gj_lag_barquero_mercader: "Barquero Mayor mercader"
 STATIC_MODIFIER_DESC_gj_lag_barquero_mercader: "El remo mayor está en manos de un mercader de pesas y sellos. El comercio florece, y la marina se resiente."
 STATIC_MODIFIER_NAME_gj_lag_barquero_armador: "Barquero Mayor armador"
 STATIC_MODIFIER_DESC_gj_lag_barquero_armador: "El remo mayor está en manos de un armador de flotas. Los astilleros no descansan, y los mercaderes refunfuñan."
 STATIC_MODIFIER_NAME_gj_lag_barquero_tejedor: "Barquero Mayor tejedor"
 STATIC_MODIFIER_DESC_gj_lag_barquero_tejedor: "El remo mayor está en manos de una maestra tejedora. Los telares van de maravilla; los marineros, algo menos."
 STATIC_MODIFIER_NAME_gj_lag_barquero_juez: "Barquero Mayor juez"
 STATIC_MODIFIER_DESC_gj_lag_barquero_juez: "El remo mayor está en manos de un Juez de Aguas. Las querellas se calman y los embajadores son bien recibidos, pero el negocio no corre tanto."
 STATIC_MODIFIER_NAME_gj_lag_escoltas_contratadas: "Escoltas contratadas"
 STATIC_MODIFIER_DESC_gj_lag_escoltas_contratadas: "Barcas armadas acompañan a los convoyes de la Liga. Los saqueadores lo piensan dos veces, y la bolsa también."
 STATIC_MODIFIER_NAME_gj_lag_tributo_pagado: "Tributo pagado"
 STATIC_MODIFIER_DESC_gj_lag_tributo_pagado: "Hemos pagado a los saqueadores del norte para que no toquen nuestras aguas. Ellos callan. Nosotros, no tanto."
 STATIC_MODIFIER_NAME_gj_lag_diques_armados: "Diques armados"
 STATIC_MODIFIER_DESC_gj_lag_diques_armados: "Cada dique tiene su guardia y cada orilla su baluarte. La Liga se hace fuerte, pero a costa de los mercaderes."
 STATIC_MODIFIER_NAME_gj_lag_hielo_roto: "Hielo roto"
 STATIC_MODIFIER_DESC_gj_lag_hielo_roto: "Parte del ejército ha caído al agua con el deshielo. Los supervivientes ya no se fían del suelo."
 STATIC_MODIFIER_NAME_gj_lag_festival_de_las_lamparas: "Noche de las Lámparas"
 STATIC_MODIFIER_DESC_gj_lag_festival_de_las_lamparas: "Miles de lámparas flotan sobre el lago. Hasta los forasteros se detienen a mirarlas."
 STATIC_MODIFIER_NAME_gj_lag_gran_subasta: "La Gran Subasta"
 STATIC_MODIFIER_DESC_gj_lag_gran_subasta: "La Liga ha vendido los permisos de paso del estrecho al mejor postor. Las arcas se llenan y los mercaderes extranjeros toman nota."
 STATIC_MODIFIER_NAME_gj_lag_gremios_enfrentados: "Gremios enfrentados"
 STATIC_MODIFIER_DESC_gj_lag_gremios_enfrentados: "Barqueros y tejedores no se hablan. Los talleres trabajan a medias."
 STATIC_MODIFIER_NAME_gj_lag_fiebre_de_orillas: "Fiebre de las orillas"
 STATIC_MODIFIER_DESC_gj_lag_fiebre_de_orillas: "Un brote de fiebres cuartanas recorre los muelles. No es la gran plaga, pero se lleva a los más débiles."
 STATIC_MODIFIER_NAME_gj_lag_cartografia_laguna: "Cartografía laguneña"
 STATIC_MODIFIER_DESC_gj_lag_cartografia_laguna: "Una carta de las mil orillas, con vados, bajíos y fondeaderos. Los capitanes la guardan como a un tesoro."
 STATIC_MODIFIER_NAME_gj_lag_puente_de_barcas: "Puente de barcas"
 STATIC_MODIFIER_DESC_gj_lag_puente_de_barcas: "Una hilera de barcazas atadas une dos orillas. Los ejércitos y las caravanas cruzan sin esperar al ferri."
 STATIC_MODIFIER_NAME_gj_lag_contrato_de_especias: "Contrato de especias"
 STATIC_MODIFIER_DESC_gj_lag_contrato_de_especias: "Un pacto con los mercaderes del sur trae pimienta y perlas a los muelles de la Liga."
 STATIC_MODIFIER_NAME_gj_lag_hermandad_de_faroleros: "Hermandad de faroleros"
 STATIC_MODIFIER_DESC_gj_lag_hermandad_de_faroleros: "Los faroleros guían a las barcas en la niebla y sueñan con los bajíos. Ninguna patrulla se pierde mientras ellos velan."
 STATIC_MODIFIER_NAME_gj_lag_aduana_del_hielo: "Arancel del hielo"
 STATIC_MODIFIER_DESC_gj_lag_aduana_del_hielo: "Cada trineo que cruza paga su peaje. La hacienda lo agradece; los mercaderes, mucho menos."
 STATIC_MODIFIER_NAME_gj_lag_archivo_de_las_aguas: "Archivo de las Aguas"
 STATIC_MODIFIER_DESC_gj_lag_archivo_de_las_aguas: "Todos los contratos, mapas y sentencias de la Liga se guardan en un solo edificio. Quien lo consulta aprende de verdad."

 ### DECISIONES ###
 gj_lag_abrir_caminos_hielo.title: "Abrir los caminos de hielo"
 gj_lag_abrir_caminos_hielo.desc: "Los lagos se han helado lo bastante para sostener trineos y hombres. Si mandamos balizar las rutas, el comercio y los ejércitos cruzarán por donde en verano solo pasan barcas. Pero el hielo no dura, y en primavera cobra su precio."
 gj_lag_abrir_caminos_hielo.a: "Balizar las rutas del hielo."
 gj_lag_abrir_caminos_hielo.b: "Esperemos a que sea más grueso."
 gj_lag_convocar_asamblea.title: "Convocar la Asamblea de Lagunas"
 gj_lag_convocar_asamblea.desc: "Cada ciudad-laguna manda a sus delegados al Salón de la Asamblea. Allí se vota al Barquero Mayor, que llevará el remo de la Liga durante ocho años."
 gj_lag_convocar_asamblea.a: "Que se abran las urnas."
 gj_lag_pagar_escoltas.title: "Escoltas o tributo"
 gj_lag_pagar_escoltas.desc: "Los Skarren acechan nuestras aguas. Podemos pagar escoltas armadas, que nos costarán caro pero nos protegerán, o comprar la calma con un tributo, que sale más barato y nos deja en mal lugar."
 gj_lag_pagar_escoltas.a: "Contratemos escoltas armadas."
 gj_lag_pagar_escoltas.b: "Paguemos el tributo."
 gj_lag_gran_subasta_estrecho.title: "La Gran Subasta del Estrecho"
 gj_lag_gran_subasta_estrecho.desc: "Los permisos de paso del estrecho se venden al mejor postor delante de todos los gremios. Los soravi ofrecerán más que nadie, pero también ellos tienen que pasar por el estrecho."
 gj_lag_gran_subasta_estrecho.a: "Que empiece la subasta."

 ### EVENTOS ###
 gj_lagunas.1.title: "El Barquero Mayor"
 gj_lagunas.1.desc: "Las urnas de la Asamblea están llenas. Los delegados han votado a cuatro candidatos: una mercader de pesas y sellos, un armador de patrullas, una maestra de los telares y un Juez de Aguas. Solo uno llevará el remo mayor durante ocho años."
 gj_lagunas.1.a: "Gana la mercader: que el comercio mande."
 gj_lagunas.1.b: "Gana el armador: que las flotas crezcan."
 gj_lagunas.1.c: "Gana la tejedora: que los telares no se detengan."
 gj_lagunas.1.d: "Gana el juez: que cada querella tenga sentencia."
 gj_lagunas.2.title: "El remo queda libre"
 gj_lagunas.2.desc: "El mandato del Barquero Mayor ha terminado. El remo mayor cuelga vacío en el Salón de la Asamblea, y los delegados de las ciudades-laguna piden que se convoque la votación."
 gj_lagunas.2.a: "Que se convoque la Asamblea."
 gj_lagunas.2.b: "Dejemos el remo colgado un tiempo."
 gj_lagunas.3.title: "El deshielo traicionero"
 gj_lagunas.3.desc: "La primavera ha llegado antes de lo esperado. El hielo suena como un trueno y los caminos balizados empiezan a ceder. Hay convoyes todavía sobre el lago."
 gj_lagunas.3.a: "Mandar retirar todo a la orilla, cueste lo que cueste."
 gj_lagunas.3.b: "Apurar un cruce más: el hielo aguantará."
 gj_lagunas.4.title: "Velas en las lagunas"
 gj_lagunas.4.desc: "Los vigías de los muelles avisan de largas barcas de proa de dragón que remontan el río hacia nuestros lagos. Los Skarren vienen a por lo que llevamos en los almacenes. La Asamblea pide una respuesta."
 gj_lagunas.4.a: "Contratar escoltas armadas."
 gj_lagunas.4.b: "Pagarles un tributo para que se vayan."
 gj_lagunas.4.c: "Armar los diques y que vengan."
 gj_lagunas.5.title: "Un contrato de las especias"
 gj_lagunas.5.desc: "Un emisario de la Casa de las Especias soravi desembarca en nuestro muelle con un cofre de perlas y un contrato sellado. Quiere que le abramos nuestros mercados a cambio de pimienta barata. Sabemos que son nuestros rivales en el estrecho, pero el precio es tentador."
 gj_lagunas.5.a: "Firmar: que corran las especias."
 gj_lagunas.5.b: "Devolver el cofre: no tratamos con rivales."
 gj_lagunas.6.title: "Querella de gremios"
 gj_lagunas.6.desc: "Los barqueros acusan a los tejedores de acaparar los muelles de carga. Los tejedores acusan a los barqueros de cobrar demasiado por el flete. Ya hay quien ha roto alguna rueca y quien ha hundido alguna barca."
 gj_lagunas.6.a: "Dar la razón a los barqueros."
 gj_lagunas.6.b: "Pagar de las arcas la paz entre los gremios."
 gj_lagunas.6.c: "Dar la razón a los tejedores y a los campesinos de las orillas."
 gj_lagunas.7.title: "La Noche de las Lámparas"
 gj_lagunas.7.desc: "Cada solsticio, los laguneños sueltan sobre el agua miles de lámparas de papel para guiar a los barqueros muertos. Este año los gremios proponen hacer de ella una fiesta mayor, con su banquete y sus forasteros."
 gj_lagunas.7.a: "Que sea la mayor de las fiestas."
 gj_lagunas.7.b: "Celebrémosla como siempre, en silencio."
 gj_lagunas.8.title: "El cartógrafo de las mil orillas"
 gj_lagunas.8.desc: "Un viejo cartógrafo, con el pelo blanco de tanta niebla, ha pasado cuarenta años midiendo los lagos de la Liga. Pide una pensión y una imprenta para publicar su carta."
 gj_lagunas.8.a: "Financiar su obra."
 gj_lagunas.8.b: "Agradecérselo con una medalla y despedirlo."
 gj_lagunas.9.title: "El puente de barcas"
 gj_lagunas.9.desc: "Dos ciudades-laguna llevan años discutiendo por un estrecho que las separa. Un ingeniero propone tender un puente de barcazas atadas, que se pueda abrir al paso de los barcos."
 gj_lagunas.9.a: "Tender el puente."
 gj_lagunas.9.b: "Dejar el estrecho como está: que los barqueros hagan su negocio."
 gj_lagunas.10.title: "La fiebre de las orillas"
 gj_lagunas.10.desc: "Un brote de fiebres cuartanas recorre los muelles. No es la gran peste, pero se lleva a los más débiles. Los médicos piden cerrar los mercados una semana."
 gj_lagunas.10.a: "Cerrar los mercados y pagar a los enfermos."
 gj_lagunas.10.b: "Que no se detenga el comercio."
 gj_lagunas.11.title: "La hermandad de faroleros"
 gj_lagunas.11.desc: "Los faroleros que encienden los fanales de las orillas quieren fundar una hermandad y un código propios. Prometen que ninguna barca se perderá en la niebla mientras ellos velen."
 gj_lagunas.11.a: "Reconocer la hermandad."
 gj_lagunas.11.b: "Que sigan siendo cada uno su propio farolero."
 gj_lagunas.12.title: "El arancel del hielo"
 gj_lagunas.12.desc: "Cada invierno, las caravanas cruzan los lagos helados sin pagar un cobre. Los tesoreros proponen un peaje por trineo. Los mercaderes lo ven como un robo."
 gj_lagunas.12.a: "Cobrar el peaje."
 gj_lagunas.12.b: "Dejar el hielo libre: es nuestro mejor reclamo."
 gj_lagunas.13.title: "El Archivo de las Aguas"
 gj_lagunas.13.desc: "La Asamblea guarda sus sentencias, mapas y contratos en cofres dispersos por las ciudades-laguna. Un archivero propone reunirlos en un solo edificio, a prueba de humedad y de incendios."
 gj_lagunas.13.a: "Construir el Archivo."
 gj_lagunas.13.b: "Dejar los cofres donde están."
 gj_lagunas.14.title: "El pozo de ámbar"
 gj_lagunas.14.desc: "Unos pescadores han sacado de la orilla de un lago lejano una veta de ámbar pálido, del tamaño de un barril. Los gremios discuten a quién pertenece."
 gj_lagunas.14.a: "Que lo venda la Asamblea."
 gj_lagunas.14.b: "Que lo labren y lo ofrezcan como regalo a los embajadores."
 gj_lagunas.15.title: "La viuda del armador"
 gj_lagunas.15.desc: "El viejo armador Dalmer ha muerto sin hijos. Su viuda ofrece sus muelles a la Liga, pero pide que se la nombre guardiana del remo menor."
 gj_lagunas.15.a: "Aceptar el trato y honrar su nombre."
 gj_lagunas.15.b: "Comprar los muelles y dejarla con una pensión."
 gj_lagunas.16.title: "La regata de balsas"
 gj_lagunas.16.desc: "Cada otoño, los jóvenes de las orillas corren en balsas desde el Cabo de la Niebla hasta el Salón de la Asamblea. Este año un patrón de patrulla propone dar a la regata un premio de la Liga."
 gj_lagunas.16.a: "Patrocinar la regata con una bolsa de plata."
 gj_lagunas.16.b: "Que la organicen las orillas por su cuenta."
 gj_lagunas.17.title: "Pescadores contra mercaderes"
 gj_lagunas.17.desc: "Los pescadores se quejan de que los barcos de carga espantan los bancos. Los mercaderes responden que sin sus fletes nadie compraría el pescado. La disputa llega a la Asamblea."
 gj_lagunas.17.a: "Reservar tramos del lago a la pesca."
 gj_lagunas.17.b: "Mantener libre la navegación."
 gj_lagunas.17.c: "Pagar una compensación a los pescadores."
 gj_lagunas.18.title: "El barquero ciego"
 gj_lagunas.18.desc: "Un barquero ciego, al que los niños llaman el Escuchador, dice oír al lago antes de que se mueva. Esta noche ha anunciado que el hielo traerá algo grande. Nadie sabe qué."
 gj_lagunas.18.a: "Escucharlo en la Asamblea."
 gj_lagunas.18.b: "Honrarlo con un cuenco de plata."
 gj_lagunas.19.title: "Las ciudades ribereñas piden entrar"
 gj_lagunas.19.desc: "Tres pequeñas ciudades de las orillas del norte piden un asiento en la Asamblea a cambio de adoptar nuestras pesas y sellos. Algunos delegados dicen que ya somos demasiados."
 gj_lagunas.19.a: "Admitirlas en la Liga."
 gj_lagunas.19.b: "Cobrarles una cuota de entrada y mandarlas a esperar."
 gj_lagunas.20.title: "La caravana perdida en el hielo"
 gj_lagunas.20.desc: "Una caravana de trineos cargada de paños y sal ha desaparecido en medio del lago. El hielo se ha abierto bajo ella, o tal vez la han asaltado. Los armadores piden que se organice una búsqueda."
 gj_lagunas.20.a: "Enviar patrullas a buscarla."
 gj_lagunas.20.b: "Dar por perdida la carga y repartir la pérdida entre los gremios."
 gj_lagunas.21.title: "La ventisca del mercado"
 gj_lagunas.21.desc: "Una tormenta de nieve ha atrapado a una docena de caravanas extranjeras en nuestros mercados del hielo. Los forasteros, atrapados, compran y venden como nunca."
 gj_lagunas.21.a: "Vender caro el abrigo y el pan."
 gj_lagunas.21.b: "Acogerlos de balde: que cuenten de nosotros en sus tierras."
