l_english:
 # Copia del castellano: esta parte no trae textos en ingles.
 # ===== Modificadores de ruinas =====
 STATIC_MODIFIER_NAME_gj_ruina_atlante_intacta: "Ruina de los Sumergidos"
 STATIC_MODIFIER_DESC_gj_ruina_atlante_intacta: "Muros de cristal verde y escaleras que bajan hasta un agua que ya no está. Aún nadie ha entrado a fondo."
 STATIC_MODIFIER_NAME_gj_ruina_enana_intacta: "Ruina de los Cantores de Piedra"
 STATIC_MODIFIER_DESC_gj_ruina_enana_intacta: "Una puerta de roca viva cerrada desde hace siglos. Dentro, dicen, la piedra todavía canta."
 STATIC_MODIFIER_NAME_gj_ruina_antigua_intacta: "Ruina de los Anteriores"
 STATIC_MODIFIER_DESC_gj_ruina_antigua_intacta: "Terrazas y círculos de piedra de una gente que vivió aquí antes que todos los pueblos conocidos."
 STATIC_MODIFIER_NAME_gj_ruina_atlante_restaurada: "Ruina sumergida restaurada"
 STATIC_MODIFIER_DESC_gj_ruina_atlante_restaurada: "Las galerías de cristal están limpias y a salvo. Los marinos vienen a ver cómo se mueve la luz bajo el suelo."
 STATIC_MODIFIER_NAME_gj_ruina_enana_restaurada: "Ruina de piedra restaurada"
 STATIC_MODIFIER_DESC_gj_ruina_enana_restaurada: "Las galerías están apuntaladas y reabiertas. Cualquier forja cercana trabaja mejor con su eco."
 STATIC_MODIFIER_NAME_gj_ruina_antigua_restaurada: "Ruina de los Anteriores restaurada"
 STATIC_MODIFIER_DESC_gj_ruina_antigua_restaurada: "Las terrazas han vuelto a cantar el calendario. Estudiosos de toda la comarca pasan una temporada aquí."
 STATIC_MODIFIER_NAME_gj_ruina_guardianes: "Los guardianes se alzan"
 STATIC_MODIFIER_DESC_gj_ruina_guardianes: "Algo de piedra y de voluntad ajena patrulla la ruina y los caminos que la rodean."
 STATIC_MODIFIER_NAME_gj_ruina_plaga_bestias: "Plaga de bestias"
 STATIC_MODIFIER_DESC_gj_ruina_plaga_bestias: "Lo que dormía en las galerías ha salido a cazar. Los campos se abandonan y los caminos se vacían."
 STATIC_MODIFIER_NAME_gj_ruina_maldicion: "Maldición de la ruina"
 STATIC_MODIFIER_DESC_gj_ruina_maldicion: "Los niños nacen callados y los viejos sueñan los mismos sueños. Pasará, pero no pronto."
 # ===== Vetas =====
 STATIC_MODIFIER_NAME_gj_veta_fuego_marca: "Veta del Pulso Rojo"
 STATIC_MODIFIER_DESC_gj_veta_fuego_marca: "La roca late despacio y está tibia al tacto incluso en pleno invierno."
 STATIC_MODIFIER_NAME_gj_veta_marea_marca: "Veta de la Marea Muda"
 STATIC_MODIFIER_DESC_gj_veta_marea_marca: "Las aguas de aquí suben y bajan a su hora, sin importar la luna."
 STATIC_MODIFIER_NAME_gj_veta_raiz_marca: "Veta de la Cepa Madre"
 STATIC_MODIFIER_DESC_gj_veta_raiz_marca: "Bajo el suelo corre algo que hace brotar lo plantado un poco antes de tiempo."
 STATIC_MODIFIER_NAME_gj_veta_estrella_marca: "Veta del Cielo Quieto"
 STATIC_MODIFIER_DESC_gj_veta_estrella_marca: "Las noches son más claras que en ningún otro sitio y las estrellas parecen más cerca."
 STATIC_MODIFIER_NAME_gj_veta_fuego_n2: "El Pulso Rojo despierta"
 STATIC_MODIFIER_DESC_gj_veta_fuego_n2: "Los hornos del reino beben del calor de la veta."
 STATIC_MODIFIER_NAME_gj_veta_fuego_n3: "El Hogar del Pulso Rojo"
 STATIC_MODIFIER_DESC_gj_veta_fuego_n3: "La veta responde a quien la sirve; pero los vecinos miran con miedo una llama que nunca se apaga."
 STATIC_MODIFIER_NAME_gj_veta_marea_n2: "La Marea Muda llama"
 STATIC_MODIFIER_DESC_gj_veta_marea_n2: "Los barcos que parten del cuenco encuentran el agua a favor."
 STATIC_MODIFIER_NAME_gj_veta_marea_n3: "El Cuenco de la Marea Muda"
 STATIC_MODIFIER_DESC_gj_veta_marea_n3: "El comercio del reino sigue una marea propia; la tierra, en cambio, pasa hambre de brazos."
 STATIC_MODIFIER_NAME_gj_veta_raiz_n2: "La Cepa Madre responde"
 STATIC_MODIFIER_DESC_gj_veta_raiz_n2: "Cada primavera llega un poco antes."
 STATIC_MODIFIER_NAME_gj_veta_raiz_n3: "La Cepa Honda"
 STATIC_MODIFIER_DESC_gj_veta_raiz_n3: "El reino come bien y cría mucho; los oficios, en cambio, se vacían de aprendices."
 STATIC_MODIFIER_NAME_gj_veta_estrella_n2: "El Cielo Quieto escucha"
 STATIC_MODIFIER_DESC_gj_veta_estrella_n2: "Los observatorios del reino trabajan con cartas más claras."
 STATIC_MODIFIER_NAME_gj_veta_estrella_n3: "La Aguja del Cielo Quieto"
 STATIC_MODIFIER_DESC_gj_veta_estrella_n3: "El saber crece deprisa; pero a la gente corriente le cuesta fiarse de una corona que mira tanto al cielo."
 STATIC_MODIFIER_NAME_gj_veta_guarnicion: "Guarnición de la veta"
 STATIC_MODIFIER_DESC_gj_veta_guarnicion: "Soldados fijos guardan el monumento y recuerdan a los vecinos quién manda."
 STATIC_MODIFIER_NAME_gj_veta_reconquista: "Veta disputada"
 STATIC_MODIFIER_DESC_gj_veta_reconquista: "Los antiguos dueños reclaman la veta y nadie en la comarca está tranquilo."
 STATIC_MODIFIER_NAME_gj_veta_rito: "Rito de la veta"
 STATIC_MODIFIER_DESC_gj_veta_rito: "Una ofrenda decenal mantiene en buen humor a la veta, y a la corte con ella."
 STATIC_MODIFIER_NAME_gj_veta_fuego_colada: "La Gran Colada"
 STATIC_MODIFIER_DESC_gj_veta_fuego_colada: "Una década de hornos al rojo perfecto."
 STATIC_MODIFIER_NAME_gj_veta_marea_flujo: "La Pleamar"
 STATIC_MODIFIER_DESC_gj_veta_marea_flujo: "Los mercaderes aprovechan una marea que no vuelve en diez años."
 STATIC_MODIFIER_NAME_gj_veta_raiz_cosecha: "La doble cosecha"
 STATIC_MODIFIER_DESC_gj_veta_raiz_cosecha: "Dos siegas por cada siembra, durante unos pocos años benditos."
 STATIC_MODIFIER_NAME_gj_veta_estrella_conjuncion: "La Conjunción"
 STATIC_MODIFIER_DESC_gj_veta_estrella_conjuncion: "El cielo se alinea sobre la veta y las cartas estelares se escriben solas."
 # ===== Expediciones =====
 STATIC_MODIFIER_NAME_gj_expedicion_fervor: "Fervor de expedición"
 STATIC_MODIFIER_DESC_gj_expedicion_fervor: "Las gentes quieren oír más cuentos de las ruinas."
 STATIC_MODIFIER_NAME_gj_expedicion_agotada: "Expedición agotada"
 STATIC_MODIFIER_DESC_gj_expedicion_agotada: "Se ha gastado mucho en las ruinas y la corte lo recuerda."
 STATIC_MODIFIER_NAME_gj_saber_perdido_impulso: "Saber recuperado"
 STATIC_MODIFIER_DESC_gj_saber_perdido_impulso: "Los sabios llevan semanas sin dormir, copiando lo que encontraron."
 STATIC_MODIFIER_NAME_gj_hallazgo_botin: "Botín de las ruinas"
 STATIC_MODIFIER_DESC_gj_hallazgo_botin: "La corte exhibe lo hallado y los visitantes pagan por verlo."
 STATIC_MODIFIER_NAME_gj_ruina_peregrinos: "Peregrinos y estudiosos"
 STATIC_MODIFIER_DESC_gj_ruina_peregrinos: "La ruina restaurada se ha vuelto un lugar de visita."
 # ===== Artefactos =====
 STATIC_MODIFIER_NAME_gj_art_astrolabio_mod: "El Astrolabio Azul"
 STATIC_MODIFIER_DESC_gj_art_astrolabio_mod: "Un disco de vidrio marino que marca rumbos a más distancia de lo posible. Los marinos lo creen sagrado; los soldados, un estorbo."
 STATIC_MODIFIER_NAME_gj_art_cetro_mod: "El Cetro de las Corrientes"
 STATIC_MODIFIER_DESC_gj_art_cetro_mod: "Quien lo empuña ve en el agua el camino de las naves. Desde que se exhibe, las fronteras parecen más abiertas de lo que conviene."
 STATIC_MODIFIER_NAME_gj_art_martillo_mod: "El Martillo sin Mango"
 STATIC_MODIFIER_DESC_gj_art_martillo_mod: "Una maza de bronce que no tiene empuñadura, y que nadie ha podido soltar sin dejar su forja mejor. Los aprendices ya no copian: esperan."
 STATIC_MODIFIER_NAME_gj_art_cuerno_mod: "El Cuerno de los Filones"
 STATIC_MODIFIER_DESC_gj_art_cuerno_mod: "Suena una vez al año y señala a los mineros dónde cavar. Cada nota cuesta una cosecha."
 STATIC_MODIFIER_NAME_gj_art_escudo_mod: "El Escudo de los Siete Juramentos"
 STATIC_MODIFIER_DESC_gj_art_escudo_mod: "Siete nombres en la cara interior: quien lo carga jura cumplirlos todos. A los diplomáticos les sale caro declarar la guerra bajo su sombra."
 STATIC_MODIFIER_NAME_gj_art_tablillas_mod: "Las Tablillas del Riego"
 STATIC_MODIFIER_DESC_gj_art_tablillas_mod: "Arcilla grabada con el calendario del agua. Con ella el campo rinde más, aunque los recaudadores pierden cuentas."
 STATIC_MODIFIER_NAME_gj_art_corona_mod: "La Corona Partida"
 STATIC_MODIFIER_DESC_gj_art_corona_mod: "Dos mitades que ajustan al milímetro y nadie sabe por qué se rompieron. Eleva a quien la lleva, y divide a quienes lo rodean."
 STATIC_MODIFIER_NAME_gj_art_lampara_mod: "La Lámpara de los Anteriores"
 STATIC_MODIFIER_DESC_gj_art_lampara_mod: "Una llama sin aceite que ilumina lo que se estudia con ella. Pero el consejo gasta más en seguir su luz."
 # ===== Monumentos de veta =====
 gj_monumento_fuego: "Hogar del Pulso Rojo"
 gj_monumento_fuego_desc: "Una caldera de piedra erigida sobre la veta de fuego. Cada nivel la hunde más y la hace más caliente. Solo puede alzarse donde late la veta, y al ser conquistado pierde un nivel."
 gj_monumento_marea: "Cuenco de la Marea Muda"
 gj_monumento_marea_desc: "Un estanque de sillares que respira con una marea propia. Cada nivel lo abre más a los barcos. Solo puede alzarse donde late la veta, y al ser conquistado pierde un nivel."
 gj_monumento_raiz: "Cepa Honda"
 gj_monumento_raiz_desc: "Un pozo cubierto de terrazas que riega a la veta con la saliva de los siglos. Cada nivel profundiza la cepa. Solo puede alzarse donde late la veta, y al ser conquistado pierde un nivel."
 gj_monumento_estrella: "Aguja del Cielo Quieto"
 gj_monumento_fuego_mantenimiento: "Brasas del Hogar Rojo"
 gj_monumento_marea_mantenimiento: "Cuidado del Cuenco Mudo"
 gj_monumento_raiz_mantenimiento: "Riego de la Cepa"
 gj_monumento_estrella_mantenimiento: "Vigilia de la Aguja"
 gj_monumento_estrella_desc: "Una torre sin tejado que mira al cielo desde la veta. Cada nivel la alarga un poco más. Solo puede alzarse donde late la veta, y al ser conquistada pierde un nivel."
 # ===== Decisiones =====
 gj_ruinas_expedicion.title: "Enviar una expedición a las ruinas"
 gj_ruinas_expedicion.desc: "En nuestras tierras hay ruinas de los Antiguos que nadie ha explorado a fondo. Una expedición cuesta oro y puede salir bien o muy mal. Solo se puede lanzar una cada dos años."
 gj_ruinas_expedicion.a: "Que parta, y que los dioses la acompañen."
 gj_ruinas_sellar.title: "Sellar una ruina despierta"
 gj_ruinas_sellar.desc: "Una ruina que ha despertado hace sufrir a la comarca. Se puede pagar a gente experta para que la selle y la deje restaurada."
 gj_ruinas_sellar.a: "Que se pague y se selle."
 gj_ruinas_rito_veta.title: "Rito de la veta"
 gj_ruinas_rito_veta.desc: "Quien guarda un monumento de veta puede ofrecer a la veta una ofrenda decenal: oro, canto y una procesión. A cambio, la corte gana prestigio y legitimidad durante diez años."
 gj_ruinas_rito_veta.a: "Ofrezcamos a la veta lo que le toca."
 # ===== Reclamación =====
 gj_cb_reclamar_veta: "Reclamación sobre una veta"
 gj_cb_reclamar_veta_PROV: "Reclamación sobre la veta de [PROVINCE.GetName]"
 gj_cb_reclamar_veta_desc: "Una veta de poder late en tierras ajenas y nosotros la queremos. Los viejos libros dicen que no debería estar en manos de quien no la entiende."
 # ===== Saberes perdidos =====
 gj_saber_mareas_hundidas: "Las mareas hundidas"
 gj_saber_mareas_hundidas_desc: "En las galerías sumergidas había cartas de cristal que predicen el mar con semanas de antelación."
 gj_saber_cartas_abisales: "Cartas abisales"
 gj_saber_cartas_abisales_desc: "Sobre aquellas cartas de cristal, nuestros pilotos aprendieron a leer fondos que nadie había visto."
 gj_saber_forja_cantora: "La forja cantora"
 gj_saber_forja_cantora_desc: "Una forja que se afina a oído: el hierro canta cuando está listo, y los maestros aprenden a escucharlo."
 gj_saber_runas_de_carga: "Runas de carga"
 gj_saber_runas_de_carga_desc: "Runas talladas en las galerías enseñan a repartir el peso de un muro, de una bóveda o de una línea de batalla."
 gj_saber_riego_anterior: "El riego de los Anteriores"
 gj_saber_riego_anterior_desc: "Terrazas y canalillos de una gente olvidada que sabía exactamente cuánta agua quiere una semilla."
 gj_saber_calendario_primero: "El Calendario Primero"
 gj_saber_calendario_primero_desc: "Un círculo de piedras que cuenta los años mejor que los almanaques. Con él, se predicen eclipses y malas cosechas."
 # ===== Eventos: expedición =====
 gj_mundo_ruinas.1.title: "La expedición parte"
 gj_mundo_ruinas.1.desc.atlante: "Los guías hablan de [gj_ruina_loc.GetName] como de un sitio donde las escaleras bajan y bajan hacia un agua que no está. Se pide un enfoque para la expedición: prudencia, audacia o una escolta de peso."
 gj_mundo_ruinas.1.desc.enana: "Los mineros que conocen [gj_ruina_loc.GetName] dicen que la piedra allí no es muda. Se pide un enfoque para la expedición: prudencia, audacia o una escolta de peso."
 gj_mundo_ruinas.1.desc.antigua: "Los pastores llevan siglos esquivando [gj_ruina_loc.GetName], con sus terrazas y círculos de piedra de manos que no son las nuestras. Se pide un enfoque para la expedición."
 gj_mundo_ruinas.1.a: "Prudencia: poco ruido, pocos riesgos."
 gj_mundo_ruinas.1.b: "Audacia: bajad lo más hondo posible."
 gj_mundo_ruinas.1.c: "Una escolta de verdad (cuesta más)."
 gj_mundo_ruinas.2.title: "Hallazgo en los escombros"
 gj_mundo_ruinas.2.desc.atlante: "No se encontró ningún gran tesoro, pero sí un buen puñado de cuentas de vidrio verde, un par de lámparas y los cimientos de una sala que se puede limpiar. La ruina queda restaurada."
 gj_mundo_ruinas.2.desc.enana: "Los mineros salieron con las manos llenas de herramientas de bronce y piezas de una forja que nadie sabe encender. La ruina queda restaurada."
 gj_mundo_ruinas.2.desc.antigua: "En una terraza enterrada aparecieron vasijas, collares y una estela con dibujos de un calendario. La ruina queda restaurada."
 gj_mundo_ruinas.2.a: "Vendámoslo y engordemos las arcas."
 gj_mundo_ruinas.2.b: "Que la corte lo exhiba."
 gj_mundo_ruinas.3.title: "Un tesoro de los Antiguos"
 gj_mundo_ruinas.3.desc.astrolabio: "En una cámara sin agua apareció un disco de vidrio azul, con un anillo móvil, que parece marcar rumbos a distancias imposibles. Es el Astrolabio Azul. Los pilotos juran haberlo visto girar solo."
 gj_mundo_ruinas.3.desc.cetro: "Bajo un mosaico de olas, un cetro de coral negro: el Cetro de las Corrientes. Quien lo toca siente el pulso de cada río y de cada estrecho."
 gj_mundo_ruinas.3.desc.martillo: "En el corazón de una forja muerta, una maza de bronce sin mango, tan pesada que nadie la levanta con una sola mano. Es el Martillo sin Mango. Los herreros se pelean por tocarla."
 gj_mundo_ruinas.3.desc.cuerno: "Un cuerno de guerra de hueso blanco, tallado con filones. Suena una vez al año por sí solo, y señala dónde hay mineral. Es el Cuerno de los Filones."
 gj_mundo_ruinas.3.desc.escudo: "Siete nombres grabados en el interior de un escudo enorme. Quien lo carga jura cumplirlos. Es el Escudo de los Siete Juramentos."
 gj_mundo_ruinas.3.desc.tablillas: "En una alacena sellada, un montón de arcilla con rayas y muescas: el calendario del agua. Las Tablillas del Riego enseñan cuándo sembrar, cuándo regar y cuándo no hacer nada."
 gj_mundo_ruinas.3.desc.corona: "Dos mitades de una corona de plata vieja, que juntas ajustan al milímetro y nadie sabe por qué se rompieron. Es la Corona Partida."
 gj_mundo_ruinas.3.desc.lampara: "Una lámpara sin mecha ni aceite que, sin embargo, arde. Ilumina mejor lo que se estudia con ella. Es la Lámpara de los Anteriores."
 gj_mundo_ruinas.3.desc.reliquia: "Había un tesoro, pero otro más afortunado llegó antes y se lo llevó. Lo que queda es una reliquia hermosa y sin poder alguno. La ruina queda restaurada."
 gj_mundo_ruinas.3.a: "Que se custodie en la propia ruina."
 gj_mundo_ruinas.3.b: "Que se lleve a la capital."
 gj_mundo_ruinas.4.title: "Un saber perdido"
 gj_mundo_ruinas.4.desc.atlante: "Entre las ruinas sumergidas hay una sala de cartas de cristal, con mareas y fondos marinos dibujados con una precisión absurda. Los sabios piden semanas para copiarlas."
 gj_mundo_ruinas.4.desc.enana: "En una galería sellada, runas talladas explican cómo se reparte el peso de una bóveda, un puente o un muro. Los maestros de obras quieren aprenderlas."
 gj_mundo_ruinas.4.desc.antigua: "Un círculo de piedras cuenta los días mejor que cualquier almanaque, y con él los años de abundancia y los de hambre. Los sabios no quieren irse."
 gj_mundo_ruinas.4.a: "Que lo estudien y lo apliquen."
 gj_mundo_ruinas.4.b: "Vendamos las copias a quien las pague."
 gj_mundo_ruinas.5.title: "Los guardianes se alzan"
 gj_mundo_ruinas.5.desc: "Algo de piedra y de voluntad ajena patrulla [gj_ruina_loc.GetName]. Los supervivientes de la expedición hablan de figuras grises que no sangran. La comarca está en pie de guerra."
 gj_mundo_ruinas.5.a: "Esperad a que se calmen."
 gj_mundo_ruinas.5.b: "Pagad a los eruditos para sellarlos ya."
 gj_mundo_ruinas.6.title: "La plaga de bestias"
 gj_mundo_ruinas.6.desc: "Lo que dormía en las galerías de [gj_ruina_loc.GetName] ha salido a cazar. Los campos se vacían, los caminos están cortados y hay carros enteros sin conductor."
 gj_mundo_ruinas.6.a: "Esperad a que las bestias se dispersen."
 gj_mundo_ruinas.6.b: "Pagad por una batida y sellad la ruina."
 gj_mundo_ruinas.7.title: "La maldición de la ruina"
 gj_mundo_ruinas.7.desc: "Desde la expedición, los niños de [gj_ruina_loc.GetName] nacen callados y los viejos sueñan los mismos sueños. Nadie encuentra ninguna causa."
 gj_mundo_ruinas.7.a: "Esperad a que pase."
 gj_mundo_ruinas.7.b: "Pagad a sacerdotes y sabios para cerrar la ruina."
 gj_mundo_ruinas.8.title: "La expedición no regresa"
 gj_mundo_ruinas.8.desc: "Pasaron las semanas sin noticias de la expedición. Cuando por fin llegó un mensajero, lo hizo con las manos vacías y la mirada perdida. Quien la dirigía no volvió."
 gj_mundo_ruinas.8.a: "Guardad luto y no volváis a esas ruinas pronto."
 gj_mundo_ruinas.8.b: "Pagad una segunda expedición cuanto antes."
 # ===== Eventos: vetas =====
 gj_mundo_ruinas.30.title: "La veta pasa a nuestras manos"
 gj_mundo_ruinas.30.desc: "[gj_veta_loc.GetName] ya es nuestra. Los viejos de la comarca cuentan que la veta late bajo los pies, y que no le gusta cambiar de amo."
 gj_mundo_ruinas.30.a: "Dejad una guarnición."
 gj_mundo_ruinas.30.b: "Reconoced los derechos de los lugareños."
 gj_mundo_ruinas.31.title: "Hemos perdido la veta"
 gj_mundo_ruinas.31.desc: "[gj_veta_loc.GetName] ya no es nuestra. Los sabios y los viejos de la corte hablan de una afrenta, y de una vieja deuda con la veta."
 gj_mundo_ruinas.31.a: "Jurad recuperarla."
 gj_mundo_ruinas.31.b: "Aceptad la pérdida."
 gj_mundo_ruinas.32.title: "Un artefacto cambia de manos"
 gj_mundo_ruinas.32.desc: "Con [gj_art_loc.GetName] ha llegado también un objeto de los Antiguos, hasta ahora ajeno. Los sabios ya hacen cola para verlo."
 gj_mundo_ruinas.32.a: "Que se le dé el lugar que merece."
 gj_mundo_ruinas.33.title: "Un artefacto perdido"
 gj_mundo_ruinas.33.desc: "Con [gj_art_loc.GetName] se ha ido un objeto de los Antiguos que habíamos custodiado. La corte guarda un silencio vergonzoso."
 gj_mundo_ruinas.33.a: "Que se anote en los libros."
 gj_mundo_ruinas.40.title: "La Gran Colada"
 gj_mundo_ruinas.40.desc: "Una vez por década, la veta hierve de más. Los herreros del Hogar dicen que ha llegado la hora de la Gran Colada: un metal que sale ya templado, sin necesidad de martillo."
 gj_mundo_ruinas.40.a: "Colad armas y herramientas."
 gj_mundo_ruinas.40.b: "Colad moneda y lingotes."
 gj_mundo_ruinas.41.title: "La Pleamar"
 gj_mundo_ruinas.41.desc: "El Cuenco se ha llenado como nunca. Una marea que no tiene nada que ver con la luna corre por los muelles. Los mercaderes piden barcos, y los pescadores, redes más grandes."
 gj_mundo_ruinas.41.a: "Aprovechad para armar más naves."
 gj_mundo_ruinas.41.b: "Vended el derecho de pasaje."
 gj_mundo_ruinas.42.title: "La doble cosecha"
 gj_mundo_ruinas.42.desc: "La Cepa Honda ha despertado: lo sembrado en primavera se siega en verano, y lo sembrado en verano, en otoño. Los graneros no dan abasto."
 gj_mundo_ruinas.42.a: "Sembrad cuanto se pueda."
 gj_mundo_ruinas.42.b: "Repartid el grano y ganad la paz."
 gj_mundo_ruinas.43.title: "La Conjunción"
 gj_mundo_ruinas.43.desc: "Una noche sin nubes, las estrellas se alinean sobre la Aguja y los astrónomos juran no haber visto nada igual. Todos los instrumentos del reino parecen funcionar solos."
 gj_mundo_ruinas.43.a: "Que escriban cuanto vean."
 gj_mundo_ruinas.43.b: "Que lo vea el reino entero."
 gj_mundo_ruinas.50.title: "Una veta al otro lado de la frontera"
 gj_mundo_ruinas.50.desc: "Al otro lado de nuestra frontera hay una veta de poder en manos de [gj_veta_vecino.GetName]. Los sabios dicen que no se puede dejar a una veta en manos que no la entienden. Los consejeros discuten si ha llegado la hora de reclamarla."
 gj_mundo_ruinas.50.a: "Preparad una reclamación."
 gj_mundo_ruinas.50.b: "Dejemos las cosas como están."
 gj_mundo_ruinas.60.title: "Temblores calientes"
 gj_mundo_ruinas.60.desc: "Desde hace semanas el suelo tiembla un poco y de las rocas sale un vapor de olor a metal. Los herreros dicen que el Pulso Rojo está de buen humor. Los campesinos, que están asustados."
 gj_mundo_ruinas.60.a: "Pagad un rito de aplacamiento."
 gj_mundo_ruinas.60.b: "Aprovechad para fundir más metal."
 gj_mundo_ruinas.61.title: "Mareas que no tocan la luna"
 gj_mundo_ruinas.61.desc: "En la costa de la veta las mareas suben y bajan a la hora que quieren. Los pescadores no se atreven a salir y los mercaderes dicen que es una señal."
 gj_mundo_ruinas.61.a: "Que se haga un rito en la orilla."
 gj_mundo_ruinas.61.b: "Cobrad por el paso de los barcos."
 gj_mundo_ruinas.62.title: "Brota fuera de estación"
 gj_mundo_ruinas.62.desc: "Un campo que debía estar dormido amaneció verde en pleno invierno. Los viejos lo llaman un regalo de la Cepa; los clérigos, una advertencia."
 gj_mundo_ruinas.62.a: "Agradecedlo con una procesión."
 gj_mundo_ruinas.62.b: "Vended el exceso de grano."
 gj_mundo_ruinas.63.title: "El cielo demasiado claro"
 gj_mundo_ruinas.63.desc: "En las noches de la veta, las estrellas se ven más cerca de lo debido. Los astrónomos apuntan cifras que no cuadran, y los marinos juran que se han perdido por mirar arriba."
 gj_mundo_ruinas.63.a: "Que los astrónomos lo apunten todo."
 gj_mundo_ruinas.63.b: "Que se cuente como señal en la corte."
 gj_mundo_ruinas.80.title: "Peregrinos y estudiosos"
 gj_mundo_ruinas.80.desc.atlante: "La ruina de cristal restaurada de [gj_ruina_loc.GetName] atrae a marinos de todas partes, que bajan a ver cómo cambia la luz bajo el suelo. Los mesones del puerto no dan abasto."
 gj_mundo_ruinas.80.desc.enana: "La ruina de piedra restaurada de [gj_ruina_loc.GetName] atrae a maestros de obras y herreros que quieren oír el eco. Algunos se quedan a vivir."
 gj_mundo_ruinas.80.desc.antigua: "La ruina de los Anteriores restaurada de [gj_ruina_loc.GetName] atrae a estudiosos que pasan allí el invierno entero. Hay quien dice que ya hablan su lengua."
 gj_mundo_ruinas.80.a: "Que sean bienvenidos."
 gj_mundo_ruinas.81.title: "Contrabandistas de reliquias"
 gj_mundo_ruinas.81.desc: "Una banda se ha instalado cerca de [gj_ruina_loc.GetName] y vende reliquias a los forasteros. Unas son auténticas, otras, de barro de ayer. Los guardias no saben cuáles son cuáles."
 gj_mundo_ruinas.81.a: "Que los guardias los expulsen."
 gj_mundo_ruinas.81.b: "Cobrad una tasa por cada venta."
