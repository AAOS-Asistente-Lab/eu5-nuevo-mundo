 a_gj_durnhal_tirador_1: "Ballesteros de galería I"
 a_gj_durnhal_tirador_1_desc: "Tiradores criados en pasillos de roca, donde un solo disparo mal apuntado rebota y mata al que lo dispara. Se les enseña a acertar a la primera. En la montaña son temibles; en campo abierto, sin paredes que les cubran, tiemblan."
 a_gj_durnhal_tirador_2: "Ballesteros de galería II"
 a_gj_durnhal_tirador_2_desc: "Tiradores criados en pasillos de roca, donde un solo disparo mal apuntado rebota y mata al que lo dispara. Se les enseña a acertar a la primera. En la montaña son temibles; en campo abierto, sin paredes que les cubran, tiemblan."
