l_english:
 # Copia del castellano: esta parte no trae textos en ingles.
 gj_durnhal_piedra_madre: "Piedra madre"
 gj_durnhal_piedra_madre_desc: "Antes de que hubiera reyes hubo veneros, y antes de los veneros, la roca que los guarda. Las Casas de Durnhal aprendieron a leer la montaña como otros leen el cielo: sabiendo que cada veta tiene su humor y cada pared su paciencia."
 gj_durnhal_ley_de_la_veta: "Ley de la veta"
 gj_durnhal_ley_de_la_veta_desc: "Quien abre la galería, la sostiene; quien la sostiene, la hereda. Una ley breve y antigua que evita que dos Casas se disputen el mismo filón y que el techo caiga sobre las dos."
 gj_durnhal_yunque_comun: "El yunque común"
 gj_durnhal_yunque_comun_desc: "En el corazón de cada gran salón arde un solo yunque al que acuden todos los herreros. Lo que se forja allí no pertenece a ninguna Casa, y por eso todas lo defienden."
 gj_durnhal_salones_de_los_ancestros: "Salones de los ancestros"
 gj_durnhal_salones_de_los_ancestros_desc: "Cada linaje labra en la roca el nombre de sus muertos. Mientras el nombre siga a la vista, el difunto sigue sentado en el Consejo, y ningún vivo se atreve a mentir delante de él."
 gj_durnhal_escudo_y_martillo: "Escudo y martillo"
 gj_durnhal_escudo_y_martillo_desc: "La primera lección de un recluta durnhalí es plantarse; la segunda, no moverse; la tercera, golpear solo cuando el escudo vecino ya está pegado al suyo. Es una guerra de muros, no de carreras."
 gj_durnhal_galerias_profundas: "Galerías profundas"
 gj_durnhal_galerias_profundas_desc: "Se inventó el puntal de piedra encajada y, de pronto, el subsuelo dejó de ser un abismo para ser una calle. Donde antes se cavaban pozos, ahora se trazan barrios enteros bajo tierra."
 gj_durnhal_cartas_de_gremio: "Cartas de gremio"
 gj_durnhal_cartas_de_gremio_desc: "Las Casas pusieron por escrito lo que antes se sabía de memoria: quién puede fundir, quién puede tallar y a quién se le debe el diezmo del primer lingote."
 gj_durnhal_maestros_de_obra: "Maestros de obra"
 gj_durnhal_maestros_de_obra_desc: "Los capataces de Durnhal cobran por la piedra que no se cae. Una escuela de cantería formó a generación tras generación de constructores que miden en siglos."
 gj_durnhal_prestamos_de_la_forja: "Préstamos de la forja"
 gj_durnhal_prestamos_de_la_forja_desc: "El prestamista durnhalí no presta oro: presta herramientas, y cobra en metal. Es un negocio lento, pero al que le debe a la forja nunca le ha faltado herramienta."
 gj_durnhal_martillo_y_pica: "Martillo y pica"
 gj_durnhal_martillo_y_pica_desc: "Al muro de escudos se le añade una segunda fila que empuja y una tercera que apunta. Los veteranos dicen que la infantería no se detiene: se acaba el enemigo."
 gj_durnhal_fundicion_de_runa: "Fundición de runa"
 gj_durnhal_fundicion_de_runa_desc: "Una runa grabada en la boca del horno mantiene el calor donde debe estar. Los herreros juran que es magia; los ingenieros, que es la forma de la chimenea. Ambos se callan cuando sale el acero."
 gj_durnhal_escuela_de_capataces: "Escuela de capataces"
 gj_durnhal_escuela_de_capataces_desc: "Quien manda una galería debe saber leer los planos, contar el aire y reconocer el sonido de una roca antes de que falle. La Escuela de Capataces enseña las tres cosas, y una cuarta: cuándo callarse."
 gj_durnhal_pozos_ventilados: "Pozos ventilados"
 gj_durnhal_pozos_ventilados_desc: "Un segundo pozo para el aire, una linterna que no se apaga y un canario en jaula: tres inventos humildes que han salvado más mineros que todos los santos juntos."
 gj_durnhal_bombardas_en_la_brecha: "Bombardas en la brecha"
 gj_durnhal_bombardas_en_la_brecha_desc: "Las bombardas de runa dejaron de ser curiosidades de taller y se convirtieron en el arma que abre las puertas. Quien no tiene muros de roca no tiene tiempo."
 gj_durnhal_minas_hondas: "Minas hondas"
 gj_durnhal_minas_hondas_desc: "Por debajo del nivel de los ríos, donde el agua se cuela y el aire se espesa, esperan las gemas que nadie vio. Cavar allí cuesta vidas y compensa en joyas."
 gj_durnhal_banco_de_las_casas: "Banco de las Casas"
 gj_durnhal_banco_de_las_casas_desc: "Las Casas pusieron sus tesoros en una sola cámara, con doce llaves y doce guardianes. Nadie puede abrirla sin los demás, y nadie puede cobrar sin que todos lo sepan."
 gj_durnhal_gremio_de_artilleros: "Gremio de artilleros"
 gj_durnhal_gremio_de_artilleros_desc: "El cálculo de la parábola se aprende en la fundición antes que en la escuela. Un artillero durnhalí sabe cuánta pólvora cabe en un caño por la forma del eco."
 gj_durnhal_frente_de_acero: "Frente de acero"
 gj_durnhal_frente_de_acero_desc: "El muro de escudos aprendió a disparar sin romperse. Los rompeescudos de nueva leva marchan con arcabuz al hombro y el martillo en el cinto."
 gj_durnhal_hornos_de_coque: "Hornos de coque"
 gj_durnhal_hornos_de_coque_desc: "El carbón bajo la montaña ardió por fin como se merecía. Los hornos de coque no se apagan nunca y su resplandor se ve desde tres valles de distancia."
 gj_durnhal_manufacturas_de_las_casas: "Manufacturas de las Casas"
 gj_durnhal_manufacturas_de_las_casas_desc: "Una manufactura durnhalí no es una fábrica: es un salón donde cuarenta artesanos miden la misma pieza hasta que dejan de discutir. El resultado, dicen los compradores, no se parece a nada de lo que se vende fuera."
 gj_durnhal_trueno_de_las_casas: "Trueno de las Casas"
 gj_durnhal_trueno_de_las_casas_desc: "Cuando las bombardas hablan al unísono, la montaña responde. Los ejércitos que no pueden esconderse bajo tierra aprenden a respetar ese trueno."
 gj_durnhal_vapor_de_runa: "Vapor de runa"
 gj_durnhal_vapor_de_runa_desc: "La runa del horno se volvió caldera y la caldera, motor. Las galerías que antes se vaciaban a mano se bombean ahora con un resoplido de hierro que nunca descansa."
 gj_durnhal_ciudades_de_piedra: "Ciudades de piedra"
 gj_durnhal_ciudades_de_piedra_desc: "Las ciudades de Durnhal crecen hacia abajo y hacia dentro. Sus calles son galerías, sus plazas, cámaras, y sus barrios, pisos. Quien las ve desde fuera solo distingue una puerta."
 gj_durnhal_pacto_de_las_casas: "El Gran Pacto de las Casas"
 gj_durnhal_pacto_de_las_casas_desc: "Tras siglos de contiendas de linaje, las Casas firmaron un pacto que las obliga a votar juntas. Quien quiebre el pacto no será expulsado: será olvidado, que para un durnhalí es peor."
 gj_durnhal_martillo_de_la_nueva_era: "Martillo de la nueva era"
 gj_durnhal_martillo_de_la_nueva_era_desc: "El Rompeescudos ha cambiado de nombre pero no de oficio: sigue sosteniendo la línea. Ahora lo hace con un acero tan fino que las balas se desvían en el casco."
 gj_durnhal_cultura_orfebres_de_veta: "Orfebres de veta"
 gj_durnhal_cultura_orfebres_de_veta_desc: "Los durnhalí no ven joyas: ven la piedra que se deja pulir. Su orfebrería es seca, geométrica y casi siempre invisible: va por dentro de las armas y los arneses."
 gj_durnhal_cultura_memoria_de_piedra: "Memoria de piedra"
 gj_durnhal_cultura_memoria_de_piedra_desc: "Los durnhalí graban lo que importa en la pared y lo que no importa en el papel. Pasadas las generaciones, la pared sigue legible; el papel, no."
 gj_durnhal_cultura_cantares_de_fragua: "Cantares de fragua"
 gj_durnhal_cultura_cantares_de_fragua_desc: "Los herreros cantan al golpear, y el compás fija el ritmo de la marcha. Un regimiento durnhalí avanza al compás de un martillo que no se ve, y no hay tambor que lo supere."
 gj_durnhal_mancomunidad_de_casas: "Mancomunidad de las Casas"
 gj_durnhal_mancomunidad_de_casas_desc: "Las Doce Casas gobiernan por turno y por veto. Ningún rey las manda; todas lo escuchan. Es un gobierno lento y estable, como la piedra de la que sale."
 gj_durnhal_concilio_de_capataces: "Concilio de capataces"
 gj_durnhal_concilio_de_capataces_desc: "Los capataces de las grandes minas se sientan en el Consejo con el mismo rango que los nobles de linaje. La profundidad, por fin, tiene voz y voto."
 gj_durnhali: "Durnhalíes"
 gj_durnhali_adj: "durnhalí"
 gj_grupo_enano: "Pueblo de la Montaña"
 gj_durnhal_lengua: "Durnhalí"
 gj_enano_language_family: "Lenguas de la Montaña"
 a_gj_durnhal_rompeescudos_1: "Rompeescudos I"
 a_gj_durnhal_rompeescudos_1_desc: "Los Rompeescudos son la infantería pesada de las Casas: lentos, apretados y casi imposibles de mover mientras tengan roca bajo los pies. En campo abierto son un muro de acero que nadie sabe cómo rodear, pero también un muro que tarda semanas en llegar a la batalla."
 a_gj_durnhal_rompeescudos_2: "Rompeescudos II"
 a_gj_durnhal_rompeescudos_2_desc: "Los Rompeescudos son la infantería pesada de las Casas: lentos, apretados y casi imposibles de mover mientras tengan roca bajo los pies. En campo abierto son un muro de acero que nadie sabe cómo rodear, pero también un muro que tarda semanas en llegar a la batalla."
