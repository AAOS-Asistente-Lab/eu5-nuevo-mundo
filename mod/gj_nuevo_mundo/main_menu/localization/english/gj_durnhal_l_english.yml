 gj_durnhal_gran_forja: "Gran Forja"
 gj_durnhal_gran_forja_desc: "El corazón de cada ciudad durnhalí es una forja en la que todas las Casas entregan, sin pagar, su mejor carbón. A cambio, el rey recibe armas y cañones de calidad que no se encuentran en ningún mercado. Solo puede haber una por país, y su producción crece con cada era, pero reclama carbón y hierro para sí."
 gj_durnhal_salon_ancestros: "Salón de los Ancestros"
 gj_durnhal_salon_ancestros_desc: "Una sala larga, tallada de arriba abajo con los nombres de los muertos. Quien gobierna sentado bajo esos nombres no se atreve a mentir. Solo puede construirse en la capital, y aumenta su efecto cuando el país descubre nuevas eras."
 gj_durnhal_fundicion_de_veta: "Fundición de veta"
 gj_durnhal_fundicion_de_veta_desc: "Un horno bajo la montaña, alimentado de hierro y carbón de la misma veta. Produce acero. Con cada nuevo avance de fundición, el horno se afina y rinde más, pero también devora más carbón."
 gj_durnhal_hongueras_hondas: "Hongueras hondas"
 gj_durnhal_hongueras_hondas_desc: "Cámaras húmedas donde crecen hongos comestibles sobre camas de estiércol y paja. Es la respuesta de los durnhalí a la falta de tierra de labor: no es sabroso, pero no hay hambruna que lo pare. Se perfecciona con la ventilación y las galerías."
 gj_durnhal_baluarte_de_roca: "Baluarte de roca"
 gj_durnhal_baluarte_de_roca_desc: "Una fortaleza excavada en la ladera, con puertas que no se abren desde fuera y pasillos en los que un solo defensor detiene a un ejército. Solo se puede construir en montaña o colina, es muy caro y sube de nivel a medida que avanzan las eras."
 STATIC_MODIFIER_NAME_gj_durnhal_mina_nivel_1: "Mina de nivel 1"
 STATIC_MODIFIER_DESC_gj_durnhal_mina_nivel_1: "Las galerías de esta mina llegan al nivel 1 de profundidad. Más metal y más gemas, pero también más inquietud en la roca."
 STATIC_MODIFIER_NAME_gj_durnhal_mina_nivel_2: "Mina de nivel 2"
 STATIC_MODIFIER_DESC_gj_durnhal_mina_nivel_2: "Las galerías de esta mina llegan al nivel 2 de profundidad. Más metal y más gemas, pero también más inquietud en la roca."
 STATIC_MODIFIER_NAME_gj_durnhal_mina_nivel_3: "Mina de nivel 3"
 STATIC_MODIFIER_DESC_gj_durnhal_mina_nivel_3: "Las galerías de esta mina llegan al nivel 3 de profundidad. Más metal y más gemas, pero también más inquietud en la roca."
 STATIC_MODIFIER_NAME_gj_durnhal_mina_nivel_4: "Mina de nivel 4"
 STATIC_MODIFIER_DESC_gj_durnhal_mina_nivel_4: "Las galerías de esta mina llegan al nivel 4 de profundidad. Más metal y más gemas, pero también más inquietud en la roca."
 STATIC_MODIFIER_NAME_gj_durnhal_mina_nivel_5: "Mina de nivel 5"
 STATIC_MODIFIER_DESC_gj_durnhal_mina_nivel_5: "Las galerías de esta mina llegan al nivel 5 de profundidad. Más metal y más gemas, pero también más inquietud en la roca."
 STATIC_MODIFIER_NAME_gj_durnhal_veta_madre: "Veta madre"
 STATIC_MODIFIER_DESC_gj_durnhal_veta_madre: "Una veta ancha y limpia, tan rica que los capataces no se creen su suerte."
 STATIC_MODIFIER_NAME_gj_durnhal_derrumbe: "Galería derrumbada"
 STATIC_MODIFIER_DESC_gj_durnhal_derrumbe: "Un derrumbe reciente ha dejado cicatrices en la galería. Hacen falta años para reabrirla."
 STATIC_MODIFIER_NAME_gj_durnhal_cantar_de_fragua: "El cantar de la fragua"
 STATIC_MODIFIER_DESC_gj_durnhal_cantar_de_fragua: "Los herreros han cantado al unísono. La moral sube y las Casas se sienten una."
 STATIC_MODIFIER_NAME_gj_durnhal_hongueras_enfermas: "Hongueras enfermas"
 STATIC_MODIFIER_DESC_gj_durnhal_hongueras_enfermas: "Una plaga de moho ha estropeado parte de la cosecha subterránea."
 STATIC_MODIFIER_NAME_gj_durnhal_acero_nuevo: "El acero nuevo"
 STATIC_MODIFIER_DESC_gj_durnhal_acero_nuevo: "Una mezcla afortunada ha mejorado las fundiciones durante un tiempo."
 STATIC_MODIFIER_NAME_gj_durnhal_obra_en_curso: "Galerías en obras"
 STATIC_MODIFIER_DESC_gj_durnhal_obra_en_curso: "Las cuadrillas están ocupadas en reforzar o profundizar las minas."
 STATIC_MODIFIER_NAME_gj_durnhal_catedral_invertida: "La catedral invertida"
 STATIC_MODIFIER_DESC_gj_durnhal_catedral_invertida: "Una obra tan magnífica que el país entero se enorgullece."
 STATIC_MODIFIER_NAME_gj_durnhal_huelga: "Huelga de capataces"
 STATIC_MODIFIER_DESC_gj_durnhal_huelga: "Los capataces han parado las galerías hasta que se les escuche."
 STATIC_MODIFIER_NAME_gj_durnhal_contrato_lagunas: "Contrato con los barqueros"
 STATIC_MODIFIER_DESC_gj_durnhal_contrato_lagunas: "Un contrato de hierro por pescado que ambas partes respetan."
 STATIC_MODIFIER_NAME_gj_durnhal_despensa_llena: "Despensa llena"
 STATIC_MODIFIER_DESC_gj_durnhal_despensa_llena: "Los almacenes rebosan de grano y de queso."
 STATIC_MODIFIER_NAME_gj_durnhal_evacuacion: "Niveles hondos evacuados"
 STATIC_MODIFIER_DESC_gj_durnhal_evacuacion: "Las galerías más profundas están vacías por precaución."
 STATIC_MODIFIER_NAME_gj_durnhal_galerias_selladas: "Galerías selladas"
 STATIC_MODIFIER_DESC_gj_durnhal_galerias_selladas: "Se han cerrado los niveles hondos. La producción lo nota."
 STATIC_MODIFIER_NAME_gj_durnhal_rito_de_contencion: "Rito de contención"
 STATIC_MODIFIER_DESC_gj_durnhal_rito_de_contencion: "Los braseros de la Llama arden a todas horas. La roca se calma, pero el trabajo pierde horas."
 STATIC_MODIFIER_NAME_gj_durnhal_forja_encendida: "La Gran Forja encendida"
 STATIC_MODIFIER_DESC_gj_durnhal_forja_encendida: "La forja arde a plena potencia. Las armas salen más deprisa, a un coste mayor."
 STATIC_MODIFIER_NAME_gj_durnhal_consejo_reciente: "Cónclave reciente"
 STATIC_MODIFIER_DESC_gj_durnhal_consejo_reciente: "Las Casas han votado juntas y todas se sienten escuchadas."
 gj_durnhal_cavar_mas_hondo.title: "Cavar más hondo"
 gj_durnhal_cavar_mas_hondo.desc: "Una galería más abajo, una veta más rica, un eco más grave. Los capataces aseguran que aún queda metal por ahí. Cada nivel que se cava da más metal y más gemas, pero también hace temblar la roca. El tope depende de la era: hasta nivel 2 al principio, hasta 5 en la era del absolutismo."
 gj_durnhal_cavar_mas_hondo.a: "Que bajen las cuadrillas."
 gj_durnhal_sellar_galeria.title: "Sellar una galería"
 gj_durnhal_sellar_galeria.desc: "A veces la prudencia consiste en tapiar lo que la ambición abrió. Se baja dos niveles una mina profunda: pierde producción, pero la roca se calma."
 gj_durnhal_sellar_galeria.a: "Que se tapien los niveles hondos."
 gj_durnhal_rito_de_contencion.title: "Rito de contención"
 gj_durnhal_rito_de_contencion.desc: "Los clérigos de la Llama Profunda descienden con braseros de carbón blanco y entonan letanías en las galerías hondas. La roca se aquieta y los mineros respiran, aunque pierden horas de trabajo."
 gj_durnhal_rito_de_contencion.a: "Que ardan los braseros."
 gj_durnhal_encender_la_gran_forja.title: "Encender la Gran Forja a plena potencia"
 gj_durnhal_encender_la_gran_forja.desc: "Se echa carbón sin tasa y se llama a todos los herreros. Durante unos años las armas y los cañones salen en cantidades que ningún mercado ve, a un coste que ninguna tesorería quiere pagar."
 gj_durnhal_encender_la_gran_forja.a: "¡Que arda hasta que se quede en brasa!"
 gj_durnhal_convocar_el_conclave.title: "Convocar el Cónclave extraordinario"
 gj_durnhal_convocar_el_conclave.desc: "Se reúne a las Doce Casas fuera de turno para votar una medida de urgencia. Las discusiones son largas, pero el resultado, si es unánime, da fuerza a los años siguientes."
 gj_durnhal_convocar_el_conclave.a: "Que se abra el Cónclave."
 gj_durnhal_lo_que_duerme_debajo: "Lo que duerme debajo"
 gj_durnhal_lo_que_duerme_debajo_desc: "Hay cosas que no deben despertarse. Durnhal ha cavado más hondo de lo que cualquier mapa recomienda y, bajo las últimas galerías, algo ha abierto un ojo. Mientras la inquietud de la roca no baje, el país temblará: se derrumbarán minas, los obreros huirán y los clérigos exigirán que se deje de cavar. La inquietud se reduce con ritos de contención y sellando galerías."
 gj_durnhal.1.a: "¡A la forja con ella!"
 gj_durnhal.1.b: "Que la hereden los que vengan."
 gj_durnhal.1.title: "La veta madre"
 gj_durnhal.1.desc: "Una cuadrilla de la Casa del Martillo Hondo ha dado con una veta que no figura en ningún plano: ancha como un camino, limpia como una moneda recién acuñada. Los capataces discuten a gritos si explotarla ya o dejarla para los nietos."
 gj_durnhal.2.a: "Que decida el linaje más antiguo."
 gj_durnhal.2.b: "Que decida la que más paga al tesoro."
 gj_durnhal.2.c: "Que echen a suertes con un dado de hueso."
 gj_durnhal.2.title: "El Cónclave de las Doce Casas"
 gj_durnhal.2.desc: "Cada cuatro inviernos las Casas se reúnen a puerta cerrada para repartir los turnos de galería. Este año dos linajes reclaman el mismo filón, y ninguno cede. Las voces suben y el eco de la sala hace que parezca que gritan cien."
 gj_durnhal.3.a: "¡Que suene hasta el amanecer!"
 gj_durnhal.3.b: "Que se cante, pero sin parar las forjas."
 gj_durnhal.3.title: "El cantar de la fragua"
 gj_durnhal.3.desc: "En la noche del primer vaciado del año, los herreros de todas las Casas cantan juntos el viejo cantar del yunque. Cuentan que quien lo oye desde fuera lo confunde con un terremoto y quien lo oye desde dentro, con un abrazo."
 gj_durnhal.4.a: "Quemad las camas y sembrad de nuevo."
 gj_durnhal.4.b: "Comprad grano a quien lo venda."
 gj_durnhal.4.title: "Hongueras enfermas"
 gj_durnhal.4.desc: "Una mancha blanca sube por las paredes de las hongueras hondas y los hongos se secan sin llegar a madurar. Sin ellos, las galerías pasan hambre. Los boticarios proponen quemar las camas de cultivo; los capataces, importar comida."
 gj_durnhal.5.a: "Que salga la guardia y los persiga."
 gj_durnhal.5.b: "Pagad el rescate de los conductores."
 gj_durnhal.5.c: "Cerrad el paso hasta la primavera."
 gj_durnhal.5.title: "La caravana del paso"
 gj_durnhal.5.desc: "Una caravana cargada de lingotes ha sido asaltada en el desfiladero por una partida que conocía muy bien el camino. Los supervivientes dicen que los asaltantes no hablaban ninguna lengua de las montañas."
 gj_durnhal.6.a: "Que funde otra tanda y la anoten bien."
 gj_durnhal.6.b: "Guardad el secreto en el archivo de la Casa."
 gj_durnhal.6.title: "La aprendiz y el acero nuevo"
 gj_durnhal.6.desc: "Una aprendiz de las fundiciones de la Casa del Carbón Frío ha mezclado, por descuido o por genio, dos cargas que nunca debieron tocarse. El lingote que salió del horno no se mella con ninguna lima conocida. Su maestra no sabe si abrazarla o expulsarla."
 gj_durnhal.7.a: "¡Todos a cavar! Que nadie se quede abajo."
 gj_durnhal.7.b: "Sellad la galería para que no cunda."
 gj_durnhal.7.title: "Derrumbe en la galería"
 gj_durnhal.7.desc: "Un crujido largo, un silencio, y luego un trueno sordo. La galería del nivel cuarto de una de nuestras minas ha cedido y ha dejado atrapados a un grupo de mineros. Las campanas de alarma suenan por todos los pozos."
 gj_durnhal.8.a: "Sacad la gema y estudiad la sala."
 gj_durnhal.8.b: "Sellad la cámara sin tocar nada."
 gj_durnhal.8.title: "La cámara de los que cavaron antes"
 gj_durnhal.8.desc: "Tras un muro de roca mal sellado, los mineros han abierto una cámara tallada con una geometría que ningún durnhalí reconoce como propia. Hay estantes vacíos, una mesa de piedra y una gema del tamaño de un puño, todavía tibia."
 gj_durnhal.9.a: "Que los clérigos de la Llama enciendan los braseros de contención."
 gj_durnhal.9.b: "Reforzad los puntales y seguid cavando."
 gj_durnhal.9.c: "Cuentos de viejas. A trabajar."
 gj_durnhal.9.title: "La roca se queja"
 gj_durnhal.9.desc: "Los mineros viejos lo notan antes que los instrumentos: las paredes crujen sin motivo, los canarios se agitan y el agua de los pozos tiembla en las jarras. Algo se mueve muy por debajo de las galerías más hondas."
 gj_durnhal.10.a: "Que haya prueba pública."
 gj_durnhal.10.b: "El yunque no se mueve. Es ley."
 gj_durnhal.10.title: "La pugna por el yunque"
 gj_durnhal.10.desc: "Una Casa pretende que el Yunque común se traslade a su salón, alegando que es la más cercana al filón mayor. Las demás murmuran. Un ancianísimo herrero propone zanjar la cuestión con una prueba: forjar la misma pieza con las mismas manos, delante de todos."
 gj_durnhal.11.a: "Acogedlos. La profundidad tiene sitio para todos."
 gj_durnhal.11.b: "Que bajen solo los que sepan un oficio."
 gj_durnhal.11.title: "Los que piden bajar"
 gj_durnhal.11.desc: "Un grupo de campesinos de los valles de arriba llega hasta la puerta del salón y pide, sin rodeos, que se les deje trabajar en las minas. Dicen que bajo tierra, al menos, se come caliente."
 gj_durnhal.12.a: "Contratad a más orfebres, sea cual sea su Casa."
 gj_durnhal.12.b: "Limitad la producción para mantener el precio."
 gj_durnhal.12.title: "El oro de la orfebrería"
 gj_durnhal.12.desc: "Una remesa de joyas de las Casas ha llegado hasta cortes lejanas, donde han despertado una moda inesperada: broches de arnés, cierres de coraza, anillos con un secreto dentro. Los pedidos aumentan más de lo que las fraguas pueden satisfacer."
 gj_durnhal.13.a: "Que se cave, aunque cueste una generación."
 gj_durnhal.13.b: "Que se cave la mitad y se vea."
 gj_durnhal.13.c: "Que se guarde el plano para tiempos mejores."
 gj_durnhal.13.title: "La catedral invertida"
 gj_durnhal.13.desc: "Un maestro cantero ha presentado a las Casas el plano de un templo cavado hacia abajo: nueve bóvedas escalonadas, cada una más ancha que la anterior, hasta una sala final que cabe un pueblo entero. «Un templo debe sostenerse a sí mismo», dice. «Por eso hacia abajo no cae»."
 gj_durnhal.14.a: "Dadles el asiento. Cuando la roca habla, se escucha."
 gj_durnhal.14.b: "Que se queden sentados hasta que les pese."
 gj_durnhal.14.c: "Comprad su vuelta con un aumento."
 gj_durnhal.14.title: "La huelga de los capataces"
 gj_durnhal.14.desc: "Los capataces de la mina mayor han dejado las herramientas a la entrada de la galería y se han sentado en el suelo. No piden más oro: piden un asiento en el Consejo. Las Casas se miran unas a otras como si cada una esperase que otra respondiera."
 gj_durnhal.15.a: "Firmad un contrato por diez años."
 gj_durnhal.15.b: "Comerciad a ratos, sin firmar nada."
 gj_durnhal.15.c: "El hierro no se vende a quien lo vende todo."
 gj_durnhal.15.title: "El emisario de las lagunas"
 gj_durnhal.15.desc: "Un mercader de rostro afable, con la cabeza cubierta de un sombrero ladeado y un mapa dibujado sobre un trozo de piel, pide audiencia. Representa a un consorcio de barqueros que querría comprar hierro y vender, a cambio, pescado salado y velas de buen sebo."
 gj_durnhal.16.a: "Que haya feria, con aduana libre."
 gj_durnhal.16.b: "Que haya feria, pero cobrad por la entrada."
 gj_durnhal.16.title: "La Feria del Yunque"
 gj_durnhal.16.desc: "Cada siete años, la Casa más antigua abre su salón y exhibe lo mejor de la forja: espadas sin filo que nunca se mellan, coronas sin gemas que pesan más que una gema, puertas de cobre que se abren con una sola mano. Los visitantes llegan desde tres rutas distintas."
 gj_durnhal.17.a: "Que oficie todo lo que haga falta."
 gj_durnhal.17.b: "Que oficie, pero fuera de las horas de trabajo."
 gj_durnhal.17.title: "Los viejos ritos de la Llama"
 gj_durnhal.17.desc: "Un clérigo de la Llama Profunda baja a las galerías con un brasero de carbón blanco y empieza a recitar letanías contra el eco. Los mineros más supersticiosos se arrodillan; los más pragmáticos preguntan cuánto tiempo van a perder."
 gj_durnhal.18.a: "Declarad tablas y honrad a los dos."
 gj_durnhal.18.b: "Dejad que lo resuelva el bloque."
 gj_durnhal.18.title: "El duelo de los linajes"
 gj_durnhal.18.desc: "Dos herederos de las Casas principales han resuelto una cuestión de honor a la manera antigua: cada uno, con un martillo, golpea un bloque de granito hasta que uno de los dos se rinde o se parte la piedra. El bloque lleva ya tres días entero."
 gj_durnhal.19.a: "Reclutad entre los pastores."
 gj_durnhal.19.b: "Que aguanten con lo que tienen hasta el deshielo."
 gj_durnhal.19.title: "Nieve en los pasos"
 gj_durnhal.19.desc: "Los exploradores traen malas noticias: las nieves han cerrado el paso del oeste y, con él, el relevo de las guarniciones de frontera. Los comandantes piden permiso para reclutar entre los pastores de las laderas."
 gj_durnhal.20.a: "Aceptad, pero con un plazo de dos años."
 gj_durnhal.20.b: "Devolved al mensajero con un cuchillo bien forjado."
 gj_durnhal.20.title: "Los hombres del este"
 gj_durnhal.20.desc: "Un mensajero de las llanuras orientales, sudoroso y polvoriento, llega a la corte durnhalí con una oferta que suena a amenaza: mil caballos a cambio de una promesa de que ninguna caravana de hierro cruzará la frontera. La cortesía es la forma que tienen los fuertes de pedir lo que quieren."
 gj_durnhal.21.a: "Nombradle Maestro de las Casas."
 gj_durnhal.21.b: "Que cree una escuela, pero que no mande."
 gj_durnhal.21.title: "El maestro cantero"
 gj_durnhal.21.desc: "Un maestro cantero de origen humilde ha rematado en la capital una bóveda tan ligera que la gente se pregunta qué la sostiene. «La gravedad», dice él, «que es la única que no miente». Los demás canteros le piden, uno a uno, que les enseñe a no mentir con las piedras."
 gj_durnhal.22.a: "Llenad los almacenes de las minas."
 gj_durnhal.22.b: "Vended parte a los gremios y bajad los precios."
 gj_durnhal.22.title: "La cosecha de los valles"
 gj_durnhal.22.desc: "Este año los valles de abajo han dado más de lo esperado y los mercados están llenos de cebada, de queso y de nabos. Los durnhalí, que comen de lo que otros siembran, hacen cuentas con una sonrisa que no les sale a menudo."
 gj_durnhal.30.a: "Evacuad los niveles hondos."
 gj_durnhal.30.b: "Que bajen los clérigos y las Casas, juntos."
 gj_durnhal.30.c: "Cavad más rápido: lo que sea, que lo quiera cuando acabemos."
 gj_durnhal.30.title: "Lo que duerme debajo"
 gj_durnhal.30.desc: "Hay un ruido que nadie quiere nombrar. Sube desde más abajo de las galerías, desde donde ya no hay roca, sino algo que se parece a la roca como una sombra se parece a su dueño. Los braseros se apagan solos. Los canarios no cantan. Los viejos dicen que han llegado al fondo de lo que debía ser tocado."
 gj_durnhal.31.a: "Reabrid lo que se pueda; olvidad el resto."
 gj_durnhal.31.title: "Galerías que se cierran solas"
 gj_durnhal.31.desc: "En una sola noche se han derrumbado cuatro galerías que llevaban un siglo en pie. Los supervivientes cuentan que la roca se movía como si respirara. No hay cadáveres que enterrar: hay galerías que ya no existen."
 gj_durnhal.32.a: "Sellad todo por debajo del tercer nivel."
 gj_durnhal.32.b: "Que bajen los Rompeescudos."
 gj_durnhal.32.title: "El pulso en la roca"
 gj_durnhal.32.desc: "La profundidad late. Cada latido hace temblar la sala del Consejo y mueve las copas sobre la mesa. Alguien ha propuesto sellar todo lo que esté a más de tres niveles. Alguien más ha propuesto bajar con armas y ver qué hay. Nadie se ríe."
 gj_durnhal.33.a: "Grabad la fecha en el Salón de los Ancestros."
 gj_durnhal.33.title: "El silencio de abajo"
 gj_durnhal.33.desc: "Poco a poco, el ruido se ha ido apagando. Los canarios vuelven a cantar y los braseros arden sin ayuda. Las Casas dicen que lo han vencido; los mineros, que solo ha vuelto a dormirse. Quizá ambas cosas sean ciertas."
