 a_gj_durnhal_bombarda_1: "Bombardas de runa I"
 a_gj_durnhal_bombarda_1_desc: "Un tubo de bronce grabado con runas que ninguna cabeza sabe leer, pero que ninguna mano duda en encender. Son más precisas que las de los demás pueblos, con la ayuda de las runas. También se atascan, se averían y son carísimas de mantener."
 a_gj_durnhal_bombarda_2: "Bombardas de runa II"
 a_gj_durnhal_bombarda_2_desc: "Un tubo de bronce grabado con runas que ninguna cabeza sabe leer, pero que ninguna mano duda en encender. Son más precisas que las de los demás pueblos, con la ayuda de las runas. También se atascan, se averían y son carísimas de mantener."
