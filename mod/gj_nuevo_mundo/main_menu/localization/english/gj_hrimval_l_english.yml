 gj_hrimval_noche_blanca: "La Noche Blanca"
 gj_hrimval_noche_blanca_desc: "La Corte Insepulta ha despertado. Durante cuatro años, un invierno sobrenatural cubre todo el norte, las Huestes no sienten el frío ni el cansancio, y las Marchas de Escarcha salen a recoger a los que caen. Cuando acabe, la Corte volverá a dormir."
 hint_gj_hrimval_noche_blanca: "La Noche Blanca"
 gj_hrimval_noche_blanca_amanece: "Amanece"
 gj_hrimval_el_deshielo: "El Deshielo"
 gj_hrimval_el_deshielo_desc: "El relicario ha caído y el rey, de pronto, tiene la edad de todos los años que no vivió. Sin él, la Corte se disuelve: los nobles huyen, los ejércitos se agrietan y el hielo cede. La única forma de salir es enterrar al rey o recuperar el relicario."
 gj_liga_sal_llama: "Liga de la Sal y la Llama"
 gj_liga_sal_llama_desc: "Una alianza de los países del norte para guardar los pasos contra la Corte Insepulta. Sus miembros intercambian sal, fuego y centinelas. Ninguno confía del todo en los demás, pero ninguno tiene mejor opción."
 diplomatic_status_gj_liga_sal_llama_name: "Liga de la Sal y la Llama"
 diplomatic_status_gj_liga_sal_llama_tooltip: "#T Liga de la Sal y la Llama#!\nEste país es miembro de la Liga de la Sal y la Llama. Sus miembros guardan juntos los pasos contra la Corte Insepulta."
 gj_liga_sal_llama_list_who_tt: "$WHO$ está en la Liga de la Sal y la Llama con $LIST$. Se protegen entre sí contra la Corte Insepulta"
 io_opinion_gj_liga_sal_llama: "En la Liga de la Sal y la Llama juntos"
 gj_hrimval_pagar_diezmo: "Pagar el Diezmo de Huesos"
 gj_hrimval_pagar_diezmo_desc: "Nadie pacta con los muertos, pero algunos les pagan. El Diezmo de Huesos es un tributo en oro que la Corte acepta a cambio de no marchar sobre quien lo paga. Es caro, es humillante y funciona diez años."
 gj_hrimval_pagar_diezmo.a: "Pagar el diezmo."
 gj_hrimval_alzar_caidos: "Alzar a los Caídos"
 gj_hrimval_alzar_caidos_desc: "Los osarios están llenos y los túmulos, impacientes. Con un decreto del rey, veinte caídos se levantan como levas de guerra durante cinco años."
 gj_hrimval_alzar_caidos.a: "Que se levanten."
 gj_hrimval_fundar_liga: "Fundar la Liga de la Sal y la Llama"
 gj_hrimval_fundar_liga_desc: "Si los países del norte quieren sobrevivir a la próxima Noche Blanca, tienen que ponerse de acuerdo antes. La Liga es una alianza defensiva con un solo objetivo: que nadie tenga que guardar solo los pasos."
 gj_hrimval_fundar_liga.a: "Fundar la Liga."
 gj_hrimval_sepultar_caidos: "Devolver a los Caídos al Hielo"
 gj_hrimval_sepultar_caidos_desc: "A veces hay más caídos de los que la Corte necesita. Devolverlos al hielo con un cántico calma a los vivos y reduce el reloj de la Noche Blanca."
 gj_hrimval_sepultar_caidos.a: "Devolverlos al hielo."
 STATIC_MODIFIER_NAME_gj_hrimval_noche_blanca: "La Noche Blanca"
 STATIC_MODIFIER_NAME_gj_hrimval_noche_blanca_invierno: "Invierno de la Noche Blanca"
 STATIC_MODIFIER_NAME_gj_hrimval_invierno_blanco: "Invierno blanco"
 STATIC_MODIFIER_NAME_gj_hrimval_diezmo_pagado: "Diezmo de Huesos pagado"
 STATIC_MODIFIER_NAME_gj_hrimval_caidos_alzados: "Caídos alzados"
 STATIC_MODIFIER_NAME_gj_hrimval_rey_bajo_el_hielo: "Rey bajo el Hielo"
 STATIC_MODIFIER_NAME_gj_hrimval_deshielo: "Deshielo"
 STATIC_MODIFIER_NAME_gj_hrimval_frio_propio: "Frío propio"
 STATIC_MODIFIER_NAME_gj_hrimval_marcha_arrasada: "Marcha arrasada"
 STATIC_MODIFIER_NAME_gj_hrimval_corte_dormida: "Corte dormida"
 gj_hrimval.1.a: "Que se escriban todos, aunque falte papel."
 gj_hrimval.1.b: "Que se olviden las derrotas."
 gj_hrimval.1.title: "Los cronistas descuentan los años"
 gj_hrimval.1.desc: "El Cronista Mayor, que lleva trescientos inviernos escribiendo la misma página, ha pedido por fin una vela nueva. Dice que los años de la Corte ya no caben en el libro y que alguien tiene que decidir cuáles se olvidan."
 gj_hrimval.2.a: "Dejadla cantar."
 gj_hrimval.2.b: "Silenciad la cámara con lana y cera."
 gj_hrimval.2.title: "El relicario canta"
 gj_hrimval.2.desc: "Una nota única y grave sale de la cámara del relicario cada noche desde hace una semana. Los guardias dicen que el rey sonríe al oírla. Los cronistas dicen que es mala señal, aunque no saben decir de qué."
 gj_hrimval.3.a: "Acogerlos en los túmulos."
 gj_hrimval.3.b: "Cerrar los pasos: la Corte no es un cementerio de nadie."
 gj_hrimval.3.title: "Peregrinos sin sepultura"
 gj_hrimval.3.desc: "Una larga fila de peregrinos ha llegado por el paso del este. Vienen de tierras donde los entierran, y piden que los dejemos morir aquí, donde por lo menos se les recuerda. Traen sus propios huesos en sacos."
 gj_hrimval.4.a: "Recoger a los que se quedaron en el camino."
 gj_hrimval.4.b: "No es asunto de la Corte."
 gj_hrimval.4.title: "La hambruna al otro lado del paso"
 gj_hrimval.4.desc: "Dicen los guardias de la frontera que al otro lado la cosecha se pudrió en pie y que los pueblos se vacían. Hay caminos llenos de gente que ya no tiene fuerzas para llegar a ninguna parte."
 gj_hrimval.5.a: "Dejarle mandar un invierno más."
 gj_hrimval.5.b: "Sepultarlo con todos los honores."
 gj_hrimval.5.title: "El general que no quiere descansar"
 gj_hrimval.5.desc: "El viejo general de las Huestes lleva más inviernos mandando que años tiene la Corte. Ha dejado de comer, de dormir y de pedir permiso. Sus oficiales ya no saben si lo siguen o lo vigilan."
 gj_hrimval.6.a: "Que espere: el trono es de quien guarda el hielo."
 gj_hrimval.6.b: "Darle un valle propio en el sur del hielo."
 gj_hrimval.6.title: "El heredero impaciente"
 gj_hrimval.6.desc: "El heredero lleva tanto tiempo esperando que ya tiene canas. Como el rey no envejece, ni el trono ni el relicario se mueven. Los nobles que lo rodean empiezan a pedir una corte propia para él."
 gj_hrimval.7.a: "Enviar a los Acechadores tras ellas."
 gj_hrimval.7.b: "Dejar la caza a los aldeanos."
 gj_hrimval.7.title: "Los cazadores del hielo"
 gj_hrimval.7.desc: "Los cazadores han vuelto con las manos vacías y los ojos llenos. Dicen que en el hielo del norte hay manadas que nadie ha visto nunca, y que alguien las vigila desde lo alto de los icebergs."
 gj_hrimval.8.a: "Mostrarle el relicario."
 gj_hrimval.8.b: "Mostrarle los mercados del hielo."
 gj_hrimval.8.title: "El embajador de abrigo de pieles"
 gj_hrimval.8.desc: "Un embajador del sur ha llegado a nuestras puertas con un abrigo de pieles que le llega a los pies. Está convencido de que la Corte es una compañía de teatro de gusto discutible. Le hemos dejado creerlo durante tres días."
 gj_hrimval.9.a: "Alzar la Hueste de Recogida."
 gj_hrimval.9.b: "Devolverlos al hielo con un cántico."
 gj_hrimval.9.title: "Las cuentas del osario"
 gj_hrimval.9.desc: "Los administradores del osario han contado los huesos y han hallado más de los que cuadran con ningún registro. Piden permiso para decidir qué hacer con ellos antes de que lo decidan los propios huesos."
 gj_hrimval.10.a: "Celebrarlo de pie, con las antorchas encendidas."
 gj_hrimval.10.b: "Celebrarlo en silencio, a oscuras."
 gj_hrimval.10.title: "El Duelo del Invierno"
 gj_hrimval.10.desc: "Cada año, cuando la noche dura más que el día, la Corte se reúne en el patio del relicario a recordar a los que no volvieron. Nadie recuerda quién empezó la costumbre, pero nadie se atreve a dejarla."
 gj_hrimval.11.a: "Cegar las grietas con sal y piedra."
 gj_hrimval.11.b: "Retirar a la gente hacia el norte."
 gj_hrimval.11.title: "La grieta del deshielo"
 gj_hrimval.11.desc: "Ha llegado un verano que nadie esperaba. En las tierras bajas, donde la Corte tiene guarniciones, el hielo suda y el suelo huele a barro. Los aldeanos preguntan si van a tener que irse."
 gj_hrimval.12.a: "Darles tierra y trabajo."
 gj_hrimval.12.b: "Expulsarlos al hielo."
 gj_hrimval.12.title: "Los insepultos vagabundos"
 gj_hrimval.12.desc: "Una banda de insepultos sin señor ni bandera ha cruzado la frontera. No roban, no hablan, no piden. Solo miran las casas con una atención que da escalofríos."
 gj_hrimval.13.a: "Financiar la expedición cartográfica."
 gj_hrimval.13.b: "Que lo dibujen los cronistas, a su ritmo."
 gj_hrimval.13.title: "El mapa blanco"
 gj_hrimval.13.desc: "Los cronistas proponen levantar un mapa de todo el norte, no por conquista sino por memoria: cada valle, cada paso, cada glaciar con su nombre, para que cuando la Noche vuelva alguien sepa dónde está."
 gj_hrimval.14.a: "Comerciar con él, sin hacer preguntas."
 gj_hrimval.14.b: "Cerrarle la puerta."
 gj_hrimval.14.title: "El mercader sin sombra"
 gj_hrimval.14.desc: "Un mercader que no proyecta sombra ha llegado al mercado del hielo con un cargamento de cosas que nadie ha pedido. Cuando se le pregunta de dónde viene, responde que de donde hace más calor."
 gj_hrimval.15.a: "Honrar al más viejo de los gigantes."
 gj_hrimval.15.b: "Fundir las corazas viejas para las Huestes."
 gj_hrimval.15.title: "La muda de los gigantes"
 gj_hrimval.15.desc: "Los Gigantes de Escarcha cambian de armadura cada cien años, cuando el hielo les agrieta la anterior. Es una ceremonia larga y ruidosa, y los forjadores aseguran que es la única vez que los ven sonreír."
 gj_hrimval.16.a: "Responder con una cortesía igual de helada."
 gj_hrimval.16.b: "Quemar la carta delante del mensajero."
 gj_hrimval.16.title: "Una carta de la Liga de la Sal y la Llama"
 gj_hrimval.16.desc: "Un mensajero ha cruzado el paso con una carta lacrada con sal. Es de la Liga: nos recuerdan, con una cortesía helada, que ellos guardan los pasos para que nadie tenga que guardarlos de nosotros."
 gj_hrimval.17.a: "Es un signo: que las Huestes se preparen."
 gj_hrimval.17.b: "Es un fenómeno del cielo y nada más."
 gj_hrimval.17.title: "La sombra en el sol"
 gj_hrimval.17.desc: "A mediodía, el sol se ha apagado un cuarto de hora. Los cronistas aseguran que la última vez que ocurrió, la Noche Blanca llegó antes de tiempo. Los sacerdotes de la Escarcha Silente ya han sacado los cántaros de ceniza."
 gj_hrimval.18.a: "Reconocerla como cortesana, sin título."
 gj_hrimval.18.b: "Encerrarla en las criptas, con honores."
 gj_hrimval.18.title: "La hija del rey dormido"
 gj_hrimval.18.desc: "En una cripta de los cronistas ha aparecido una joven que asegura ser hija del rey. Su aspecto es el de una mujer de treinta años, pero habla con los modales de hace seis siglos. El relicario no la reconoce, pero tampoco la rechaza."
 gj_hrimval.19.a: "Abrir los graneros y esperar."
 gj_hrimval.19.b: "Dejar que pase."
 gj_hrimval.19.title: "Nieve negra"
 gj_hrimval.19.desc: "Ha caído nieve negra sobre una de nuestras tierras. Los aldeanos dicen que es ceniza de un volcán lejano, y los sacerdotes, que son los restos de los que cayeron en la última Noche. Los campos no se pueden labrar."
 gj_hrimval.20.a: "Que suenen los cuernos."
 gj_hrimval.20.b: "Que las Huestes marchen sin ruido."
 gj_hrimval.20.title: "La Corte despierta"
 gj_hrimval.20.desc: "Los cuernos de hueso han sonado desde el relicario. La perdición ha llegado al límite del reloj y nada se puede detener. Las Huestes salen de los túmulos, los Gigantes rompen el hielo y el rey, por fin, sonríe."
 gj_hrimval.21.a: "Atrancar las puertas y encender los hornos."
 gj_hrimval.21.b: "Pagar el Diezmo de Huesos a la Corte."
 gj_hrimval.21.title: "Ha llegado la Noche Blanca"
 gj_hrimval.21.desc: "El sol no ha vuelto a salir y la ventisca ha cerrado los pasos. En los caminos del norte se oyen cuernos de hueso y pasos que no son de nadie. La Corte Insepulta ha despertado, y tiene hambre."
 gj_hrimval.22.a: "Volver a los túmulos."
 gj_hrimval.22.b: "Que los cronistas lo anoten todo."
 gj_hrimval.22.title: "La Corte se duerme"
 gj_hrimval.22.desc: "Las Huestes vuelven a los túmulos, los Gigantes callan, y el rey apoya la cabeza en el relicario. La perdición ha vuelto a cero. Durante treinta años la Corte será otra vez un rumor."
 gj_hrimval.23.a: "Reconstruir lo perdido."
 gj_hrimval.23.b: "Dar gracias por el amanecer."
 gj_hrimval.23.title: "Amanece"
 gj_hrimval.23.desc: "Por primera vez en años, el sol ha vuelto a asomar por el paso. Hay quien llora, hay quien reza y hay quien no sabe qué hacer sin tener miedo. Los muertos de la Noche han quedado atrás, y los vivos tienen mucho que reconstruir."
 gj_hrimval.30.a: "Resistir en los pasos."
 gj_hrimval.30.b: "Pagar el Diezmo de Huesos."
 gj_hrimval.30.c: "Pedir que la Liga cierre el paso."
 gj_hrimval.30.title: "Una Marcha de Escarcha"
 gj_hrimval.30.desc: "Han llegado a nuestras fronteras los cuernos de hueso. Una Marcha de Escarcha avanza por el paso del norte: Huestes sin hambre, gigantes sin prisa y una ventisca que nunca llega sola. Los pueblos de la frontera preguntan qué hacer."
 gj_hrimval.31.a: "Contar a los caídos."
 gj_hrimval.31.b: "Guardar los cuernos hasta la próxima."
 gj_hrimval.31.title: "Las Marchas han vuelto"
 gj_hrimval.31.desc: "Los cuernos de hueso han vuelto de la frontera con la nieve manchada de rojo. Los cronistas ya han contado los cuerpos, y los túmulos tienen más sitio del que tenían."
 gj_hrimval.40.a: "Que los cronistas registren la ruina."
 gj_hrimval.40.b: "Alzar a las Huestes para recuperar el relicario."
 gj_hrimval.40.title: "Cae el relicario"
 gj_hrimval.40.desc: "El relicario ya no está en nuestras manos. El rey, que no sabía lo que era la edad, la siente de golpe: un siglo en un instante. En los túmulos, las Huestes se agrietan; en el hielo, los gigantes se sientan para no volver a levantarse."
 gj_hrimval.41.a: "Aceptar lo que somos."
 gj_hrimval.41.b: "Honrar a los que se quedaron."
 gj_hrimval.41.title: "El Deshielo termina"
 gj_hrimval.41.desc: "El agua ha dejado de correr. Lo que queda de la Corte no es la que fue, pero es lo que somos: un puñado de pueblos de hielo que han aprendido, a la fuerza, a vivir al sol."
 gj_hrimval.42.a: "Dejarlos marchar."
 gj_hrimval.42.b: "Detenerlos en los pasos."
 gj_hrimval.42.title: "Los nobles huyen al sur"
 gj_hrimval.42.desc: "Una caravana de carros con los blasones de las casas más antiguas ha tomado el camino del sur con las bodegas llenas. Dicen que van a negociar. Nadie cree que vayan a volver."
 gj_hrimval.43.a: "Mandar a los cronistas a investigar."
 gj_hrimval.43.b: "Volver a cubrirlo y no preguntar."
 gj_hrimval.43.title: "El hielo cede en el valle"
 gj_hrimval.43.desc: "En un valle donde nunca cedió, el hielo ha cedido. Lo que hay debajo es barro, huesos y algo que parece una torre. La gente dice que es el sitio donde empezó todo."
 gj_hrimval.44.a: "Que lo entierren por fin."
 gj_hrimval.44.b: "Esperar un milagro."
 gj_hrimval.44.title: "El rey se levanta"
 gj_hrimval.44.desc: "El rey que no podía morir se ha levantado por última vez. Ha caminado hasta el patio del relicario vacío, ha mirado el hueco, y ha pedido que le traigan una silla. Está dispuesto a firmar lo que haga falta."

