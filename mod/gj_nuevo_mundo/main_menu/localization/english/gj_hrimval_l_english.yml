l_english:
 # Copia del castellano: esta parte no trae textos en ingles.
 gj_insepulto: "Insepultos"
 gj_insepulto_adj: "insepulto"
 gj_insepulto_desc: "Los insepultos son el pueblo del norte helado que decidió, hace tanto que nadie lo recuerda, no volver a la tierra. Su cultura gira en torno al duelo, la vigilia y la memoria. No temen a la muerte: la han convertido en un oficio."
 gj_grupo_insepulto: "Insepultos del hielo"
 gj_grupo_insepulto_desc: "Pueblos del norte helado que comparten la costumbre de no sepultar a sus muertos, sino de conservarlos en el hielo y dejarles una vela encendida. Comen poco, viven mucho y recuerdan todo."
 gj_lengua_insepulta: "Lengua insepulta"
 gj_familia_insepulta: "Lenguas del hielo"
 gj_hrimval_rey_bajo_el_hielo_reforma: "El Rey bajo el Hielo"
 gj_hrimval_rey_bajo_el_hielo_reforma_desc: "El rey de la Corte no envejece: su vida está atada a un relicario en la capital. Mientras el relicario siga en pie, el trono es seguro y la legitimidad crece sola. Si cae el relicario, cae la Corte."
 gj_hrimval_registro_de_caidos_reforma: "El Registro de los Caídos"
 gj_hrimval_registro_de_caidos_reforma_desc: "Los cronistas apuntan cada caído de cada batalla y cada hambruna en un libro que nunca se cierra. De ese libro salen las levas, y de las levas, la victoria. Pero un reino que cuenta cuerpos no cuenta monedas."
 gj_hrimval_corte_despierta_reforma: "La Corte Despierta"
 gj_hrimval_corte_despierta_reforma_desc: "Cuando la Corte pasa de la defensa a la marcha, todo se vuelve disciplina: filas, cuernos, relevos de ceniza. Es un ejército mejor. Es también un reino peor, porque ya no tiene tiempo para pensar en nada más."
 gj_hrimval_guardia_del_umbral: "La Guardia del Umbral"
 gj_hrimval_guardia_del_umbral_desc: "Hay una línea sobre el hielo, más allá de la cual la Corte no pone el pie. Los guardias que la vigilan llevan más años de servicio que países vecinos tiene. Con ellos nacieron las primeras Huestes de Hueso."
 gj_hrimval_voz_de_los_caidos: "La Voz de los Caídos"
 gj_hrimval_voz_de_los_caidos_desc: "Cada caído de la Corte sigue hablando en el hielo. Los cronistas aprenden a escucharlos y a repetir sus palabras en voz alta. Los que oyen se sienten acompañados; los que no, se sienten juzgados."
 gj_hrimval_ayuno_de_la_tierra: "El Ayuno de la Tierra"
 gj_hrimval_ayuno_de_la_tierra_desc: "Un pueblo que no necesita comer tanto no necesita campos tan grandes. La Corte aprende a vivir con la mitad del pan y a no pedirle más a la tierra. Los Acechadores del Hielo salen de este ayuno."
 gj_hrimval_tumulos_antiguos: "Los Túmulos Antiguos"
 gj_hrimval_tumulos_antiguos_desc: "Los túmulos más viejos de la Corte guardan a los que no quisieron irse. Cada nivel que se construye es una veta de caídos listos para alzarse. De aquí nace la leyenda de los Gigantes de Escarcha."
 gj_hrimval_vigilia_blanca: "La Vigilia Blanca"
 gj_hrimval_vigilia_blanca_desc: "Cuentan que la vigilia nunca se interrumpió, ni una noche, desde hace seiscientos años. Los oficiales se turnan, la ventisca no. Los soldados aprenden a dormir con los ojos abiertos."
 gj_hrimval_muro_de_escarcha: "El Muro de Escarcha"
 gj_hrimval_muro_de_escarcha_desc: "La Corte levanta un muro de hielo y piedra a lo largo de sus pasos. Es más alto que cualquier ejército que haya conocido y más delgado que una promesa. Se derrite en verano, pero en verano nadie ataca."
 gj_hrimval_cosecha_de_los_caidos: "La Cosecha de los Caídos"
 gj_hrimval_cosecha_de_los_caidos_desc: "Después de cada batalla, los osarios salen al campo. No lo hacen por saqueo ni por piedad, sino por sistema: lo que cae en nuestro nombre vuelve a levantarse en nuestro nombre. Es la razón por la que la Corte nunca se queda sin soldados."
 gj_hrimval_pan_de_ceniza: "El Pan de Ceniza"
 gj_hrimval_pan_de_ceniza_desc: "Los panaderos de la Corte han aprendido a hacer pan con ceniza, líquenes y paciencia. No sabe a nada, pero alimenta. Es la única receta que se enseña a los niños antes que a leer."
 gj_hrimval_marchas_de_escarcha: "Las Marchas de Escarcha"
 gj_hrimval_marchas_de_escarcha_desc: "Las Marchas son incursiones largas, silenciosas y sin retorno previsto. Salen con la primera ventisca y vuelven con la última. Lo que traen de vuelta no es botín, sino gente."
 gj_hrimval_vientos_del_osario: "Los Vientos del Osario"
 gj_hrimval_vientos_del_osario_desc: "Hay un viento que sopla desde los túmulos, siempre en la misma dirección: hacia el campo de batalla. Los soldados dicen que los guía. Los cronistas dicen que los empuja."
 gj_hrimval_sellar_los_pasos: "Sellar los Pasos"
 gj_hrimval_sellar_los_pasos_desc: "En los pasos del norte la Corte aprende a sellar el hielo con el hielo mismo, de forma que nadie que no tenga permiso pueda cruzar. Los asedios se vuelven más cortos y los desplazamientos, más fáciles."
 gj_hrimval_cronica_en_hueso: "La Crónica en Hueso"
 gj_hrimval_cronica_en_hueso_desc: "Los cronistas graban ahora la historia de la Corte sobre huesos pulidos, para que dure más que el papel. Es poco práctico pero muy bello: cada hueso es una página y cada página, un nombre."
 gj_hrimval_ejercito_sin_hambre: "El Ejército sin Hambre"
 gj_hrimval_ejercito_sin_hambre_desc: "Un ejército que no come es un ejército que no depende de nadie. Las Huestes marchan semanas sin tocar un almacén. Es lo que más teme el enemigo: no la fuerza, sino la paciencia."
 gj_hrimval_rey_inmortal: "El Rey Inmortal"
 gj_hrimval_rey_inmortal_desc: "Después de siglos de duda, la Corte acepta por fin lo que ya sabía: el rey no morirá, y nadie debe esperarlo. Los consejeros se vuelven más eficaces cuando dejan de rezar por una sucesión."
 gj_hrimval_guardias_de_nieve: "Las Guardias de Nieve"
 gj_hrimval_guardias_de_nieve_desc: "Cada aldea del hielo mantiene una guardia de nieve: aldeanos con lanza que se alzan cuando suenan los cuernos. No son soldados, pero tampoco son campesinos. Son lo que queda cuando la Corte pide algo más."
 gj_hrimval_pacto_de_sal: "El Pacto de Sal"
 gj_hrimval_pacto_de_sal_desc: "La Corte acepta que alguna vez habrá que negociar. No con alianzas, sino con sal: un pago anual a quien le deje la frontera en paz. Es la forma más cínica de diplomacia, y funciona."
 gj_hrimval_legion_de_hueso: "La Legión de Hueso"
 gj_hrimval_legion_de_hueso_desc: "Las Huestes dejan de ser un conjunto de soldados para formar una sola cosa: una Legión. Marchan al mismo paso, caen al mismo ritmo y se levantan en el mismo orden."
 gj_hrimval_acero_de_escarcha: "El Acero de Escarcha"
 gj_hrimval_acero_de_escarcha_desc: "Las forjas de la Corte, calentadas por hornos que nunca se apagan, producen un acero frío, quebradizo y mortal. Se rompe más fácilmente, pero corta mejor. Los herreros lo llaman «acero que recuerda»."
 gj_hrimval_cartografia_del_hielo: "La Cartografía del Hielo"
 gj_hrimval_cartografia_del_hielo_desc: "Los mapas de la Corte son los mejores del norte, porque lo que no se ve en verano se ve en invierno: cada grieta, cada puente de hielo, cada atajo. Un ejército con buen mapa llega antes."
 gj_hrimval_el_largo_invierno: "El Largo Invierno"
 gj_hrimval_el_largo_invierno_desc: "Hay inviernos de un año y hay el Largo Invierno, que dura lo que tarda el último soldado en sentarse. La Corte lo ha aprendido a vivir: no como una condena, sino como una estación."
 gj_hrimval_doctrina_del_duelo: "La Doctrina del Duelo"
 gj_hrimval_doctrina_del_duelo_desc: "Los oficiales de la Corte enseñan que un soldado que llora a sus compañeros es un soldado que no huye. La tristeza, bien entrenada, es una forma de disciplina."
 gj_hrimval_industria_de_los_osarios: "La Industria de los Osarios"
 gj_hrimval_industria_de_los_osarios_desc: "Con vapor, hornos y mucha piedra, la Corte levanta fábricas sobre sus viejos osarios. Los dueños aseguran que los muertos no se quejan. Los obreros no están tan seguros."
 gj_hrimval_estado_de_vigilia: "El Estado de Vigilia"
 gj_hrimval_estado_de_vigilia_desc: "La vigilia ya no es una costumbre: es un régimen. Cada oficina, cada aldea y cada túmulo tiene su turno de guardia. El Estado entero es un solo centinela con muchas manos."
 gj_hrimval_la_ultima_marcha: "La Última Marcha"
 gj_hrimval_la_ultima_marcha_desc: "Se dice que habrá una última Marcha, tan grande que nadie volverá a necesitar otra. Los cronistas saben que se dice cada siglo. Mientras tanto, la Corte se prepara como si fuera cierto."
 gj_hrimval_cultura_insepulta_cantares: "Los Cantares del Duelo"
 gj_hrimval_cultura_insepulta_cantares_desc: "Los insepultos cantan a sus muertos todas las noches, y los muertos, por lo que se cuenta, escuchan. Los cantares pasan de boca en boca y de siglo en siglo sin perder una palabra."
 gj_hrimval_cultura_insepulta_memoria: "La Memoria Larga"
 gj_hrimval_cultura_insepulta_memoria_desc: "Un insepulto recuerda lo que vio, lo que oyó, y lo que le contaron los que vieron y oyeron antes. Con esta memoria la cultura se ha vuelto más lenta y más profunda a la vez."
 gj_grupo_insepulto_vigilia: "La Vigilia de los Insepultos"
 gj_grupo_insepulto_vigilia_desc: "Todos los pueblos insepultos comparten la costumbre de la vigilia: nadie deja a su gente sola de noche. Con ello se vuelven resistentes al frío, a la fatiga y a la soledad."
 gj_hrimval_relicario: "Relicario del Rey"
 gj_hrimval_relicario_desc: "Una cámara de hielo en la capital donde descansa el relicario que guarda la vida del rey. Mientras siga en pie, el rey no envejece. Si cae en manos ajenas, la Corte se deshace. Solo puede haber uno, y solo en la capital."
 gj_hrimval_tumulo_hielo: "Túmulos del Hielo"
 gj_hrimval_tumulo_hielo_desc: "Un campo de túmulos de nieve y piedra donde descansan los caídos de la Corte. Cada nivel es una veta más de soldados dispuestos a alzarse. Solo se pueden levantar en tierra helada."
 gj_hrimval_osario_mayor: "Osario Mayor"
 gj_hrimval_osario_mayor_desc: "Un osario de piedra donde se reúnen los huesos de las Marchas. Es la fábrica de la Corte: recoge, clasifica y devuelve. Hace falta haber recogido caídos para poder levantarlo."
 gj_hrimval_atalaya_helada: "Atalaya Helada"
 gj_hrimval_atalaya_helada_desc: "Una torre de hielo y piedra que vigila los pasos del norte. Los guardias que la ocupan llevan mucho tiempo allí. Solo se puede levantar en tierra helada."
 gj_hrimval_cripta_cronistas: "Cripta de los Cronistas"
 gj_hrimval_cripta_cronistas_desc: "La biblioteca de la Corte, excavada bajo el hielo. Es lenta, silenciosa y bellísima. Solo puede haber una en todo el país."
 gj_hrimval_huestes: "Huestes de Hueso"
 gj_hrimval_gigantes: "Gigantes de Escarcha"
 gj_hrimval_acechadores: "Acechadores del Hielo"
 a_gj_hrimval_huestes_1: "Huestes de Hueso"
 a_gj_hrimval_huestes_1_desc: "Infantería pesada de la Corte Insepulta: lenta, sin hambre y con una moral que no se quiebra. Fuera del frío pierden buena parte de su fuerza y aguantan peor el daño."
 a_gj_hrimval_gigantes_1: "Gigantes de Escarcha"
 a_gj_hrimval_gigantes_1_desc: "Gigantes de hielo y hueso: pesados, escasos y devastadores. Como mucho tres regimientos por país. Lentos, caros de levantar y frágiles fuera del frío."
 a_gj_hrimval_acechadores_1: "Acechadores del Hielo"
 a_gj_hrimval_acechadores_1_desc: "Infantería ligera de los hielos: rápida y tenaz, casi sin desgaste. Es frágil en combate cerrado y pierde mucho fuera del hielo."
 a_gj_hrimval_huestes_2: "Huestes del Osario"
