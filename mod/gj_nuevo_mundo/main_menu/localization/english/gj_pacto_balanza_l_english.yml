l_english:
 # Copia del castellano: esta parte no trae textos en ingles.
 # ---- Religion ----
 gj_pacto_balanza: "Pacto de la Balanza"
 gj_pacto_balanza_ADJ: "Balancista"
 gj_pacto_balanza_desc: "Los fieles del Pacto creen que el mundo entero pende de una balanza invisible y que cada palabra dada es un peso puesto en uno de sus platos. No hay dios que juzgue: solo la Cuenta, que se salda siempre, en esta vida o en la siguiente. Sus sacerdotes, los Pesadores, no predican, sino que arbitran, y sus templos, las lonjas, son a la vez mercado, tribunal y santuario. Quien cumple sus contratos gana honor y el crédito de la fe entera; quien los rompe carga con un perjurio que ningún puerto olvida."

 # ---- Aspectos ----
 gj_pacto_aspecto_escribanos_cuenta: "Los Escribanos de la Cuenta"
 gj_pacto_aspecto_escribanos_cuenta_desc: "Cada deuda y cada promesa se asienta en libros sagrados que nadie puede corregir. Quien lleva bien la Cuenta comercia mejor y recauda con menos queja."
 gj_pacto_aspecto_peso_justo: "El Peso Justo"
 gj_pacto_aspecto_peso_justo_desc: "Los Pesadores recorren el reino comprobando medidas y sentencias. Los estamentos confían en que nadie será pesado con la balanza trucada, y los súbditos lejanos, también."
 gj_pacto_aspecto_juramento_sal: "El Juramento de la Sal"
 gj_pacto_aspecto_juramento_sal_desc: "Se sella un pacto partiendo sal sobre el filo de una espada. Quien lo rompe no merece ni agua, y quien lo honra pelea sin miedo a que su palabra se pierda con él. Incompatible con la Mano Abierta."
 gj_pacto_aspecto_mano_abierta: "La Mano Abierta"
 gj_pacto_aspecto_mano_abierta_desc: "El huésped es sagrado mientras tenga cuentas que saldar. Los forasteros llegan a los puertos de los fieles seguros de que se les pesará con justicia. Incompatible con el Juramento de la Sal."

 # ---- Lugares sagrados ----
 gj_pacto_balanza_lonja_sagrada: "Lonja Sagrada"
 gj_pacto_balanza_lonja_sagrada_desc: "Una lonja donde se firmó, hace siglos, el primer contrato que ninguna de las partes rompió. Los fieles acuden a jurar sobre sus bancos de piedra."
 gj_pacto_balanza_casa_del_peso: "Casa del Peso"
 gj_pacto_balanza_casa_del_peso_desc: "El edificio donde se guardan los pesos patrón de la fe. Se dice que ninguna balanza falsa cruza su umbral sin quebrarse."

 # ---- Modificadores automaticos ----
 AUTO_MODIFIER_NAME_gj_pacto_palabra_de_oro: "Palabra de Oro"
 AUTO_MODIFIER_NAME_gj_pacto_credito_roto: "Crédito Roto"
 AUTO_MODIFIER_NAME_gj_pacto_contratos_en_vigor: "Contratos en Vigor"

 # ---- Modificadores de pais ----
 STATIC_MODIFIER_NAME_gj_pacto_contrato_firmado: "Contrato Sellado en la Lonja"
 STATIC_MODIFIER_DESC_gj_pacto_contrato_firmado: "Un contrato mayor, firmado ante los Pesadores, abre las puertas del crédito y de los mercaderes."
 STATIC_MODIFIER_NAME_gj_pacto_balanza_pesada: "La Balanza Pesada"
 STATIC_MODIFIER_DESC_gj_pacto_balanza_pesada: "Tras una penitencia pública, los estamentos vuelven a fiarse de la palabra de la corona."
 STATIC_MODIFIER_NAME_gj_pacto_tregua_sagrada: "Tregua Sagrada"
 STATIC_MODIFIER_DESC_gj_pacto_tregua_sagrada: "El reino ha jurado no buscar guerra. La paz hace prosperar los campos, pero nadie fabrica motivos de guerra a la ligera."
 STATIC_MODIFIER_NAME_gj_pacto_arbitro_reconocido: "Árbitro Reconocido"
 STATIC_MODIFIER_DESC_gj_pacto_arbitro_reconocido: "Los reinos vecinos llevan sus disputas ante nuestros Pesadores."
 STATIC_MODIFIER_NAME_gj_pacto_perjurio: "Perjurio"
 STATIC_MODIFIER_DESC_gj_pacto_perjurio: "Una palabra rota que nadie olvida. Los prestamistas desconfían y los diplomáticos extranjeros ya no se fían."
 STATIC_MODIFIER_NAME_gj_pacto_presagio_favorable: "El Signo Pesa a Favor"
 STATIC_MODIFIER_DESC_gj_pacto_presagio_favorable: "Los Pesadores han leído el signo del cielo como una promesa."
 STATIC_MODIFIER_NAME_gj_pacto_presagio_adverso: "El Signo Pesa en Contra"
 STATIC_MODIFIER_DESC_gj_pacto_presagio_adverso: "Los Pesadores han leído el signo del cielo como una cuenta pendiente."
 STATIC_MODIFIER_NAME_gj_pacto_huesped_honrado: "Huésped Honrado"
 STATIC_MODIFIER_DESC_gj_pacto_huesped_honrado: "La fama de nuestra hospitalidad corre por los puertos."
 STATIC_MODIFIER_NAME_gj_pacto_pesos_trucados: "Pesos Trucados"
 STATIC_MODIFIER_DESC_gj_pacto_pesos_trucados: "Los mercaderes ganan más de lo debido y todos lo saben."
 STATIC_MODIFIER_NAME_gj_pacto_mano_dura_pesos: "Mano Dura con los Pesos"
 STATIC_MODIFIER_DESC_gj_pacto_mano_dura_pesos: "Las inspecciones protegen a los clientes y encolerizan a los burgueses."
 STATIC_MODIFIER_NAME_gj_pacto_crisis_credito: "Crisis de Crédito"
 STATIC_MODIFIER_DESC_gj_pacto_crisis_credito: "Ninguna casa de comercio presta ya a un reino con el nombre manchado."
 STATIC_MODIFIER_NAME_gj_pacto_escuela_de_fieles: "Escuela de los Fieles"
 STATIC_MODIFIER_DESC_gj_pacto_escuela_de_fieles: "Los hijos de mercaderes y de campesinos aprenden a leer en la Cuenta."

 # ---- Decisiones ----
 gj_pacto_sellar_contrato.title: "Sellar un Contrato en la Lonja"
 gj_pacto_sellar_contrato.desc: "Una casa de comercio mayor quiere atar su fortuna a la nuestra ante los Pesadores. Es caro, pero la Cuenta lo anotará."
 gj_pacto_sellar_contrato.a: "Que se parta la sal."
 gj_pacto_pesar_la_balanza.title: "Pesar la Balanza"
 gj_pacto_pesar_la_balanza.desc: "Nuestra palabra vale poco en los puertos. Solo una penitencia pública ante los Pesadores, con los libros abiertos, puede devolverle su peso."
 gj_pacto_pesar_la_balanza.a: "Que se abran los libros."
 gj_pacto_proclamar_tregua_sagrada.title: "Proclamar la Tregua Sagrada"
 gj_pacto_proclamar_tregua_sagrada.desc: "Hace años que la espada descansa. Los Pesadores proponen jurar ante todos que no será la primera en salir de la vaina."
 gj_pacto_proclamar_tregua_sagrada.a: "Que lo sepan los cuatro vientos."
 gj_pacto_nombrar_fiel_arbitro.title: "Nombrar al Fiel Árbitro"
 gj_pacto_nombrar_fiel_arbitro.desc: "Nuestra reputación es tal que los reinos vecinos pedirían, con gusto, un árbitro propio en nuestra corte. Hay que pagar una sede digna de él."
 gj_pacto_nombrar_fiel_arbitro.a: "Que se levante su estrado."

 # ---- Eventos ----
 gj_pacto_balanza.1.title: "Dos casas y una balanza"
 gj_pacto_balanza.1.desc: "Una casa noble y una casa de mercaderes disputan un contrato de arrendamiento de muelles, y ambas juran haber cumplido. El Pesador mayor se niega a sentenciar sin que decida la corona, pues dice que quien pesa por otro carga con su peso."
 gj_pacto_balanza.1.a: "Se falla a favor de los mercaderes."
 gj_pacto_balanza.1.b: "Se falla a favor de los nobles."
 gj_pacto_balanza.1.c: "La corona paga la diferencia de su bolsa."
 gj_pacto_balanza.2.title: "La deuda del capitán"
 gj_pacto_balanza.2.desc: "Un capitán de navío naufragó con una carga ajena y ahora se presenta ante la lonja sin plata, pero con las manos callosas y una historia triste. Los acreedores exigen que se cumpla el contrato, que no distingue entre un naufragio y una trampa."
 gj_pacto_balanza.2.a: "Se cobra hasta el último peso."
 gj_pacto_balanza.2.b: "Se le perdona la deuda."
 gj_pacto_balanza.2.c: "La corona asume la mitad y él trabajará el resto."
 gj_pacto_balanza.3.title: "Sal en el umbral"
 gj_pacto_balanza.3.desc: "Una caravana de forasteros, rota y hambrienta, llama a la puerta de un santuario. No tienen con qué pagar, pero ofrecen sal: la señal del pacto de hospitalidad. Los Pesadores esperan nuestra respuesta."
 gj_pacto_balanza.3.a: "Que entren como huéspedes."
 gj_pacto_balanza.3.b: "Que paguen lo que consumen y sigan su camino."
 gj_pacto_balanza.4.title: "Letra pequeña"
 gj_pacto_balanza.4.desc: "Los escribanos han descubierto, en un tratado ya firmado, una cláusula olvidada que nos favorece sin que la otra parte lo haya notado. Nadie fuera de esta sala lo sabe."
 gj_pacto_balanza.4.a: "Se avisa a la otra parte y se corrige a nuestra costa."
 gj_pacto_balanza.4.b: "Se calla y se cobra la ventaja."
 gj_pacto_balanza.4.c: "Se somete el caso al arbitraje de los Pesadores."
 gj_pacto_balanza.5.title: "El perjurio"
 gj_pacto_balanza.5.desc: "Un escribano de la lonja ha mostrado en público el registro de un pacto roto por la corona. La plaza guarda silencio, que es peor que el griterío. Los Pesadores exigen que se salde la Cuenta antes de que el mal se contagie a los demás contratos."
 gj_pacto_balanza.5.a: "Penitencia pública, con las cuentas abiertas."
 gj_pacto_balanza.5.b: "Se tapa el escándalo."
 gj_pacto_balanza.5.c: "Se destierra al escribano, pero se honra el pacto."
 gj_pacto_balanza.6.title: "La fiesta de los pesos"
 gj_pacto_balanza.6.desc: "Una vez al año, los Pesadores sacan a la calle los pesos patrón y los comparan con los de cada mercader. La ciudad se convierte en una fiesta de cintas, sal y música. La corona ha de decidir cómo participa."
 gj_pacto_balanza.6.a: "Se financia una gran feria."
 gj_pacto_balanza.6.b: "Se aprovecha para renovar los contratos de los gremios."
 gj_pacto_balanza.6.c: "Se cobra por el uso de los muelles y se deja a la gente a lo suyo."
 gj_pacto_balanza.7.title: "La balanza se inclina"
 gj_pacto_balanza.7.desc: "Dos reinos vecinos, a punto de ir a la guerra, han acordado que solo nuestros Pesadores pueden sentenciar su disputa. Es un honor que pocos reinos reciben, y una responsabilidad que muchos no soportan."
 gj_pacto_balanza.7.a: "Aceptamos el arbitraje."
 gj_pacto_balanza.7.b: "Rechazamos, pero cobramos los gastos de la consulta."
 gj_pacto_balanza.8.title: "Falsos pesos"
 gj_pacto_balanza.8.desc: "Los inspectores han descubierto que varios mercaderes poderosos usan pesas ligeras para vender grano y especias. Ningún perjuicio es grande, pero el hecho es público y los Pesadores esperan que la corona actúe."
 gj_pacto_balanza.8.a: "Se multa a los culpables y se rompen sus pesos."
 gj_pacto_balanza.8.b: "Se hace la vista gorda, porque pagan impuestos."
 gj_pacto_balanza.8.c: "Se les cobra una multa privada y todos callan."
 gj_pacto_balanza.9.title: "La tregua que se mantiene"
 gj_pacto_balanza.9.desc: "Pasan los años y la Tregua Sagrada no ha sido rota. Los viajeros dicen que nuestras fronteras son las más tranquilas de la región, y los cronistas ya la citan como ejemplo de lo que vale una palabra."
 gj_pacto_balanza.9.a: "Que se grabe en la piedra de la lonja."
 gj_pacto_balanza.9.b: "Que los mercaderes aprovechen la calma."
 gj_pacto_balanza.10.title: "El signo y la balanza"
 gj_pacto_balanza.10.desc.a: "Algo extraño ha cruzado el cielo y los Pesadores se reúnen a leerlo. Con la Cuenta limpia de nuestra parte, los más ancianos lo interpretan como una promesa: el cielo ha puesto su peso en el plato de los justos."
 gj_pacto_balanza.10.desc.b: "Algo extraño ha cruzado el cielo y los Pesadores se reúnen a leerlo. Con tantas cuentas pendientes de nuestra parte, los más ancianos dudan en voz alta: quizá el cielo ha puesto su peso en el plato de los acreedores."
 gj_pacto_balanza.10.a: "Es una promesa. Que se anote en la Cuenta."
 gj_pacto_balanza.10.b: "Es un aviso. Que se anote en la Cuenta."
 gj_pacto_balanza.10.c: "No es más que humo y luz. Que no se anote."
 gj_pacto_balanza.11.title: "Crédito roto"
 gj_pacto_balanza.11.desc: "Los prestamistas de los puertos vecinos han dejado de aceptar la firma de la corona. Dicen que quien rompe una palabra rompe todas, y que el interés ya no basta para compensar el riesgo. Los Pesadores ofrecen un trato: deudas saldadas a cambio de abrir los libros."
 gj_pacto_balanza.11.a: "Se salda lo pendiente de inmediato."
 gj_pacto_balanza.11.b: "Se aguanta la crisis, que ya pasará."
 gj_pacto_balanza.12.title: "La escuela de los fieles"
 gj_pacto_balanza.12.desc: "Un Pesador anciano propone abrir una escuela donde los hijos de mercaderes, campesinos y escribanos aprendan juntos a leer la Cuenta. Dice que un pueblo que sabe contar es difícil de engañar."
 gj_pacto_balanza.12.a: "La corona fundará la escuela."
 gj_pacto_balanza.12.b: "Que sean los templos quienes la sostengan."
