 # --- Acciones religiosas ---
 gj_sol_blanco_rito_contrapeso: "Rito del Contrapeso"
 gj_sol_blanco_rito_contrapeso_desc: "Ofrecemos [prestige|el] y recursos a uno de los Hermanos para mover el [yanantin|el]: los del Sol lo bajan y los de la Luna lo suben."
 gj_sol_blanco_festival_luces: "Festival de las Dos Luces"
 gj_sol_blanco_festival_luces_desc: "Una vez al año, el templo celebra a los astros. El premio depende del equilibrio: cuanto más cerca del centro esté el [yanantin|el], mejor."
 gj_sol_blanco_festival_equilibrio_tt: "El equilibrio es casi perfecto: el festival de las Dos Luces nos concede prestigio y estabilidad durante un año."
 gj_sol_blanco_festival_luna_tt: "El Sol pesa demasiado: se celebra a la Luna, con más comercio y prosperidad durante un año."
 gj_sol_blanco_festival_sol_tt: "La Luna pesa demasiado: se celebra al Sol, con más moral y crecimiento durante un año."
 WE_PERFORM_gj_sol_blanco_rito_contrapeso_ACTION_SETUP: "Cuando ofrecemos un rito a los Hermanos."
