 WE_PERFORM_gj_sol_blanco_festival_luces_ACTION_TITLE: "¡Festival de las Dos Luces!"
 WE_PERFORM_gj_sol_blanco_festival_luces_ACTION_DESC: "Las terrazas se llenan de música desde el alba hasta la última luna."
 WE_PERFORM_gj_sol_blanco_festival_luces_ACTION_EFFECTS: "$EFFECT$"

