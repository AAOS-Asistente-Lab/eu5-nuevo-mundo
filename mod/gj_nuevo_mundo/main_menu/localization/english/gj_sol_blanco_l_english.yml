l_english:
 # Copia del castellano: esta parte no trae textos en ingles.
 # --- Religión ---
 gj_sol_blanco: "Sol Blanco"
 gj_sol_blanco_ADJ: "solblanquista"
 gj_sol_blanco_desc: "Culto de las altas terrazas, nacido donde el sol llega primero y la luna se queda más tiempo. Enseña que nada florece si el día y la noche no se reparten el cielo: el [yanantin|e] es la balanza entre los Hermanos del Sol y las Hermanas de la Luna, y el buen gobernante es el que sabe mantenerla quieta. Sus sacerdotes miden el año con cuerdas anudadas y celebran cada eclipse como una prueba de que el equilibrio puede romperse."

 # --- Dioses ---
 gj_sol_blanco_iscarel: "Iscarel"
 gj_sol_blanco_iscarel_desc: "[ShowGodName('gj_sol_blanco_iscarel')], el Sol de la Cumbre, vigila desde el pico más alto. Es el hermano de la guerra y la vigilancia: sus devotos marchan sin miedo, pero el exceso de su luz seca los campos."
 gj_sol_blanco_tauhuel: "Tauhuel"
 gj_sol_blanco_tauhuel_desc: "[ShowGodName('gj_sol_blanco_tauhuel')], el Sol de la Cosecha, madura el grano y llena las cunas. Su culto premia a los pueblos fecundos, pero cobra su parte en sequía cuando se le sirve demasiado."
 gj_sol_blanco_nauquil: "Nauquil"
 gj_sol_blanco_nauquil_desc: "[ShowGodName('gj_sol_blanco_nauquil')], la Luna Hilandera, teje los pactos entre los pueblos con hilo de plata. Es la patrona del trato, del tributo y de la palabra dada."
 gj_sol_blanco_oseyra: "Oseyra"
 gj_sol_blanco_oseyra_desc: "[ShowGodName('gj_sol_blanco_oseyra')], la Luna Sembradora, vela la semilla bajo la tierra y las terrazas bajo la noche. Quien la honra ve prosperar sus campos, y quien la olvida ve crecer la sombra."

 # --- Aspectos ---
 worship_gj_sol_blanco_iscarel: "Venerar a $gj_sol_blanco_iscarel$ como nuestro dios patrón"
 worship_gj_sol_blanco_iscarel_desc: "Damos prioridad al culto de [ShowGodName('gj_sol_blanco_iscarel')] como nuestro patrón y protector."
 worship_gj_sol_blanco_tauhuel: "Venerar a $gj_sol_blanco_tauhuel$ como nuestro dios patrón"
 worship_gj_sol_blanco_tauhuel_desc: "Damos prioridad al culto de [ShowGodName('gj_sol_blanco_tauhuel')] como nuestro patrón y protector."
 worship_gj_sol_blanco_nauquil: "Venerar a $gj_sol_blanco_nauquil$ como nuestra diosa patrona"
 worship_gj_sol_blanco_nauquil_desc: "Damos prioridad al culto de [ShowGodName('gj_sol_blanco_nauquil')] como nuestra patrona y protectora."
 worship_gj_sol_blanco_oseyra: "Venerar a $gj_sol_blanco_oseyra$ como nuestra diosa patrona"
 worship_gj_sol_blanco_oseyra_desc: "Damos prioridad al culto de [ShowGodName('gj_sol_blanco_oseyra')] como nuestra patrona y protectora."

 # --- Focos religiosos ---
 gj_sol_blanco_deriva_equilibrio: "Cerca del equilibrio entre el Sol y la Luna"
 gj_sol_blanco_foco_calendario: "El Calendario de las Cuatro Luces"
 gj_sol_blanco_foco_calendario_desc: "Los sacerdotes fijan por escrito las cuatro luces del año: siembra, cosecha, fiesta y ayuno. El reino aprende a esperar."
 gj_sol_blanco_foco_terrazas: "La Liturgia de las Terrazas"
 gj_sol_blanco_foco_terrazas_desc: "Cada terraza se consagra al levantarla: la piedra se bendice, el agua se reparte y el trabajo se vuelve oración."
 gj_sol_blanco_foco_cuerdas: "Los Nudos de la Cuenta"
 gj_sol_blanco_foco_cuerdas_desc: "Los templos llevan la cuenta del reino en cuerdas anudadas. Lo que está anudado no se discute, y lo que no se discute se cobra."
 gj_sol_blanco_foco_zenit: "La Guardia del Zenit"
 gj_sol_blanco_foco_zenit_desc: "Los guerreros de la fe aprenden a marchar con el sol a la espalda y a subir por los pasos sin romper la formación."
 gj_sol_blanco_foco_hilanderia: "La Hilandería de Plata"
 gj_sol_blanco_foco_hilanderia_desc: "El culto de la Luna Hilandera protege los pactos escritos en tejido. Los mercaderes viajan más lejos bajo su nombre."
 gj_sol_blanco_foco_ayuno: "El Ayuno Común"
 gj_sol_blanco_foco_ayuno_desc: "Una vez al año, todo el reino come lo mismo y en silencio. Es duro, pero nadie recuerda con rencor lo que sufrió junto a todos."
 gj_sol_blanco_foco_vigilia: "La Vigilia del Eclipse"
 gj_sol_blanco_foco_vigilia_desc: "Los sabios velan el cielo por turnos y conocen de antemano cada ocultación. Cuando llega el eclipse, el rito ya está preparado."
 gj_sol_blanco_foco_vigilia_tt: "Los eclipses se pueden celebrar sin coste: la Vigilia ya tiene preparado el rito."
 gj_sol_blanco_foco_concordia: "La Concordia de las Dos Luces"
 gj_sol_blanco_foco_concordia_desc: "Culminación del culto: el Sol y la Luna se sientan juntos en el mismo altar. Exige haber completado el Calendario, la Liturgia de las Terrazas y la Vigilia del Eclipse."
 gj_sol_blanco_foco_concordia_tt: "Se desbloquea el suceso «La Corona de Rayos»."

 # --- Lugares sagrados ---
 gj_sol_blanco_cumbre_sagrada: "Cumbre sagrada del Sol Blanco"
 gj_sol_blanco_cumbre_sagrada_desc: "Pico donde el primer rayo del día toca el templo. Es un [holy_site|el] importante para todos los que siguen el [ShowReligionName('gj_sol_blanco')|l]."
 gj_sol_blanco_terraza_sagrada: "Terraza sagrada del Sol Blanco"
 gj_sol_blanco_terraza_sagrada_desc: "Escalón de cultivo consagrado, regado por la oración. Es un [holy_site|el] importante para todos los que siguen el [ShowReligionName('gj_sol_blanco')|l]."

