 WE_PERFORM_gj_sol_blanco_rito_contrapeso_ACTION_TITLE: "¡Rito del Contrapeso!"
 WE_PERFORM_gj_sol_blanco_rito_contrapeso_ACTION_DESC: "Los sacerdotes han movido la balanza del cielo."
