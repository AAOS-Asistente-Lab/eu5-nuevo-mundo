 # --- Eventos ---
 gj_sol_blanco.1.title: "El Sol demasiado alto"
 gj_sol_blanco.1.desc: "Los sacerdotes de la Luna llegan al palacio con las manos vacías. Dicen que en las terrazas altas el sol cae a plomo desde hace semanas, que la tierra se agrieta y que los Hermanos del Sol son honrados más de lo que conviene. «Lo que se inclina, cae», murmuran."
 gj_sol_blanco.1.a: "Ofrecer a la Luna un rito de contrapeso."
 gj_sol_blanco.1.b: "El Sol sabe lo que hace."
 gj_sol_blanco.2.title: "La Luna se hace sombra"
 gj_sol_blanco.2.desc: "Las vigilias nocturnas se han vuelto tan largas que los labradores duermen de día y los sacerdotes del Sol protestan en voz alta. El templo lunar crece más rápido que ningún otro, y el pueblo empieza a temer que el amanecer se retrase."
 gj_sol_blanco.2.a: "Encender las hogueras del Sol para devolver el contrapeso."
 gj_sol_blanco.2.b: "Dejar que la Luna reine un tiempo."
 gj_sol_blanco.3.title: "La Piedra de las Dos Sombras"
 gj_sol_blanco.3.desc: "En el patio del templo mayor hay una piedra que, a mediodía, proyecta dos sombras iguales cuando el culto está en equilibrio. Hoy, por primera vez en décadas, las dos sombras coinciden. Los fieles lo toman como señal de que el reino está bien gobernado."
 gj_sol_blanco.3.a: "Un buen presagio."
 gj_sol_blanco.3.b: "Levantar una columna que recuerde el día."
 gj_sol_blanco.4.title: "Peregrinos de las terrazas"
 gj_sol_blanco.4.desc: "Familias enteras han empezado a subir por las escalinatas hasta los santuarios de altura. Duermen al raso, cantan a los astros y comparten el pan. Los guardias del paso piden instrucciones: ¿se las ayuda o se las deja pasar?"
 gj_sol_blanco.4.a: "Levantar hospicios en el camino."
 gj_sol_blanco.4.b: "Dejar que suban por su cuenta."
 gj_sol_blanco.5.title: "Dos hermanos, un altar"
 gj_sol_blanco.5.desc: "El gran sacerdote del Sol y la gran sacerdotisa de la Luna se disputan el altar mayor. Cada uno exige que se les reserve la primera hora del día, y los fieles empiezan a tomar partido. Hay que decidir antes de que el altar se parta en dos."
 gj_sol_blanco.5.a: "Dar la hora primera al Sol."
 gj_sol_blanco.5.b: "Dar la hora primera a la Luna."
 gj_sol_blanco.5.c: "Repartir la hora por la mitad y que se contenten."
 gj_sol_blanco.6.title: "El hilado de la Dama de Plata"
 gj_sol_blanco.6.desc: "Los gremios de tejedores han hilado un tapiz tan fino que parece hecho de luz. Dicen que lo inspiró Nauquil y piden al templo que lo guarde. Los mercaderes del puerto ofrecen una fortuna por él."
 gj_sol_blanco.6.a: "Venderlo al mejor postor."
 gj_sol_blanco.6.b: "Colgarlo en el templo, a la vista de todos."
 gj_sol_blanco.7.title: "El primer rayo del zenit"
 gj_sol_blanco.7.desc: "Al mediodía del solsticio, un rayo atraviesa el techo del templo mayor y toca el altar. Es un momento que los sacerdotes llevan esperando todo el año. Falta decidir a quién se dedica la ceremonia."
 gj_sol_blanco.7.a: "Dedicarla al Sol."
 gj_sol_blanco.7.b: "Dedicarla a la Luna, que nos observa desde el otro lado."
 gj_sol_blanco.8.title: "El Sol se apaga"
 gj_sol_blanco.8.desc: "A media mañana, el cielo se oscurece como si hubieran apagado una vela. Los pájaros callan, los niños lloran y los sacerdotes se miran: el eclipse ha llegado. Es el momento en que el equilibrio puede romperse para siempre, salvo que el rito se celebre a tiempo."
 gj_sol_blanco.8.a: "Celebrar el Rito de la Concordia con todo el templo."
 gj_sol_blanco.8.b: "Los sabios de la Vigilia ya lo tenían preparado."
 gj_sol_blanco.8.c: "Cubrir el rostro y esperar a que pase."
 gj_sol_blanco.9.title: "La estrella con cola"
 gj_sol_blanco.9.desc: "Una estrella con una larga cola blanca cruza el cielo de poniente. Los sacerdotes discuten si es un hilo de la Dama de Plata que se descose o un estandarte del Sol que avanza. El pueblo espera que el rey decida cómo debe leerse."
 gj_sol_blanco.9.a: "Es el estandarte del Sol: buen augurio."
 gj_sol_blanco.9.b: "Es un hilo suelto de la Luna: hay que prepararse."
 gj_sol_blanco.10.title: "La Corona de Rayos"
 gj_sol_blanco.10.desc: "El templo ha cumplido la Concordia de las Dos Luces. En una ceremonia que durará tres días, el soberano recibe una diadema de oro blanco con doce rayos, uno por cada luna del año. Por primera vez en generaciones, el Sol y la Luna comparten altar."
 gj_sol_blanco.10.a: "Que el reino se acuerde de este día."
 gj_sol_blanco.11.title: "El Eclipse que no termina"
 gj_sol_blanco.11.desc: "Un predicador sin templo afirma que la Luna es un engaño y que solo el Sol merece culto. Sus seguidores cubren los espejos de agua de las terrazas y niegan el nombre de las Hermanas. Cada día son más."
 gj_sol_blanco.11.a: "Detener al predicador y cerrar sus reuniones."
 gj_sol_blanco.11.b: "Dejar que los fieles decidan."
 gj_sol_blanco.11.c: "Pagar una gran celebración lunar para devolverlos al culto."
 gj_sol_blanco.12.title: "Cosecha de plata y oro"
 gj_sol_blanco.12.desc: "Este año el grano ha madurado en dos colores: espigas blancas bajo la luna y espigas doradas bajo el sol. Los almacenes rebosan y los campesinos hablan de milagro. Hay que decidir qué hacer con tanta abundancia."
 gj_sol_blanco.12.a: "Guardarla en graneros comunes."
 gj_sol_blanco.12.b: "Venderla en los mercados vecinos."
