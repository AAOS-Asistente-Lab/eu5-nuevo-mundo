l_english:
 # Copia del castellano: esta parte no trae textos en ingles.
 # --- Cultura, grupo y lengua ---
 gj_orunmari: "Orunmarí"
 gj_orunmari_adj: "orunmarí"
 gj_orunmari_desc: "Los orunmaríes viven en las selvas de altura, entre cumbres sin nombre y barrancos que se llenan de niebla cada tarde. Cultivan en escalones, tiñen de rojo todo lo que tocan y creen que los dioses de la montaña tienen hambre. Su mayor orgullo es haber convertido esa creencia en un Estado."
 gj_grupo_carmesi: "Carmesí"
 gj_grupo_carmesi_desc: "Los pueblos de la selva alta que comparten tintes, cultos y calendario de cosechas. Entre ellos se pelean con crueldad, pero sólo entre ellos: para el resto del mundo son un único rostro rojo."
 gj_orunmar_lengua: "Orunmarí"

 # --- Edificios ---
 gj_orunmar_escalinata_ofrendas: "Escalinata de las Ofrendas"
 gj_orunmar_escalinata_ofrendas_desc: "Una escalera de piedra roja, cien peldaños de subida, donde los sacerdotes reciben a los cautivos y a los dioses. Sólo puede haber una en cada país, en su capital, y mejora con cada era: la tercera la ensancha, y la quinta la corona de salas de ayuno."
 gj_orunmar_escalinata_ofrendas_maintenance: "Servicio de la Escalinata"
 gj_orunmar_casa_de_cautivos: "Casa de los Cautivos"
 gj_orunmar_casa_de_cautivos_desc: "Dormitorios, talleres y huertos cercados donde los cautivos de las marchas trabajan hasta que los dioses los reclaman. Aumentan la producción de la población esclava, pero ésta come más y se inquieta antes."
 gj_orunmar_casa_de_cautivos_maintenance: "Servicio de la Casa de los Cautivos"
 gj_orunmar_huerto_de_niebla: "Huerto de Niebla"
 gj_orunmar_huerto_de_niebla_desc: "Campos en escalón sobre colinas y cumbres, regados por la bruma. Dan más comida y más gente, pero sólo se pueden levantar en terreno elevado."
 gj_orunmar_huerto_de_niebla_maintenance: "Cuidado de los escalones"
 gj_orunmar_taller_del_tinte: "Taller del Tinte Rojo"
 gj_orunmar_taller_del_tinte_desc: "Obradores de grana y vidrio rojo, siempre con el aire cargado de humo y de colores. Sólo florecen en las ciudades, donde hay quien compre."
 gj_orunmar_taller_del_tinte_maintenance: "Servicio del Taller del Tinte"
 gj_orunmar_atalaya_de_la_niebla: "Atalaya de la Niebla"
 gj_orunmar_atalaya_de_la_niebla_desc: "Torres de vigía sobre el barranco, desde donde el humo avisa de cualquier columna extraña. Refuerzan la defensa y las levas, pero sólo sirven en tierras propias."
 gj_orunmar_atalaya_de_la_niebla_maintenance: "Guarnición de la Atalaya"

 # --- Unidades: nombres por era (1 Tradiciones ... 6 Revoluciones) ---
 a_gj_orunmar_captura_1: "Lanceros de la Captura"
 a_gj_orunmar_captura_2: "Guerreros de la Captura"
 a_gj_orunmar_captura_3: "Guardia de la Cuerda"
 a_gj_orunmar_captura_4: "Mosqueteros de la Cuerda"
 a_gj_orunmar_captura_5: "Segadores de Fusil"
 a_gj_orunmar_captura_6: "Segadores de Línea"
 gj_orunmar_captura_desc: "Infantería pesada de la Hegemonía Carmesí: no mata si puede atar. Resisten bien el castigo y quiebran la moral del enemigo, pero hieren poco. Cada Escalinata y cada Casa de los Cautivos permiten sostener a más de ellos."
 a_gj_orunmar_captura_1_desc: "$gj_orunmar_captura_desc$"
 a_gj_orunmar_captura_2_desc: "$gj_orunmar_captura_desc$"
 a_gj_orunmar_captura_3_desc: "$gj_orunmar_captura_desc$"
 a_gj_orunmar_captura_4_desc: "$gj_orunmar_captura_desc$"
 a_gj_orunmar_captura_5_desc: "$gj_orunmar_captura_desc$"
 a_gj_orunmar_captura_6_desc: "$gj_orunmar_captura_desc$"
 a_gj_orunmar_cazador_1: "Cazadores del Dosel"
 a_gj_orunmar_cazador_2: "Honderos del Dosel"
 a_gj_orunmar_cazador_3: "Ballesteros del Dosel"
 a_gj_orunmar_cazador_4: "Arcabuceros del Dosel"
 a_gj_orunmar_cazador_5: "Fusileros de la Niebla"
 a_gj_orunmar_cazador_6: "Tiradores de la Niebla"
 gj_orunmar_cazador_desc: "Infantería ligera criada entre las copas y los barrancos. Atacan primero y son terribles en la selva, pero fuera de ellas se rompen con facilidad. Las Atalayas de la Niebla fijan cuántos pueden sostenerse."
 a_gj_orunmar_cazador_1_desc: "$gj_orunmar_cazador_desc$"
 a_gj_orunmar_cazador_2_desc: "$gj_orunmar_cazador_desc$"
 a_gj_orunmar_cazador_3_desc: "$gj_orunmar_cazador_desc$"
 a_gj_orunmar_cazador_4_desc: "$gj_orunmar_cazador_desc$"
 a_gj_orunmar_cazador_5_desc: "$gj_orunmar_cazador_desc$"
 a_gj_orunmar_cazador_6_desc: "$gj_orunmar_cazador_desc$"
 a_gj_orunmar_porteador_1: "Porteadores Rojos"
 a_gj_orunmar_porteador_2: "Porteadores de Cuerda"
 a_gj_orunmar_porteador_3: "Recuas de Carga"
 a_gj_orunmar_porteador_4: "Caravana de Cautivos"
 a_gj_orunmar_porteador_5: "Intendencia Roja"
 a_gj_orunmar_porteador_6: "Cuerpo de Intendencia Roja"
 gj_orunmar_porteador_desc: "Auxiliares que cargan el avituallamiento a hombros. Se mueven más rápido y desgastan menos al ejército en la selva, pero sufren mucho en combate: quien cae no se sustituye con prisa."
 a_gj_orunmar_porteador_1_desc: "$gj_orunmar_porteador_desc$"
