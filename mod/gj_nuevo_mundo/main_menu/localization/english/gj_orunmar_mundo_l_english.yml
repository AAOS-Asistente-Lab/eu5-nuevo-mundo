 # --- Cupos (descripciones de los valores) ---
 EFFECTIVE_GJ_ORUNMAR_ESCALINATA: "Escalinata de las Ofrendas"
 EFFECTIVE_GJ_ORUNMAR_CASA_CAUTIVOS: "Casas de los Cautivos"
 EFFECTIVE_GJ_ORUNMAR_ATALAYA: "Atalayas de la Niebla"

 # --- Casus belli y objetivo de guerra ---
 cb_gj_orunmar_cosecha: "Marcha de la Cosecha"
 cb_gj_orunmar_cosecha_desc: "Los dioses tienen hambre y los vecinos tienen hijos. La Marcha de la Cosecha es una guerra ritual: breve, barata y sin deshonra, hecha para volver a casa con cautivos y no con tierras."
 war_goal_gj_orunmar_superiority_cosecha: "$generic_war_goal_superiority$"
 war_goal_gj_orunmar_superiority_cosecha_desc: "El [war_goal|el] es tomar cautivos del enemigo y volver con ellos."

 # --- Modificadores temporales ---
 gj_orunmar_marcha_de_cosecha: "Marcha de la Cosecha"
 gj_orunmar_marcha_de_cosecha_desc: "Los campos esperan mientras la hueste cumple con los dioses."
 gj_orunmar_banquete_de_victoria: "Banquete de victoria"
 gj_orunmar_banquete_de_victoria_desc: "La Escalinata humea y el pueblo ve cumplido su deber."
 gj_orunmar_botin_de_nobles: "Botín de nobles"
 gj_orunmar_botin_de_nobles_desc: "Un señor enemigo en nuestras manos vale más que mil campesinos."
 gj_orunmar_cosecha_de_esclavos: "Cosecha de esclavos"
 gj_orunmar_cosecha_de_esclavos_desc: "Más brazos en los campos y las minas, más bocas que alimentar y más rencor que vigilar."
 gj_orunmar_levas_de_ayuno: "Levas de ayuno"
 gj_orunmar_levas_de_ayuno_desc: "Los hombres huyen del dosel y no hay sacerdote que los traiga."
 gj_orunmar_niebla_bendita: "Niebla bendita"
 gj_orunmar_niebla_bendita_desc: "La bruma de las cumbres cubre los escalones de cultivo y los dioses sonríen."
 gj_orunmar_bonanza_de_tinte: "Bonanza del tinte"
 gj_orunmar_bonanza_de_tinte_desc: "El rojo de Orunmar se paga en plata y en cacao."
 gj_orunmar_mecenas_de_la_niebla: "Mecenas de la niebla"
 gj_orunmar_mecenas_de_la_niebla_desc: "Poetas, escribas y tintoreros cantan al país que los sostiene."
 gj_orunmar_paz_con_el_sol: "Paz con los hijos del Sol"
 gj_orunmar_paz_con_el_sol_desc: "Los regalos ankaruníes llenan los mercados, pero los sacerdotes miran la cuenta del hambre."
 gj_orunmar_paz_cobardia: "Paz de cobardes"
 gj_orunmar_paz_cobardia_desc: "Los sacerdotes murmuran que la Mesa ha perdido el apetito."
 gj_orunmar_rebelion_de_cautivos: "Rebelión de cautivos"
 gj_orunmar_rebelion_de_cautivos_desc: "Las minas arden y los capataces no vuelven."
 gj_orunmar_ayuno_cumplido: "Ayuno cumplido"
 gj_orunmar_ayuno_cumplido_desc: "El pueblo ha ayunado y los dioses se han dado por servidos, por ahora."
 gj_orunmar_orugas_rojas: "Orugas rojas"
 gj_orunmar_orugas_rojas_desc: "Una plaga de orugas devora los escalones de cultivo."
 gj_orunmar_campos_de_cautivos: "Campos de cautivos"
 gj_orunmar_campos_de_cautivos_desc: "Los cautivos trabajan a destajo, y el control local se resiente."

 # --- Gran Ayuno (desastre) ---
 gj_orunmar_gran_ayuno: "El Gran Ayuno de los Dioses"
 gj_orunmar_gran_ayuno_desc: "Han pasado demasiados años sin marcha, sin cautivos, sin banquete. Los dioses de la montaña no se quejan: simplemente dejan de ayudar, y los campos, la fe y la Mesa lo notan. Sólo una guerra pone fin al Ayuno."

 # --- Decisiones ---
 gj_orunmar_convocar_marcha.title: "Convocar la Marcha de la Cosecha"
 gj_orunmar_convocar_marcha.desc: "La Mesa Roja puede convocar a los Segadores. La marcha trae un casus belli contra un vecino y levanta a la hueste, pero deja los campos con menos manos y al pueblo con menos paciencia."
 gj_orunmar_convocar_marcha.a: "¡Que suenen los cuernos de la niebla!"
 gj_orunmar_ofrecer_cautivos.title: "Ofrecer cautivos en la Escalinata"
 gj_orunmar_ofrecer_cautivos.desc: "Los prisioneros esperan en las celdas bajo la escalera. Podemos ofrecerlos a los dioses a cambio de devoción, o dejar que sigan trabajando. Cada ofrenda es un banquete para unos y una pérdida para otros."
 gj_orunmar_ofrecer_cautivos.a: "Que suban los cautivos."
 gj_orunmar_llenar_las_vetas.title: "Llenar las vetas y los campos"
 gj_orunmar_llenar_las_vetas.desc: "Nuestras minas y campos piden brazos. Podemos mandar a los cautivos a trabajar allí de por vida y convertirlos en población esclava de una de nuestras provincias."
 gj_orunmar_llenar_las_vetas.a: "Que bajen a las vetas."
 gj_orunmar_ayuno_voluntario.title: "Proclamar un ayuno voluntario"
 gj_orunmar_ayuno_voluntario.desc: "Los sacerdotes aconsejan un ayuno público: un año de pan escaso y oraciones largas que aplace el hambre de los dioses y evite el Gran Ayuno durante una década."
 gj_orunmar_ayuno_voluntario.a: "Que el pueblo ayune."
