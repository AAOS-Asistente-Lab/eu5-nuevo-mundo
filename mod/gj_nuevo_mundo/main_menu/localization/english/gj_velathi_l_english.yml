l_english:
 # Copia del castellano: esta parte no trae textos en ingles.
 # --- Cultura, grupo y lengua ---
 gj_velathi: "Velathi"
 gj_velathi_desc: "Pueblo del bosque de vida larga. Sus reyes viven siglos, sus hijos tardan en nacer y sus ciudades cuelgan de las copas de los árboles."
 gj_grupo_velathi: "Velathi"
 gj_grupo_velathi_desc: "Los pueblos que comparten el Dosel: gente de bosque, de paso ligero y de memoria larga, que prefiere el silencio de un claro al ruido de un mercado."
 gj_velathi_language: "Velathí antiguo"
 gj_velathi_dialect: "Velathí"
 gj_velathi_language_family: "Lenguas del Dosel"

 # --- Avances propios, por era ---
 gj_velathi_raices_hondas: "Raíces hondas"
 gj_velathi_raices_hondas_desc: "Antes de que hubiera reyes, hubo árboles. Quien aprende a vivir entre sus raíces recoge leña y caza sin vaciar nunca el bosque."
 gj_velathi_memoria_de_savia: "Memoria de savia"
 gj_velathi_memoria_de_savia_desc: "Los ancianos recitan la genealogía de cada tronco y cada familia. Un pueblo que se acuerda de todo es difícil de engañar y más difícil de desalojar."
 gj_velathi_paso_del_cazador: "Paso del cazador"
 gj_velathi_paso_del_cazador_desc: "Los velathi caminan sin que cruja una rama. Los invasores, en cambio, pierden hombres entre zarzas, nieblas y senderos que no existían ayer."
 gj_velathi_concilio_de_ancianos: "Concilio de ancianos"
 gj_velathi_concilio_de_ancianos_desc: "Los más viejos se sientan en círculo bajo el tejo mayor y hablan hasta que todos están de acuerdo. Tardan, pero lo que deciden dura."
 gj_velathi_hogar_en_las_copas: "Hogar en las copas"
 gj_velathi_hogar_en_las_copas_desc: "Las casas se tejen entre las ramas altas y caben más familias por claro. Construir así es lento, porque ningún árbol se doblega por prisa."
 gj_velathi_arco_de_tejo: "Arco de tejo"
 gj_velathi_arco_de_tejo_desc: "El tejo viejo da el mejor arco. Los arqueros velathi curan la madera durante años y disparan desde ramas donde nadie los ve."
 gj_velathi_silvicultura: "Silvicultura"
 gj_velathi_silvicultura_desc: "Se talan los árboles enfermos, se aclaran los jóvenes y se deja crecer al resto. El bosque rinde más a quien lo trata como a un huerto paciente."
 gj_velathi_ley_del_claro: "Ley del claro"
 gj_velathi_ley_del_claro_desc: "En el claro nadie alza la voz ni la mano. La ley velathi castiga más el escándalo que el delito, y por eso hay pocos escándalos."
 gj_velathi_herbolarios_longevos: "Herbolarios longevos"
 gj_velathi_herbolarios_longevos_desc: "Una herbolaria de trescientos años ha visto cada fiebre cuatro veces. Sus remedios, escritos en corteza, valen más que un hospital de piedra."
 gj_velathi_cronicas_de_los_siglos: "Crónicas de los siglos"
 gj_velathi_cronicas_de_los_siglos_desc: "Los cronistas velathi llevan cuenta de mil años sin perder una hoja. Con prensa de tipos móviles, esa memoria llega por fin a muchas manos."
 gj_velathi_navios_de_savia: "Navíos de savia"
 gj_velathi_navios_de_savia_desc: "Cascos de madera viva, curvados al crecer, y velas de fibra de corteza. Los navíos velathi son hermosos y resistentes, pero casi nunca se alejan de casa."
 gj_velathi_fortines_de_corteza: "Fortines de corteza"
 gj_velathi_fortines_de_corteza_desc: "Torres que parecen árboles y árboles que parecen torres. Una guarnición velathi rara vez es grande, pero casi nunca se la encuentra."
 gj_velathi_guardabosques: "Guardabosques"
 gj_velathi_guardabosques_desc: "Compañías ligeras que conocen cada atajo del Dosel. Sus ejércitos llegan antes de lo esperado y se mantienen con lo que el bosque ofrece."
 gj_velathi_cultivo_sin_hacha: "Cultivo sin hacha"
 gj_velathi_cultivo_sin_hacha_desc: "Se siembra bajo los árboles, no en su lugar. Los claros curan sus heridas con una rapidez que sorprende a quien llega de tierras peladas."
 gj_velathi_puertos_de_corteza: "Puertos de corteza"
 gj_velathi_puertos_de_corteza_desc: "Los muelles velathi se alzan sobre pilotes de raíz viva. Poco comercio, pero marineros de por vida, porque ninguno se jubila antes de los doscientos años."
 gj_velathi_siglo_de_paz: "Siglo de paz"
 gj_velathi_siglo_de_paz_desc: "Cuando un mismo rey recuerda la guerra anterior, la siguiente se pospone. Las instituciones envejecen bien cuando quien las fundó sigue en el consejo."
 gj_velathi_ingenio_de_madera: "Ingenio de madera"
 gj_velathi_ingenio_de_madera_desc: "Engranajes, norias y poleas de madera dura, ajustados por artesanos de largos años. Sin hierro, pero sin prisa y sin fallos."
 gj_velathi_fusileros_del_umbral: "Fusileros del Umbral"
 gj_velathi_fusileros_del_umbral_desc: "Los arqueros cambian el arco por el fusil, pero no el hábito de disparar desde la espesura. Una línea velathi no se ve hasta que dispara."
 gj_velathi_sabiduria_de_las_eras: "Sabiduría de las eras"
 gj_velathi_sabiduria_de_las_eras_desc: "Las ideas nuevas del mundo llegan al Dosel y se encuentran con quien las pensó hace cinco siglos. De ese choque salen académicos formidables."
 gj_velathi_bosque_industrial: "Bosque industrial"
 gj_velathi_bosque_industrial_desc: "Aserraderos, astilleros y papeleras en el borde del bosque, con reglas estrictas: por cada tronco que cae, un retoño en el mismo claro."
 gj_velathi_memoria_viva: "Memoria viva"
 gj_velathi_memoria_viva_desc: "Los derechos del individuo son nuevos para el mundo y viejos para los velathi, que los practican desde que hay claros y consejos."
 gj_velathi_ultimo_juramento: "Último juramento"
 gj_velathi_ultimo_juramento_desc: "Cuando el bosque corre peligro, hasta el rey más dormido despierta. Todo velathi jura defenderlo, y ese juramento se cumple."
 gj_velathi_cultura_lengua_de_hojas: "Lengua de hojas"
 gj_velathi_cultura_lengua_de_hojas_desc: "El velathí se canta tanto como se habla. Cada verso es una hoja, y cada poema, un árbol de memoria."
 gj_velathi_cultura_canto_del_amanecer: "Canto del amanecer"
 gj_velathi_cultura_canto_del_amanecer_desc: "Al alba, todo el Dosel canta a la vez. Quien no ha oído esa música no entiende por qué un velathi tarda tanto en irse de casa."
 gj_velathi_cultura_pacto_de_los_arboles: "Pacto de los árboles"
 gj_velathi_cultura_pacto_de_los_arboles_desc: "El pueblo y el bosque se prometieron cuidarse mutuamente. Los forasteros tardan en entrar en ese pacto, y muchos nunca lo logran."

 # --- Reformas de gobierno ---
 gj_velathi_corona_de_siglos: "Corona de siglos"
 gj_velathi_corona_de_siglos_desc: "El rey velathi reina durante generaciones. La estabilidad es enorme, pero quien conoce todas las respuestas deja de hacerse preguntas nuevas."
 gj_velathi_consejo_de_raices: "Consejo de raíces"
 gj_velathi_consejo_de_raices_desc: "Cada rama del Dosel envía a su anciano. Entre todos gobiernan más que el rey, y se cuidan de que el rey no lo note."
 gj_velathi_juramento_del_bosque: "Juramento del Bosque"
 gj_velathi_juramento_del_bosque_desc: "Cada soldado velathi jura sobre la corteza de su árbol natal. Defender el Dosel es lo único que a todos obliga por igual."

 # --- Edificios ---
 gj_velathi_arboleda_antigua: "Arboleda Antigua"
 gj_velathi_arboleda_antigua_desc: "Un bosque sagrado que protege la comarca. Los ejércitos enemigos sufren desgaste entre sus troncos, y los defensores combaten con ventaja. Solo se levanta en bosque, y mejora con cada era."
 gj_velathi_arboleda_antigua_mantenimiento: "Mantenimiento de la arboleda"
 gj_velathi_salon_de_raices: "Salón de Raíces"
 gj_velathi_salon_de_raices_desc: "Una gran sala bajo las raíces donde se guardan las crónicas del pueblo. Mejora la cultura y la alfabetización de la comarca, y crece con cada era."
 gj_velathi_salon_de_raices_mantenimiento: "Mantenimiento del salón"
 gj_velathi_aserradero_vivo: "Aserradero Vivo"
 gj_velathi_aserradero_vivo_desc: "Un aserradero que replanta lo que corta. Produce mucha madera y muebles, pero agota poco a poco la prosperidad de su comarca. Mejora con cada era."
 gj_velathi_aserradero_vivo_mantenimiento: "Mantenimiento del aserradero"
 gj_velathi_jardin_de_sanacion: "Jardín de Sanación"
 gj_velathi_jardin_de_sanacion_desc: "Jardines de hierbas medicinales cuidados por herbolarias de siglos. Reducen las enfermedades y ayudan a que la población crezca. No se construyen en megalópolis."
 gj_velathi_jardin_de_sanacion_mantenimiento: "Mantenimiento del jardín"
 gj_velathi_torre_de_copas: "Torre de Copas"
 gj_velathi_torre_de_copas_desc: "Una atalaya construida en las ramas más altas. Mejora el control de la comarca y su abastecimiento. Es cara y solo se levanta en pueblos y ciudades."

 # --- Unidades ---
 gj_velathi_umbral: "Arqueros del Umbral"
 gj_velathi_raiz: "Guardia de la Raíz"
 gj_velathi_umbral_arqueros: "Arqueros del Umbral"
 gj_velathi_umbral_arqueros_desc: "Arqueros que disparan desde las ramas bajas. Fuertes en bosque y colinas, flojos en campo abierto. Su número depende de las Arboledas Antiguas."
 gj_velathi_umbral_arqueros_de_tejo: "Arqueros de tejo"
 gj_velathi_umbral_arqueros_de_tejo_desc: "$gj_velathi_umbral_arqueros_desc$"
 gj_velathi_umbral_arcabuceros: "Arcabuceros del Umbral"
 gj_velathi_umbral_arcabuceros_desc: "$gj_velathi_umbral_arqueros_desc$"
 gj_velathi_umbral_mosqueteros: "Mosqueteros del Umbral"
 gj_velathi_umbral_mosqueteros_desc: "$gj_velathi_umbral_arqueros_desc$"
 gj_velathi_umbral_linea: "Línea del Umbral"
 gj_velathi_umbral_linea_desc: "$gj_velathi_umbral_arqueros_desc$"
 gj_velathi_umbral_fusileros: "Fusileros del Umbral"
 gj_velathi_umbral_fusileros_desc: "$gj_velathi_umbral_arqueros_desc$"
 gj_velathi_raiz_guardia: "Guardia de la Raíz"
 gj_velathi_raiz_guardia_desc: "Infantería pesada que resiste y no se mueve. Aguanta bien los golpes, pero avanza lento y flojea en llano. Su número depende de las Torres de Copas."
 gj_velathi_raiz_alabarderos: "Alabarderos de la Raíz"
 gj_velathi_raiz_alabarderos_desc: "$gj_velathi_raiz_guardia_desc$"
 gj_velathi_raiz_piqueros: "Piqueros de la Raíz"
 gj_velathi_raiz_piqueros_desc: "$gj_velathi_raiz_guardia_desc$"
 gj_velathi_raiz_escopeteros_de_raiz: "Escopeteros de la Raíz"
 gj_velathi_raiz_escopeteros_de_raiz_desc: "$gj_velathi_raiz_guardia_desc$"
 gj_velathi_raiz_linea_de_raiz: "Línea de la Raíz"
 gj_velathi_raiz_linea_de_raiz_desc: "$gj_velathi_raiz_guardia_desc$"
 gj_velathi_raiz_centinelas: "Centinelas de la Raíz"
 gj_velathi_raiz_centinelas_desc: "$gj_velathi_raiz_guardia_desc$"
 gj_velathi_umbral_cupo_arboledas: "Niveles de Arboleda Antigua"
 gj_velathi_umbral_cupo_base: "Compañía base"
 gj_velathi_raiz_cupo_torres: "Niveles de Torre de Copas"
 gj_velathi_raiz_cupo_base: "Guardia base"

 # --- Modificadores temporales ---
 gj_velathi_cansancio_1: "Cansancio del trono: primer siglo"
 gj_velathi_cansancio_1_desc: "El mismo rey lleva muchos años en el trono y las ideas empiezan a repetirse."
 gj_velathi_cansancio_2: "Cansancio del trono: segundo siglo"
 gj_velathi_cansancio_2_desc: "El reinado se alarga. Nadie se atreve a contradecir a quien lo vio todo."
 gj_velathi_cansancio_3: "Cansancio del trono: tercer siglo"
 gj_velathi_cansancio_3_desc: "El trono pesa más que el reino. La corte duerme, y el mundo avanza."
 gj_velathi_consejo_regente: "Consejo regente"
 gj_velathi_consejo_regente_desc: "El rey duerme y el consejo de ancianos gobierna en su nombre, con prudencia y sin ambición."
 gj_velathi_rey_renovado: "Rey renovado"
 gj_velathi_rey_renovado_desc: "Tras el Sueño Largo, el rey vuelve con ojos nuevos y una memoria que lo abarca todo."
 gj_velathi_rey_dormido: "Rey dormido"
 gj_velathi_rey_dormido_desc: "El rey vive, pero no está. Su mente vaga por sueños antiguos."
 gj_velathi_tala_reciente: "Tala reciente"
 gj_velathi_tala_reciente_desc: "Se ha talado más de la cuenta. La madera abunda, pero los árboles murmuran."
 gj_velathi_otono_eterno: "Otoño eterno"
 gj_velathi_otono_eterno_desc: "Las hojas no caen y el bosque da más de lo habitual."
 gj_velathi_savia_serena: "Savia serena"
 gj_velathi_savia_serena_desc: "Una calma extraña recorre el Dosel. Las enfermedades ceden y la gente se siente orgullosa."
 gj_velathi_senda_del_dosel: "Senda del dosel"
 gj_velathi_senda_del_dosel_desc: "Nuevos caminos entre las copas acortan los viajes y mejoran el abastecimiento."
 gj_velathi_estandarte_de_hojas: "Estandarte de hojas"
 gj_velathi_estandarte_de_hojas_desc: "Los ejércitos marchan bajo un estandarte de mil hojas. Cada soldado sabe lo que defiende."
 gj_velathi_puertas_cerradas: "Caminos cerrados"
 gj_velathi_puertas_cerradas_desc: "Los senderos del bosque se han cerrado a los forasteros. La paz interior aumenta, y el comercio sufre."
 gj_velathi_puertas_abiertas: "Caminos abiertos"
 gj_velathi_puertas_abiertas_desc: "Los forasteros son recibidos en los claros. Llegan ideas nuevas, y también costumbres que algunos prefieren no ver."
 gj_velathi_reinado_de_raices: "Reinado de raíces"
 gj_velathi_reinado_de_raices_desc: "El nuevo rey promete continuidad: lo que fue, será."
 gj_velathi_reinado_de_hojas: "Reinado de hojas"
 gj_velathi_reinado_de_hojas_desc: "El nuevo rey promete aprender: cada año traerá una hoja nueva."
 gj_velathi_reinado_de_espinas: "Reinado de espinas"
 gj_velathi_reinado_de_espinas_desc: "El nuevo rey promete defensa: quien entre sin permiso, saldrá con espinas."
 gj_velathi_heredera_en_el_consejo: "Heredera en el consejo"
 gj_velathi_heredera_en_el_consejo_desc: "Una voz joven se sienta entre los ancianos y los obliga a explicar lo que hacen."
 gj_velathi_trueque_de_madera: "Trueque de madera"
 gj_velathi_trueque_de_madera_desc: "Se cambia madera por monedas en las ferias de frontera. El bosque da menos, pero las arcas se llenan."
 gj_velathi_bosque_antiguo: "Bosque Antiguo"
 gj_velathi_bosque_antiguo_desc: "Un bosque sagrado plantado con paciencia. Los ejércitos enemigos sufren desgaste, y la comarca recupera antes población y control."
 gj_velathi_brote_reciente: "Brote reciente"
 gj_velathi_brote_reciente_desc: "Los retoños nuevos devuelven la vida a la comarca."
 gj_velathi_incendio_en_la_copa: "Incendio en la copa"
 gj_velathi_incendio_en_la_copa_desc: "El fuego ha prendido en las copas. La comarca sufre y la madera escasea."
 gj_velathi_savia_que_cura: "Savia que cura"
 gj_velathi_savia_que_cura_desc: "Una savia curativa baña la comarca. Las fiebres ceden y la población crece."

 # --- Decisiones ---
 gj_velathi_plantar_bosque_antiguo.title: "Plantar el Bosque Antiguo"
 gj_velathi_plantar_bosque_antiguo.title.entry: "Plantar el Bosque Antiguo"
 gj_velathi_plantar_bosque_antiguo.desc: "Hay claros donde el bosque murió: por las guerras, por la tala, por el olvido. Podemos plantar un bosque sagrado que recupere población y control, y que sea una trampa para el invasor."
 gj_velathi_plantar_bosque_antiguo.desc.entry: "Plantar un bosque sagrado en una comarca arrasada o vacía."
 gj_velathi_plantar_bosque_antiguo.a: "Que crezca el Bosque Antiguo."
 gj_velathi_convocar_concilio.title: "Convocar el concilio de ancianos"
 gj_velathi_convocar_concilio.title.entry: "Convocar el concilio de ancianos"
 gj_velathi_convocar_concilio.desc: "El mismo rey lleva demasiados años en el trono. Podemos convocar al concilio para que renueve las ideas del reino, aunque cueste prestigio."
 gj_velathi_convocar_concilio.desc.entry: "Renovar el reinado y quitar el cansancio del trono."
 gj_velathi_convocar_concilio.a: "Que hablen los ancianos."
 gj_velathi_despertar_al_rey.title: "Despertar al rey"
 gj_velathi_despertar_al_rey.title.entry: "Despertar al rey"
 gj_velathi_despertar_al_rey.desc: "El rey duerme y el consejo gobierna. Podemos pedir a las voces del bosque que lo despierten, aunque la corte lo vea como una afrenta."
 gj_velathi_despertar_al_rey.desc.entry: "Despertar antes de tiempo al rey que duerme."
 gj_velathi_despertar_al_rey.a: "Cantad la canción del alba."
 gj_velathi_cerrar_los_caminos.title: "Cerrar los caminos del bosque"
 gj_velathi_cerrar_los_caminos.title.entry: "Cerrar los caminos del bosque"
 gj_velathi_cerrar_los_caminos.desc: "El bosque guarda sus secretos. Podemos cerrar los senderos a los forasteros durante veinte años: habrá paz interior, pero menos comercio."
 gj_velathi_cerrar_los_caminos.desc.entry: "Cerrar los senderos a los forasteros."
 gj_velathi_cerrar_los_caminos.a: "Que nadie entre sin invitación."
 gj_velathi_abrir_los_caminos.title: "Abrir los caminos del bosque"
 gj_velathi_abrir_los_caminos.title.entry: "Abrir los caminos del bosque"
 gj_velathi_abrir_los_caminos.desc: "El mundo cambia más rápido que nosotros. Podemos abrir los senderos durante veinte años y aprender de quienes llegan, a costa de mezclar nuestras costumbres."
 gj_velathi_abrir_los_caminos.desc.entry: "Abrir los senderos a los forasteros."
 gj_velathi_abrir_los_caminos.a: "Que entren los viajeros."

 # --- Eventos ---
 gj_velathi.1.title: "Se abre un reinado"
 gj_velathi.1.desc: "El nuevo rey se sienta bajo el árbol mayor y habla despacio. Todos escuchan, porque lo que diga hoy durará siglos. ¿Qué clase de reinado promete?"
 gj_velathi.1.a: "Un reinado de raíces: lo que fue, será."
 gj_velathi.1.b: "Un reinado de hojas: cada año, algo nuevo."
 gj_velathi.1.c: "Un reinado de espinas: nadie entrará sin permiso."
 gj_velathi.2.title: "Los años del mismo rey"
 gj_velathi.2.desc: "Han pasado otros veinticinco inviernos y el rey sigue en su trono. Los consejeros que lo conocieron joven ya son ancianos, y los jóvenes lo ven como parte del paisaje. La corte se siente segura, pero algo se detiene."
 gj_velathi.2.a: "El peso de los siglos es nuestro."
 gj_velathi.2.b: "Que el consejo hable, aunque duela."
 gj_velathi.3.title: "El Sueño Largo"
 gj_velathi.3.desc: "Los cortesanos lo notaron primero en los ojos. El rey mira, pero no ve; habla, pero sus palabras vienen de otro siglo. Los ancianos lo llaman Sueño Largo y dicen que puede durar décadas. El reino no puede esperar a su rey."
 gj_velathi.3.a: "Que duerma. El consejo gobernará."
 gj_velathi.3.b: "Despertadlo con el canto de la primavera."
 gj_velathi.3.c: "Que la heredera tome la voz."
 gj_velathi.4.title: "El rey despierta"
 gj_velathi.4.desc: "Una mañana de lluvia fina, el rey abre los ojos y pide que le cuenten qué ha pasado. Lo hace con voz clara, como si hubiera dormido una noche. Los ancianos le explican quince años de historia, y él asiente con tristeza."
 gj_velathi.4.a: "Que reine de nuevo."
 gj_velathi.4.b: "Que el consejo siga un tiempo más."
 gj_velathi.5.title: "Un árbol muere en la frontera"
 gj_velathi.5.desc: "Nuestros soldados han tomado tierras ajenas. Entre ellas hay un árbol viejo, caído por el fuego de la guerra. Los guardabosques dicen que su savia se detiene, y que el Dosel entero lo siente. ¿Qué hacemos con la conquista?"
 gj_velathi.5.a: "Plantar un retoño donde cayó."
 gj_velathi.5.b: "La guerra no espera."
 gj_velathi.6.title: "El otoño eterno"
 gj_velathi.6.desc: "Este año las hojas no han caído. El bosque se vuelve de oro y de ámbar, y la caza y la leña abundan. Los ancianos dicen que ocurre una vez cada tres vidas."
 gj_velathi.6.a: "Celebremos y aprovechemos."
 gj_velathi.6.b: "Que los poetas lo canten."
 gj_velathi.7.title: "Los arqueros aprenden el bosque"
 gj_velathi.7.desc: "En plena guerra, un viejo explorador reúne a los arqueros y les enseña senderos que ningún mapa recoge. Los soldados, al terminar, miran los árboles con otros ojos."
 gj_velathi.7.a: "Bajo el estandarte de hojas."
 gj_velathi.7.b: "Marchemos por las copas."
 gj_velathi.8.title: "Forasteros en el claro"
 gj_velathi.8.desc: "Un grupo de viajeros ha llegado a un claro lejano y pide hablar con los ancianos. Traen noticias, mercancías y preguntas incómodas. El consejo duda entre acogerlos o guiarlos de vuelta a la linde."
 gj_velathi.8.a: "Que se queden y hablen."
 gj_velathi.8.b: "Guiadlos de vuelta a la linde."
 gj_velathi.9.title: "La savia que cura"
 gj_velathi.9.desc: "Una herbolaria de ciento ochenta años descubre una savia nueva que cura las fiebres de los niños. Pide permiso para extenderla por la comarca más cercana."
 gj_velathi.9.a: "Extended la savia por la comarca."
 gj_velathi.9.b: "Que se enseñe en todo el reino."
 gj_velathi.10.title: "Mercaderes de pocas monedas"
 gj_velathi.10.desc: "Los velathi no acuñan casi moneda, pero un mercader de la linde quiere madera a cambio de oro. Las cuentas son claras, aunque a los árboles no les agrade."
 gj_velathi.10.a: "Trocad madera por monedas con regularidad."
 gj_velathi.10.b: "Una gran venta de madera, de una vez."
 gj_velathi.10.c: "Rechazad el trato. El Dosel no se vende."
 gj_velathi.11.title: "El Árbol-Memoria"
 gj_velathi.11.desc: "En el corazón del Dosel hay un tejo que cuenta mil años. Los cronistas descubren que sus anillos guardan un registro tan exacto como el de cualquier biblioteca. Estudiarlos llevará una generación."
 gj_velathi.11.a: "Que los sabios lean los anillos."
 gj_velathi.11.b: "Que el árbol sea un símbolo del reino."
 gj_velathi.12.title: "Incendio en la copa"
 gj_velathi.12.desc: "Un rayo ha prendido fuego en las copas de una comarca. La llama salta de rama en rama y los habitantes huyen por las pasarelas. Hay que decidir si se apaga a costa de talar o si se deja arder."
 gj_velathi.12.a: "Apagadlo, aunque se talen cortafuegos."
 gj_velathi.12.b: "Dejad que arda. El bosque vuelve."
 gj_velathi.13.title: "El cantor de los mil años"
 gj_velathi.13.desc: "Un cantor llega a la corte. Dice haber conocido a los primeros reyes, y todos le creen. Canta durante tres noches, y el reino entero se queda en silencio."
 gj_velathi.13.a: "Que su canto quede escrito."
 gj_velathi.14.title: "El retoño que salvó el claro"
 gj_velathi.14.desc: "Años después del fuego, un retoño ha crecido donde ardió el árbol mayor. Es verde y es fuerte, y los habitantes han decidido que se llame como la herbolaria que murió apagando las llamas."
 gj_velathi.14.a: "Que el retoño inicie un nuevo bosque."
 gj_velathi.15.title: "La heredera impaciente"
 gj_velathi.15.desc: "La heredera lleva cuarenta años esperando una corona que no llega. Es sabia, es capaz y está harta de ver que decide el mismo rey de siempre. Pide un puesto en el consejo."
 gj_velathi.15.a: "Que se siente entre los ancianos."
 gj_velathi.15.b: "Aún no es su hora."
 gj_velathi.16.title: "El bosque que plantamos"
 gj_velathi.16.desc: "Hace diez años plantamos un bosque en una comarca vacía. Hoy sus troncos tienen el grosor de un brazo, los pájaros anidan y los niños juegan donde antes había ceniza."
 gj_velathi.16.a: "Que la comarca prospere."
 gj_velathi.16.b: "Que el reino entero lo celebre."
 gj_velathi.17.title: "A través del dosel"
 gj_velathi.17.desc: "Un grupo de exploradores ha terminado de tender una red de pasarelas entre las copas. Se puede cruzar medio reino sin tocar el suelo."
 gj_velathi.17.a: "Usadla para el ejército y los mensajeros."
 gj_velathi.17.b: "Que los cartógrafos la dibujen."
 gj_velathi.18.title: "Tala en tiempos de guerra"
 gj_velathi.18.desc: "El ejército necesita madera y hombres, y el bosque los tiene. Los generales piden talar a gran escala. Los ancianos tiemblan, porque cada árbol tiene nombre."
 gj_velathi.18.a: "Talad lo que haga falta."
 gj_velathi.18.b: "El bosque no es una cantera."
 gj_velathi.19.title: "El estandarte de las mil hojas"
 gj_velathi.19.desc: "Los ejércitos velathi han adoptado un estandarte nuevo: una copa de árbol bordada con mil hojas, una por cada familia del reino. Los soldados lo besan antes de cada batalla."
 gj_velathi.19.a: "Que ondee en cada campaña."
 gj_velathi.20.title: "El último juramento"
 gj_velathi.20.desc: "El mundo cambia a una velocidad que ni los más viejos recuerdan. En un claro, todos los ancianos se reúnen para renovar el juramento: defender el bosque, aunque el bosque ya no sea lo que era."
 gj_velathi.20.a: "Juremos otra vez."
 gj_velathi.20.b: "Que el juramento quede en la memoria."
