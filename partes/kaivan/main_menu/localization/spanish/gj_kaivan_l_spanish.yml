l_spanish:
 gj_kaivani: "Kaivanis"
 gj_grupo_estepa: "Grupo de la estepa del norte"
 gj_grupo_estepa_desc: "Los pueblos de la gran estepa del norte comparten caballo, rebaño y fuego común: jinetes de clanes que cruzan la hierba tras las yeguadas y el pasto."
 gj_kaivani_language: "Kaivani"
 gj_estepa_language_family: "Esteparias del norte"
 GJ_KAIVAN_CAMPAMENTOS: "Campamentos del Kan"
 GJ_KAIVAN_POR_ERA: "Por eras superadas"
 gj_kaivan_lobos: "Jinetes Lobo"
 STATIC_MODIFIER_NAME_gj_kaivan_gran_cabalgada: "La Gran Cabalgada"
 STATIC_MODIFIER_DESC_gj_kaivan_gran_cabalgada: "Los clanes cabalgan juntos: más velocidad y saqueo, y los caballos cuestan más de mantener."
 STATIC_MODIFIER_NAME_gj_kaivan_pastos_agotados: "Pastos agotados"
 STATIC_MODIFIER_DESC_gj_kaivan_pastos_agotados: "La hierba tarda en volver tras tanta cabalgada o tanta mala racha."
 STATIC_MODIFIER_NAME_gj_kaivan_sede_del_kan: "Sede del kan"
 STATIC_MODIFIER_DESC_gj_kaivan_sede_del_kan: "La corte ha llegado: el campamento crece y el control se afianza deprisa."
 STATIC_MODIFIER_NAME_gj_kaivan_reinado_uzhar: "Reinado del Halcón Gris"
 STATIC_MODIFIER_DESC_gj_kaivan_reinado_uzhar: "Reina un kan del clan Uzhar: la caballería ligera es lo primero."
 STATIC_MODIFIER_NAME_gj_kaivan_reinado_tarkhen: "Reinado de la Lanza de la Marca"
 STATIC_MODIFIER_DESC_gj_kaivan_reinado_tarkhen: "Reina un kan del clan Tarkhen: guerra de asedio y fronteras de hierro."
 STATIC_MODIFIER_NAME_gj_kaivan_reinado_ilbari: "Reinado del Señor del Río"
 STATIC_MODIFIER_DESC_gj_kaivan_reinado_ilbari: "Reina un kan del clan Ilbari: rutas abiertas y yeguadas de los valles."
 STATIC_MODIFIER_NAME_gj_kaivan_reinado_merghan: "Reinado del Pastor de la Niebla"
 STATIC_MODIFIER_DESC_gj_kaivan_reinado_merghan: "Reina un kan del clan Merghan: rebaños gordos y muchos hijos."
 STATIC_MODIFIER_NAME_gj_kaivan_cicatriz_de_hermanos: "Cicatriz de hermanos"
 STATIC_MODIFIER_DESC_gj_kaivan_cicatriz_de_hermanos: "Los clanes no olvidan quién cabalgó contra quién."
 STATIC_MODIFIER_NAME_gj_kaivan_juramento_renovado: "Brasas rejuradas"
 STATIC_MODIFIER_DESC_gj_kaivan_juramento_renovado: "Los clanes han jurado de nuevo sobre el Fuego Común."
 STATIC_MODIFIER_NAME_gj_kaivan_invierno_negro: "Invierno negro"
 STATIC_MODIFIER_DESC_gj_kaivan_invierno_negro: "La nieve cubre el pasto y los caballos mueren de pie."
 STATIC_MODIFIER_NAME_gj_kaivan_primavera_de_yeguadas: "Primavera de yeguadas"
 STATIC_MODIFIER_DESC_gj_kaivan_primavera_de_yeguadas: "Nacen potros por millares."
 STATIC_MODIFIER_NAME_gj_kaivan_ruta_abierta: "Ruta abierta"
 STATIC_MODIFIER_DESC_gj_kaivan_ruta_abierta: "Las caravanas cruzan la estepa y hablan bien de nosotros."
 STATIC_MODIFIER_NAME_gj_kaivan_botin_de_marca: "Botín de la marca"
 STATIC_MODIFIER_DESC_gj_kaivan_botin_de_marca: "Los jóvenes guerreros vuelven con historias que contar."
 STATIC_MODIFIER_NAME_gj_kaivan_fiebre_de_los_campamentos: "Fiebre de los campamentos"
 STATIC_MODIFIER_DESC_gj_kaivan_fiebre_de_los_campamentos: "La fiebre pasa de tienda en tienda."
 STATIC_MODIFIER_NAME_gj_kaivan_cometa_de_los_nueve: "Cometa de los Nueve"
 STATIC_MODIFIER_DESC_gj_kaivan_cometa_de_los_nueve: "Los guerreros han visto la señal y cabalgan sin miedo."
 STATIC_MODIFIER_NAME_gj_kaivan_feria_de_verano: "Feria de verano"
 STATIC_MODIFIER_DESC_gj_kaivan_feria_de_verano: "Los corrales están abiertos a todos los mercaderes de la estepa."
 gj_kaivan_nueve_fuegos: "Los Nueve Fuegos"
 gj_kaivan_nueve_fuegos_desc: "Cada clan encendió una hoguera la noche en que se juró el Círculo. Cada hoguera aún tiene su jinete."
 gj_kaivan_camino_largo: "La Ley del Camino Largo"
 gj_kaivan_camino_largo_desc: "El mando no se queda en la tienda: viaja con el kan. Aprendimos a gobernar a caballo."
 gj_kaivan_tienda_abierta: "La Tienda Abierta"
 gj_kaivan_tienda_abierta_desc: "Quien llega a un fuego de Kaivan es huésped tres noches. Después de eso, es amigo o es presa."
 gj_kaivan_hierbas_de_primavera: "Hierbas de Primavera"
 gj_kaivan_hierbas_de_primavera_desc: "Los pastores saben leer el deshielo. La yeguada llega gorda al verano y el mercado lo nota."
 gj_kaivan_flechas_del_alba: "Flechas del Alba"
 gj_kaivan_flechas_del_alba_desc: "El arco corto, tensado al galope, y la flecha que llega antes que el grito."
 gj_kaivan_jinetes_de_lobo: "Los Jinetes Lobo"
 gj_kaivan_jinetes_de_lobo_desc: "Los lobos de la estepa se dejan montar por quien les da de comer. Nadie dice cómo empezó, pero ahora hay jinetes que los crían."
 gj_kaivan_forja_de_carros: "La Forja de los Carros"
 gj_kaivan_forja_de_carros_desc: "Cada clan lleva su fragua en un carro. Las espadas se cambian mejor en los campamentos que en las ciudades."
 gj_kaivan_ley_del_circulo: "La Ley del Círculo"
 gj_kaivan_ley_del_circulo_desc: "Lo que se decide en el Círculo obliga a los nueve fuegos. El kan lo sabe, y los clanes también."
 gj_kaivan_atalayas_de_fuego: "Las Atalayas de Fuego"
 gj_kaivan_atalayas_de_fuego_desc: "Una hoguera en la loma avisa a la siguiente. En una noche, todo el país sabe que viene el invasor."
 gj_kaivan_mercado_de_primavera: "El Mercado de Primavera"
 gj_kaivan_mercado_de_primavera_desc: "Cuando se abren los pasos, los mercaderes suben hasta las yeguadas. Les enseñamos a regatear a caballo."
 gj_kaivan_marca_armada: "La Marca Armada"
 gj_kaivan_marca_armada_desc: "Los Tarkhen levantaron empalizadas donde nadie las esperaba. Ahora la frontera también sabe sitiar."
 gj_kaivan_carabinas_de_estepa: "Las Carabinas de la Estepa"
 gj_kaivan_carabinas_de_estepa_desc: "El arco corto cede el sitio a la carabina corta. El jinete sigue siendo el mismo."
 gj_kaivan_nueva_ruta_de_caballos: "La Nueva Ruta de los Caballos"
 gj_kaivan_nueva_ruta_de_caballos_desc: "Nuestras yeguadas se venden en ferias de reinos que no conocemos. Los guerreros vuelven con historias nuevas."
 gj_kaivan_campamentos_permanentes: "Los Campamentos Permanentes"
 gj_kaivan_campamentos_permanentes_desc: "Un campamento que vuelve cada invierno acaba siendo una ciudad. Los clanes lo han aprendido a su pesar."
 gj_kaivan_cuerno_de_las_nueve: "El Cuerno de los Nueve"
 gj_kaivan_cuerno_de_las_nueve_desc: "Nueve toques, nueve clanes. Cuando suena el cuerno, la caballería llega de todas partes a la vez."
 gj_kaivan_pastos_comunes: "Los Pastos Comunes"
 gj_kaivan_pastos_comunes_desc: "Se acuerda que ningún clan cerrará el pasto a otro. Los rebaños crecen, y los pleitos también."
 gj_kaivan_hijos_del_circulo: "Los Hijos del Círculo"
 gj_kaivan_hijos_del_circulo_desc: "Los hijos de los clanes se crían en la corte del kan. Aprenden de todos y de ninguno."
 gj_kaivan_rieles_de_la_estepa: "Los Rieles de la Estepa"
 gj_kaivan_rieles_de_la_estepa_desc: "Las ruedas de hierro corren sobre la hierba donde antes pasaban los caballos. La estepa se hace pequeña."
 gj_kaivan_ultimo_kurultai: "El Último Círculo"
 gj_kaivan_ultimo_kurultai_desc: "Cuando todo cambia, el Círculo se reúne una vez más para decidir qué merece seguir ardiendo."
 gj_kaivan_caballeria_de_hierro: "La Caballería de Hierro"
 gj_kaivan_caballeria_de_hierro_desc: "Los caballos son los mismos, pero los jinetes llevan acero y disciplina. Los lobos también."
 gj_kaivan_cultura_memoria_de_las_ruedas: "Memoria de las Ruedas"
 gj_kaivan_cultura_memoria_de_las_ruedas_desc: "Cada familia kaivani lleva un carro, y en cada carro, la historia de quien lo rodó por primera vez."
 gj_kaivan_cultura_hogueras_de_linaje: "Las Hogueras de Linaje"
 gj_kaivan_cultura_hogueras_de_linaje_desc: "Quien se sienta ante una hoguera kaivani lleva ya el nombre de su linaje. Los forasteros que se quedan lo reciben."
 gj_kaivan_grupo_pastores_de_horizonte: "Los Pastores del Horizonte"
 gj_kaivan_grupo_pastores_de_horizonte_desc: "Todos los pueblos de la estepa saben mover rebaños más lejos que el horizonte de un hombre a pie."
 gj_kaivan_circulo_de_clanes: "El Círculo de los Clanes"
 gj_kaivan_circulo_de_clanes_desc: "El kan no hereda: lo eligen cuatro clanes ante un fuego. La corte se muda a la tierra del elegido."
 gj_kaivan_ley_de_la_hierba: "La Ley de la Hierba"
 gj_kaivan_ley_de_la_hierba_desc: "El pasto es de todos y la lanza de cada clan. Los clanes ponen sus levas y pagan lo justo."
 gj_kaivan_gran_hogar_de_los_nueve: "El Gran Hogar de los Nueve"
 gj_kaivan_gran_hogar_de_los_nueve_desc: "La corte deja de ser un campamento sin dejar de moverse. Los nueve fuegos arden en una sola mesa."
 gj_kaivan_campamento_kan: "Campamento del Kan"
 gj_kaivan_campamento_kan_desc: "Cada capital vieja deja un campamento: sigue criando caballos y conserva el control del lugar. Se levanta solo donde manda la cultura kaivani, y los niveles crecen con la era."
 gj_kaivan_cria_trashumante: "Cría trashumante"
 gj_kaivan_cria_selecta: "Cría selecta"
 gj_kaivan_remonta_de_hierro: "Remonta de hierro"
 gj_kaivan_feria_yeguadas: "Feria de las Yeguadas"
 gj_kaivan_feria_yeguadas_desc: "El gran mercado del pasto: cuero, paños y pieles finas, según la era. No hay ferias en villorrios."
 gj_kaivan_feria_cueros: "Cueros de feria"
 gj_kaivan_feria_panos: "Paños de feria"
 gj_kaivan_feria_peleteria: "Peletería fina"
 gj_kaivan_fragua_estepa: "Fragua de la Estepa"
 gj_kaivan_fragua_estepa_desc: "Armas para los clanes. Solo funciona donde hay mercado de hierro o de cobre, y los métodos buenos llegan tarde."
 gj_kaivan_fragua_de_carros: "Fragua de carros"
 gj_kaivan_fragua_de_coraza: "Fragua de coraza"
 gj_kaivan_fragua_de_acero: "Fragua de acero"
 gj_kaivan_atalaya_hogueras: "Atalaya de las Hogueras"
 gj_kaivan_atalaya_hogueras_desc: "Una torre de madera y una hoguera lista. Frena a los invasores y propaga el control, pero no produce nada."
 gj_kaivan_vigias_de_madera: "Vigías de madera"
 gj_kaivan_vigias_con_polvora: "Vigías con pólvora"
 gj_kaivan_tienda_del_circulo: "Gran Tienda del Círculo"
 gj_kaivan_tienda_del_circulo_desc: "La tienda donde se reúne el Círculo. Solo hay una, solo en la capital, y viaja con ella."
 gj_kaivan_tienda_de_fieltro: "Tienda de fieltro"
 gj_kaivan_tienda_de_seda_y_laca: "Tienda de seda y laca"
 a_gj_kaivan_arqueros_1: "Arqueros del Círculo"
 a_gj_kaivan_arqueros_1_desc: "Arco corto y caballo ligero. Hacen más daño a la moral, pero no asaltan fortalezas, sufren en la costa y la sierra, y solo se reclutan donde domina la cultura kaivani."
 a_gj_kaivan_arqueros_2: "Arqueros del Alba"
 a_gj_kaivan_arqueros_2_desc: "Las flechas del alba, ahora con puntas de hierro bien curado."
 a_gj_kaivan_arqueros_3: "Arqueros arcabuceros de la Marca"
 a_gj_kaivan_arqueros_3_desc: "La Marca enseña al arquero a cargar un arcabuz sin bajar del caballo."
 a_gj_kaivan_arqueros_4: "Carabineros de la Estepa"
 a_gj_kaivan_arqueros_4_desc: "Carabinas cortas y la misma puntería de siempre."
 a_gj_kaivan_arqueros_5: "Carabineros del Cuerno"
 a_gj_kaivan_arqueros_5_desc: "Nueve toques de cuerno y la caballería carga a la vez."
 a_gj_kaivan_arqueros_6: "Fusileros montados de la Estepa"
 a_gj_kaivan_arqueros_6_desc: "Los últimos jinetes de los Nueve Fuegos, con rifles y sin miedo al viento."
 a_gj_kaivan_lobos_2: "Jinetes Lobo"
 a_gj_kaivan_lobos_2_desc: "Jinetes sobre lobos de la estepa. Flanquean y llegan antes, pero se desmoralizan antes, sufren en la sierra y la selva, y su número depende de los campamentos del kan."
 a_gj_kaivan_lobos_3: "Jinetes Lobo de Lanza"
 a_gj_kaivan_lobos_3_desc: "Lanzas largas para un animal que muerde mejor que corre."
 a_gj_kaivan_lobos_4: "Lobos Carabineros"
 a_gj_kaivan_lobos_4_desc: "El lobo no se asusta de la pólvora; el jinete aprende a no asustarse de él."
 a_gj_kaivan_lobos_5: "Lobos del Cuerno"
 a_gj_kaivan_lobos_5_desc: "La manada baja al llano cuando suena el cuerno."
 a_gj_kaivan_lobos_6: "Lobos de Hierro"
 a_gj_kaivan_lobos_6_desc: "Corazas ligeras y collares de acero: la última manada de la estepa."
 gj_kaivan_guerra_hermanos: "La guerra de los hermanos"
 gj_kaivan_guerra_hermanos_desc: "Un clan ha perdido la votación y no ha jurado sobre el Fuego Común. Los hermanos cabalgan contra los hermanos hasta que alguien acepte la paz del Círculo."
 gj_kaivan_gran_cabalgada_decision.title: "La Gran Cabalgada"
 gj_kaivan_gran_cabalgada_decision.desc: "Los clanes se reúnen y cabalgan juntos diez años: más velocidad, más saqueo y caballos más caros. Después, la hierba tarda en volver."
 gj_kaivan_gran_cabalgada_decision.a: "Que suene el cuerno de los Nueve"
 gj_kaivan_ganar_favor_decision.title: "Ganar el favor de un clan"
 gj_kaivan_ganar_favor_decision.desc: "Antes de que muera el kan, hay que saber a quién apoyar. Oro, caballos y promesas para un solo clan, una vez cada cinco años."
 gj_kaivan_ganar_favor_decision.uzhar: "Clan Uzhar, el Halcón Gris"
 gj_kaivan_ganar_favor_decision.tarkhen: "Clan Tarkhen, la Lanza de la Marca"
 gj_kaivan_ganar_favor_decision.ilbari: "Clan Ilbari, los Señores del Río"
 gj_kaivan_ganar_favor_decision.merghan: "Clan Merghan, los Pastores de la Niebla"
 gj_kaivan_convocar_circulo_decision.title: "Convocar el Círculo"
 gj_kaivan_convocar_circulo_decision.desc: "El kan vive, pero la corte puede cambiar de tierra una vez por generación si el Círculo lo pide. Cuesta legitimidad."
 gj_kaivan_convocar_circulo_decision.a: "Que se reúnan los clanes"
 gj_kaivan_feria_de_verano_decision.title: "La Feria de Verano"
 gj_kaivan_feria_de_verano_decision.desc: "La capital abre los corrales a todos los mercaderes de la estepa durante diez años."
 gj_kaivan_feria_de_verano_decision.a: "Que abran los corrales"
 gj_kaivan.1.title: "El Círculo se reúne"
 gj_kaivan.1.desc: "El kan ha muerto y el Fuego Común sigue encendido. Cuatro clanes han traído a su candidato y se sientan en círculo, sin armas pero con los caballos cerca. Quien reine llevará la corte a su tierra, y el que pierda tendrá que decidir si jura o cabalga. Los jefes esperan saber a quién apoyamos, y qué estamos dispuestos a prometer."
 gj_kaivan.1.a: "Apoyar al clan Uzhar, el Halcón Gris"
 gj_kaivan.1.b: "Apoyar al clan Tarkhen, la Lanza de la Marca"
 gj_kaivan.1.c: "Apoyar al clan Ilbari, los Señores del Río"
 gj_kaivan.1.d: "Apoyar al clan Merghan, los Pastores de la Niebla"
 gj_kaivan.1.e: "Dejar que el Círculo decida sin nosotros"
 gj_kaivan.2.title: "La tienda del nuevo kan"
 gj_kaivan.2.desc.uzhar: "Las crines de los caballos del Halcón Gris se trenzan con cintas grises. El nuevo kan es un Uzhar, y la corte se muda a las llanuras altas. La tienda vieja queda atrás, convertida en campamento, y un humo nuevo sube de la nueva."
 gj_kaivan.2.desc.tarkhen: "El nuevo kan es un Tarkhen. La corte baja hacia la marca del oeste, donde la hierba se mezcla con el humo de las empalizadas. Los Tarkhen no saben reinar sin vigilar la frontera."
 gj_kaivan.2.desc.ilbari: "El nuevo kan es un Ilbari. La corte se muda a los valles del este, junto a los ríos de las yeguadas. Se dice que el agua da buena memoria para las cuentas."
 gj_kaivan.2.desc.merghan: "El nuevo kan es un Merghan. La corte baja a la estepa baja, entre las nieblas de la mañana y los rebaños sin fin. Los pastores no cuentan los años: cuentan los inviernos."
 gj_kaivan.2.desc.nadie: "Ningún clan tiene tierra bajo nuestra bandera, y el Círculo no encuentra dónde plantar la tienda. El kan seguirá donde estaba hasta que alguien recupere el pasto de su clan."
 gj_kaivan.2.a: "Que ardan los fuegos de la nueva sede"
 gj_kaivan.3.title: "Los clanes agraviados"
 gj_kaivan.3.desc.uzhar: "La votación fue reñida y el Halcón Gris no ha jurado. Los jinetes Uzhar ensillan en silencio, con las flechas aún en el carcaj. Esperan una señal del kan."
 gj_kaivan.3.desc.tarkhen: "La votación fue reñida y la Lanza de la Marca no ha jurado. Los Tarkhen ya cierran sus empalizadas, y no es contra el invasor."
 gj_kaivan.3.desc.ilbari: "La votación fue reñida y los Señores del Río no han jurado. Los Ilbari retienen sus yeguadas en los valles y hacen cuentas."
 gj_kaivan.3.desc.merghan: "La votación fue reñida y los Pastores de la Niebla no han jurado. Los Merghan se llevan los rebaños hacia el sur, sin prisa, como quien ya ha decidido."
 gj_kaivan.3.a: "Darles privilegios y oro para que juren"
 gj_kaivan.3.b: "Dejar que se marchen con su tierra"
 gj_kaivan.3.c: "Que el Círculo decida con las armas"
 gj_kaivan.20.title: "La guerra de los hermanos"
 gj_kaivan.20.desc: "El Círculo ha roto el juramento. Los hermanos que compartían el fuego se miran por encima de las lanzas. Cada tienda debe elegir bando, y cada caballo, jinete. Los viejos dicen que los clanes que se matan entre sí lo recuerdan durante cien inviernos."
 gj_kaivan.20.a: "Que el cuerno suene por última vez como uno solo"
 gj_kaivan.21.title: "Escaramuza entre hermanos"
 gj_kaivan.21.desc: "Una partida de jinetes de dos clanes ha chocado junto a un río seco. Nadie quiere ser el primero en bajar el arco. Un anciano de la marca se ofrece a hablar con los dos lados, a cambio de un regalo."
 gj_kaivan.21.a: "Pagar los regalos y comprar tiempo"
 gj_kaivan.21.b: "Dejar que arda el pasto: ya se verá quién queda"
 gj_kaivan.22.title: "El Círculo exige la paz"
 gj_kaivan.22.desc: "Dos años de guerra han dejado pastos vacíos y tiendas sin dueño. Los ancianos de todos los clanes se reúnen junto al Fuego Común y piden al kan que acepte la paz. Hay quien dice que sin un vencedor claro no hay reinado, y quien dice que sin perdón no hay clanes."
 gj_kaivan.22.a: "Perdonar y renovar el juramento"
 gj_kaivan.22.b: "Imponer la voluntad del kan con la espada"
 gj_kaivan.23.title: "Se apagan las hogueras de guerra"
 gj_kaivan.23.desc: "La guerra de los hermanos ha terminado. Los clanes vuelven a sus pastos y los jinetes cuentan sus muertos junto al fuego. Nadie olvida, pero todos saben que hay un solo Círculo y que sin él no queda nada de lo que cabalgar."
 gj_kaivan.23.a: "Que se encienda el Fuego Común otra vez"
 gj_kaivan.30.title: "Invierno negro"
 gj_kaivan.30.desc: "La nieve ha caído antes de tiempo y no se funde. Los caballos escarban el hielo para llegar al pasto y se quedan sin fuerzas. Los ancianos dicen que no vivían un invierno así desde hace tres generaciones, y se acuerdan de quién no volvió."
 gj_kaivan.30.a: "Abrir los silos de los clanes y repartir"
 gj_kaivan.30.b: "Matar a los caballos viejos y vivir de la carne"
 gj_kaivan.31.title: "Primavera de yeguadas"
 gj_kaivan.31.desc: "La primavera ha llegado con lluvia y sol en la medida justa. Las yeguas paren sin problema y los potros corren antes de aprender a andar. Los pastores sonríen por primera vez en meses."
 gj_kaivan.31.a: "Celebrar la fiesta de los potros"
 gj_kaivan.31.b: "Vender el excedente de caballos"
 gj_kaivan.32.title: "Mercaderes de las rutas del oeste"
 gj_kaivan.32.desc: "Una caravana de mercaderes de las tierras del oeste pide permiso para cruzar la estepa con telas, sal y herramientas. Prometen pagar y hablar bien de nosotros donde van. Los clanes del paso quieren saber si es buena idea o simple debilidad."
 gj_kaivan.32.a: "Concederles paso libre"
 gj_kaivan.32.b: "Cobrarles un peaje de dos manos"
 gj_kaivan.32.c: "Rechazar la petición: la estepa no es un camino"
 gj_kaivan.33.title: "El cometa de los Nueve"
 gj_kaivan.33.desc: "Una estrella con cola ha cruzado el cielo sobre el campamento. Los más viejos cuentan nueve rayos en su cola, uno por cada fuego. Los guerreros no hablan de otra cosa. ¿Es buen presagio, o aviso?"
 gj_kaivan.33.a: "Leer en él una promesa para los nueve fuegos"
 gj_kaivan.33.b: "Callar el presagio: el cielo no manda en el kan"
 gj_kaivan.34.title: "El herrero errante"
 gj_kaivan.34.desc: "Un herrero que viaja en un carro se ofrece a quedarse un invierno. Dice que sabe templar el hierro como nadie y que ha visto cosas en ciudades que nosotros solo conocemos de oídas. Quiere oro y que no le hagan preguntas."
 gj_kaivan.34.a: "Contratarlo y pedirle que enseñe a los herreros"
 gj_kaivan.34.b: "Darle comida y dejarlo seguir su camino"
 gj_kaivan.35.title: "La hija del kan"
 gj_kaivan.35.desc: "La hija del kan ha crecido y cada clan habla de ella como se habla de una tierra buena. Hay quien quiere casarla con un jefe de los valles, y quien prefiere dársela a un señor de fuera para sellar una paz. Ella dice que cabalga mejor que todos."
 gj_kaivan.35.a: "Casarla con el jefe Ilbari"
 gj_kaivan.35.b: "Casarla con un señor de más allá de la estepa"
 gj_kaivan.35.c: "Casarla con un Uzhar y dejarla en la corte"
 gj_kaivan.36.title: "El corral de piedra"
 gj_kaivan.36.desc: "Un clan pide permiso para construir corrales de piedra y quedarse el invierno junto al río. Los viejos dicen que quien se queda ya no es de la estepa. Los jóvenes dicen que los inviernos negros ya no perdonan."
 gj_kaivan.36.a: "Permitirlo: nacerán aldeas en la estepa"
 gj_kaivan.36.b: "Prohibirlo: el clan se mueve o se pierde"
 gj_kaivan.37.title: "Un lobo blanco en el campamento"
 gj_kaivan.37.desc: "Un lobo blanco ha entrado en el campamento al amanecer y se ha sentado junto al fuego. Nadie se atreve a tocarlo. Los jinetes lobo dicen que es la señal que esperaban, y los demás murmuran que trae mala suerte."
 gj_kaivan.37.a: "Aceptarlo como presagio y recibir a los jinetes"
 gj_kaivan.37.b: "Cazarlo: el campamento no es un cubil"
 gj_kaivan.38.title: "La marca arde"
 gj_kaivan.38.desc: "Unos bandoleros han cruzado la frontera del oeste y han quemado tres campamentos. Los Tarkhen piden permiso para perseguirlos. Los que sobrevivieron lloran, y los que no, ya no."
 gj_kaivan.38.a: "Dar a los Tarkhen carta blanca y caballos"
 gj_kaivan.38.b: "Dejar que se defiendan solos"
 gj_kaivan.39.title: "El cantor de las rutas"
 gj_kaivan.39.desc: "Un cantor que ha recorrido todos los fuegos de la estepa pide un lugar junto al kan. Sus canciones cuentan cómo cada clan conquistó su pasto, y las cuentan de forma que cada clan se siente el mejor."
 gj_kaivan.39.a: "Darle un lugar de honor en la corte"
 gj_kaivan.39.b: "Escucharlo una noche y despedirlo"
 gj_kaivan.40.title: "Los Nueve Fuegos"
 gj_kaivan.40.desc: "Es la noche de los Nueve Fuegos: cada clan enciende su hoguera y la lleva hasta el Fuego Común. El Círculo celebra el juramento y, por una noche, las rivalidades se apagan con el humo."
 gj_kaivan.40.a: "Que todos los clanes partan de la misma hoguera"
 gj_kaivan.40.b: "Organizar un gran festín para la corte"
 gj_kaivan.41.title: "El huésped del oeste"
 gj_kaivan.41.desc: "Un joven de una casa señorial de fuera ha llegado a nuestro fuego como huésped, con una escolta pequeña. Dice que su familia le ha enviado para aprender de la estepa. Quizá sea cierto, quizá sea un rehén."
 gj_kaivan.41.a: "Tratarlo como huésped y ganar su respeto"
 gj_kaivan.41.b: "Retenerlo y pedir rescate a su casa"
 gj_kaivan.42.title: "Mala hierba"
 gj_kaivan.42.desc: "Una hierba amarga ha brotado en los mejores pastos y los caballos que la comen enferman. Los pastores se preguntan si deben quemar el pasto o mover los rebaños y rezar."
 gj_kaivan.42.a: "Quemar los pastos y empezar de nuevo"
 gj_kaivan.42.b: "Mover los rebaños y rezar"
 gj_kaivan.43.title: "La carrera de los jóvenes"
 gj_kaivan.43.desc: "Cada diez años, los jóvenes de los nueve fuegos corren de un extremo a otro de la estepa con los caballos de su clan. El que llega primero gana un nombre, y los demás, una buena historia que contar."
 gj_kaivan.43.a: "Financiar la carrera con premios generosos"
 gj_kaivan.43.b: "Dejar que corran sin premios, por el honor"
 gj_kaivan.44.title: "Los exploradores del norte blanco"
 gj_kaivan.44.desc: "Un grupo de exploradores ha vuelto del norte, más allá de donde se acaba la hierba. Traen pieles raras, ojos hundidos y una historia que nadie cree del todo: dicen que el hielo se mueve de noche y que algo vive en él."
 gj_kaivan.44.a: "Premiarles y enviar otra expedición"
 gj_kaivan.44.b: "Que nadie vuelva a hablar de eso"
 gj_kaivan.45.title: "La batalla de la hierba"
 gj_kaivan.45.desc: "Los Uzhar y los Merghan se disputan un pasto junto al río. No ha corrido la sangre, pero hay arcos tensados. Ambos piden al kan que decida a quién pertenece, y ambos recordarán la sentencia."
 gj_kaivan.45.a: "Dar la razón a los Uzhar"
 gj_kaivan.45.b: "Dar la razón a los Merghan"
 gj_kaivan.45.c: "Dividir el pasto entre los dos, aunque nadie quede contento"
 gj_kaivan.46.title: "Fiebre en los campamentos"
 gj_kaivan.46.desc: "La fiebre ha entrado en los campamentos del este y no distingue entre guerreros y niños. Los curanderos piden mover las tiendas lejos del río. Los jefes no quieren perder el pasto bueno."
 gj_kaivan.46.a: "Mover los campamentos y pagar a los curanderos"
 gj_kaivan.46.b: "Aguantar: la fiebre se irá con el calor"
 gj_kaivan.47.title: "La promesa en la tumba del primer kan"
 gj_kaivan.47.desc: "En un cerro sin nombre reposa el primer kan, al que enterraron con su caballo y sus nueve flechas. Los jefes de todos los clanes suben al cerro una vez por generación para renovar su promesa. Este año nos toca a nosotros dirigir la ceremonia."
 gj_kaivan.47.a: "Dirigir la ceremonia con grandes ofrendas"
 gj_kaivan.47.b: "Hacerlo sencillo, como se hacía antes"
 gj_kaivan.48.title: "La hierba no vuelve"
 gj_kaivan.48.desc: "Han pasado diez años desde la Gran Cabalgada. Los caballos están gordos, pero los pastos de las llanuras donde cabalgamos han quedado pelados. Los pastores dicen que hace falta un largo descanso."
 gj_kaivan.48.a: "Dejar descansar el pasto"
 gj_kaivan_heraldos_del_circulo: "Los Heraldos del Círculo"
 gj_kaivan_heraldos_del_circulo_desc: "Un jinete con la cinta de su clan cruza la estepa anunciando que el Círculo se reúne. Donde llega, los fuegos se apagan para escuchar."
 gj_kaivan_jueces_de_la_hierba: "Los Jueces de la Hierba"
 gj_kaivan_jueces_de_la_hierba_desc: "Los pleitos de pasto ya no se resuelven con lanzas: los ancianos de cada clan se sientan sobre la hierba y no se levantan hasta ponerse de acuerdo."
