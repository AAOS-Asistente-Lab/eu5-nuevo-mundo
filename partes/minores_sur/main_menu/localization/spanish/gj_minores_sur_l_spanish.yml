l_spanish:
 # ===== Culturas, lenguas y familias =====
 gj_brazalmi: "Brazalmí"
 gj_brazalmi_desc: "La gente de las Siete Rampas, ciudad de pregones y cuentas. Aquí se cuenta antes de rezar, se pesa antes de creer y se pregona antes de firmar. Cada familia guarda en casa su propia balanza."
 gj_ondani: "Ondaní"
 gj_ondani_desc: "Cantores de arrecife. Sus ciudades flotan sobre bancos de coral y se fían de las mareas más que de los reyes. Cada ola trae una canción, y cada canción, una noticia."
 gj_halcori: "Halcorí"
 gj_halcori_desc: "Pueblo de cabo y de acantilado. En cada risco hay una atalaya y en cada atalaya una hoguera preparada. Dicen que un halcorí duerme con un ojo en el mar."
 gj_tirnauki: "Tirnauki"
 gj_tirnauki_desc: "Pueblo de las terrazas menores. Cuelgan los huertos de la ladera, suben el agua a mano y rezan al sol por turnos, para que nunca se quede el cielo sin vigilante."
 gj_sotolari: "Sotolarí"
 gj_sotolari_desc: "Gente de la marca del bosque, parientes pobres y tercos de los longevos. Viven poco, pero se acuerdan de todo, y su memoria corta más que sus espadas."
 gj_yorumbi: "Yorumbí"
 gj_yorumbi_desc: "Pueblos del gran río. Se cuentan por orillas y por vados, no por tierras, y miden la edad de un hombre en crecidas."
 gj_pakhuni: "Pakhuní"
 gj_pakhuni_desc: "Clanes de la selva alta, de ceniza y de tinte. Cada abuelo es un fuego que no se apaga, y los jóvenes lo alimentan con sus nombres."
 gj_brazalmi_language: "Brazalmí antiguo"
 gj_brazalmi_dialect: "Brazalmí"
 gj_ondani_language: "Ondaní antiguo"
 gj_ondani_dialect: "Ondaní"
 gj_halcori_language: "Halcorí antiguo"
 gj_halcori_dialect: "Halcorí"
 gj_tirnauki_language: "Tirnauki antiguo"
 gj_tirnauki_dialect: "Tirnauki"
 gj_sotolari_language: "Sotolarí antiguo"
 gj_sotolari_dialect: "Sotolarí"
 gj_yorumbi_language: "Yorumbí antiguo"
 gj_yorumbi_dialect: "Yorumbí"
 gj_pakhuni_language: "Pakhuní antiguo"
 gj_pakhuni_dialect: "Pakhuní"
 gj_minores_sur_familia_puerto: "Lenguas de rada"
 gj_minores_sur_familia_marca: "Lenguas de frontera"
 gj_minores_sur_familia_selva: "Lenguas del río y la selva"

 # ===== Avances de cultura =====
 gj_brazalmi_pregon_de_la_rada: "Pregón de la rada"
 gj_brazalmi_pregon_de_la_rada_desc: "Cada mañana un pregonero recita los precios del día desde el tercer escalón. Quien compra en Brazalmar sabe lo que paga, y quien vende, lo que gana."
 gj_brazalmi_libro_de_cuentas_abierto: "Libro de cuentas abierto"
 gj_brazalmi_libro_de_cuentas_abierto_desc: "Las deudas de la ciudad se anotan en un libro que cualquiera puede consultar. Fiarse de la ciudad sale barato, porque nadie se la juega a ciegas."
 gj_brazalmi_pabellon_franco: "Pabellón franco"
 gj_brazalmi_pabellon_franco_desc: "Una bandera blanca con siete rayas garantiza un trato justo en cualquier muelle. Los demás puertos la respetan porque les conviene."
 gj_ondani_canto_de_la_concha: "Canto de la concha"
 gj_ondani_canto_de_la_concha_desc: "Los buzos entonan una cuerda de notas que les marca cuánto aire queda. Con ella bajan más hondo, y suben más perlas."
 gj_ondani_jardines_de_coral: "Jardines de coral"
 gj_ondani_jardines_de_coral_desc: "Se plantan fragmentos de arrecife como quien siembra, y los bancos crecen a la medida de los barcos. Entre las ramas aparecen gemas que nadie había visto."
 gj_ondani_mareas_regladas: "Mareas regladas"
 gj_ondani_mareas_regladas_desc: "Tablas de mareas grabadas en concha para cada cala de la costa. Los barcos ondaníes salen cuando el mar lo pide y vuelven a casa sin averías."
 gj_halcori_faros_de_alarma: "Faros de alarma"
 gj_halcori_faros_de_alarma_desc: "Una cadena de hogueras recorre el cabo, de risco en risco. Antes de que un barco enemigo toque tierra, media costa ya está armada."
 gj_halcori_cadenas_de_la_bahia: "Cadenas de la bahía"
 gj_halcori_cadenas_de_la_bahia_desc: "Cadenas de hierro negro cierran la boca de cada bahía. Los barcos ligeros de los halcoríes rondan tras ellas y nadie entra sin permiso."
 gj_halcori_ronda_del_cabo: "Ronda del cabo"
 gj_halcori_ronda_del_cabo_desc: "Una escuadra pequeña y constante patrulla el litoral. Los piratas aprenden pronto qué costa conviene evitar."
 gj_tirnauki_escalones_del_sol: "Escalones del sol"
 gj_tirnauki_escalones_del_sol_desc: "Cada ladera tiene sus peldaños de piedra y cada peldaño su huerto. Cabe más gente en la montaña, y come mejor."
 gj_tirnauki_cantera_sagrada: "Cantera sagrada"
 gj_tirnauki_cantera_sagrada_desc: "La piedra se extrae en procesión y se corta rezando. Lo que sale de la cantera sagrada vale más en el mercado que cualquier otra losa."
 gj_tirnauki_voz_del_santuario: "Voz del santuario"
 gj_tirnauki_voz_del_santuario_desc: "El santuario decide el calendario y, con el calendario, casi todo lo demás. La obediencia se cobra en devoción, y la devoción abarata la paz."
 gj_sotolari_sendas_del_umbral: "Sendas del umbral"
 gj_sotolari_sendas_del_umbral_desc: "Los sotolaríes conocen cada atajo de la marca. Sus ejércitos pierden menos hombres entre zarzas y nieblas, y su caza no se acaba."
 gj_sotolari_cercas_vivas: "Cercas vivas"
 gj_sotolari_cercas_vivas_desc: "Setos de espino y haya trenzados durante generaciones sustituyen a las murallas de piedra. Cuestan poco, se curan solos y paran carros mejor que un foso."
 gj_sotolari_pacto_del_claro: "Pacto del claro"
 gj_sotolari_pacto_del_claro_desc: "Las familias de la marca firman, bajo el roble viejo, que nadie dividirá lo que se juró unido. Menos rebeldes, más honra."
 gj_yorumbi_balsas_del_gran_rio: "Balsas del gran río"
 gj_yorumbi_balsas_del_gran_rio_desc: "Troncos atados con liana y cargados hasta la borda. El río es camino, mercado y despensa a la vez."
 gj_yorumbi_tambores_de_crecida: "Tambores de crecida"
 gj_yorumbi_tambores_de_crecida_desc: "Cuando suena el tambor río arriba, se sabe que el agua llega en tres días. Se siembra la vega a tiempo y la cosecha crece sola."
 gj_yorumbi_consejo_de_las_orillas: "Consejo de las orillas"
 gj_yorumbi_consejo_de_las_orillas_desc: "Cada orilla manda un anciano a la balsa grande, y allí se decide, remando, lo que importa. Cuesta tiempo, pero los acuerdos se cumplen."
 gj_pakhuni_cazadores_del_dosel: "Cazadores del dosel"
 gj_pakhuni_cazadores_del_dosel_desc: "Cazan desde las copas y se mueven sin pisar el suelo. La selva alta alimenta a los clanes y se vuelve un laberinto para el forastero."
 gj_pakhuni_tinte_de_ceniza: "Tinte de ceniza"
 gj_pakhuni_tinte_de_ceniza_desc: "Con ceniza de nogal y resina de la selva se obtienen tintes que ningún otro pueblo sabe fijar. Los mercaderes los pagan al peso."
 gj_pakhuni_voz_de_los_ancianos: "Voz de los ancianos"
 gj_pakhuni_voz_de_los_ancianos_desc: "Los más viejos hablan primero, y los jóvenes callan hasta el segundo fuego. Los clanes que se escuchan van a la guerra juntos."

 # ===== Avances compartidos por estilo =====
 gj_minores_sur_concejo_de_gremios: "Concejo de gremios"
 gj_minores_sur_concejo_de_gremios_desc: "Los oficios se sientan a la misma mesa que los capitanes. Más producción y más peso de los burgueses, a cambio de menos sorpresas."
 gj_minores_sur_muelles_francos: "Muelles francos"
 gj_minores_sur_muelles_francos_desc: "Los muelles quedan libres de tasas para quien venga de buena fe. Las mercancías entran y salen sin demoras."
 gj_minores_sur_senderos_de_selva: "Senderos de selva"
 gj_minores_sur_senderos_de_selva_desc: "Los clanes abren caminos entre los claros y los mantienen limpios. Lo que antes era maleza ahora es cultivo y despensa."
 gj_minores_sur_ritos_de_cosecha_menor: "Ritos de cosecha menor"
 gj_minores_sur_ritos_de_cosecha_menor_desc: "Ni una pieza se pierde: la primera se ofrece, la segunda se comparte y la tercera se guarda. Se come menos, y se produce más."
 gj_minores_sur_palabra_de_vasallo: "Palabra de vasallo"
 gj_minores_sur_palabra_de_vasallo_desc: "El señor lejano confía en quien nunca le ha fallado. La lealtad bien conocida da estabilidad en casa y tolerancia fuera."
 gj_minores_sur_baluartes_de_frontera: "Baluartes de frontera"
 gj_minores_sur_baluartes_de_frontera_desc: "Los pasos y los vados se cierran con muros bajos y anchos. Se mantienen con pocas manos y detienen a muchos."

 # ===== Edificios, unidades y cupos =====
 gj_minores_sur_lonja_del_concejo: "Lonja del Concejo"
 gj_minores_sur_lonja_del_concejo_desc: "La mesa donde se fija el precio de la rada. Más capacidad y fuerza de mercader. Solo en puertos, gasta papel y mampostería y mete bulla en las calles. Con cada era admite un nivel más, hasta tres."
 gj_minores_sur_palafito_mayor: "Palafito Mayor"
 gj_minores_sur_palafito_mayor_desc: "La casa larga sobre pilotes donde caben varios clanes. Más comida y más levas, menos letras. Solo donde hay caza, fruta, madera o pesca. Con cada era admite un nivel más, hasta tres."
 gj_minores_sur_torre_de_frontera: "Torre de Frontera"
 gj_minores_sur_torre_de_frontera_desc: "Atalaya con cuartel que ve venir al vecino. Aumenta la defensa y la guarnición, pero no produce nada. Solo en puertos, colinas o montaña. Con cada era admite un nivel más, hasta tres."
 gj_minores_sur_lonja_mantenimiento: "Mantenimiento de la Lonja"
 gj_minores_sur_palafito_mantenimiento: "Mantenimiento del Palafito"
 gj_minores_sur_torre_mantenimiento: "Mantenimiento de la Torre"
 GJ_MINORES_SUR_NIVELES_LONJA: "Niveles de la Lonja del Concejo"
 GJ_MINORES_SUR_NIVELES_PALAFITO: "Niveles del Palafito Mayor"
 GJ_MINORES_SUR_NIVELES_TORRE: "Niveles de la Torre de Frontera"
 gj_minores_sur_guardias: "Guardias del Muelle"
 gj_minores_sur_lanceros: "Lanceros del Vado"
 gj_minores_sur_jinetes: "Jinetes de Frontera"
 a_gj_minores_sur_guardia_1: "Guardia del Muelle"
 a_gj_minores_sur_guardia_1_desc: "Hombres de la rada con arpón largo y escudo de remo. Aguantan en la costa y en el río; tierra adentro pierden pie. Lentos, y matan menos de lo que resisten."
 a_gj_minores_sur_guardia_2: "Alabarderos de la Rada"
 a_gj_minores_sur_guardia_2_desc: "La guardia de los muelles, con alabarda y coraza de cuero hervido. Defensivos y lentos; fuertes junto al agua, flojos lejos de ella."
 a_gj_minores_sur_guardia_3: "Guardia del Concejo"
 a_gj_minores_sur_guardia_3_desc: "Cuerpo pagado por el Concejo, de picas y primeros arcabuces. Aguanta el choque en el puerto; en campo abierto, se desordena."
 a_gj_minores_sur_guardia_4: "Fusileros de la Rada"
 a_gj_minores_sur_guardia_4_desc: "Fusileros que disparan desde el muelle y las calles. Resisten tras muros y bordas; en tierra adentro no tienen quien los apoye."
 a_gj_minores_sur_guardia_5: "Granaderos del Puerto"
 a_gj_minores_sur_guardia_5_desc: "Infantería de línea de la ciudad franca. Disciplinados, defensivos y siempre cerca del agua."
 a_gj_minores_sur_guardia_6: "Milicia del Muelle Franco"
 a_gj_minores_sur_guardia_6_desc: "Milicia moderna que defiende el puerto y sus almacenes. Muy buena en la costa, escasa lejos de ella."
 a_gj_minores_sur_lancero_1: "Lancero del Vado"
 a_gj_minores_sur_lancero_1_desc: "Hombres de río con lanza de punta de hueso. Golpean fuerte y rápido en selva, humedal y orilla, pero se rompen antes y en llano no valen nada."
 a_gj_minores_sur_lancero_2: "Lanceros del Dosel"
 a_gj_minores_sur_lancero_2_desc: "Cazadores del dosel con lanza larga y red. Ágiles en la selva y en el río; frágiles a campo abierto."
 a_gj_minores_sur_lancero_3: "Tiradores de Cerbatana"
 a_gj_minores_sur_lancero_3_desc: "Dardos untados de resina y arcabuces de caza. Pegan fuerte desde la espesura y mueren pronto si les cargan en llano."
 a_gj_minores_sur_lancero_4: "Arcabuceros del Vado"
 a_gj_minores_sur_lancero_4_desc: "Escopetas de largo cañón que se apoyan en un tronco. Letales en la maleza; indefensos fuera de ella."
 a_gj_minores_sur_lancero_5: "Fusileros de la Orilla"
 a_gj_minores_sur_lancero_5_desc: "Infantería ligera de línea que combate de orilla en orilla. Muy buena en selva, mala en llano."
 a_gj_minores_sur_lancero_6: "Guerrilleros del Gran Río"
 a_gj_minores_sur_lancero_6_desc: "Fusileros del río que conocen cada meandro. Pegan duro desde la espesura y se esfuman en terreno abierto."
 a_gj_minores_sur_jinete_1: "Jinete de Frontera"
 a_gj_minores_sur_jinete_1_desc: "Jinete de pony montañés, rápido en colina y bosque. Nervioso en la refriega y torpe en el llano."
 a_gj_minores_sur_jinete_2: "Batidores de Marca"
 a_gj_minores_sur_jinete_2_desc: "Exploradores a caballo que conocen cada paso. Rápidos y buenos en terreno quebrado; débiles en la llanura."
 a_gj_minores_sur_jinete_3: "Jinetes del Cabo"
 a_gj_minores_sur_jinete_3_desc: "Caballería de costa que patrulla acantilados y senderos. Dañan más en colina; ceden en llano."
 a_gj_minores_sur_jinete_4: "Dragones de Frontera"
 a_gj_minores_sur_jinete_4_desc: "Jinetes con pistola que combaten a pie y a caballo. Rápidos en terreno difícil, inquietos si se les carga."
 a_gj_minores_sur_jinete_5: "Húsares de Marca"
 a_gj_minores_sur_jinete_5_desc: "Caballería ligera de marca, con sable curvo y capa corta. Velocísimos en colina; poco fiables en llanura."
 a_gj_minores_sur_jinete_6: "Lanceros de la Marca"
 a_gj_minores_sur_jinete_6_desc: "Lanceros montados que cubren los pasos. Excelentes en terreno quebrado, malos en campo abierto."


 # ===== Decisiones =====
 gj_minores_sur_abrir_la_lonja.title: "Abrir la Lonja a los forasteros"
 gj_minores_sur_abrir_la_lonja.desc: "Si se abren las puertas de la Lonja a mercaderes de otras costas, la ciudad gana en pregones y en tasas. Pero hay que pagar la hospitalidad."
 gj_minores_sur_abrir_la_lonja.a: "Que se abran las puertas."
 gj_minores_sur_pregon_de_aranceles.title: "Pregonar los aranceles"
 gj_minores_sur_pregon_de_aranceles.desc: "El Concejo debe decidir si el puerto vive de las tasas o de las visitas. Cada pregón dura una década."
 gj_minores_sur_pregon_de_aranceles.a: "Tasas bajas: que vengan todos."
 gj_minores_sur_pregon_de_aranceles.b: "Tasas altas: quien quiera pasar, que pague."
 gj_minores_sur_convocar_la_crecida.title: "Convocar la crecida"
 gj_minores_sur_convocar_la_crecida.desc: "Se baten los tambores río arriba y se abren las compuertas de las orillas. El agua llega cargada de limo y de peces, y con ella, de sorpresas."
 gj_minores_sur_convocar_la_crecida.a: "Que suenen los tambores."
 gj_minores_sur_pacto_de_los_vados.title: "El pacto de los vados"
 gj_minores_sur_pacto_de_los_vados.desc: "Los clanes se reparten el uso de cada vado y se comprometen a no cobrar de más. Es un gesto caro de orgullo, pero el comercio fluye."
 gj_minores_sur_pacto_de_los_vados.a: "Que cada clan jure su vado."
 gj_minores_sur_renovar_el_homenaje.title: "Renovar el homenaje"
 gj_minores_sur_renovar_el_homenaje.desc: "Se envía una embajada con regalos al señor lejano. El homenaje se renueva y la corona local gana legitimidad, a costa de un poco de brillo propio."
 gj_minores_sur_renovar_el_homenaje.a: "Que parta la embajada."
 gj_minores_sur_alzar_la_atalaya.title: "Alzar una atalaya"
 gj_minores_sur_alzar_la_atalaya.desc: "Se levanta una torre de vigía en un puerto, un otero o un paso de montaña. Su hoguera se ve a leguas y los hombres de armas duermen más tranquilos."
 gj_minores_sur_alzar_la_atalaya.a: "Que se encienda la primera hoguera."

 # ===== Modificadores temporales =====
 STATIC_MODIFIER_NAME_gj_minores_sur_lonja_abierta: "Lonja abierta"
 STATIC_MODIFIER_DESC_gj_minores_sur_lonja_abierta: "Mercaderes de otras costas llenan la Lonja. Más capacidad de mercader y más tasas."
 STATIC_MODIFIER_NAME_gj_minores_sur_aranceles_bajos: "Aranceles bajos"
 STATIC_MODIFIER_DESC_gj_minores_sur_aranceles_bajos: "El puerto cobra poco y atrae a todos. Menos tasas, pero más tratos por burgués."
 STATIC_MODIFIER_NAME_gj_minores_sur_aranceles_altos: "Aranceles altos"
 STATIC_MODIFIER_DESC_gj_minores_sur_aranceles_altos: "Quien quiera descargar, paga. Más ingresos por tasas, y algunos mercaderes se van."
 STATIC_MODIFIER_NAME_gj_minores_sur_crecida_convocada: "Crecida convocada"
 STATIC_MODIFIER_DESC_gj_minores_sur_crecida_convocada: "El río ha subido a la hora que se le pidió. Más maíz y más peces."
 STATIC_MODIFIER_NAME_gj_minores_sur_pacto_de_los_vados: "Pacto de los vados"
 STATIC_MODIFIER_DESC_gj_minores_sur_pacto_de_los_vados: "Los clanes respetan los vados y los viajeros pasan sin sustos. Comercio terrestre más eficiente y menos desgaste hostil."
 STATIC_MODIFIER_NAME_gj_minores_sur_homenaje_renovado: "Homenaje renovado"
 STATIC_MODIFIER_DESC_gj_minores_sur_homenaje_renovado: "El señor lejano ha reconocido de nuevo a la corona local. Más legitimidad, menos brillo propio."
 STATIC_MODIFIER_NAME_gj_minores_sur_atalaya_encendida: "Atalaya encendida"
 STATIC_MODIFIER_DESC_gj_minores_sur_atalaya_encendida: "Una hoguera de vigía arde de noche en lo alto. Más defensa y menos desgaste para quien defiende."
 STATIC_MODIFIER_NAME_gj_minores_sur_pregon_fresco: "Pregón fresco"
 STATIC_MODIFIER_DESC_gj_minores_sur_pregon_fresco: "Las noticias de la rada llegan antes que las velas. Más alcance comercial y más tratos."
 STATIC_MODIFIER_NAME_gj_minores_sur_gran_lonja: "El año de la Gran Lonja"
 STATIC_MODIFIER_DESC_gj_minores_sur_gran_lonja: "Todas las casas de la ciudad abren sus almacenes a la vez. Un año que se recordará."
 STATIC_MODIFIER_NAME_gj_minores_sur_cuarentena: "Cuarentena del muelle"
 STATIC_MODIFIER_DESC_gj_minores_sur_cuarentena: "Los barcos esperan en la rada antes de descargar. Menos enfermedad, menos producción."
 STATIC_MODIFIER_NAME_gj_minores_sur_cisterna_nueva: "Cisterna nueva"
 STATIC_MODIFIER_DESC_gj_minores_sur_cisterna_nueva: "Un aljibe grande recoge la lluvia del barrio. Más gente cabe y enferma menos."
 STATIC_MODIFIER_NAME_gj_minores_sur_gremios_contentos: "Gremios contentos"
 STATIC_MODIFIER_DESC_gj_minores_sur_gremios_contentos: "Los oficios tienen voz y la usan bien. Más producción y más legitimidad."
 STATIC_MODIFIER_NAME_gj_minores_sur_puerto_sin_patente: "Puerto sin patente"
 STATIC_MODIFIER_DESC_gj_minores_sur_puerto_sin_patente: "Se mira hacia otro lado ante ciertos capitanes. Más tasas, menos honra."
 STATIC_MODIFIER_NAME_gj_minores_sur_limo_fertil: "Limo fértil"
 STATIC_MODIFIER_DESC_gj_minores_sur_limo_fertil: "La crecida ha dejado la vega engrasada. Más producción y más hijos."
 STATIC_MODIFIER_NAME_gj_minores_sur_remedios_de_la_orilla: "Remedios de la orilla"
 STATIC_MODIFIER_DESC_gj_minores_sur_remedios_de_la_orilla: "Las curanderas reparten hojas y cortezas. Menos enfermedad y vidas más largas."
 STATIC_MODIFIER_NAME_gj_minores_sur_ceniza_fertil: "Ceniza fértil"
 STATIC_MODIFIER_DESC_gj_minores_sur_ceniza_fertil: "Un claro quemado rinde cosechas generosas durante unos años."
 STATIC_MODIFIER_NAME_gj_minores_sur_vados_en_paz: "Vados en paz"
 STATIC_MODIFIER_DESC_gj_minores_sur_vados_en_paz: "Nadie cobra de más en los vados. Comercio terrestre más eficiente y más legitimidad."
 STATIC_MODIFIER_NAME_gj_minores_sur_festin_de_clanes: "Festín de clanes"
 STATIC_MODIFIER_DESC_gj_minores_sur_festin_de_clanes: "Los clanes comparten mesa durante días. Más prestigio y las tradiciones militares se desgastan menos."
 STATIC_MODIFIER_NAME_gj_minores_sur_juramento_renovado: "Voto de las Siete Rampas"
 STATIC_MODIFIER_DESC_gj_minores_sur_juramento_renovado: "Las casas de la marca han vuelto a jurar. Más legitimidad y menos separatismo."
 STATIC_MODIFIER_NAME_gj_minores_sur_mensajero_bien_tratado: "Mensajero bien tratado"
 STATIC_MODIFIER_DESC_gj_minores_sur_mensajero_bien_tratado: "El enviado del señor se ha ido contento y lo cuenta. Más reputación y más prestigio."
 STATIC_MODIFIER_NAME_gj_minores_sur_guarnicion_alerta: "Guarnición alerta"
 STATIC_MODIFIER_DESC_gj_minores_sur_guarnicion_alerta: "Las atalayas están cubiertas y los pasos vigilados. Más guarnición y más desgaste para el invasor."
 STATIC_MODIFIER_NAME_gj_minores_sur_ladera_amnistiada: "Ladera amnistiada"
 STATIC_MODIFIER_DESC_gj_minores_sur_ladera_amnistiada: "Los rebeldes han vuelto a casa, pero la cosecha se ha resentido. Menos separatismo y menos producción."
 STATIC_MODIFIER_NAME_gj_minores_sur_siete_rampas: "Las Siete Rampas"
 STATIC_MODIFIER_DESC_gj_minores_sur_siete_rampas: "La ciudad recuerda su origen y se enorgullece. Más prestigio y más tratos por burgués."
 STATIC_MODIFIER_NAME_gj_minores_sur_marea_alta: "Marea alta"
 STATIC_MODIFIER_DESC_gj_minores_sur_marea_alta: "El canto de la marea alta anuncia una temporada excepcional. Más perlas y mejor moral naval."
 STATIC_MODIFIER_NAME_gj_minores_sur_cadena_del_cabo: "La cadena del cabo"
 STATIC_MODIFIER_DESC_gj_minores_sur_cadena_del_cabo: "Una cadena de hierro cierra la bahía. Más eficacia de bloqueo y más defensa."
 STATIC_MODIFIER_NAME_gj_minores_sur_procesion_de_terrazas: "Procesión de las terrazas"
 STATIC_MODIFIER_DESC_gj_minores_sur_procesion_de_terrazas: "Todo el pueblo sube la ladera cantando. Más devoción y menos consumo de comida."
 STATIC_MODIFIER_NAME_gj_minores_sur_claro_del_cuervo: "El claro del cuervo"
 STATIC_MODIFIER_DESC_gj_minores_sur_claro_del_cuervo: "La marca recuerda el claro donde se juró. Menos desgaste y más caza."
 STATIC_MODIFIER_NAME_gj_minores_sur_nombre_del_rio: "El nombre del río"
 STATIC_MODIFIER_DESC_gj_minores_sur_nombre_del_rio: "Cada orilla sabe cómo la llama el vecino. Más pesca y más prestigio."
 STATIC_MODIFIER_NAME_gj_minores_sur_ceniza_de_los_abuelos: "Ceniza de los abuelos"
 STATIC_MODIFIER_DESC_gj_minores_sur_ceniza_de_los_abuelos: "Los jóvenes beben la ceniza de sus mayores y juran seguirlos. Infantería ligera más fuerte y más legitimidad."


 # ===== Eventos: ciudad =====
 gj_minores_sur.1.title: "La campana del concejo"
 gj_minores_sur.1.desc: "La campana grande suena una sola vez al año, para elegir a los que gobernarán la ciudad. Los gremios piden asiento fijo; los vecinos prefieren echarlo a suertes."
 gj_minores_sur.1.a: "Que los gremios tengan asiento."
 gj_minores_sur.1.b: "Que se sortee entre vecinos."
 gj_minores_sur.2.title: "El pregón del puerto"
 gj_minores_sur.2.desc: "Un pregonero nuevo, de voz profunda y buen oído, llena el muelle de noticias de todas las costas. Los capitanes se detienen a escucharlo, y alguno decide quedarse a comprar."
 gj_minores_sur.2.a: "Que cobre por cada noticia."
 gj_minores_sur.2.b: "Que el pregón sea libre y gratuito."
 gj_minores_sur.3.title: "Se secan los aljibes"
 gj_minores_sur.3.desc: "Tres veranos secos han vaciado las cisternas del barrio del muelle. Los vecinos hacen cola con cántaros y los capitanes empiezan a cargar agua en otros puertos."
 gj_minores_sur.3.a: "Que se excave un aljibe grande."
 gj_minores_sur.3.b: "Que cada cual se las arregle."
 gj_minores_sur.4.title: "Los capitanes sin patente"
 gj_minores_sur.4.desc: "Un grupo de capitanes sin bandera ni patente fondea en la rada y pide amarre. Dicen que pagarán bien. Nadie pregunta de dónde sale su oro."
 gj_minores_sur.4.a: "Que se les cierre el puerto y se pague una escolta."
 gj_minores_sur.4.b: "Que paguen y se queden."
 gj_minores_sur.5.title: "El año de la Gran Lonja"
 gj_minores_sur.5.desc: "Por primera vez, todas las casas de la ciudad abren a la vez sus almacenes y ponen sus mercancías en la misma plaza. Los forasteros hablan de ello durante décadas."
 gj_minores_sur.5.a: "Que dure todo el año."
 gj_minores_sur.6.title: "El muro nuevo"
 gj_minores_sur.6.desc: "Los ingenieros dicen que las viejas tapias no resistirán un cañón. El Concejo debate entre cerrar el puerto con piedra o confiar en los barcos."
 gj_minores_sur.6.a: "Levantar un muro con atalaya."
 gj_minores_sur.6.b: "Invertir en barcos, no en piedra."
 gj_minores_sur.7.title: "Sobornos en la aduana"
 gj_minores_sur.7.desc: "Un escribano de la aduana ha sido sorprendido cobrando por rebajar las tasas. Los capitanes honrados exigen castigo; los otros, discreción."
 gj_minores_sur.7.a: "Que se le juzgue en la plaza."
 gj_minores_sur.7.b: "Que reparta con el Concejo y calle."
 gj_minores_sur.8.title: "Los gremios piden voz"
 gj_minores_sur.8.desc: "Los maestros de los oficios se plantan ante el Concejo con las llaves de sus talleres. Quieren que sus votos pesen más que los de los mercaderes."
 gj_minores_sur.8.a: "Concederles un asiento."
 gj_minores_sur.8.b: "Negarse y reforzar al Concejo."
 gj_minores_sur.9.title: "Fiebres del muelle"
 gj_minores_sur.9.desc: "Los estibadores caen enfermos de una fiebre que sube con la marea. Los médicos recomiendan retener los barcos en la rada hasta que baje la temperatura."
 gj_minores_sur.9.a: "Que los barcos esperen en cuarentena."
 gj_minores_sur.9.b: "Que descarguen y que Dios reparta."
 gj_minores_sur.10.title: "Un huésped de lejos"
 gj_minores_sur.10.desc: "Un sabio de lejanas costas pide hospedaje en la ciudad. Trae libros que nadie entiende, instrumentos que nadie ha visto y ganas de enseñar."
 gj_minores_sur.10.a: "Que enseñe en la Lonja."
 gj_minores_sur.10.b: "Que lo exhiban ante los visitantes."

 # ===== Eventos: selva =====
 gj_minores_sur.11.title: "La crecida del gran río"
 gj_minores_sur.11.desc: "El agua sube más de lo habitual. Las aldeas bajas se mojan los pies y los vados desaparecen, pero la vega promete un año de limo."
 gj_minores_sur.11.a: "Dejar entrar el agua."
 gj_minores_sur.11.b: "Levantar diques a las orillas."
 gj_minores_sur.12.title: "El tambor de los vados"
 gj_minores_sur.12.desc: "Los tambores suenan de orilla a orilla, y los ancianos de cada clan acuden a la balsa grande. Hay que repartir turnos de paso para toda la estación."
 gj_minores_sur.12.a: "Que decida el consejo por turnos."
 gj_minores_sur.12.b: "Que mande el clan más fuerte."
 gj_minores_sur.13.title: "La caza de la pantera de ceniza"
 gj_minores_sur.13.desc: "Una pantera de pelaje gris ronda los poblados y se lleva a las crías. Los jóvenes piden salir de caza; los viejos aconsejan esperar a la luna."
 gj_minores_sur.13.a: "Que los jóvenes salgan ya."
 gj_minores_sur.13.b: "Que se tomen sus pieles y se vendan."
 gj_minores_sur.14.title: "La curandera de las orillas"
 gj_minores_sur.14.desc: "Una mujer de manos largas llega de río arriba con un hato de cortezas y hojas secas. Dice que cura las fiebres y que no cobra, si se le da casa."
 gj_minores_sur.14.a: "Que se le dé casa y que enseñe."
 gj_minores_sur.14.b: "Que anote sus remedios y se vaya."
 gj_minores_sur.15.title: "Fuego en el claro"
 gj_minores_sur.15.desc: "Un incendio se ha comido un claro entero. Los viejos dicen que la ceniza es buena para sembrar, y los jóvenes, que hay que apagar lo que queda."
 gj_minores_sur.15.a: "Dejar que la ceniza abone."
 gj_minores_sur.15.b: "Apagar las brasas."
 gj_minores_sur.16.title: "Dos clanes y un vado"
 gj_minores_sur.16.desc: "Dos clanes reclaman el mismo vado y se han llevado las manos a las lanzas. Los ancianos esperan que alguien se interponga antes de que corra sangre."
 gj_minores_sur.16.a: "Arbitrar con equidad."
 gj_minores_sur.16.b: "Apoyar al clan más fuerte."
 gj_minores_sur.17.title: "La balsa de los mercaderes"
 gj_minores_sur.17.desc: "Una flotilla de balsas cargadas de sal y telas llega río arriba. Los mercaderes piden paso y ofrecen pagar en moneda."
 gj_minores_sur.17.a: "Cobrar el peaje completo."
 gj_minores_sur.17.b: "Dejarlos pasar con un pacto de vados."
 gj_minores_sur.18.title: "La fiesta de los clanes"
 gj_minores_sur.18.desc: "Cada diez años, los clanes del río y de la selva se reúnen en el claro mayor. Se come, se baila y se miden fuerzas sin matarse."
 gj_minores_sur.18.a: "Que sea una fiesta grande."
 gj_minores_sur.18.b: "Que sea una fiesta modesta."
 gj_minores_sur.19.title: "Los ancianos recuerdan"
 gj_minores_sur.19.desc: "Una noche, junto al fuego, el más viejo de los clanes cuenta cómo se abrieron los primeros caminos. Los jóvenes escuchan, y algunos copian los trazos en cortezas."
 gj_minores_sur.19.a: "Que se guarde en cortezas."
 gj_minores_sur.19.b: "Que se cuente en la plaza."
 gj_minores_sur.20.title: "La crecida convocada"
 gj_minores_sur.20.desc: "Los tambores han hecho su trabajo: el río sube exactamente cuando se le pidió. Las orillas se cubren de limo y los peces saltan en las vegas."
 gj_minores_sur.20.a: "Sembrar sin tardar."
 gj_minores_sur.20.b: "Vender el exceso de pescado."

 # ===== Eventos: marca =====
 gj_minores_sur.21.title: "El tributo de la cosecha"
 gj_minores_sur.21.desc: "El recaudador del señor llega con su carro vacío y su lista llena. La cosecha no ha sido buena, pero la lealtad se paga en grano."
 gj_minores_sur.21.a: "Pagar entero y con una sonrisa."
 gj_minores_sur.21.b: "Pagar a medias y pedir disculpas."
 gj_minores_sur.22.title: "El mensajero del señor"
 gj_minores_sur.22.desc: "Un mensajero llega a caballo con el sello del señor lejano. Trae una carta, ganas de comer y ojos para contar lo que ve."
 gj_minores_sur.22.a: "Agasajarlo con generosidad."
 gj_minores_sur.22.b: "Recibirlo con sobriedad."
 gj_minores_sur.23.title: "La atalaya sin relevo"
 gj_minores_sur.23.desc: "La guardia de la atalaya del paso lleva tres semanas sin relevo. El jefe de la torre escribe que ya no queda leña ni paciencia."
 gj_minores_sur.23.a: "Mandar relevo y provisiones."
 gj_minores_sur.23.b: "Que aguanten, que son duros."
 gj_minores_sur.24.title: "Bodas de frontera"
 gj_minores_sur.24.desc: "Una hija de la casa principal se casa con el heredero de una casa vecina. Las dos orillas del paso se reúnen a celebrarlo y a vigilarse."
 gj_minores_sur.24.a: "Una boda con toda la pompa."
 gj_minores_sur.24.b: "Una boda pequeña, y que se ahorre la dote."
 gj_minores_sur.25.title: "El paso en la niebla"
 gj_minores_sur.25.desc: "Una niebla espesa cubre el paso durante dos semanas. Los carros se pierden, los pastores se extravían y los guardias oyen pasos que no ven."
 gj_minores_sur.25.a: "Mandar batidores a guiar a los viajeros."
 gj_minores_sur.25.b: "Cerrar el paso hasta que levante."
 gj_minores_sur.26.title: "Ladrones de ganado"
 gj_minores_sur.26.desc: "Una banda de cuatreros cruza la frontera cada luna nueva y se lleva las reses de los pastores. La gente exige que alguien haga algo."
 gj_minores_sur.26.a: "Mandar una patrulla armada."
 gj_minores_sur.26.b: "Dejar que los pastores se arreglen."
 gj_minores_sur.27.title: "El juramento renovado"
 gj_minores_sur.27.desc: "Se reúnen las casas de la marca bajo el roble viejo. Cada una jura de nuevo lealtad a la corona y a las demás. Quien rompa el juramento arderá en la memoria de todos."
 gj_minores_sur.27.a: "Que el juramento quede grabado."
 gj_minores_sur.28.title: "El cartógrafo del señor"
 gj_minores_sur.28.desc: "Un cartógrafo enviado por el señor lejano recorre la marca midiendo y anotando. Al marchar, deja copias de sus mapas y algunos instrumentos."
 gj_minores_sur.28.a: "Quedarse con los instrumentos."
 gj_minores_sur.28.b: "Quedarse con los mapas y presumir."
 gj_minores_sur.29.title: "Rebeldes en la ladera"
 gj_minores_sur.29.desc: "Un grupo de campesinos se ha atrincherado en una ladera y se niega a pagar tasas. No son muchos, pero son tercos."
 gj_minores_sur.29.a: "Ofrecer amnistía."
 gj_minores_sur.29.b: "Enviar a la guarnición."
 gj_minores_sur.30.title: "La hora de la independencia"
 gj_minores_sur.30.desc: "El heredero del señor lejano está enfermo y la sucesión es incierta. Algunos nobles de la marca susurran que es el momento de cortar lazos."
 gj_minores_sur.30.a: "Mantener la palabra dada."
 gj_minores_sur.30.b: "Armar discretamente a la gente."

 # ===== Eventos de cultura =====
 gj_minores_sur.31.title: "Las Siete Rampas"
 gj_minores_sur.31.desc: "Cada año, en el día del primer pregón, los brazalmíes suben las siete rampas de la ciudad cantando las cuentas de sus abuelos. Quien llega arriba sin equivocarse es honrado en la plaza."
 gj_minores_sur.31.a: "Que sea fiesta mayor."
 gj_minores_sur.31.b: "Que cada casa pague su tasa de rampa."
 gj_minores_sur.32.title: "El canto de la marea alta"
 gj_minores_sur.32.desc: "En la noche más alta del año, los ondaníes cantan juntos desde las cubiertas de sus barcos. Dicen que el arrecife les responde y que ese año las perlas serán gordas."
 gj_minores_sur.32.a: "Que se cante sin descanso."
 gj_minores_sur.32.b: "Que se venda lo cosechado."
 gj_minores_sur.33.title: "La cadena del cabo"
 gj_minores_sur.33.desc: "Los halcoríes cuentan que una cadena de hierro negro cierra desde siempre la boca de la bahía. Esta vez se plantea forjar una nueva y hacerla más larga."
 gj_minores_sur.33.a: "Que se forje la nueva cadena."
 gj_minores_sur.33.b: "Que baste con la vieja."
 gj_minores_sur.34.title: "La procesión de las terrazas"
 gj_minores_sur.34.desc: "El día del solsticio, todo el pueblo tirnauki sube cantando por los peldaños de la ladera. Quien llega arriba antes del amanecer recibe la bendición del santuario."
 gj_minores_sur.34.a: "Que suba el pueblo entero."
 gj_minores_sur.34.b: "Que suba solo el santuario."
 gj_minores_sur.35.title: "El claro del cuervo"
 gj_minores_sur.35.desc: "Cada otoño, los sotolaríes recuerdan el claro donde se firmó el primer pacto. Cuelgan cintas negras de las ramas y comen en silencio."
 gj_minores_sur.35.a: "Que sea día de memoria."
 gj_minores_sur.35.b: "Que sea día de armas."
 gj_minores_sur.36.title: "El nombre del río"
 gj_minores_sur.36.desc: "Cada orilla llama al gran río de forma distinta. Los ancianos se reúnen para decidir un nombre común, y los discursos duran hasta el amanecer."
 gj_minores_sur.36.a: "Que se acepte el nombre más antiguo."
 gj_minores_sur.36.b: "Que se inscriban todos los nombres."
 gj_minores_sur.37.title: "La ceniza de los abuelos"
 gj_minores_sur.37.desc: "Cuando muere un abuelo, los pakhuníes queman su cuerpo y reparten la ceniza entre los nietos. Quien la bebe jura honrar su nombre en la próxima guerra."
 gj_minores_sur.37.a: "Que se jure ante todos."
 gj_minores_sur.37.b: "Que se jure en silencio."
