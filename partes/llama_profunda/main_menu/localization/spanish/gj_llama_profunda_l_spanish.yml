l_spanish:
 # ---------- La religión ----------
 gj_llama_profunda: "Llama Profunda"
 gj_llama_profunda_ADJ: "de la Llama Profunda"
 gj_llama_profunda_desc: "Los enanos de las montañas creen que el mundo es una forja enfriada. Bajo la piedra arde todavía la Brasa Madre, el fuego con el que se hizo lo primero, y cada mina es una grieta por la que se asoma. Sus sacerdotes, los Guardabrasas, no rezan: velan. Mantienen limpia la llama con trabajo honrado, con ritos y con galerías bien selladas, y temen más a quien la ensucia que a quien la apaga.\n\nLa #Y Pureza#! de la Llama sube con los ritos y con el oficio bien hecho, y baja con el hierro mal templado, con el oro fácil y, sobre todo, con los pactos con lo que duerme abajo."

 # ---------- Dioses ----------
 gj_llama_orgad_god: "Orgad, el Yunque Primero"
 gj_llama_orgad_god_desc: "Orgad es el primer yunque, el que recibió el primer golpe. Se le reza con las manos, y su favor no se mide en milagros sino en piezas que no se rompen."
 gj_llama_thurn_god: "Thurn, el Centinela de Piedra"
 gj_llama_thurn_god_desc: "Thurn es el muro que no se queja. Los enanos le deben las puertas que nadie ha forzado, y le dedican la última piedra de cada fortaleza."
 gj_llama_veshka_god: "Veshka, la Madre Hondura"
 gj_llama_veshka_god_desc: "Veshka cuida la poca tierra de cultivo que da la montaña y enseña a hacer mucho con poco. Es la diosa de los hongos de cueva, de los deshielos y de la paciencia."
 gj_llama_ildra_god: "Ildra, la Brasa Callada"
 gj_llama_ildra_god_desc: "Ildra es el fuego que no se ve, el que late dentro de la roca. Los Guardabrasas dicen que cuando una Casa de Fuego está en paz, es porque Ildra duerme tranquila."
 gj_llama_maruk_god: "Maruk, el Cantero"
 gj_llama_maruk_god_desc: "Maruk mide dos veces y corta una. Patrón de los canteros y de los maestros de obra, bendice las galerías que no se hunden y los salones que aguantan siglos."
 gj_llama_zhurgan_god: "Zhurgan, la Brasa Mayor"
 gj_llama_zhurgan_god_desc: "El dragón de la caldera, sentado en el panteón por una década cada vez. Su aliento templa cañones y moral como nada, pero la Llama se ensucia con cada año que dura el trato, y cada diez años cobra su diezmo."

 # ---------- Aspectos ----------
 gj_llama_aspecto_yunque_vivo: "El Yunque Vivo"
 gj_llama_aspecto_yunque_vivo_desc: "El metal es la oración que se puede tocar. Quien forja bien reza bien."
 gj_llama_aspecto_vigilia_brasa: "La Vigilia de la Brasa"
 gj_llama_aspecto_vigilia_brasa_desc: "Alguien tiene que velar la llama para que no se apague. Turnos de guardia, ritos de relevo y un clero que no duerme del todo."
 gj_llama_aspecto_pacto_piedra: "El Pacto de Piedra"
 gj_llama_aspecto_pacto_piedra_desc: "La montaña es un templo y se defiende como tal. Cada paso estrecho es un altar."
 gj_llama_aspecto_culto_fondo: "El Culto del Fondo"
 gj_llama_aspecto_culto_fondo_desc: "Lo que hay más abajo es de quien se atreva. Rinde en gemas y en prestigio, pero mancha la Llama con cada galería abierta sin rito."

 # ---------- Lugares sagrados ----------
 gj_llama_pozo_de_la_llama: "Pozo de la Llama"
 gj_llama_pozo_de_la_llama_desc: "Una sima abierta hasta donde se ve el resplandor del fuego de abajo. Se peregrina a mirarlo, y nadie lo mira sin bajar la voz."
 gj_llama_forja_eterna: "Forja Eterna"
 gj_llama_forja_eterna_desc: "Una forja que lleva siglos sin apagarse. El hierro que sale de ella se vende como reliquia, y no sin razón."

 # ---------- Modificadores ----------
 STATIC_MODIFIER_NAME_gj_llama_rito_brasa: "Resplandor del Rito de la Brasa"
 STATIC_MODIFIER_DESC_gj_llama_rito_brasa: "Los Guardabrasas han avivado la llama y todo el reino lo nota en las forjas."
 STATIC_MODIFIER_NAME_gj_llama_vigilia_fondo: "Vigilia del Fondo"
 STATIC_MODIFIER_DESC_gj_llama_vigilia_fondo: "Se han cerrado galerías con ritos. Hay menos producción y más calma."
 STATIC_MODIFIER_NAME_gj_llama_forja_bendita: "Forja bendecida"
 STATIC_MODIFIER_DESC_gj_llama_forja_bendita: "La Brasa ha tocado nuestras forjas y el hierro sale mejor que nunca."
 STATIC_MODIFIER_NAME_gj_llama_ceniza_fria: "Ceniza fría"
 STATIC_MODIFIER_DESC_gj_llama_ceniza_fria: "Los Guardabrasas dudan y la gente deja de ir a la forja común."
 STATIC_MODIFIER_NAME_gj_llama_voz_brasa: "La Voz de la Brasa"
 STATIC_MODIFIER_DESC_gj_llama_voz_brasa: "Las visiones de las Casas de Fuego dan luz a nuestro gobierno."
 STATIC_MODIFIER_NAME_gj_llama_chispa_de_abajo: "Chispa de abajo"
 STATIC_MODIFIER_DESC_gj_llama_chispa_de_abajo: "Los Guardabrasas leyeron el presagio del cielo como una chispa del fuego de abajo."
 STATIC_MODIFIER_NAME_gj_llama_dragon_rencor: "Rencor de la Brasa Mayor"
 STATIC_MODIFIER_DESC_gj_llama_dragon_rencor: "Rompimos el pacto con el dragón. No lo ha olvidado, y los nuestros lo notan en el aire."
 STATIC_MODIFIER_NAME_gj_llama_dragon_pacto_cumplido: "Pacto cumplido con el Ala"
 STATIC_MODIFIER_DESC_gj_llama_dragon_pacto_cumplido: "Pagamos el diezmo y el dragón nos presta su calor: los ejércitos marchan con la moral alta."
 STATIC_MODIFIER_NAME_gj_llama_cenizas_fundidas: "Cenizas fundidas"
 STATIC_MODIFIER_DESC_gj_llama_cenizas_fundidas: "Las espadas nuevas llevan las cenizas de los caídos. Quien las empuña no quiere defraudarlos."
 STATIC_MODIFIER_NAME_gj_llama_santuario_concurrido: "Santuario concurrido"
 STATIC_MODIFIER_DESC_gj_llama_santuario_concurrido: "Peregrinos, limosnas y una hospedería siempre llena."
 STATIC_MODIFIER_NAME_gj_llama_galeria_sellada: "Galería sellada con ritos"
 STATIC_MODIFIER_DESC_gj_llama_galeria_sellada: "Se ha sellado una galería para calmar lo que duerme debajo. Produce menos hierro y la zona está más tranquila."
 AUTO_MODIFIER_NAME_gj_llama_brasa_limpia: "Brasa limpia"
 AUTO_MODIFIER_NAME_gj_llama_brasa_apagada: "Brasa apagada"

 # ---------- Decisiones ----------
 gj_llama_profunda_rito_brasa.title: "Rito de la Brasa"
 gj_llama_profunda_rito_brasa.desc: "Los Guardabrasas encienden en la Casa de Fuego una nueva llama a partir de la brasa guardada. Es el modo más corriente de mantener limpia la Pureza de la Llama, y de calmar un poco lo que late abajo."
 gj_llama_profunda_rito_brasa.a: "Que se encienda la brasa."
 gj_llama_profunda_vigilia_fondo.title: "Vigilia del Fondo"
 gj_llama_profunda_vigilia_fondo.desc: "Se sellan galerías con ritos y se guarda silencio ante el pozo mayor. Cuesta producción durante una década y calma la profundidad."
 gj_llama_profunda_vigilia_fondo.a: "Que se sellen las galerías."
 gj_llama_profunda_pactar_dragon.title: "El Pacto del Ala"
 gj_llama_profunda_pactar_dragon.desc: "El dragón de la caldera está inquieto y escucha. Los Guardabrasas más viejos saben de un trato antiguo: sentarlo en el panteón por una década a cambio de su aliento. Da artillería, forja y moral, pero baja la pureza cada mes y cobra un diezmo cada diez años."
 gj_llama_profunda_pactar_dragon.a: "Que el dragón se siente en el panteón."
 gj_llama_profunda_romper_pacto.title: "Romper el Pacto"
 gj_llama_profunda_romper_pacto.desc: "Los Guardabrasas piden volver a la llama limpia. El dragón perderá su asiento en el panteón, y no lo olvidará."
 gj_llama_profunda_romper_pacto.a: "Que se apague su brasa en nuestro panteón."

 # ---------- Eventos ----------
 gj_llama_profunda.1.title: "El Encendido de la Primera Forja"
 gj_llama_profunda.1.entry: "$gj_llama_profunda.1.title$"
 gj_llama_profunda.1.desc: "Es la noche en que, según los Guardabrasas, se golpeó el primer yunque. Las Casas de Fuego apagan todas sus llamas y las vuelven a encender a partir de una sola brasa, que pasa de mano en mano hasta la última forja del reino. Los niños la miran sin pestañear."
 gj_llama_profunda.1.a: "Un banquete de forja para todos los gremios."
 gj_llama_profunda.1.b: "Forjemos un arma votiva para guardarla bajo el Yunque."
 gj_llama_profunda.1.c: "Que cada casa encienda su propio fuego, y nada más."

 gj_llama_profunda.2.title: "La brasa se apaga en la Casa de las Cenizas"
 gj_llama_profunda.2.entry: "$gj_llama_profunda.2.title$"
 gj_llama_profunda.2.desc: "La brasa de la Casa de las Cenizas, que lleva ardiendo desde antes del primer registro, se ha apagado sola una madrugada. Los Guardabrasas hablan en voz baja. Unos dicen que ha sido el hierro mal templado; otros, el oro fácil; otros, que alguien ha bajado más hondo de lo debido. Nadie sabe qué decir al pueblo."
 gj_llama_profunda.2.a: "Reavivémosla con ceremonia pública, a costa del tesoro."
 gj_llama_profunda.2.b: "Pidamos una chispa a las Casas de los vecinos y aguantemos la vergüenza."
 gj_llama_profunda.2.c: "Que se apague del todo: ya renacerá con otra generación."

 gj_llama_profunda.3.title: "La Voz de la Brasa"
 gj_llama_profunda.3.entry: "$gj_llama_profunda.3.title$"
 gj_llama_profunda.3.desc: "En la Casa de Fuego, un Guardabrasas joven ha entrado en trance ante la llama limpia y habla con una calma que no es suya. Dice palabras de forja, de medida y de paciencia. Nadie las había oído nunca, y todos las entienden."
 gj_llama_profunda.3.a: "Que sus palabras se fundan en la próxima gran obra."
 gj_llama_profunda.3.b: "Que se lean ante todas las Casas, sin guardarse nada."

 gj_llama_profunda.4.title: "El Diezmo del Ala"
 gj_llama_profunda.4.entry: "$gj_llama_profunda.4.title$"
 gj_llama_profunda.4.desc: "Ha pasado una década desde que el dragón se sentó en nuestro panteón, y la caldera ruge. La Brasa Mayor no habla, pero todos saben qué pide: su parte. Los Guardabrasas más viejos recuerdan lo que se pagó la última vez y no lo dicen en voz alta."
 gj_llama_profunda.4.a: "Pagar en gentes: algunas familias bajarán a la caldera."
 gj_llama_profunda.4.b: "Pagar en oro, un tesoro entero fundido ante el pozo."
 gj_llama_profunda.4.c: "No pagar. Se acabó el trato."

 gj_llama_profunda.5.title: "El latido bajo la piedra"
 gj_llama_profunda.5.entry: "$gj_llama_profunda.5.title$"
 gj_llama_profunda.5.desc: "Los mineros del turno de noche dicen que la roca late, despacio, como un corazón. Los Guardabrasas bajan con una vela y vuelven más callados de lo que subieron. Cada galería nueva parece oírse más hondo que la anterior."
 gj_llama_profunda.5.a: "Doblar la vigilia y sellar lo que se pueda."
 gj_llama_profunda.5.b: "Es señal de riqueza. Que se siga cavando."

 gj_llama_profunda.6.title: "El yunque que cantó"
 gj_llama_profunda.6.entry: "$gj_llama_profunda.6.title$"
 gj_llama_profunda.6.desc: "Un yunque viejo de la Casa de Fuego ha dado, bajo el martillo, una nota larga y clara, como de campana. Los herreros dejan de golpear. El sonido ha durado más de lo que debería y ha parado de golpe, como cortado con cincel."
 gj_llama_profunda.6.a: "Es un signo. Que se coloque en el centro de la Casa de Fuego."
 gj_llama_profunda.6.b: "Un gremio de extranjeros ofrece una fortuna por él."

 gj_llama_profunda.7.title: "La herejía del Hierro Frío"
 gj_llama_profunda.7.entry: "$gj_llama_profunda.7.title$"
 gj_llama_profunda.7.desc: "Un grupo de herreros predica que el fuego es un robo a la montaña y que el hierro bueno se forja con la brasa apagada. Dicen que la Llama Profunda se ha vuelto un negocio. Hay quien los escucha."
 gj_llama_profunda.7.a: "Que se les cierren las forjas y se les prohíba predicar."
 gj_llama_profunda.7.b: "Que debatan en público ante los Guardabrasas, con vino por nuestra cuenta."

 gj_llama_profunda.8.title: "Peregrinos al Pozo de la Llama"
 gj_llama_profunda.8.entry: "$gj_llama_profunda.8.title$"
 gj_llama_profunda.8.desc: "Una caravana de peregrinos de otras Casas ha llegado a pie al pozo, con los hombros llenos de nieve y los ojos hambrientos de resplandor. Piden techo y la bendición de los Guardabrasas."
 gj_llama_profunda.8.a: "Costear una hospedería junto al pozo."
 gj_llama_profunda.8.b: "Que paguen por mirar."

 gj_llama_profunda.9.title: "Las cenizas de los caídos"
 gj_llama_profunda.9.entry: "$gj_llama_profunda.9.title$"
 gj_llama_profunda.9.desc: "Se han quemado los caídos según la costumbre, y las cenizas esperan en urnas de piedra. Los herreros del frente proponen algo antiguo: mezclarlas con el hierro de las espadas nuevas. Los Guardabrasas fruncen el ceño: dicen que las cenizas deben volver a la montaña."
 gj_llama_profunda.9.a: "Fundámoslas en las espadas. Que luchen una vez más."
 gj_llama_profunda.9.b: "Que vuelvan a la montaña, como siempre."

 gj_llama_profunda.10.title: "La veta que respira"
 gj_llama_profunda.10.entry: "$gj_llama_profunda.10.title$"
 gj_llama_profunda.10.desc: "Una cuadrilla ha dado con una veta de hierro rojo que exhala un aire caliente y huele a ceniza. Es rica como pocas y está tibia al tacto. Los más viejos tocan la pared y dicen que la veta no es de nadie, que es el sudor de algo que duerme."
 gj_llama_profunda.10.a: "Abrámosla. Es demasiado buena para dejarla."
 gj_llama_profunda.10.b: "Sellémosla con el rito antes de que despierte."
 gj_llama_profunda.10.c: "Marquémosla y dejémosla para los nietos."

 gj_llama_profunda.11.title: "La Brasa Mayor no olvida"
 gj_llama_profunda.11.entry: "$gj_llama_profunda.11.title$"
 gj_llama_profunda.11.desc: "Desde que rompimos el trato, el aire de los pasos altos huele a azufre y los pájaros dan la vuelta antes de llegar a la caldera. Los Guardabrasas proponen una ofrenda de oro ante el pozo, sin palabras, para que el dragón sepa que no queremos guerra."
 gj_llama_profunda.11.a: "Ofrendemos oro y pidamos paz."
 gj_llama_profunda.11.b: "No nos arrodillamos ante nadie."
