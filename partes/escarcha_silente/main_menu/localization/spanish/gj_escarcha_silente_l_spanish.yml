l_spanish:
 # --- Religion ---
 gj_escarcha_silente: "Escarcha Silente"
 gj_escarcha_silente_ADJ: "silente"
 gj_escarcha_silente_desc: "No rezan: callan. Los fieles de la Escarcha Silente creen que el primer invierno no se fue nunca, que espera bajo la nieve a que los vivos terminen de hablar. Sus oficiantes, los Callados Blancos, llevan la cuenta de los inviernos con nudos de crin en una cuerda sin final, y saben que cada guerra, cada eclipse y cada hambruna aprietan un nudo más. Cuando la cuenta se cierra llega la Noche Blanca: el frío se levanta, los muertos caminan y la Corte reclama lo suyo. Quien la sigue gana en fuerza y en aguante lo que pierde en sosiego, y vive con la [doom|e] pegada a la nuca."

 # --- Aspectos ---
 gj_escarcha_silente_aspecto_vigilia_blanca: "La Vigilia Blanca"
 gj_escarcha_silente_aspecto_vigilia_blanca_desc: "Las fronteras se guardan sin hablar, de pie sobre la nieve, hasta que el frío mismo parece parte de la guardia."
 gj_escarcha_silente_aspecto_aliento_quieto: "El Aliento Quieto"
 gj_escarcha_silente_aspecto_aliento_quieto_desc: "Quien contiene el aliento retrasa la cuenta. Los oficiantes enseñan a callar a tiempo, a dejar pasar el miedo sin darle voz."
 gj_escarcha_silente_aspecto_hueso_y_sal: "Hueso y Sal"
 gj_escarcha_silente_aspecto_hueso_y_sal_desc: "La sal conserva y el hueso sostiene. Los hombres de la cuerda saben que ningún ejército es caro si no se pudre."
 gj_escarcha_silente_aspecto_memoria_helada: "La Memoria Helada"
 gj_escarcha_silente_aspecto_memoria_helada_desc: "Lo que se congela no se olvida. Las crónicas de los Callados guardan, palabra por palabra, todo lo que el hielo ha cubierto."

 # --- Focos ---
 gj_escarcha_silente_foco_cantar_el_hielo: "Cantar el Hielo"
 gj_escarcha_silente_foco_cantar_el_hielo_desc: "Un canto sin palabras, entonado a coro sobre los lagos helados, que según los Callados afloja un nudo de la cuenta."
 gj_escarcha_silente_foco_levas_de_ceniza: "Levas de Ceniza"
 gj_escarcha_silente_foco_levas_de_ceniza_desc: "Los clanes del norte no mandan a sus hombres a la guerra: los devuelven a ella. Las levas se reponen deprisa, porque el que cae en la nieve vuelve a levantarse."
 gj_escarcha_silente_foco_pan_de_invierno: "Pan de Invierno"
 gj_escarcha_silente_foco_pan_de_invierno_desc: "Panes de harina y ceniza que no se enmohecen. Los fieles viven más con poco, y se quejan menos de ello."
 gj_escarcha_silente_foco_la_cumbre_callada: "La Cumbre Callada"
 gj_escarcha_silente_foco_la_cumbre_callada_desc: "Se levanta un santuario sobre la cumbre donde ningún pájaro canta. Los peregrinos suben descalzos y vuelven sin fiebres."
 gj_escarcha_silente_foco_el_ultimo_invierno: "El Último Invierno"
 gj_escarcha_silente_foco_el_ultimo_invierno_desc: "El secreto último de los Callados: el invierno que no termina no es una condena, sino un trono. Solo lo alcanza quien ha cumplido los demás ritos."

 # --- Lugares sagrados ---
 gj_escarcha_silente_cumbre_callada: "Cumbre callada"
 gj_escarcha_silente_cumbre_callada_desc: "Una cima donde la nieve no se derrite ni en pleno verano. Es un [holy_site|el] de la Escarcha Silente."
 gj_escarcha_silente_tumba_del_primer_invierno: "Tumba del primer invierno"
 gj_escarcha_silente_tumba_del_primer_invierno_desc: "Un túmulo bajo el hielo donde, dicen, yace el primer muerto. Es un [holy_site|el] de la Escarcha Silente."

 # --- Modificadores ---
 STATIC_MODIFIER_NAME_gj_escarcha_silente_vigilia_cantada: "Vigilia de la cuenta"
 STATIC_MODIFIER_NAME_gj_escarcha_silente_hielo_en_las_venas: "Hielo en las venas"
 STATIC_MODIFIER_NAME_gj_escarcha_silente_ayuno_de_los_callados: "Ayuno de los Callados"
 STATIC_MODIFIER_NAME_gj_escarcha_silente_pregon_del_hielo: "Pregón del hielo"
 STATIC_MODIFIER_NAME_gj_escarcha_silente_eclipse_de_ceniza: "Eclipse de ceniza"
 STATIC_MODIFIER_NAME_gj_escarcha_silente_noche_blanca_fiel: "La Noche Blanca es nuestra"
 STATIC_MODIFIER_NAME_gj_escarcha_silente_corte_dormida: "La Corte duerme"
 STATIC_MODIFIER_NAME_gj_escarcha_silente_cuenta_rota: "Cuenta rota"
 STATIC_MODIFIER_NAME_gj_escarcha_silente_ceniza_bendita: "Ceniza bendita"
 STATIC_MODIFIER_NAME_gj_escarcha_silente_nieve_viva: "Nieve viva"
 AUTO_MODIFIER_NAME_gj_escarcha_silente_aliento: "Aliento de la Escarcha"
 AUTO_MODIFIER_NAME_gj_escarcha_silente_guerra: "La guerra aprieta la cuenta"

 # --- Decisiones ---
 gj_escarcha_silente_vigilia_decision.title: "Vigilia de la cuenta"
 gj_escarcha_silente_vigilia_decision.entry: "Vigilia de la cuenta"
 gj_escarcha_silente_vigilia_decision.desc: "Los Callados Blancos proponen una vigilia de tres noches para aflojar un nudo de la cuenta."
 gj_escarcha_silente_vigilia_decision.desc.entry: "Los Callados Blancos proponen una vigilia de tres noches sobre el hielo. Nadie hablará, nadie comerá, y la [doom|e] bajará. Costará prestigio ante quienes piensan que callar es rendirse."
 gj_escarcha_silente_vigilia_decision.a: "Que se haga la vigilia."
 gj_escarcha_silente_convocar_noche_decision.title: "Convocar la Noche Blanca"
 gj_escarcha_silente_convocar_noche_decision.entry: "Convocar la Noche Blanca"
 gj_escarcha_silente_convocar_noche_decision.desc: "La guerra va mal y la cuenta está casi cerrada. Quizá convenga no esperar."
 gj_escarcha_silente_convocar_noche_decision.desc.entry: "La guerra aprieta y los nudos de la cuerda están casi cerrados. Podemos adelantar la Noche Blanca en lugar de esperar a que llegue sola. Los muertos no preguntan de qué bando es el que los despierta."
 gj_escarcha_silente_convocar_noche_decision.a: "Que caiga el invierno."
 gj_escarcha_silente_erguir_cumbre_decision.title: "Erguir la Cumbre Callada"
 gj_escarcha_silente_erguir_cumbre_decision.entry: "Erguir la Cumbre Callada"
 gj_escarcha_silente_erguir_cumbre_decision.desc: "Un santuario de piedra y hielo en nuestra capital, para que los peregrinos no tengan que ir tan lejos."
 gj_escarcha_silente_erguir_cumbre_decision.desc.entry: "Levantaremos en la capital un santuario de piedra y hielo, réplica de las cumbres donde reposan los primeros Callados. Costará prestigio, pero el pregón de su consagración se oirá durante veinte años."
 gj_escarcha_silente_erguir_cumbre_decision.a: "Levantad el santuario."

 # --- Eventos ---
 gj_escarcha_silente.1.title: "La primera helada de la cuenta"
 gj_escarcha_silente.1.desc: "Los oficiantes han hecho un nudo nuevo en la cuerda: la primera helada llegó antes de tiempo. Ninguno habla, pero todos miran al cielo."
 gj_escarcha_silente.1.a: "Guardar silencio toda la noche."
 gj_escarcha_silente.1.b: "Dejar que el frío hable."
 gj_escarcha_silente.2.title: "Los nombres sobre la nieve"
 gj_escarcha_silente.2.desc: "Tras la última guerra, los Callados piden escribir los nombres de los caídos sobre la nieve, con ceniza. Es un gesto hermoso y un poco peligroso: cada nombre es un nudo más en la cuerda."
 gj_escarcha_silente.2.a: "Escribid todos los nombres."
 gj_escarcha_silente.2.b: "Que la nieve los cubra sin marcas."
 gj_escarcha_silente.3.title: "El ayuno de los callados"
 gj_escarcha_silente.3.desc: "Se acerca el solsticio y los oficiantes proponen un ayuno colectivo para retrasar la cuenta. Hay quien lo celebra y quien murmura que la cuenta ni se entera de nuestras tripas."
 gj_escarcha_silente.3.a: "Que ayune todo el reino."
 gj_escarcha_silente.3.b: "Que ayunen solo los oficiantes, y pagamos su ofrenda."
 gj_escarcha_silente.3.c: "Que el reino coma. La cuenta que corra."
 gj_escarcha_silente.4.title: "Peregrinos a la cumbre callada"
 gj_escarcha_silente.4.desc: "Una larga fila de peregrinos ha subido descalza hasta la cumbre callada. Dicen que han oído, al fondo del silencio, el latido del primer invierno."
 gj_escarcha_silente.4.a: "Bendecid el camino y los pueblos que atraviesa."
 gj_escarcha_silente.4.b: "Cobrad el paso. Los peregrinos pueden pagar."
 gj_escarcha_silente.5.title: "Un verano demasiado cálido"
 gj_escarcha_silente.5.desc: "El verano ha sido tan cálido que los glaciares retroceden y los lagos no se hielan a tiempo. Los Callados lo viven como un insulto personal."
 gj_escarcha_silente.5.a: "Cantad al hielo para que vuelva."
 gj_escarcha_silente.5.b: "Es el cielo, no nosotros. Que lo resuelva el clero."
 gj_escarcha_silente.6.title: "El cantor sin lengua"
 gj_escarcha_silente.6.desc: "Un cantor sin lengua ha llegado a la corte. Canta con las manos sobre un tambor de piel de lobo, y quien lo escucha asegura entender cada palabra de un idioma que nunca estudió."
 gj_escarcha_silente.6.a: "Que cante ante toda la corte."
 gj_escarcha_silente.6.b: "Que cante solo ante los oficiantes."
 gj_escarcha_silente.7.title: "Un hereje bajo la nieve"
 gj_escarcha_silente.7.desc: "Un viajero asegura que el invierno no es una deidad sino una estación, y que la cuenta de los nudos es una superstición. Ya tiene a medio pueblo escuchándolo."
 gj_escarcha_silente.7.a: "Dejarlo marchar. Que el frío se ocupe de él."
 gj_escarcha_silente.7.b: "Enterrarlo bajo la nieve, como ordena el rito."
 gj_escarcha_silente.8.title: "La cuenta se acerca"
 gj_escarcha_silente.8.desc: "Quedan pocos nudos por cerrar en la cuerda. Los oficiantes ya no duermen, y los soldados de la frontera dicen que las huellas de la nieve empiezan a señalar hacia el reino."
 gj_escarcha_silente.8.a: "Reunid a los nuestros. Que llegue como llegue."
 gj_escarcha_silente.8.b: "Ayuno total. Que se aflojen los nudos."
 gj_escarcha_silente.9.title: "La Noche Blanca"
 gj_escarcha_silente.9.desc: "El último nudo se ha cerrado. Los Callados dejan de cantar y el frío, de golpe, se levanta del suelo como un animal. Es la Noche Blanca. Los muertos caminarán, los vivos se agarrarán a lo que tengan, y la Corte reclamará su parte durante cuatro inviernos."
 gj_escarcha_silente.9.a: "Que caiga la Noche. Es nuestra."
 gj_escarcha_silente.9.b: "Romper la cuerda. No será hoy."
 gj_escarcha_silente.10.title: "La Corte se duerme"
 gj_escarcha_silente.10.desc: "Cuatro inviernos después, un amanecer sin viento marca el fin de la Noche Blanca. La Corte se retira bajo el hielo y los Callados empiezan una cuerda nueva, de nudos aún sin hacer. Los vivos respiran, y están muy cansados."
 gj_escarcha_silente.10.a: "Que duerma."
 gj_escarcha_silente.11.title: "Los callados reclaman su parte"
 gj_escarcha_silente.11.desc: "Los clanes de la frontera han vuelto a ver a sus muertos en pie. Piden que se les deje sumarse a las levas, porque dicen que callar no es lo mismo que descansar."
 gj_escarcha_silente.11.a: "Que se sumen a las levas."
 gj_escarcha_silente.11.b: "Que descansen. Los nobles no quieren verlos."
 gj_escarcha_silente.12.title: "El último invierno"
 gj_escarcha_silente.12.desc: "Los Callados han cumplido todos los ritos, y el más viejo, que no hablaba desde hacía veinte años, rompe el silencio para decir lo que sabe: el invierno que no termina no se teme, se hereda."
 gj_escarcha_silente.12.a: "Aceptar el don del último invierno."
 gj_escarcha_silente.12.b: "Guardar el secreto y que el prestigio lo cuente."
