l_spanish:
 # --- Avances de la Hegemonía Carmesí (24) ---
 gj_orunmar_tradicion_cosecha: "La tradición de la Cosecha"
 gj_orunmar_tradicion_cosecha_desc: "Antes de que hubiera reyes, los clanes de la niebla bajaban de las terrazas a segar a sus vecinos como se siega el grano: en luna menguante, en silencio y con cuerda de fibra roja. Lo llamaron cosecha, y los dioses la aceptaron."
 gj_orunmar_senda_de_la_nube: "La Senda de la Nube"
 gj_orunmar_senda_de_la_nube_desc: "Las pasarelas de liana y piedra sobre los barrancos enseñaron a nuestra gente a vivir donde nadie más sube. Cada escalón de monte es un campo, y cada campo, un hijo más."
 gj_orunmar_tintes_carmesi: "Tintes carmesí"
 gj_orunmar_tintes_carmesi_desc: "La grana del árbol de sangre tiñe lana, cuero y cuerpo. Quien viste el rojo de Orunmar viste una promesa: que alguien la pagó."
 gj_orunmar_primera_ofrenda: "La primera ofrenda"
 gj_orunmar_primera_ofrenda_desc: "Los dioses de la altura tienen hambre desde antes de la memoria. La primera ofrenda fue grano; la segunda, un hombre. Nadie recuerda cuál bastó."
 gj_orunmar_corredores_de_selva: "Corredores de la selva"
 gj_orunmar_corredores_de_selva_desc: "Los caminos de la selva alta no se ven desde abajo. Nuestros corredores los recorren de noche y vuelven con el amanecer, y con compañía."
 gj_orunmar_cacerias_de_hombres: "Las cacerías de hombres"
 gj_orunmar_cacerias_de_hombres_desc: "Ya no basta con sorprender a un pueblo: ahora se planea la cosecha como un viaje de mercaderes, con rutas, vigías, cuerdas y relevos. La captura se vuelve oficio, y el oficio, orgullo."
 gj_orunmar_graneros_de_altura: "Graneros de altura"
 gj_orunmar_graneros_de_altura_desc: "Cámaras de piedra seca, ventiladas por el viento de la cumbre, guardan el grano cuatro años. Un pueblo que no teme el hambre puede permitirse que sus dioses sí la tengan."
 gj_orunmar_cantera_de_vidrio_rojo: "La cantera de vidrio rojo"
 gj_orunmar_cantera_de_vidrio_rojo_desc: "En las laderas del Volcán Callado hay una piedra roja que corta mejor que el bronce y brilla como una brasa. Los canteros la sacan, los sacerdotes la bendicen y los mercaderes la venden."
 gj_orunmar_senderos_de_cazadores: "Senderos de cazadores"
 gj_orunmar_senderos_de_cazadores_desc: "Cada tropa de caza conoce su sendero y lo guarda como un secreto de familia. Juntos, forman una red que el enemigo no ve hasta que ya está dentro."
 gj_orunmar_cosecha_ritual: "La cosecha ritual"
 gj_orunmar_cosecha_ritual_desc: "Se fija el calendario: en cada luna llena, una marcha. Los vecinos lo saben y se preparan, y por eso mismo la guerra se vuelve costumbre y no catástrofe. Las minas y los campos, mientras tanto, nunca se quedan sin brazos."
 gj_orunmar_caminos_de_nube: "Caminos de nube"
 gj_orunmar_caminos_de_nube_desc: "Puentes colgantes de doble cuerda y calzadas de piedra pulida atraviesan la niebla. Quien manda en ellos manda en la selva, y las órdenes llegan antes que los rumores."
 gj_orunmar_arte_del_dosel: "El arte del dosel"
 gj_orunmar_arte_del_dosel_desc: "Pelear entre las copas, en la penumbra verde, exige otra disciplina: no la de la fila, sino la de la caza. Quien la domina no necesita ver al enemigo para saber dónde está."
 gj_orunmar_mercado_de_cacao: "El mercado del cacao"
 gj_orunmar_mercado_de_cacao_desc: "Las vainas oscuras se cuentan como monedas y se beben como bendición. Cada plaza de Orunmar tiene ahora su pesador de cacao, y los gremios crecen a su sombra."
 gj_orunmar_ritual_ordenado: "El ritual ordenado"
 gj_orunmar_ritual_ordenado_desc: "Los sacerdotes ponen por escrito lo que antes se transmitía a gritos: cuántos, cuándo, en qué escalón. El hambre de los dioses se vuelve un calendario, y el calendario, una fuente de legitimidad."
 gj_orunmar_tintoreros_de_la_lluvia: "Los tintoreros de la lluvia"
 gj_orunmar_tintoreros_de_la_lluvia_desc: "Los tintoreros descubrieron que la grana prende mejor con agua de lluvia de tormenta. Desde entonces, cada temporal es una bendición de color."
 gj_orunmar_marcha_ligera: "Marcha ligera"
 gj_orunmar_marcha_ligera_desc: "Menos equipaje, menos ruido, menos bajas. Las tropas de la selva aprenden a vivir de lo que pisan y a reponer huecos sin esperar a nadie."
 gj_orunmar_intendencia_de_cautivos: "La intendencia de cautivos"
 gj_orunmar_intendencia_de_cautivos_desc: "Los prisioneros de la última marcha cargan los suministros de la siguiente. Comen poco, caminan mucho y, si caen, nadie los llora: así de bien lo ha pensado el Consejo."
 gj_orunmar_cafetales_rojos: "Los cafetales rojos"
 gj_orunmar_cafetales_rojos_desc: "En las laderas más altas, bajo sombra de árboles viejos, crece un arbusto de bayas rojas que despierta a quien las bebe. Los esclavos lo recogen; los nobles lo prueban; los mercaderes lo pagan a peso de plata."
 gj_orunmar_cosecha_total: "La cosecha total"
 gj_orunmar_cosecha_total_desc: "El Consejo decreta que la marcha no es una excepción sino un régimen: todo hombre útil sirve en la columna cuando llega la luna. El resultado es una hueste que tarda en armarse y que, armada, no se detiene."
 gj_orunmar_fusiles_de_la_niebla: "Los fusiles de la niebla"
 gj_orunmar_fusiles_de_la_niebla_desc: "Tiradores que disparan desde la bruma y desaparecen antes de que el humo se disipe. La pólvora llegó tarde a Orunmar, pero llegó para quedarse."
 gj_orunmar_caravanas_de_carga: "Caravanas de carga"
 gj_orunmar_caravanas_de_carga_desc: "Recuas de cientos de porteadores salen de cada almacén en columnas ordenadas. Los alimentos duran más y los ejércitos llegan frescos, aunque quien carga con ellos no siempre llegue."
 gj_orunmar_ultimo_banquete: "El último banquete"
 gj_orunmar_ultimo_banquete_desc: "Un siglo de cosechas sin cuento ha dado al Consejo una certeza incómoda: los dioses hambrientos no se saciarán nunca. Mejor, entonces, servirles un banquete que dure para siempre."
 gj_orunmar_hegemonia_de_la_nube: "La hegemonía de la nube"
 gj_orunmar_hegemonia_de_la_nube_desc: "Desde las cumbres, el Consejo ve todos los valles. Ya no hace falta pedir tributo: basta con subir un escalón más."
 gj_orunmar_guardas_del_dosel: "Las guardas del dosel"
 gj_orunmar_guardas_del_dosel_desc: "Los antiguos cazadores son ahora cuerpos de línea, con fusiles de cañón largo y uniforme de grana. Siguen prefiriendo la sombra al campo abierto."

 # --- Avances de la cultura orunmari ---
 gj_orunmar_cultura_costumbre_del_banquete: "La costumbre del banquete"
 gj_orunmar_cultura_costumbre_del_banquete_desc: "En cada casa orunmari se reserva una mesa a los ausentes y a los dioses. Quien rompe la costumbre pierde a sus vecinos; quien la cumple, el respeto de todos."
 gj_orunmar_cultura_ojo_del_tintorero: "El ojo del tintorero"
 gj_orunmar_cultura_ojo_del_tintorero_desc: "Los orunmaríes distinguen más de cuarenta matices de rojo y tienen un nombre para cada uno. Esa mirada educada se nota también en sus escribas, sus joyeros y sus cronistas."

 # --- Reformas de gobierno ---
 gj_orunmar_mesa_roja: "La Mesa Roja"
 gj_orunmar_mesa_roja_desc: "Los nueve linajes que fundaron la Hegemonía se sientan en torno a una mesa de piedra teñida y deciden juntos las marchas, los banquetes y los ayunos. No hay corona; hay una silla vacía que representa a los dioses."
 gj_orunmar_casta_de_segadores: "La casta de los Segadores"
 gj_orunmar_casta_de_segadores_desc: "Los guerreros de la Hegemonía se organizan en una casta: sus hijos nacen soldados, sus rangos se heredan y sus cautivos son suyos por derecho. El Consejo les debe más de lo que quiere admitir."
 gj_orunmar_gran_banquete: "El Gran Banquete"
 gj_orunmar_gran_banquete_desc: "La Hegemonía institucionaliza la cosecha: cada provincia entrega su cupo de esclavos y de grano, y cada marcha tiene su presupuesto. La liturgia es ahora administración, y viceversa."
