 gj_marea_negra_mapa_robado_desc: "Cartas robadas"
 gj_marea_negra_tributo_del_faro: "Tributo del faro"
 gj_marea_negra_tributo_del_faro_desc: "Tributo del faro"
 gj_marea_negra_noche_de_luces_falsas: "La noche de las luces falsas"
 gj_marea_negra_noche_de_luces_falsas_desc: "La noche de las luces falsas"
 gj_marea_negra_omen_del_mar_dormido: "Augurio del Mar Dormido"
 gj_marea_negra_omen_del_mar_dormido_desc: "Augurio del Mar Dormido"
 gj_marea_negra_escuela_de_grumetes: "Escuela de grumetes"
 gj_marea_negra_escuela_de_grumetes_desc: "Escuela de grumetes"
 gj_marea_negra_arsenal_flotante: "Arsenal flotante"
 gj_marea_negra_arsenal_flotante_desc: "Arsenal flotante"
 gj_marea_negra_amenaza_de_disolucion: "La Hermandad se resquebraja"
 gj_marea_negra_amenaza_de_disolucion_desc: "Quedan pocos puertos y el Código empieza a ceder."
 gj_marea_negra_hermandad_rota: "Hermandad rota"
 gj_marea_negra_hermandad_rota_desc: "Hermandad rota"
 gj_marea_negra_rescate_pagado: "Rescate pagado"
 gj_marea_negra_rescate_pagado_desc: "Rescate pagado"
 gj_marea_negra_marea_muerta: "Marea muerta"
 gj_marea_negra_marea_muerta_desc: "Marea muerta"
 gj_marea_negra_izar_bandera_negra: "Izar la bandera negra"
 gj_marea_negra_izar_bandera_negra_desc: "Durante cinco años los barcos de la Hermandad dejan de fingir. Se cobra más, se captura más y se negocia menos. Después, la reputación tarda mucho en cicatrizar."
 gj_marea_negra_izar_bandera_negra.a: "Izar la bandera"
 gj_marea_negra_fundar_puerto_libre: "Fundar un Puerto Libre"
 gj_marea_negra_fundar_puerto_libre_desc: "Un puerto de nuestra costa se declara libre: sin aduana, sin tasa de fondeo y sin preguntas. El primer año se pierde dinero; el segundo, llegan los mercantes."
 gj_marea_negra_fundar_puerto_libre.a: "Que se declare libre"
 gj_marea_negra_convocar_conclave: "Convocar el Cónclave de capitanes"
 gj_marea_negra_convocar_conclave_desc: "Los capitanes se reúnen en la Sala de los Siete Nudos para repasar el Código y renovar los votos. Es caro y largo, pero la Hermandad sale de él más unida."
 gj_marea_negra_convocar_conclave.a: "Que suenen las cuerdas"
 gj_marea_negra_abrir_el_contrabando: "Abrir el contrabando"
 gj_marea_negra_abrir_el_contrabando_desc: "Durante diez años, la Hermandad deja de esconder lo que vende. Los ingresos suben, y la autoridad del Código sufre."
 gj_marea_negra_abrir_el_contrabando.a: "Que se descargue a plena luz"
 gj_marea_negra_contratar_patente: "Contratar a la Hermandad"
 gj_marea_negra_contratar_patente_desc: "Una bolsa de oro, un nombre y la palabra de un capitán: durante cinco años los barcos de la Hermandad hostigarán el comercio de nuestro rival. Nadie verá nuestra mano."
 gj_marea_negra_contratar_patente.a: "Pagar la patente"
 gj_marea_negra_pagar_contrapatente: "Pagar una contrapatente"
 gj_marea_negra_pagar_contrapatente_desc: "Quien nos hostiga ha pagado a la Hermandad. Si pagamos el doble, la patente se da la vuelta y quien la contrató se convierte en la presa. El Código no pregunta por razones."
 gj_marea_negra_pagar_contrapatente.a: "Pagar el doble"
 gj_marea_negra.1.a: "Reafirmar los siete, sin añadir ni quitar."
 gj_marea_negra.1.b: "Abrir el Código a los recién llegados: un octavo nudo."
 gj_marea_negra.1.title: "El nudo de las siete cuerdas"
 gj_marea_negra.1.desc: "En la Sala de los Siete Nudos aún cuelga el cabo con los siete nudos de la primera Hermandad. Cada nudo es un artículo del Código, y cada año, antes de zarpar, los capitanes lo desatan y lo vuelven a atar. Este año, un grumete sugiere que se añada un octavo."
 gj_marea_negra.2.a: "Aprovechar la calma para carenar la flota."
 gj_marea_negra.2.b: "Remolcar a remo hasta la ensenada más próxima."
 gj_marea_negra.2.title: "Marea muerta"
 gj_marea_negra.2.desc: "Una semana sin viento. Las velas cuelgan, la brea hierve en las cubiertas y los marineros se ponen a hacer lo que hacen los marineros cuando no hay nada que hacer: contar historias, contar deudas y contar los días. Los capitanes discuten si merece la pena arriesgar un remolque."
 gj_marea_negra.3.a: "Guardarlas: nadie más sabrá de esos pasos."
 gj_marea_negra.3.b: "Venderlas a los mercaderes de los puertos libres."
 gj_marea_negra.3.title: "Las cartas robadas"
 gj_marea_negra.3.desc: "Entre el botín de un mercante hay un rollo de cartas náuticas de una compañía rival: derrotas, bajíos y fondeaderos que no figuran en ningún mapa de la Hermandad. Un capitán veterano propone guardarlas; otro, venderlas al mejor postor."
 gj_marea_negra.4.a: "Darle un barco y dejar que pruebe lo que dice."
 gj_marea_negra.4.b: "Ofrecerle un asiento en la Sala de los Siete Nudos, sin mando."
 gj_marea_negra.4.title: "Un capitán sin barco"
 gj_marea_negra.4.desc: "Un hombre de la edad de los mástiles viejos aparece en el muelle con un cuchillo, un cabo y un nombre. Fue capitán durante veinte años, hasta que perdió su barco en una apuesta. Pide un puesto, y asegura que conoce cada bajío del estrecho."
 gj_marea_negra.5.a: "Aceptar el tributo: el dinero es dinero."
 gj_marea_negra.5.b: "Rechazarlo: el Código no vende protección."
 gj_marea_negra.5.title: "El tributo del faro"
 gj_marea_negra.5.desc: "Una ciudad de la costa, harta de ver cómo sus barcos desaparecen, ofrece pagar un tributo anual si la Hermandad promete mirar para otro lado. El alcalde dice «protección»; los capitanes, «chantaje con buenos modales»."
 gj_marea_negra.6.a: "Encender las hogueras."
 gj_marea_negra.6.b: "Dejar que el convoy pase."
 gj_marea_negra.6.title: "La noche de las luces falsas"
 gj_marea_negra.6.desc: "Un convoy de seis naves se acerca a la costa, con las bodegas llenas y los vigías dormidos. Un grupo de pescadores propone encender unas hogueras en el acantilado equivocado. «Es fácil, y nadie sabrá nunca que fuimos nosotros», dicen. Los capitanes se miran en silencio."
 gj_marea_negra.7.a: "Auditar el cofre ante todos los capitanes."
 gj_marea_negra.7.b: "Cerrar el asunto y reponer lo que falte de las partes."
 gj_marea_negra.7.title: "Cuentas del cofre de tres llaves"
 gj_marea_negra.7.desc: "El cofre común, el que se abre con tres llaves, sale a la luz en una asamblea de capitanes: faltan algunas monedas, y nadie recuerda cuántas había. El contable jura que ha sido un error. Los capitanes juran que no tiene por qué haberlo sido."
 gj_marea_negra.8.a: "Arrasar el muelle y poner el ejemplo."
 gj_marea_negra.8.b: "Negociar un pago menor y cerrar la disputa."
 gj_marea_negra.8.title: "La ciudad que no quiso pagar"
 gj_marea_negra.8.desc: "Un puerto de una costa lejana se ha negado a pagar el diezmo del Código y ha amurallado su muelle. Los capitanes están divididos entre arrasarlo para dar ejemplo y negociar un precio menor."
 gj_marea_negra.9.a: "Hacer un sacrificio de sal y brea al amanecer."
 gj_marea_negra.9.b: "Ignorar el prodigio: es solo el reflejo de las nubes."
 gj_marea_negra.9.title: "El eco del Mar Dormido"
 gj_marea_negra.9.desc: "En una noche sin luna el agua del puerto se vuelve negra como la tinta, aunque no se mueve. Los viejos dicen que es el Mar Dormido, que se ha despertado un momento para contar a sus hijos. Los capitanes se descubren y esperan una señal."
 gj_marea_negra.10.a: "Financiar una escuela de grumetes."
 gj_marea_negra.10.b: "Dejar que se arreglen entre ellos."
 gj_marea_negra.10.title: "Los hijos del botín"
 gj_marea_negra.10.desc: "Las viudas de la Hermandad han reunido a un grupo de huérfanos en una cabaña junto al muelle. Nadie los ha mandado allí, pero nadie ha dicho que se vayan. Un capitán retirado se ha ofrecido a enseñarles a leer el viento."
 gj_marea_negra.11.a: "Aprovechar la taberna para cerrar contratos de ocasión."
 gj_marea_negra.11.b: "Poner un escribano en una esquina, para anotar lo que se dice."
 gj_marea_negra.11.title: "La taberna de las mil lenguas"
 gj_marea_negra.11.desc: "En el puerto más viejo hay una taberna donde se oyen seis idiomas a la vez, y nadie discute. Es una especie de tregua tácita entre quienes no tienen nada que perder. Un marino comenta que allí se han cerrado tratos que ningún embajador habría conseguido."
 gj_marea_negra.12.a: "Doblar las guardias y reforzar los cabos."
 gj_marea_negra.12.b: "Contarlo en las tabernas: un buen fantasma sirve para cobrar peajes."
 gj_marea_negra.12.title: "El navío fantasma"
 gj_marea_negra.12.desc: "Un vigía jura haber visto, a lo lejos, un navío que navegaba contra el viento, sin luces y sin tripulación. Otros dos marineros han confirmado la historia. Los capitanes discuten si es un presagio, una broma o un barco enemigo muy bien disfrazado."
 gj_marea_negra.13.a: "Acogerlos y repartir el cargamento."
 gj_marea_negra.13.b: "Devolver la flota a su armador y cobrar una tasa."
 gj_marea_negra.13.title: "La flota mercante que cambió de bandera"
 gj_marea_negra.13.desc: "Una pequeña flota de mercantes, endeudada con su armador, pide asilo en un puerto de la Hermandad. Traen carga, familia y un montón de deudas. Su capitán dice que prefiere vivir con el Código que morir de acreedores."
 gj_marea_negra.14.a: "Pedir el rescate completo."
 gj_marea_negra.14.b: "Devolverlo sin precio, a cambio de un favor futuro."
 gj_marea_negra.14.title: "El rescate de un heredero"
 gj_marea_negra.14.desc: "Entre los cautivos de un abordaje hay un joven con anillos y letras que habla con un acento que no es de marinero. Es el hijo menor de un armador poderoso. El Código dice rescate; el corazón de algunos capitanes dice otra cosa."
 gj_marea_negra.15.a: "Aplicar la plancha a los cabecillas."
 gj_marea_negra.15.b: "Perdonar a todos, con una ración de azotes."
 gj_marea_negra.15.title: "La ley de la plancha"
 gj_marea_negra.15.desc: "Una tripulación ha intentado amotinarse en plena travesía. El capitán ha sofocado la revuelta y ahora la tripulación espera sentencia. El Código admite la plancha, el azote y el perdón, y no dice cuál es el mejor."
 gj_marea_negra.16.a: "Financiar el arsenal flotante."
 gj_marea_negra.16.b: "Aprovechar los planos y construir un astillero fijo."
 gj_marea_negra.16.title: "El arsenal flotante"
 gj_marea_negra.16.desc: "Un capitán ambicioso propone atar tres cascos viejos en una isla de maderas y usarla como astillero móvil. Dice que lo ha visto hacer en otras costas. Los demás capitanes se burlan, hasta que ven los planos."
 gj_marea_negra.20.a: "Elegir a la veterana: prudencia y barcos enteros."
 gj_marea_negra.20.b: "Elegir al joven: audacia y botines."
 gj_marea_negra.20.c: "Elegir al tratante: puertos llenos y arcas pesadas."
 gj_marea_negra.20.title: "Los capitanes votan"
 gj_marea_negra.20.desc: "Se ha cumplido el plazo y los capitanes deben elegir al nuevo Almirante del Código. Hay tres candidatos, cada uno con su estilo y sus apoyos: una veterana prudente, un joven audaz y un viejo tratante que sabe cuánto pesa cada puerto. El voto se hace con cuentas de colores y a puerta cerrada."
 gj_marea_negra.21.a: "Reforzar los puertos que quedan."
 gj_marea_negra.21.b: "Confiar en que bastarán los barcos."
 gj_marea_negra.21.title: "Los puertos se vacían"
 gj_marea_negra.21.desc: "Quedan pocos puertos que lleven la bandera de la Hermandad. Los capitanes se miran, calculan y no les gusta lo que ven: sin muelles, el Código es solo un conjunto de palabras. En la Sala de los Siete Nudos se habla ya, en voz baja, de lo que ocurrirá si cae el último."
 gj_marea_negra.22.a: "Aceptar el final y mantener unida la flota restante."
 gj_marea_negra.22.b: "Reunir a los que queden en torno a una nueva bandera."
 gj_marea_negra.22.title: "La Hermandad se deshace"
 gj_marea_negra.22.desc: "Con el último puerto perdido, el Código ya no tiene dónde cumplirse. Los capitanes se llevan sus barcos y sus deudas a otras costas; los archivos se queman y la Sala de los Siete Nudos se queda vacía. La Hermandad sigue existiendo, pero es solo una palabra."
 gj_marea_negra.23.a: "Contar la bolsa y repartir las partes."
 gj_marea_negra.23.title: "Una bolsa de patente"
 gj_marea_negra.23.desc: "Un mensajero sin nombre ha dejado en la Sala de los Siete Nudos una bolsa de monedas y un papel con el nombre de una flota que hay que hostigar. La Hermandad no pregunta por qué; solo se informa de a qué hora zarpan los mercantes."
 gj_marea_negra.24.a: "Estudiar la contrapatente: se puede pagar el doble."
 gj_marea_negra.24.b: "Aguantar y esperar a que la patente caduque."
 gj_marea_negra.24.title: "Nos han puesto precio"
 gj_marea_negra.24.desc: "Un capitán de la Hermandad ha dejado caer, en un muelle ajeno, que alguien ha contratado una patente contra nuestro comercio. Los barcos nuestros ya notan las velas negras en el horizonte. Queda una salida: pagar a la Hermandad el doble."
 gj_marea_negra.25.a: "El Código no pregunta."
 gj_marea_negra.25.title: "La patente se ha dado la vuelta"
 gj_marea_negra.25.desc: "El oro de una contrapatente ha llegado antes que el de la patente original. El Código no pregunta quién paga primero, sino quién paga más. La flota ya ha cambiado de rumbo y apunta ahora hacia el que nos contrató."
 gj_marea_negra.24.tt: "La decisión «Pagar una contrapatente» queda disponible."
 gj_marea_negra_fondeaderos_de_ceniza: "Fondeaderos de ceniza"
 gj_marea_negra_fondeaderos_de_ceniza_desc: "Las ensenadas donde fondea la Hermandad no figuran en carta alguna, y quien las conoce no las nombra. Un capitÃ¡n que esconde su flota entre dos rocas ahorra mÃ¡s dÃ­as de mar que uno que corre con viento favorable."
 gj_marea_negra_llaves_del_cofre_grande: "Llaves del cofre grande"
 gj_marea_negra_llaves_del_cofre_grande_desc: "Tres llaves, tres capitanes que no se hablan y un cofre que crece cada aÃ±o. El arreglo funciona porque nadie confÃ­a en nadie, y las aduanas del mundo lo envidian sin entenderlo."
