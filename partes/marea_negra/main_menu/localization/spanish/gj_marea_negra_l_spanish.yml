l_spanish:
 gj_marea_negra_hijos_de_la_marea: "Hijos de la marea"
 gj_marea_negra_hijos_de_la_marea_desc: "Nadie en la Hermandad recuerda haber aprendido a nadar: se aprende antes que a hablar. Los niños de los puertos libres crecen entre cascos y redes, y a los doce años ya valen como grumetes."
 gj_marea_negra_puertos_sin_senor: "Puertos sin señor"
 gj_marea_negra_puertos_sin_senor_desc: "Ninguna corona cobra aquí el fondeo, y por eso acuden los barcos que huyen de las aduanas. Un muelle sin dueño es un muelle donde todo se vende, y donde nadie pregunta de dónde viene la carga."
 gj_marea_negra_cuchillo_de_borda: "Cuchillo de borda"
 gj_marea_negra_cuchillo_de_borda_desc: "En una cubierta mojada no hay sitio para la espada larga. El cuchillo corto, la gafa y el garfio se aprenden en una sola travesía y se olvidan solo con la muerte."
 gj_marea_negra_ley_del_reparto: "La ley del reparto"
 gj_marea_negra_ley_del_reparto_desc: "Antes de zarpar se jura quién cobra qué. Lo que se reparte con justicia se vuelve lealtad, y lo que no, un motín que se cuenta en las tabernas durante generaciones."
 gj_marea_negra_noches_sin_luna: "Noches sin luna"
 gj_marea_negra_noches_sin_luna_desc: "Los capitanes eligen la oscuridad como otros eligen el viento. Una flota que se apaga y espera en una ensenada puede cerrar un estrecho entero antes del alba."
 gj_marea_negra_cofradia_de_capitanes: "Cofradía de capitanes"
 gj_marea_negra_cofradia_de_capitanes_desc: "Los capitanes veteranos se reúnen en la Sala de los Siete Nudos para repasar las singladuras del año. Nadie lleva un diario por escrito, pero todos acaban sabiendo cómo se perdió cada barco."
 gj_marea_negra_abordaje_de_ley: "Abordaje de ley"
 gj_marea_negra_abordaje_de_ley_desc: "El Código lo dice con pocas palabras: el que se rinde conserva la vida, el que resiste pierde la parte. Un barco que sabe que será tratado así se rinde mucho antes."
 gj_marea_negra_casa_de_la_tasa: "Casa de la tasa"
 gj_marea_negra_casa_de_la_tasa_desc: "Cada puerto libre tiene su casa de la tasa, una cabaña con una balanza y un libro. La tasa es baja y el libro nunca miente: es lo único sagrado que queda cuando todo lo demás se vende."
 gj_marea_negra_bandera_negra: "La bandera negra"
 gj_marea_negra_bandera_negra_desc: "Basta izarla para que la mitad de los mercantes arríen sin disparar. La Hermandad ha aprendido que el miedo es la munición más barata, y que se reutiliza."
 gj_marea_negra_puertos_francos: "Puertos francos"
 gj_marea_negra_puertos_francos_desc: "Los mercaderes de medio mundo descubren que fondear en la Hermandad sale más barato que pagar peajes. Lo que no preguntan es de dónde salió el género que se vende junto a ellos."
 gj_marea_negra_arcabuces_de_cubierta: "Arcabuces de cubierta"
 gj_marea_negra_arcabuces_de_cubierta_desc: "Un arcabuz que dispara desde la borda no necesita ser exacto, solo ruidoso. Los tiradores de la Hermandad aprenden a cargar tumbados, con el casco inclinado y la pólvora seca entre los dientes."
 gj_marea_negra_astilleros_de_ribera: "Astilleros de ribera"
 gj_marea_negra_astilleros_de_ribera_desc: "Un casco se levanta en una playa en pocas semanas si hay madera, brea y gente que no hace preguntas. Los astilleros de ribera no tienen gradas ni permisos, pero botan más barcos que los de muchos reinos."
 gj_marea_negra_patentes_y_contrapatentes: "Patentes y contrapatentes"
 gj_marea_negra_patentes_y_contrapatentes_desc: "La Hermandad cobra por hostigar y vuelve a cobrar por dejar de hacerlo. Los escribanos de la Sala de los Siete Nudos ya no distinguen entre extorsión y diplomacia, y han dejado de intentarlo."
 gj_marea_negra_fusileros_de_presa: "Fusileros de presa"
 gj_marea_negra_fusileros_de_presa_desc: "El fusil de chispa sustituyó al arcabuz en las cubiertas con una rapidez que sorprendió a todos menos a los armeros de contrabando, que ya lo vendían años antes de que existiera."
 gj_marea_negra_aduana_del_hampa: "Aduana del hampa"
 gj_marea_negra_aduana_del_hampa_desc: "Existe una aduana que no figura en ningún mapa: se cobra en la mar, de noche, y se paga en mercancía. Los armadores que la conocen la prefieren a las oficiales."
 gj_marea_negra_luces_falsas: "Luces falsas"
 gj_marea_negra_luces_falsas_desc: "Un farol bien colocado en un acantilado vale más que una batería. Las naves que siguen el fuego equivocado no vuelven a contar el camino, y las que lo cuentan ya no confían en ningún faro."
 gj_marea_negra_corsarios_de_libre_albedrio: "Corsarios de libre albedrío"
 gj_marea_negra_corsarios_de_libre_albedrio_desc: "Los capitanes de la Hermandad nunca han aceptado órdenes de línea, y los almirantes de medio mundo aprenden a su costa que una flota sin disciplina también puede ganar batallas."
 gj_marea_negra_infantes_de_cubierta: "Infantes de cubierta"
 gj_marea_negra_infantes_de_cubierta_desc: "Los tiradores de la Hermandad se entrenan en barcos amarrados, donde el suelo se mueve y las órdenes llegan a gritos. Cuando desembarcan, la tierra firme les parece una concesión."
 gj_marea_negra_aseguradoras_de_la_sal_negra: "Aseguradoras de la sal negra"
 gj_marea_negra_aseguradoras_de_la_sal_negra_desc: "Nadie asegura mejor un cargamento que quien podría hundirlo. Los mercaderes pagan una prima a la Hermandad y, a cambio, sus naves cruzan aguas que otras no se atreven a pisar."
 gj_marea_negra_la_marea_no_olvida: "La marea no olvida"
 gj_marea_negra_la_marea_no_olvida_desc: "Dicen en los puertos que la Hermandad ha perdido muchas batallas y ninguna deuda. Es una forma de decir que sus capitanes pelean con una paciencia que los reinos no pueden permitirse."
 gj_marea_negra_corbetas_del_codigo: "Corbetas del Código"
 gj_marea_negra_corbetas_del_codigo_desc: "El Código sobrevive porque sus naves son rápidas. Las corbetas de la Hermandad son más ligeras que las de cualquier armada, y su casco tiene un secreto que los constructores se llevan a la tumba."
 gj_marea_negra_tiradores_del_codigo: "Tiradores del Código"
 gj_marea_negra_tiradores_del_codigo_desc: "Un tirador del Código es capaz de recargar bajo la lluvia, de pie sobre un casco que cabecea y con la mano herida. Los reinos hablan de él con respeto, y lo reclutan con precios que la Hermandad no iguala."
 gj_marea_negra_navieras_en_la_sombra: "Navieras en la sombra"
 gj_marea_negra_navieras_en_la_sombra_desc: "Compañías con sede en un puerto neutral, un contable en otro y los barcos bajo una bandera que cambia cada primavera. Las navieras en la sombra mueven más carga que muchas compañías con licencia."
 gj_marea_negra_cultura_lengua_de_cubierta: "Lengua de cubierta"
 gj_marea_negra_cultura_lengua_de_cubierta_desc: "Una jerga hecha de seis idiomas de puerto: corta, ruidosa y capaz de cruzar una tormenta sin perder una orden. Los hijos de la Hermandad la hablan antes que la de sus abuelos."
 gj_marea_negra_cultura_tradicion_del_nudo: "La tradición del nudo"
 gj_marea_negra_cultura_tradicion_del_nudo_desc: "Cada marinero lleva en la muñeca un nudo que dice de dónde viene y a quién debe una vida. El nudo se hereda, se vende o se corta, y un hombre sin nudo es un hombre sin Hermandad."
 gj_marea_negra_cultura_memoria_de_las_deudas: "Memoria de las deudas"
 gj_marea_negra_cultura_memoria_de_las_deudas_desc: "Los marineros de la Hermandad no escriben su historia: recitan la lista de deudas que cada generación debe cobrar. Es una épica seca y aritmética, y funciona mejor que cualquier himno."
 gj_mareano: "Mareanos"
 gj_mareano_desc: "Gente de puerto sin tierra: descendientes de náufragos, desertores y armadores arruinados que acabaron compartiendo fogón en una costa que ningún reino quiso. Se reconocen por el nudo de la muñeca, por la lengua de cubierta y por una desconfianza hereditaria hacia todo lo que no flota."
 gj_marea_negra_lengua: "Lengua de cubierta"
 gj_marea_negra_lengua_desc: "Una jerga de puerto hecha de seis idiomas, con verbos cortos para las órdenes y una larga lista de palabras para decir «deuda»."
 gj_marea_negra_dialecto: "Lengua de cubierta"
 gj_marea_negra_familia: "Lenguas de cubierta"
 gj_marea_negra_codigo_reform: "El Código de la Hermandad"
 gj_marea_negra_codigo_reform_desc: "Ningún rey: el Código. Un puñado de artículos, aprendidos de memoria, que dicen quién manda, quién cobra y quién se queda en tierra. Los capitanes eligen entre ellos al Almirante, y lo vuelven a elegir cuando deja de servir."
 gj_marea_negra_capitanias_de_puerto_reform: "Capitanías de puerto"
 gj_marea_negra_capitanias_de_puerto_reform_desc: "Cada puerto libre tiene un capitán de fondeadero que cobra la tasa, resuelve las deudas y echa a quien rompe el Código. No es un gobernador: se le puede quitar el cargo con una votación y un cuchillo."
 gj_marea_negra_flota_en_la_sombra_reform: "Flota en la sombra"
 gj_marea_negra_flota_en_la_sombra_reform_desc: "Muchos de los barcos de la Hermandad no pertenecen a nadie: se prestan, se alquilan, se hunden en los registros y reaparecen con otro nombre. Es el último escalón de una organización que ha convertido la ambigüedad en un recurso."
 gj_marea_negra_falua: "Falúa de Abordaje"
 gj_marea_negra_falua_desc: "Un casco largo y bajo, impulsado por remos y una vela latina, que llega al costado del mercante antes de que este sepa que ha sido avistado. En su cubierta cabe poco más que una tripulación y sus garfios."
 gj_marea_negra_balandra: "Balandra Negra"
 gj_marea_negra_balandra_desc: "La primera nave que la Hermandad pintó de negro entero, casco y velas, para cruzar sin luna los estrechos vigilados. Rápida con viento medio, y frágil en cuanto aparece un cañón de verdad."
 gj_marea_negra_bergantin_presa: "Bergantín de Presa"
 gj_marea_negra_bergantin_presa_desc: "Dos palos, velas cuadras y un casco que ha olvidado lo que es una bodega llena de carga honrada. El bergantín de presa se construye para dar caza, y para ser abandonado sin lástima en cuanto deja de servir."
 gj_marea_negra_bergantin_corsario: "Bergantín Corsario"
 gj_marea_negra_bergantin_corsario_desc: "La nave que dio fama a la Hermandad: veloz, con una batería ligera y una tripulación que nunca ha oído hablar de «líneas de batalla». En un combate formal pierde; en una persecución, no."
 gj_marea_negra_goleta_corsaria: "Goleta Corsaria"
 gj_marea_negra_goleta_corsaria_desc: "La goleta inclina el velamen hacia el viento y gana algo que ningún mercante sabe imitar: la capacidad de escapar contra la corriente. Es el terror de los convoyes lentos y la pesadilla de los guardacostas."
 gj_marea_negra_corbeta_codigo: "Corbeta del Código"
 gj_marea_negra_corbeta_codigo_desc: "Ligera para su tamaño, con una artillería que se apoya más en la puntería que en el calibre. La corbeta del Código ya no es una nave de piratas: es la nave de un reino sin rey que ha aprendido a hacer la guerra a su manera."
 gj_marea_negra_chalupa: "Chalupa de Contrabando"
 gj_marea_negra_chalupa_desc: "Una barca ancha con un doble fondo que los inspectores de aduana rara vez encuentran. Carga mucho para su tamaño, y no pretende pelear nunca."
 gj_marea_negra_contrabandista: "Balandra Contrabandista"
 gj_marea_negra_contrabandista_desc: "La balandra contrabandista cambia de nombre en cada puerto y de bandera con cada estación. Su bodega es más grande de lo que debería, y su casco más débil de lo que se atreve a admitir."
 gj_marea_negra_balandra_doble: "Balandra de Doble Fondo"
 gj_marea_negra_balandra_doble_desc: "Un barco hecho para engañar: cuarteles que parecen pañoles, pañoles que parecen cuarteles y un lastre que nadie ha pesado nunca. Transporta más que sus iguales y no resiste ni una descarga."
 gj_marea_negra_flauta_de_contrabando: "Flauta Contrabandista"
 gj_marea_negra_flauta_de_contrabando_desc: "La flauta de astilleros lejanos, comprada de segunda mano y reformada hasta que ya no se parece a nada. Abarca mucho en el vientre y poco en el casco."
 gj_marea_negra_goleta_de_sombra: "Goleta de Sombra"
 gj_marea_negra_goleta_de_sombra_desc: "La goleta de las navieras en la sombra: matriculada en un puerto neutral, tripulada en otro y cargada en un tercero. Corre bien, carga bien, y se hunde bien."
 gj_marea_negra_clipper_de_sombra: "Clíper de Sombra"
 gj_marea_negra_clipper_de_sombra_desc: "El último gran invento de la Hermandad: un casco largo y estrecho, hecho para cruzar medio océano con la bodega llena y escapar de cualquier guardacostas. En combate, un huevo con velas."
 gj_marea_negra_cuchilla: "Cuchilleros de Borda"
 gj_marea_negra_cuchilla_desc: "Marineros con cuchillo corto, garfio y mucha costumbre de pelear en suelo mojado. Fuera de la cubierta pierden su ventaja, pero cerca de un puerto no hay quien los desaloje."
 gj_marea_negra_abordador: "Abordadores"
 gj_marea_negra_abordador_desc: "Infantes de cubierta que han aprendido a lanzarse de una borda a otra con el sable entre los dientes. Su fuerza está en la sorpresa y en la costa, y se agotan cuando se alejan de ella."
 gj_marea_negra_arcabucero: "Arcabuceros de Cubierta"
 gj_marea_negra_arcabucero_desc: "Tiradores que disparan acostados tras la regala, protegidos de la respuesta. En tierra firme son menos de lo que parecen, pero en un desembarco, hasta un grupo pequeño de ellos obliga a retroceder a una guarnición."
 gj_marea_negra_fusilero: "Fusileros de Presa"
 gj_marea_negra_fusilero_desc: "Fusileros de chispa con una mala fama bien ganada: disparan rápido, cobran por adelantado y se retiran a los barcos cuando la batalla deja de ser rentable. Son más fuertes en la orilla que en el interior."
 gj_marea_negra_infante_cubierta: "Infantes de Cubierta"
 gj_marea_negra_infante_cubierta_desc: "Compañías organizadas en torno a los sargentos de a bordo, que mantienen el orden con el látigo y con el reparto. Pelean bien cerca del agua y mal lejos de ella."
 gj_marea_negra_tirador_codigo: "Tiradores del Código"
 gj_marea_negra_tirador_codigo_desc: "La élite de las compañías de desembarco: hombres que han jurado el Código, que cobran una parte en lugar de una paga y que se saben morir con la retirada asegurada. Sin su costa, flaquean."
 gj_marea_negra_abordadores: "Compañías de abordaje"
 GJ_MAREA_NEGRA_LIMITE_PUERTOS: "Niveles de Puerto Libre"
 gj_marea_negra_puerto_libre: "Puerto Libre"
 gj_marea_negra_puerto_libre_desc: "Un muelle sin aduana, sin bandera y sin preguntas. Los mercantes fondean allí para descargar lo que no figura en ningún registro, y la Hermandad cobra una tasa discreta. Atrae contrabando y mala gente, y los muelles cercanos no duermen nunca."
 gj_marea_negra_puerto_libre_mantenimiento: "Mantenimiento de $gj_marea_negra_puerto_libre$"
 gj_marea_negra_puerto_libre_price: "Coste de $gj_marea_negra_puerto_libre$"
 gj_marea_negra_astillero_corsario: "Astillero Corsario"
 gj_marea_negra_astillero_corsario_desc: "Una playa con gradas de madera, una cabaña para la brea y una fila de cascos a medio hacer. Las cuadrillas del astillero trabajan de noche, para que nadie cuente cuántos barcos se botan al amanecer."
 gj_marea_negra_astillero_corsario_mantenimiento: "Mantenimiento de $gj_marea_negra_astillero_corsario$"
 gj_marea_negra_astillero_corsario_price: "Coste de $gj_marea_negra_astillero_corsario$"
 gj_marea_negra_casa_de_las_cuerdas: "Sala de los Siete Nudos"
 gj_marea_negra_casa_de_las_cuerdas_desc: "La sede de los capitanes de un puerto: una sala larga con una mesa, un cabo de siete nudos colgado de la viga y un libro donde se anota cada voto. Aquí se juzgan las deudas y se reclutan las tripulaciones."
 gj_marea_negra_casa_de_las_cuerdas_mantenimiento: "Mantenimiento de $gj_marea_negra_casa_de_las_cuerdas$"
 gj_marea_negra_casa_de_las_cuerdas_price: "Coste de $gj_marea_negra_casa_de_las_cuerdas$"
 gj_marea_negra_almacen_del_botin: "Almacén del Botín"
 gj_marea_negra_almacen_del_botin_desc: "Una nave varada que se ha convertido en depósito: el botín se cuenta, se reparte y se guarda hasta que haya mercado. Los armadores pagan por almacenar lo que no pueden vender, y la Hermandad cobra por no mirar."
 gj_marea_negra_almacen_del_botin_mantenimiento: "Mantenimiento de $gj_marea_negra_almacen_del_botin$"
 gj_marea_negra_almacen_del_botin_price: "Coste de $gj_marea_negra_almacen_del_botin$"
 gj_marea_negra_faro_falso: "Faro Falso"
 gj_marea_negra_faro_falso_desc: "Una hoguera en el acantilado que nadie enciende nunca, salvo cuando conviene. El faro falso desorienta a las flotas enemigas y las lleva, lentamente, hacia los bajíos de la bahía."
 gj_marea_negra_faro_falso_mantenimiento: "Mantenimiento de $gj_marea_negra_faro_falso$"
 gj_marea_negra_faro_falso_price: "Coste de $gj_marea_negra_faro_falso$"
 GJ_MAREA_NEGRA_NIVEL_POR_ERA: "Nivel desbloqueado por la era"
 gj_marea_negra_almirante: "Almirante del Código"
 gj_marea_negra_almirante_desc: "Los capitanes votan cada diez años, o cuando el Almirante muere, o cuando deja de ser útil. Cuentan los votos de los que han navegado, no los de los que han heredado."
 gj_marea_negra_reparto_igual_policy: "Partes iguales"
 gj_marea_negra_reparto_igual_policy_desc: "Cada marinero cobra lo mismo que el capitán. Los barcos se mantienen unidos, y los capitanes ambiciosos se buscan otro oficio."
 gj_marea_negra_parte_del_capitan_policy: "Parte del capitán"
 gj_marea_negra_parte_del_capitan_policy_desc: "El capitán se lleva dos partes, y el contramaestre, una y media. Los capitanes compiten por quién consigue más, y las tripulaciones por quién pierde menos."
 gj_marea_negra_fondo_comun_policy: "Fondo común"
 gj_marea_negra_fondo_comun_policy_desc: "Una quinta parte del botín va a un cofre que custodian tres llaves. De él se pagan los astilleros, las viudas y los funerales. Nadie lo ha robado todavía, y por eso nadie se atreve a intentarlo."
 gj_marea_negra_reparto_ley: "Artículo del reparto"
 gj_marea_negra_reparto_ley_desc: "Antes de zarpar se escribe en el libro quién cobra qué. Cambiar ese artículo en pleno viaje se considera, en el mejor de los casos, una grosería."
 gj_marea_negra_reparto_ley_CATEGORY: "SOCIOECONOMIC_LAW_CATEGORY"
 gj_marea_negra_rescate_policy: "Rescate"
 gj_marea_negra_rescate_policy_desc: "Todo cautivo vale su peso en plata, y quien lo hiere pierde su parte. Las casas de rescate de los puertos libres hacen de aduana y de banco."
 gj_marea_negra_leva_forzosa_policy: "Leva de bordo"
 gj_marea_negra_leva_forzosa_policy_desc: "Los cautivos con oficio de mar firman con la tripulación o van por la borda. La Hermandad nunca ha tenido escasez de marineros, y los reinos ribereÃ±os, tampoco de enemigos."
 gj_marea_negra_sin_cuartel_policy: "Sin cuartel"
 gj_marea_negra_sin_cuartel_policy_desc: "La bandera negra a media asta significa que no habrá piedad. Las naves que la ven pueden rendirse a la primera o pelear hasta el final, y a la segunda opción apenas se le da buena fama."
 gj_marea_negra_prisioneros_ley: "Artículo de los cautivos"
 gj_marea_negra_prisioneros_ley_desc: "Lo que se hace con quien se rinde es lo que decide quién se rendirá la próxima vez. Los capitanes llevan siglos discutiendo cuál es el punto exacto entre la crueldad y la rentabilidad."
 gj_marea_negra_prisioneros_ley_CATEGORY: "MILITARY_LAW_CATEGORY"
 gj_marea_negra_capitania_abierta_policy: "Capitanía abierta"
 gj_marea_negra_capitania_abierta_policy_desc: "Cualquier marinero con tres travesías a sus espaldas puede aspirar a capitán. Las tripulaciones se renuevan, los cuadros se llenan de ambiciosos y nadie ha vuelto a mencionar los orígenes."
 gj_marea_negra_capitania_por_hazanas_policy: "Capitanía por hazañas"
 gj_marea_negra_capitania_por_hazanas_policy_desc: "Solo manda quien ha traído un barco enemigo a puerto. La regla es simple, brutal y muy difícil de manipular, y por eso los capitanes la defienden como el origen de su honor."
 gj_marea_negra_capitania_de_casas_de_mar_policy: "Casas de mar"
 gj_marea_negra_capitania_de_casas_de_mar_policy_desc: "Las familias que llevan generaciones en la Hermandad se reservan los cargos de capitán. No es ley, es costumbre, y es más difícil de cambiar que una ley."
 gj_marea_negra_capitania_ley: "Artículo de las capitanías"
 gj_marea_negra_capitania_ley_desc: "Quién puede mandar un barco es la pregunta más vieja de la Hermandad. La respuesta cambia con cada generación, y con cada revuelta."
 gj_marea_negra_capitania_ley_CATEGORY: "LEADERSHIP_LAW_CATEGORY"
 gj_marea_negra_bandera_izada: "Bandera negra izada"
 gj_marea_negra_bandera_izada_desc: "Bandera negra izada"
 gj_marea_negra_conclave: "Cónclave de capitanes"
 gj_marea_negra_conclave_desc: "Cónclave de capitanes"
 gj_marea_negra_contrabando_abierto: "Contrabando a las claras"
 gj_marea_negra_contrabando_abierto_desc: "Contrabando a las claras"
 gj_marea_negra_patente_hostigado: "Hostigado por una patente de corso"
 gj_marea_negra_patente_hostigado_desc: "Hostigado por una patente de corso"
 gj_marea_negra_almirante_cauto: "Almirante cauto"
 gj_marea_negra_almirante_cauto_desc: "Almirante cauto"
 gj_marea_negra_almirante_audaz: "Almirante audaz"
 gj_marea_negra_almirante_audaz_desc: "Almirante audaz"
